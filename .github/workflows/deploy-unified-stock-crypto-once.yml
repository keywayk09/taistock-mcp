name: Validate Unified Stock Crypto

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-unified-stock-crypto-once.yml'
  workflow_dispatch:

# IMPORTANT: this workflow is validation-only.
# Production deployment authority for taistock-mcp belongs exclusively to
# .github/workflows/deploy-cloudflare-production.yml.
permissions:
  contents: read

concurrency:
  group: unified-stock-crypto-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WORKER_BASE_URL: https://taistock-mcp.keywayk09.workers.dev
      CRYPTO_BASE_URL: https://tv-crypto-engine.keikei99887.workers.dev

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and validate unified source
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npm run type-check
          npm run test:family-selection

      - name: Verify central crypto dual lanes are live
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 25 "${CRYPTO_BASE_URL}/health" > /tmp/crypto-health.json; then
              if node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('/tmp/crypto-health.json','utf8'));
          if (x.ok !== true) process.exit(2);
          if (String(x.version || '') !== '0.9.0') process.exit(3);
          const profiles = x.crypto_profiles || [];
          if (!profiles.includes('stable_quality') || !profiles.includes('volatile')) process.exit(4);
          console.log(`crypto dual lanes health ok version=${x.version}`);
          NODE
              then break; fi
            fi
            if [ "$attempt" = 5 ]; then
              echo 'crypto V0.9.0 health not live after retries'; cat /tmp/crypto-health.json 2>/dev/null || true; exit 1
            fi
            sleep 8
          done

          curl --fail --silent --show-error --max-time 45 \
            "${CRYPTO_BASE_URL}/market/volatile-scan?per_side=1&setup=all" > /tmp/crypto-volatile.json
          node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('/tmp/crypto-volatile.json','utf8'));
          if (x.profile !== 'volatile') throw new Error(`profile=${x.profile}`);
          if (x.profile_label !== '妖幣/高波動') throw new Error(`profile_label=${x.profile_label}`);
          if (!x.policy?.separate_from_stable_quality_lane) throw new Error('volatile lane not isolated');
          if (x.policy?.no_24h_overheat_hard_exclusion !== true) throw new Error('overheat policy wrong');
          const allowed = new Set(['trend_follow','pullback_contraction','consolidation','squeeze','unclassified']);
          for (const c of x.candidates || []) if (!allowed.has(c.setup)) throw new Error(`bad setup ${c.setup}`);
          if ((x?.subrequest_budget?.reported_total || 0) > 10) throw new Error(`volatile smoke request budget ${x.subrequest_budget.reported_total}`);
          console.log(`CRYPTO_VOLATILE_LANE_PASS selected=${x.selected_count} candidates=${(x.candidates||[]).length}`);
          NODE

      - name: Verify deployed unified gateway read-only
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 25 "${WORKER_BASE_URL}/health" > /tmp/health.json; then
              if node - <<'NODE'
          const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          const tools=x?.market_data?.crypto_tools || [];
          if (x.status !== 'ok') process.exit(2);
          if (x.mcp_endpoint !== '/my-mcp') process.exit(4);
          if (x?.family_mcp?.endpoint !== '/family-mcp') process.exit(5);
          for (const name of ['get_crypto_engine_status','get_crypto_candidates','get_crypto_deep_probe']) {
            if (!tools.includes(name)) process.exit(6);
          }
          if (x?.family_mcp?.crypto !== 'SAME_FAMILY_MCP_CONNECTION_TO_CENTRAL_TV_CRYPTO_ENGINE_READ_ONLY') process.exit(7);
          console.log(`UNIFIED_STOCK_CRYPTO_READ_ONLY_PASS version=${x.version}`);
          NODE
              then exit 0; fi
            fi
            sleep 8
          done
          echo 'Unified production read-only smoke failed'
          cat /tmp/health.json 2>/dev/null || true
          exit 1
