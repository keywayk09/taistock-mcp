name: OHLC Readonly Regression 20260830

on:
  push:
    branches:
      - ops/fugle-control-plane-public-runner-20260829
    paths:
      - .github/workflows/ohlc-readonly-regression-20260830.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect OHLC completion health safely
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const url = 'https://tv-fugle-1d.keikei99887.workers.dev/health';
          const r = await fetch(url, { headers: { Accept:'application/json','Cache-Control':'no-cache' }, signal: AbortSignal.timeout(15000) });
          if (!r.ok) throw new Error(`health_http_${r.status}`);
          const h = await r.json();
          if (!h || typeof h !== 'object') throw new Error('health_shape_invalid');
          if (Object.prototype.hasOwnProperty.call(h,'jin10_retired_secret_present')) throw new Error('temporary_jin10_proof_present');
          if (String(h.liveness_version||'') !== 'EDGE_DIRECT_RECOVERY_V3') throw new Error('liveness_version_mismatch');
          const day = h.day && typeof h.day === 'object' ? h.day : {};
          const stock = day.stock && typeof day.stock === 'object' ? day.stock : {};
          const allow = /^(ok|status|phase|trade_date|.*count|.*done|.*complete.*|.*started.*|.*requested.*|.*verified.*|.*mismatch.*|.*recovery.*)$/i;
          const safe = (obj) => Object.fromEntries(Object.entries(obj).filter(([k,v]) => allow.test(k) && ['string','number','boolean'].includes(typeof v)));
          console.log(`[health] ROOT_KEYS=${Object.keys(h).sort().join(',')}`);
          console.log(`[health] DAY_KEYS=${Object.keys(day).sort().join(',')}`);
          console.log(`[health] STOCK_KEYS=${Object.keys(stock).sort().join(',')}`);
          console.log(`[health] DAY_SAFE=${JSON.stringify(safe(day))}`);
          console.log(`[health] STOCK_SAFE=${JSON.stringify(safe(stock))}`);
          if (String(day.phase||'') !== 'DONE') throw new Error(`day_not_done:${String(day.phase||'')}`);
          if (!String(day.trade_date||'').match(/^\d{4}-\d{2}-\d{2}$/)) throw new Error('trade_date_invalid');
          console.log('[health] COMPLETION_HEALTH_PASS');
          NODE
