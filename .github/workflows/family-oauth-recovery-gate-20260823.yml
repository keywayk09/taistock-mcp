name: Family OAuth stale-client recovery gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  oauth-recovery-gate:
    if: github.head_ref == 'fix/family-oauth-stale-chatgpt-client-20260823'
    runs-on: ubuntu-latest
    env:
      BASE_URL: http://127.0.0.1:8787
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      - name: Build local Workers OAuth gate config
        shell: bash
        run: |
          set -euo pipefail
          cat > wrangler.family-oauth-local-gate.jsonc <<'EOF'
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "taistock-mcp-family-oauth-local-gate",
            "main": "src/index-v6.ts",
            "compatibility_date": "2025-03-10",
            "compatibility_flags": ["nodejs_compat", "global_fetch_strictly_public"],
            "vars": {
              "RESEARCH_MAX_SYMBOLS":"40",
              "RESEARCH_MAX_ONE_MINUTE":"8",
              "GITHUB_DATA_REPO":"keywayk09/tv-papertrader",
              "GITHUB_DATA_BRANCH":"main",
              "FAMILY_OAUTH_LOGIN_SECRET":"isolated-test-secret-never-production"
            },
            "kv_namespaces": [{"binding":"OAUTH_KV","id":"00000000000000000000000000000000"}],
            "exports": {
              "MyMCP":{"type":"durable-object","storage":"sqlite"},
              "FamilyMCP":{"type":"durable-object","storage":"sqlite"}
            },
            "durable_objects": {
              "bindings":[
                {"class_name":"MyMCP","name":"MCP_OBJECT"},
                {"class_name":"FamilyMCP","name":"FAMILY_MCP_OBJECT"}
              ]
            },
            "observability":{"enabled":false}
          }
          EOF

      - name: Start local Workers runtime
        shell: bash
        run: |
          set -euo pipefail
          nohup npx wrangler dev --local --config wrangler.family-oauth-local-gate.jsonc --ip 127.0.0.1 --port 8787 --persist-to /tmp/family-oauth-gate-state > /tmp/wrangler-local.log 2>&1 &
          echo $! > /tmp/wrangler-local.pid
          for i in $(seq 1 60); do
            if curl -fsS --max-time 2 "$BASE_URL/health" >/tmp/local-health.json 2>/dev/null; then
              python - <<'PY'
          import json
          from pathlib import Path
          body=json.loads(Path('/tmp/local-health.json').read_text())
          assert body.get('status') == 'ok', body
          print('LOCAL_WORKER_READY=PASS')
          PY
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wrangler-local.log
          exit 1

      - name: Build PKCE requests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,os,urllib.parse
          from pathlib import Path
          verifier='family-recovery-gate-verifier-' + 'v'*48
          challenge=base64.urlsafe_b64encode(hashlib.sha256(verifier.encode()).digest()).rstrip(b'=').decode()
          callback='https://chatgpt.com/connector/oauth/familyrecoverygate1234567890'
          client_id='chatgpt-stale-client-1234567890'
          state='family-recovery-state-1234567890'
          params={
            'response_type':'code','client_id':client_id,'redirect_uri':callback,
            'scope':'family:read','state':state,'code_challenge':challenge,
            'code_challenge_method':'S256'
          }
          query=urllib.parse.urlencode(params)
          Path('/tmp/oauth-query.txt').write_text(query)
          Path('/tmp/verifier.txt').write_text(verifier)
          Path('/tmp/callback.txt').write_text(callback)
          Path('/tmp/client-id.txt').write_text(client_id)
          Path('/tmp/state.txt').write_text(state)
          Path('/tmp/good-url.txt').write_text(os.environ['BASE_URL']+'/authorize?'+query)
          bad=urllib.parse.urlencode({
            'response_type':'code','client_id':'untrusted-stale-client-12345678',
            'redirect_uri':'https://evil.example/callback','scope':'family:read',
            'state':'state-bad','code_challenge':'A'*43,'code_challenge_method':'S256'
          })
          Path('/tmp/bad-url.txt').write_text(os.environ['BASE_URL']+'/authorize?'+bad)
          PY

      - name: Reject untrusted redirect
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --max-time 20 -sS -D /tmp/bad.headers -o /tmp/bad.html -w '%{http_code}' "$(cat /tmp/bad-url.txt)")"
          echo "BAD_HTTP_CODE=${code}"
          case "$code" in 4??) ;; *) exit 1 ;; esac
          ! grep -q '家人連線驗證碼' /tmp/bad.html
          ! grep -qi '^location: *https://evil\.example' /tmp/bad.headers
          echo 'UNTRUSTED_REDIRECT_REJECTED=PASS'

      - name: Stale ChatGPT GET renders Family login
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --max-time 20 -sS -D /tmp/get.headers -o /tmp/get.html -w '%{http_code}' "$(cat /tmp/good-url.txt)")"
          echo "STALE_GET_HTTP_CODE=${code}"
          test "$code" = '200'
          grep -q '家人連線驗證碼' /tmp/get.html
          grep -q 'ChatGPT Family Connector' /tmp/get.html
          echo 'STALE_GET_LOGIN=PASS'

      - name: Wrong Family secret cannot authorize
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --max-time 20 -sS -o /tmp/wrong.html -w '%{http_code}' -X POST "$BASE_URL/authorize" \
            -H 'content-type: application/x-www-form-urlencoded' \
            --data-urlencode "oauth_query=$(cat /tmp/oauth-query.txt)" \
            --data-urlencode 'login_secret=definitely-wrong')"
          test "$code" = '200'
          grep -q '驗證碼錯誤' /tmp/wrong.html
          echo 'WRONG_SECRET_REJECTED=PASS'

      - name: Correct Family secret restores stale client and issues code
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --max-time 30 -sS -D /tmp/post.headers -o /tmp/post.body -w '%{http_code}' \
            -X POST "$BASE_URL/authorize" \
            -H 'content-type: application/x-www-form-urlencoded' \
            --data-urlencode "oauth_query=$(cat /tmp/oauth-query.txt)" \
            --data-urlencode 'login_secret=isolated-test-secret-never-production')"
          echo "AUTH_POST_HTTP_CODE=${code}"
          if [ "$code" != '302' ]; then cat /tmp/post.body; exit 1; fi
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/,""); sub(/^[^:]+:[[:space:]]*/,""); print; exit}' /tmp/post.headers)"
          test -n "$location"
          LOCATION="$location" CALLBACK="$(cat /tmp/callback.txt)" EXPECTED_STATE="$(cat /tmp/state.txt)" python - <<'PY'
          import os,urllib.parse
          loc=urllib.parse.urlsplit(os.environ['LOCATION']); cb=urllib.parse.urlsplit(os.environ['CALLBACK'])
          assert (loc.scheme,loc.netloc,loc.path)==(cb.scheme,cb.netloc,cb.path)
          q=urllib.parse.parse_qs(loc.query)
          assert q.get('state')==[os.environ['EXPECTED_STATE']]
          assert len(q.get('code',[]))==1 and q['code'][0]
          print('AUTHORIZATION_REDIRECT=PASS')
          PY

      - name: Exchange authorization code with PKCE
        shell: bash
        run: |
          set -euo pipefail
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/,""); sub(/^[^:]+:[[:space:]]*/,""); print; exit}' /tmp/post.headers)"
          code="$(LOCATION="$location" python - <<'PY'
          import os,urllib.parse
          print(urllib.parse.parse_qs(urllib.parse.urlsplit(os.environ['LOCATION']).query)['code'][0])
          PY
          )"
          curl --max-time 30 -fsS -X POST "$BASE_URL/oauth/token" \
            -H 'content-type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=authorization_code' \
            --data-urlencode "client_id=$(cat /tmp/client-id.txt)" \
            --data-urlencode "code=${code}" \
            --data-urlencode "redirect_uri=$(cat /tmp/callback.txt)" \
            --data-urlencode "code_verifier=$(cat /tmp/verifier.txt)" > /tmp/token.json
          python - <<'PY'
          import json
          from pathlib import Path
          body=json.loads(Path('/tmp/token.json').read_text())
          assert isinstance(body.get('access_token'),str) and body['access_token']
          assert str(body.get('token_type','')).lower()=='bearer'
          print('TOKEN_EXCHANGE=PASS')
          PY

      - name: Stop local runtime
        if: always()
        shell: bash
        run: |
          if [ -s /tmp/wrangler-local.pid ]; then kill "$(cat /tmp/wrangler-local.pid)" 2>/dev/null || true; fi
          if [ -s /tmp/wrangler-local.log ]; then tail -n 80 /tmp/wrangler-local.log | sed -E 's/(code=)[^& ]+/\1[REDACTED]/g'; fi
