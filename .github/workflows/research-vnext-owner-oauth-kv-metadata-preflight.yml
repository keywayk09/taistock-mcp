name: Research VNext Owner OAuth KV Metadata Preflight

on:
  push:
    branches:
      - 'refactor/research-vnext-foundation-20260901'
    paths:
      - 'runtime/research-vnext-owner-oauth-kv-metadata-preflight-authorization.json'

permissions:
  contents: read

concurrency:
  group: research-vnext-owner-oauth-kv-metadata-preflight
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: ca89b77a06b79a09df3ade88a18e7225b53b2093
      EXPECTED_ACTIVE_VERSION: 0d7a4c8d-0ccf-4d89-9cd4-ab28fab70c5c
      EXPECTED_OAUTH_KV_ID: 696e3654d2fa4c3bb1a868e5095b5660
      EXPECTED_BINDING_FINGERPRINT: d1faf34e53a3901c0ca13f4c29ff354194c7a3788bd94aa7a2e37509eaf1a49b
      AUTH_PATH: runtime/research-vnext-owner-oauth-kv-metadata-preflight-authorization.json

    steps:
      - name: Checkout authorization commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Fail closed on exact metadata-preflight authorization
        shell: bash
        env:
          EXPECTED_BRANCH: refactor/research-vnext-foundation-20260901
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" != "$EXPECTED_BRANCH" ]; then
            echo 'FAIL: unexpected branch'
            exit 78
          fi
          if [ "$GITHUB_SHA" != "$AFTER_SHA" ]; then
            echo 'FAIL: event after SHA mismatch'
            exit 78
          fi
          mapfile -t changed < <(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")
          if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != "$AUTH_PATH" ]; then
            echo 'FAIL: authorization commit must change exactly one authorization file'
            exit 78
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync(process.env.AUTH_PATH, 'utf8'));
          const fail = (message) => { throw new Error(message); };
          if (body.schema !== 'RESEARCH_VNEXT_OWNER_OAUTH_KV_METADATA_PREFLIGHT_AUTH_V1') fail('INVALID_AUTH_SCHEMA');
          if (body.mode !== 'GET_ONLY_OAUTH_KV_METADATA') fail('INVALID_MODE');
          if (body.source_sha !== process.env.SOURCE_SHA) fail('SOURCE_SHA_MISMATCH');
          if (body.expected_active_version_id !== process.env.EXPECTED_ACTIVE_VERSION) fail('ACTIVE_VERSION_MISMATCH');
          if (body.expected_oauth_kv_id !== process.env.EXPECTED_OAUTH_KV_ID) fail('OAUTH_KV_MISMATCH');
          if (body.expected_binding_fingerprint !== process.env.EXPECTED_BINDING_FINGERPRINT) fail('BINDING_FINGERPRINT_MISMATCH');
          if (body.production_mutation !== 'NONE') fail('MUTATION_NOT_NONE');
          if (!/^vnext-owner-oauth-kv-meta-20260902-[a-z0-9-]{8,64}$/.test(String(body.authorization_nonce ?? ''))) fail('INVALID_NONCE');
          console.log('OWNER_OAUTH_KV_METADATA_PREFLIGHT=AUTHORIZED_GET_ONLY');
          NODE

      - name: Checkout exact sealed source
        uses: actions/checkout@v4
        with:
          ref: ca89b77a06b79a09df3ade88a18e7225b53b2093
          path: sealed
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Capture GET-only Production control-plane baseline
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEARCH_VNEXT_EXPECTED_SHA: ca89b77a06b79a09df3ade88a18e7225b53b2093
        run: |
          set -euo pipefail
          mkdir -p evidence
          node --experimental-strip-types sealed/scripts/research-vnext-production-control-plane-live-snapshot.mjs > evidence/control-plane.json

      - name: Fail closed on exact current Production baseline
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const receipt = JSON.parse(fs.readFileSync('evidence/control-plane.json', 'utf8'));
          const fail = (message) => { throw new Error(message); };
          if (receipt.status !== 'READ_ONLY_SNAPSHOT_VALID') fail('CONTROL_PLANE_STATUS_INVALID');
          if (receipt.active_version_id !== process.env.EXPECTED_ACTIVE_VERSION) fail('ACTIVE_VERSION_DRIFT');
          if (receipt.active_version_percentage !== 100) fail('ACTIVE_VERSION_NOT_100_PERCENT');
          if (receipt.oauth_kv_id !== process.env.EXPECTED_OAUTH_KV_ID) fail('OAUTH_KV_DRIFT');
          if (receipt.binding_fingerprint !== process.env.EXPECTED_BINDING_FINGERPRINT) fail('BINDING_FINGERPRINT_DRIFT');
          if (receipt.read_only_capture !== true || receipt.token_leak !== false) fail('CONTROL_PLANE_READ_ONLY_EVIDENCE_INVALID');
          if (receipt.production_deploy_authorized !== false || receipt.production_mutation !== 'NONE') fail('CONTROL_PLANE_MUTATION_EVIDENCE_INVALID');
          console.log('OWNER_OAUTH_KV_METADATA_PREFLIGHT_BASELINE=PASS');
          NODE

      - name: Inspect OAuth KV token/grant metadata GET-only without credential disclosure
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';

          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const apiToken = process.env.CLOUDFLARE_API_TOKEN;
          const namespaceId = process.env.EXPECTED_OAUTH_KV_ID;
          if (!accountId || !apiToken || !namespaceId) throw new Error('MISSING_CLOUDFLARE_READ_CREDENTIAL');

          const root = `https://api.cloudflare.com/client/v4/accounts/${accountId}/storage/kv/namespaces/${namespaceId}`;
          const headers = { Authorization: `Bearer ${apiToken}` };
          const sha256 = (value) => createHash('sha256').update(String(value)).digest('hex');

          async function getJson(url, label) {
            const response = await fetch(url, { method: 'GET', headers });
            if (!response.ok) throw new Error(`${label}_HTTP_${response.status}`);
            return response.json();
          }

          async function getText(url, label) {
            const response = await fetch(url, { method: 'GET', headers });
            if (!response.ok) throw new Error(`${label}_HTTP_${response.status}`);
            return response.text();
          }

          async function listKeys(prefix) {
            const rows = [];
            let cursor = '';
            for (let page = 0; page < 20; page += 1) {
              const params = new URLSearchParams({ prefix, limit: '1000' });
              if (cursor) params.set('cursor', cursor);
              const body = await getJson(`${root}/keys?${params.toString()}`, 'KV_KEYS');
              if (body.success !== true || !Array.isArray(body.result)) throw new Error('KV_KEYS_INVALID_RESPONSE');
              rows.push(...body.result);
              cursor = String(body.result_info?.cursor ?? '');
              if (!cursor) return rows;
            }
            throw new Error('KV_KEYS_PAGINATION_LIMIT');
          }

          async function readRecord(keyName) {
            const raw = await getText(`${root}/values/${encodeURIComponent(keyName)}`, 'KV_VALUE');
            try {
              return JSON.parse(raw);
            } catch {
              return null;
            }
          }

          const ownerGrantRows = await listKeys('grant:owner:');
          const ownerClientIds = new Set();
          let unreadableOwnerGrants = 0;
          for (const row of ownerGrantRows) {
            const record = await readRecord(String(row.name ?? ''));
            if (!record || typeof record !== 'object') {
              unreadableOwnerGrants += 1;
              continue;
            }
            if (typeof record.clientId === 'string' && record.clientId) ownerClientIds.add(record.clientId);
          }

          const tokenRows = await listKeys('token:');
          const nowMs = Date.now();
          const candidates = [];
          let unreadableTokenRecords = 0;
          let ownerClientMatchedTokens = 0;
          let ownerScopeTokens = 0;
          let ownerUserTokens = 0;
          let ownerRoleTokens = 0;

          const normalizeScope = (value) => {
            if (Array.isArray(value)) return value.map(String);
            if (typeof value === 'string') return value.split(/\s+/).filter(Boolean);
            return [];
          };
          const expirationState = (record, row) => {
            const raw = record?.expiresAt ?? row?.expiration ?? null;
            if (raw === null || raw === undefined || raw === '') return { present: false, expired: false, parseable: false };
            let timestamp = Number.NaN;
            if (typeof raw === 'number') timestamp = raw > 1e12 ? raw : raw * 1000;
            else if (/^\d+$/.test(String(raw))) {
              const n = Number(raw);
              timestamp = n > 1e12 ? n : n * 1000;
            } else timestamp = Date.parse(String(raw));
            if (!Number.isFinite(timestamp)) return { present: true, expired: false, parseable: false };
            return { present: true, expired: timestamp <= nowMs, parseable: true };
          };

          for (const row of tokenRows) {
            const keyName = String(row.name ?? '');
            const record = await readRecord(keyName);
            if (!record || typeof record !== 'object') {
              unreadableTokenRecords += 1;
              continue;
            }

            const nestedProps = record.props && typeof record.props === 'object' ? record.props : {};
            const tokenProps = record.tokenProps && typeof record.tokenProps === 'object' ? record.tokenProps : {};
            const role = record.role ?? nestedProps.role ?? tokenProps.role ?? null;
            const userId = record.userId ?? nestedProps.userId ?? tokenProps.userId ?? null;
            const scopes = normalizeScope(record.scope ?? nestedProps.scope ?? tokenProps.scope);
            const ownerClientMatch = typeof record.clientId === 'string' && ownerClientIds.has(record.clientId);
            const roleOwner = role === 'owner';
            const userOwner = userId === 'owner';
            const scopeOwnerFull = scopes.includes('owner:full');
            const expiry = expirationState(record, row);

            if (ownerClientMatch) ownerClientMatchedTokens += 1;
            if (roleOwner) ownerRoleTokens += 1;
            if (userOwner) ownerUserTokens += 1;
            if (scopeOwnerFull) ownerScopeTokens += 1;

            if (ownerClientMatch && roleOwner && userOwner && scopeOwnerFull && !expiry.expired) {
              candidates.push({
                key_sha256: sha256(keyName),
                owner_client_match: true,
                role_owner: true,
                user_owner: true,
                scope_owner_full: true,
                expiration_present: expiry.present,
                expiration_parseable: expiry.parseable,
                expired: false,
              });
            }
          }

          const receipt = {
            schema: 'RESEARCH_VNEXT_OWNER_OAUTH_KV_METADATA_PREFLIGHT_RECEIPT_V1',
            status: 'READ_ONLY_METADATA_CAPTURE_VALID',
            source_sha: process.env.SOURCE_SHA,
            active_version_id: process.env.EXPECTED_ACTIVE_VERSION,
            oauth_kv_id: namespaceId,
            binding_fingerprint: process.env.EXPECTED_BINDING_FINGERPRINT,
            owner_grant_records_total: ownerGrantRows.length,
            owner_client_ids_resolved: ownerClientIds.size,
            unreadable_owner_grant_records: unreadableOwnerGrants,
            token_records_total: tokenRows.length,
            unreadable_token_records: unreadableTokenRecords,
            owner_client_matched_tokens: ownerClientMatchedTokens,
            owner_role_tokens: ownerRoleTokens,
            owner_user_tokens: ownerUserTokens,
            owner_scope_tokens: ownerScopeTokens,
            strict_owner_candidate_count: candidates.length,
            candidates,
            raw_key_names_emitted: false,
            raw_values_emitted: false,
            token_leak: false,
            production_mutation: 'NONE',
            authenticated_mcp_probe_executed: false,
            legacy_retirement_authorized: false,
          };
          fs.writeFileSync('evidence/oauth-kv-metadata.json', `${JSON.stringify(receipt, null, 2)}\n`);
          console.log(`OWNER_OAUTH_KV_METADATA_CAPTURE=PASS:candidates=${candidates.length}:tokens=${tokenRows.length}`);
          console.log('token_leak=false');
          console.log('production_mutation=NONE');
          NODE

      - name: Validate metadata-only receipt
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const receipt = JSON.parse(fs.readFileSync('evidence/oauth-kv-metadata.json', 'utf8'));
          const fail = (message) => { throw new Error(message); };
          if (receipt.status !== 'READ_ONLY_METADATA_CAPTURE_VALID') fail('METADATA_STATUS_INVALID');
          if (receipt.source_sha !== process.env.SOURCE_SHA) fail('METADATA_SOURCE_SHA_INVALID');
          if (receipt.active_version_id !== process.env.EXPECTED_ACTIVE_VERSION) fail('METADATA_ACTIVE_VERSION_INVALID');
          if (receipt.oauth_kv_id !== process.env.EXPECTED_OAUTH_KV_ID) fail('METADATA_OAUTH_KV_INVALID');
          if (receipt.binding_fingerprint !== process.env.EXPECTED_BINDING_FINGERPRINT) fail('METADATA_BINDING_FINGERPRINT_INVALID');
          if (receipt.raw_key_names_emitted !== false || receipt.raw_values_emitted !== false) fail('RAW_CREDENTIAL_METADATA_EMISSION_INVALID');
          if (receipt.token_leak !== false) fail('TOKEN_LEAK_CONTRACT_INVALID');
          if (receipt.production_mutation !== 'NONE') fail('PRODUCTION_MUTATION_INVALID');
          if (receipt.authenticated_mcp_probe_executed !== false) fail('MCP_PROBE_MUST_NOT_RUN_IN_METADATA_PHASE');
          if (receipt.legacy_retirement_authorized !== false) fail('LEGACY_RETIREMENT_MUST_REMAIN_BLOCKED');
          console.log(`OWNER_OAUTH_KV_METADATA_PREFLIGHT_VALID=PASS:${receipt.strict_owner_candidate_count}`);
          NODE

      - name: Upload immutable-style metadata receipt
        uses: actions/upload-artifact@v4
        with:
          name: research-vnext-owner-oauth-kv-metadata-preflight-${{ github.run_id }}
          path: |
            evidence/control-plane.json
            evidence/oauth-kv-metadata.json
          if-no-files-found: error
          retention-days: 30
