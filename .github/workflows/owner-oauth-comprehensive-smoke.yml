name: One-shot Owner Family OAuth comprehensive local smoke

on:
  pull_request:

permissions:
  contents: read

jobs:
  oauth-matrix:
    if: github.head_ref == 'fix/owner-oauth-effective-scope-20260827'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run Owner Family OAuth A-F destruction matrix
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 \
            --var MCP_API_KEY:owner-local-secret \
            --var MOM_GPT_API_KEY:family-local-secret \
            >/tmp/owner-family-oauth-matrix.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; tail -220 /tmp/owner-family-oauth-matrix.log || true' EXIT

          ready=false
          for i in $(seq 1 45); do
            if curl --silent --max-time 2 http://127.0.0.1:8787/health >/tmp/health.json 2>/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo 'local_worker_not_ready' >&2
            exit 1
          fi

          node <<'NODE'
          const crypto = await import('node:crypto');
          const base = 'http://127.0.0.1:8787';

          function assert(cond, message, detail) {
            if (!cond) throw new Error(`${message}${detail === undefined ? '' : `: ${JSON.stringify(detail)}`}`);
          }

          async function readText(response) {
            return await response.text();
          }

          async function json(response) {
            const text = await response.text();
            try { return JSON.parse(text); }
            catch { throw new Error(`expected JSON ${response.status}: ${text.slice(0, 700)}`); }
          }

          function challenge(verifier) {
            return crypto.createHash('sha256').update(verifier).digest('base64url');
          }

          async function register(label, callback) {
            const response = await fetch(`${base}/oauth/register`, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({
                client_name: label,
                redirect_uris: [callback],
                grant_types: ['authorization_code', 'refresh_token'],
                response_types: ['code'],
                token_endpoint_auth_method: 'none',
              }),
              redirect: 'manual',
            });
            if (response.status !== 201) {
              const text = await response.text();
              throw new Error(`DCR ${label} status ${response.status}: ${text.slice(0, 700)}`);
            }
            return json(response);
          }

          async function authorizeStart({ clientId, callback, verifier, resource, scope, state }) {
            const u = new URL(`${base}/authorize`);
            u.searchParams.set('response_type', 'code');
            u.searchParams.set('client_id', clientId);
            u.searchParams.set('redirect_uri', callback);
            u.searchParams.set('scope', scope);
            u.searchParams.set('state', state);
            u.searchParams.set('code_challenge', challenge(verifier));
            u.searchParams.set('code_challenge_method', 'S256');
            if (resource) u.searchParams.set('resource', resource);
            const response = await fetch(u, { redirect: 'manual' });
            const body = await readText(response);
            assert(response.status === 200, 'authorize login-page status', { status: response.status, body: body.slice(0, 700), resource });
            return { oauthQuery: u.searchParams.toString(), body };
          }

          async function authorizeWrongSecret({ oauthQuery, secret, expectedText }) {
            const response = await fetch(`${base}/authorize`, {
              method: 'POST',
              headers: { 'content-type': 'application/x-www-form-urlencoded' },
              body: new URLSearchParams({ oauth_query: oauthQuery, login_secret: secret }),
              redirect: 'manual',
            });
            const body = await readText(response);
            assert(response.status === 200, 'wrong-secret POST must not grant', { status: response.status, body: body.slice(0, 500) });
            assert(!response.headers.get('location'), 'wrong-secret POST unexpectedly redirected', response.headers.get('location'));
            assert(body.includes(expectedText), 'wrong-secret page marker missing', body.slice(0, 600));
          }

          async function authorizeFinish({ oauthQuery, secret, label }) {
            const response = await fetch(`${base}/authorize`, {
              method: 'POST',
              headers: { 'content-type': 'application/x-www-form-urlencoded' },
              body: new URLSearchParams({ oauth_query: oauthQuery, login_secret: secret }),
              redirect: 'manual',
            });
            if (response.status !== 302) {
              const text = await response.text();
              throw new Error(`${label} authorize POST status ${response.status}: ${text.slice(0, 900)}`);
            }
            const location = response.headers.get('location');
            assert(location, `${label} authorize missing redirect`);
            const redirect = new URL(location);
            const code = redirect.searchParams.get('code');
            assert(code, `${label} authorize missing code`, location);
            return code;
          }

          async function tokenRequest(params) {
            const response = await fetch(`${base}/oauth/token`, {
              method: 'POST',
              headers: { 'content-type': 'application/x-www-form-urlencoded' },
              body: new URLSearchParams(params),
              redirect: 'manual',
            });
            const text = await response.text();
            let body;
            try { body = JSON.parse(text); } catch { body = { raw: text }; }
            return { response, body };
          }

          async function protectedCall(path, token) {
            return fetch(`${base}${path}`, {
              method: 'POST',
              headers: {
                authorization: `Bearer ${token}`,
                'content-type': 'application/json',
                accept: 'application/json, text/event-stream',
              },
              body: JSON.stringify({
                jsonrpc: '2.0',
                id: 1,
                method: 'initialize',
                params: {
                  protocolVersion: '2025-03-26',
                  capabilities: {},
                  clientInfo: { name: 'oauth-matrix', version: '1' },
                },
              }),
              redirect: 'manual',
            });
          }

          async function assertBearerRejected(path, token, expectedMetadataPath) {
            const headers = token ? { authorization: `Bearer ${token}` } : {};
            const response = await fetch(`${base}${path}`, { headers, redirect: 'manual' });
            assert(response.status === 401, `bearer must be rejected ${path}`, response.status);
            const challengeHeader = response.headers.get('www-authenticate') || '';
            assert(challengeHeader.includes(expectedMetadataPath), `wrong challenge metadata ${path}`, challengeHeader);
          }

          // A. Discovery and frozen public identity.
          {
            const healthResponse = await fetch(`${base}/health`);
            assert(healthResponse.status === 200, 'health must remain public', healthResponse.status);
            const health = await json(healthResponse);
            assert(health.status === 'ok', 'health status', health);
            assert(health.mcp_endpoint === '/my-mcp', 'Owner ingress moved', health);

            const owner = await json(await fetch(`${base}/.well-known/oauth-protected-resource/my-mcp`));
            const legacy = await json(await fetch(`${base}/.well-known/oauth-protected-resource/mcp`));
            const family = await json(await fetch(`${base}/.well-known/oauth-protected-resource/family-mcp`));
            assert(owner.resource === `${base}/my-mcp`, 'Owner resource metadata', owner);
            assert(JSON.stringify(owner.scopes_supported) === JSON.stringify(['owner:full']), 'Owner scope metadata', owner);
            assert(legacy.resource === `${base}/mcp`, 'legacy Owner resource metadata', legacy);
            assert(JSON.stringify(legacy.scopes_supported) === JSON.stringify(['owner:full']), 'legacy Owner scope metadata', legacy);
            assert(family.resource === `${base}/family-mcp`, 'Family resource metadata', family);
            assert(JSON.stringify(family.scopes_supported) === JSON.stringify(['family:read']), 'Family scope metadata', family);
            assert((await fetch(`${base}/.well-known/oauth-protected-resource`)).status === 404, 'root metadata must not infer role');
          }

          // C/D/E. Missing and invalid bearer tokens must never enter any MCP handler.
          for (const [path, metadataPath] of [
            ['/my-mcp', '/.well-known/oauth-protected-resource/my-mcp'],
            ['/mcp', '/.well-known/oauth-protected-resource/mcp'],
            ['/family-mcp', '/.well-known/oauth-protected-resource/family-mcp'],
          ]) {
            await assertBearerRejected(path, '', metadataPath);
            await assertBearerRejected(path, 'definitely-invalid-bearer-token', metadataPath);
          }

          // B/C/F. Canonical Owner flow, including wrong-secret non-grant and refresh boundaries.
          const ownerCallback = 'https://chatgpt.com/connector/oauth/MatrixOwnerCanonical123';
          const ownerVerifier = 'owner-canonical-verifier-that-is-safely-longer-than-43-characters';
          const ownerClient = await register('Matrix Owner Canonical', ownerCallback);
          const ownerStart = await authorizeStart({
            clientId: ownerClient.client_id,
            callback: ownerCallback,
            verifier: ownerVerifier,
            resource: `${base}/my-mcp`,
            scope: 'owner:full offline_access',
            state: 'owner-canonical-state',
          });
          assert(ownerStart.body.includes('Owner / 鑽石引擎'), 'Owner request entered wrong login page', ownerStart.body.slice(0, 500));
          assert(!ownerStart.body.includes('<h1>台股引擎 Family</h1>'), 'Owner request leaked into Family login');
          await authorizeWrongSecret({
            oauthQuery: ownerStart.oauthQuery,
            secret: 'wrong-owner-secret',
            expectedText: 'Owner 驗證碼錯誤',
          });
          const ownerCode = await authorizeFinish({
            oauthQuery: ownerStart.oauthQuery,
            secret: 'owner-local-secret',
            label: 'Owner canonical',
          });
          const ownerExchange = await tokenRequest({
            grant_type: 'authorization_code',
            code: ownerCode,
            redirect_uri: ownerCallback,
            code_verifier: ownerVerifier,
            client_id: ownerClient.client_id,
            resource: `${base}/my-mcp`,
          });
          assert(ownerExchange.response.status === 200, 'Owner code exchange', ownerExchange.body);
          assert(ownerExchange.body.access_token, 'Owner access token missing', ownerExchange.body);
          assert(ownerExchange.body.refresh_token, 'Owner refresh token missing', ownerExchange.body);
          assert((ownerExchange.body.scope || '').split(/\s+/).filter(Boolean).includes('owner:full'), 'Owner effective scope missing', ownerExchange.body);

          const ownerGood = await protectedCall('/my-mcp', ownerExchange.body.access_token);
          assert(ownerGood.status !== 401 && ownerGood.status !== 403, 'Owner canonical token rejected', { status: ownerGood.status, body: (await ownerGood.text()).slice(0, 500) });
          const ownerIntoFamily = await protectedCall('/family-mcp', ownerExchange.body.access_token);
          assert(ownerIntoFamily.status === 401 || ownerIntoFamily.status === 403, 'Owner token crossed into Family', ownerIntoFamily.status);
          const ownerIntoLegacy = await protectedCall('/mcp', ownerExchange.body.access_token);
          assert(ownerIntoLegacy.status === 401 || ownerIntoLegacy.status === 403, 'Owner /my-mcp token crossed audience into /mcp alias', ownerIntoLegacy.status);

          const ownerWrongResourceRefresh = await tokenRequest({
            grant_type: 'refresh_token',
            refresh_token: ownerExchange.body.refresh_token,
            client_id: ownerClient.client_id,
            resource: `${base}/family-mcp`,
          });
          assert(ownerWrongResourceRefresh.response.status === 400 && ownerWrongResourceRefresh.body.error === 'invalid_target', 'Owner refresh audience drift not rejected', ownerWrongResourceRefresh.body);

          const ownerRefresh = await tokenRequest({
            grant_type: 'refresh_token',
            refresh_token: ownerExchange.body.refresh_token,
            client_id: ownerClient.client_id,
            resource: `${base}/my-mcp`,
          });
          assert(ownerRefresh.response.status === 200 && ownerRefresh.body.access_token, 'Owner refresh failed', ownerRefresh.body);
          assert((ownerRefresh.body.scope || '').split(/\s+/).filter(Boolean).includes('owner:full'), 'Owner refresh lost owner scope', ownerRefresh.body);
          const ownerRefreshedCall = await protectedCall('/my-mcp', ownerRefresh.body.access_token);
          assert(ownerRefreshedCall.status !== 401 && ownerRefreshedCall.status !== 403, 'Refreshed Owner token rejected', ownerRefreshedCall.status);

          // C/F. A valid Owner grant may be downscoped by the token endpoint. A token with
          // correct owner props/audience but without owner:full must be denied by the app handler.
          const ownerNarrowCallback = 'https://chatgpt.com/connector/oauth/MatrixOwnerNarrow123';
          const ownerNarrowVerifier = 'owner-narrow-verifier-that-is-safely-longer-than-43-characters';
          const ownerNarrowClient = await register('Matrix Owner Narrow', ownerNarrowCallback);
          const ownerNarrowStart = await authorizeStart({
            clientId: ownerNarrowClient.client_id,
            callback: ownerNarrowCallback,
            verifier: ownerNarrowVerifier,
            resource: `${base}/my-mcp`,
            scope: 'owner:full',
            state: 'owner-narrow-state',
          });
          const ownerNarrowCode = await authorizeFinish({ oauthQuery: ownerNarrowStart.oauthQuery, secret: 'owner-local-secret', label: 'Owner narrow' });
          const ownerNarrowExchange = await tokenRequest({
            grant_type: 'authorization_code',
            code: ownerNarrowCode,
            redirect_uri: ownerNarrowCallback,
            code_verifier: ownerNarrowVerifier,
            client_id: ownerNarrowClient.client_id,
            resource: `${base}/my-mcp`,
            scope: 'family:read',
          });
          assert(ownerNarrowExchange.response.status === 200 && ownerNarrowExchange.body.access_token, 'Owner downscope token issue failed', ownerNarrowExchange.body);
          assert(!(ownerNarrowExchange.body.scope || '').split(/\s+/).filter(Boolean).includes('owner:full'), 'Owner downscope unexpectedly retained owner:full', ownerNarrowExchange.body);
          const ownerNarrowCall = await protectedCall('/my-mcp', ownerNarrowExchange.body.access_token);
          assert(ownerNarrowCall.status === 403, 'Owner token missing owner:full reached MyMCP', { status: ownerNarrowCall.status, body: (await ownerNarrowCall.text()).slice(0, 500) });

          // D. Legacy Owner /mcp gets its own exact audience and the same protection.
          const legacyCallback = 'https://chatgpt.com/connector/oauth/MatrixOwnerLegacy123';
          const legacyVerifier = 'owner-legacy-verifier-that-is-safely-longer-than-43-characters';
          const legacyClient = await register('Matrix Owner Legacy', legacyCallback);
          const legacyStart = await authorizeStart({
            clientId: legacyClient.client_id,
            callback: legacyCallback,
            verifier: legacyVerifier,
            resource: `${base}/mcp`,
            scope: 'owner:full',
            state: 'owner-legacy-state',
          });
          assert(legacyStart.body.includes('Owner / 鑽石引擎'), 'legacy /mcp did not route to Owner login', legacyStart.body.slice(0, 500));
          const legacyCode = await authorizeFinish({ oauthQuery: legacyStart.oauthQuery, secret: 'owner-local-secret', label: 'Owner legacy' });
          const legacyExchange = await tokenRequest({
            grant_type: 'authorization_code',
            code: legacyCode,
            redirect_uri: legacyCallback,
            code_verifier: legacyVerifier,
            client_id: legacyClient.client_id,
            resource: `${base}/mcp`,
          });
          assert(legacyExchange.response.status === 200 && legacyExchange.body.access_token, 'legacy Owner token exchange failed', legacyExchange.body);
          const legacyGood = await protectedCall('/mcp', legacyExchange.body.access_token);
          assert(legacyGood.status !== 401 && legacyGood.status !== 403, 'legacy Owner token rejected by /mcp', { status: legacyGood.status, body: (await legacyGood.text()).slice(0, 500) });
          const legacyIntoCanonical = await protectedCall('/my-mcp', legacyExchange.body.access_token);
          assert(legacyIntoCanonical.status === 401 || legacyIntoCanonical.status === 403, 'legacy token crossed exact audience into /my-mcp', legacyIntoCanonical.status);

          // E/F. Explicit Family flow and cross-role/resource refresh boundaries.
          const familyCallback = 'https://chatgpt.com/connector/oauth/MatrixFamilyExplicit123';
          const familyVerifier = 'family-explicit-verifier-that-is-safely-longer-than-43-characters';
          const familyClient = await register('Matrix Family Explicit', familyCallback);
          const familyStart = await authorizeStart({
            clientId: familyClient.client_id,
            callback: familyCallback,
            verifier: familyVerifier,
            resource: `${base}/family-mcp`,
            scope: 'family:read offline_access',
            state: 'family-explicit-state',
          });
          assert(familyStart.body.includes('<h1>台股引擎 Family</h1>'), 'Family request entered wrong login page', familyStart.body.slice(0, 500));
          assert(!familyStart.body.includes('Owner / 鑽石引擎'), 'Family request leaked into Owner login');
          const familyCode = await authorizeFinish({ oauthQuery: familyStart.oauthQuery, secret: 'family-local-secret', label: 'Family explicit' });
          const familyExchange = await tokenRequest({
            grant_type: 'authorization_code',
            code: familyCode,
            redirect_uri: familyCallback,
            code_verifier: familyVerifier,
            client_id: familyClient.client_id,
            resource: `${base}/family-mcp`,
          });
          assert(familyExchange.response.status === 200, 'Family code exchange', familyExchange.body);
          assert(familyExchange.body.access_token, 'Family access token missing', familyExchange.body);
          assert(familyExchange.body.refresh_token, 'Family refresh token missing', familyExchange.body);
          assert((familyExchange.body.scope || '').split(/\s+/).filter(Boolean).includes('family:read'), 'Family effective scope missing', familyExchange.body);

          const familyGood = await protectedCall('/family-mcp', familyExchange.body.access_token);
          assert(familyGood.status !== 401 && familyGood.status !== 403, 'Family token rejected', { status: familyGood.status, body: (await familyGood.text()).slice(0, 500) });
          const familyIntoOwner = await protectedCall('/my-mcp', familyExchange.body.access_token);
          assert(familyIntoOwner.status === 401 || familyIntoOwner.status === 403, 'Family token crossed into Owner', familyIntoOwner.status);

          const familyWrongResourceRefresh = await tokenRequest({
            grant_type: 'refresh_token',
            refresh_token: familyExchange.body.refresh_token,
            client_id: familyClient.client_id,
            resource: `${base}/my-mcp`,
          });
          assert(familyWrongResourceRefresh.response.status === 400 && familyWrongResourceRefresh.body.error === 'invalid_target', 'Family refresh audience drift not rejected', familyWrongResourceRefresh.body);

          const familyRefresh = await tokenRequest({
            grant_type: 'refresh_token',
            refresh_token: familyExchange.body.refresh_token,
            client_id: familyClient.client_id,
            resource: `${base}/family-mcp`,
          });
          assert(familyRefresh.response.status === 200 && familyRefresh.body.access_token, 'Family refresh failed', familyRefresh.body);
          assert((familyRefresh.body.scope || '').split(/\s+/).filter(Boolean).includes('family:read'), 'Family refresh lost family scope', familyRefresh.body);
          const familyRefreshedCall = await protectedCall('/family-mcp', familyRefresh.body.access_token);
          assert(familyRefreshedCall.status !== 401 && familyRefreshedCall.status !== 403, 'Refreshed Family token rejected', familyRefreshedCall.status);

          // E/F. Valid Family grant downscoped to an unrelated permission must not enter FamilyMCP.
          const familyNarrowCallback = 'https://chatgpt.com/connector/oauth/MatrixFamilyNarrow123';
          const familyNarrowVerifier = 'family-narrow-verifier-that-is-safely-longer-than-43-characters';
          const familyNarrowClient = await register('Matrix Family Narrow', familyNarrowCallback);
          const familyNarrowStart = await authorizeStart({
            clientId: familyNarrowClient.client_id,
            callback: familyNarrowCallback,
            verifier: familyNarrowVerifier,
            resource: `${base}/family-mcp`,
            scope: 'family:read',
            state: 'family-narrow-state',
          });
          const familyNarrowCode = await authorizeFinish({ oauthQuery: familyNarrowStart.oauthQuery, secret: 'family-local-secret', label: 'Family narrow' });
          const familyNarrowExchange = await tokenRequest({
            grant_type: 'authorization_code',
            code: familyNarrowCode,
            redirect_uri: familyNarrowCallback,
            code_verifier: familyNarrowVerifier,
            client_id: familyNarrowClient.client_id,
            resource: `${base}/family-mcp`,
            scope: 'owner:full',
          });
          assert(familyNarrowExchange.response.status === 200 && familyNarrowExchange.body.access_token, 'Family downscope token issue failed', familyNarrowExchange.body);
          assert(!(familyNarrowExchange.body.scope || '').split(/\s+/).filter(Boolean).includes('family:read'), 'Family downscope unexpectedly retained family:read', familyNarrowExchange.body);
          const familyNarrowCall = await protectedCall('/family-mcp', familyNarrowExchange.body.access_token);
          assert(familyNarrowCall.status === 403, 'Family token missing family:read reached FamilyMCP', { status: familyNarrowCall.status, body: (await familyNarrowCall.text()).slice(0, 500) });

          // E. Omitted resource remains legacy Family compatibility; it must never infer Owner.
          const omittedCallback = 'https://chatgpt.com/connector/oauth/MatrixFamilyOmitted123';
          const omittedVerifier = 'family-omitted-verifier-that-is-safely-longer-than-43-characters';
          const omittedClient = await register('Matrix Family Omitted', omittedCallback);
          const omittedStart = await authorizeStart({
            clientId: omittedClient.client_id,
            callback: omittedCallback,
            verifier: omittedVerifier,
            resource: '',
            scope: 'family:read offline_access',
            state: 'family-omitted-state',
          });
          assert(omittedStart.body.includes('<h1>台股引擎 Family</h1>'), 'omitted resource no longer routes to Family compatibility', omittedStart.body.slice(0, 600));
          assert(!omittedStart.body.includes('Owner / 鑽石引擎'), 'omitted resource inferred Owner');
          const omittedCode = await authorizeFinish({ oauthQuery: omittedStart.oauthQuery, secret: 'family-local-secret', label: 'Family omitted resource' });
          const omittedExchange = await tokenRequest({
            grant_type: 'authorization_code',
            code: omittedCode,
            redirect_uri: omittedCallback,
            code_verifier: omittedVerifier,
            client_id: omittedClient.client_id,
          });
          assert(omittedExchange.response.status === 200 && omittedExchange.body.access_token, 'omitted-resource Family exchange failed', omittedExchange.body);
          assert((omittedExchange.body.scope || '').split(/\s+/).filter(Boolean).includes('family:read'), 'omitted-resource Family scope missing', omittedExchange.body);
          const omittedFamilyCall = await protectedCall('/family-mcp', omittedExchange.body.access_token);
          assert(omittedFamilyCall.status !== 401 && omittedFamilyCall.status !== 403, 'omitted-resource legacy Family token rejected', { status: omittedFamilyCall.status, body: (await omittedFamilyCall.text()).slice(0, 500) });
          const omittedIntoOwner = await protectedCall('/my-mcp', omittedExchange.body.access_token);
          assert(omittedIntoOwner.status === 401 || omittedIntoOwner.status === 403, 'omitted-resource Family token crossed into Owner', omittedIntoOwner.status);

          console.log('OWNER_FAMILY_OAUTH_A_F_MATRIX=PASS');
          NODE
