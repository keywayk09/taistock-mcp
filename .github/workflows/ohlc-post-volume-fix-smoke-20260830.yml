name: OHLC Post Volume Fix Smoke 20260830

on:
  push:
    branches:
      - ops/ohlc-post-volume-fix-smoke-20260830
    paths:
      - .github/workflows/ohlc-post-volume-fix-smoke-20260830.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify tv-fugle-1d production health
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const r = await fetch('https://tv-fugle-1d.keikei99887.workers.dev/health', {
            headers: { accept: 'application/json', 'cache-control': 'no-cache' },
            signal: AbortSignal.timeout(15000),
          });
          const text = await r.text();
          let body;
          try { body = JSON.parse(text); } catch { throw new Error(`health_not_json_http_${r.status}`); }
          if (!r.ok) throw new Error(`health_http_${r.status}`);
          if (!body || typeof body !== 'object') throw new Error('health_shape_invalid');
          const day = body.day || {};
          if (String(day.phase || '') !== 'DONE') throw new Error(`day_phase_${String(day.phase)}`);
          if (!/^2026-08-\d{2}$/.test(String(day.trade_date || ''))) throw new Error(`trade_date_${String(day.trade_date)}`);
          console.log(`[smoke] OHLC_PRODUCTION_HEALTH_PASS trade_date=${day.trade_date} phase=${day.phase}`);
          NODE
