name: Crypto Short Asym V5

on:
  push:
    branches: [research/crypto-mtf-rr-20260830]
    paths:
      - '.github/workflows/crypto-short-asym-v5.yml'
      - 'research/crypto_short_asym_v5.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run asymmetric SHORT research
        run: python research/crypto_short_asym_v5.py
      - name: Upload asymmetric SHORT report
        uses: actions/upload-artifact@v4
        with:
          name: crypto-short-asym-v5
          path: /tmp/crypto_short_asym_v5.json
          retention-days: 3
