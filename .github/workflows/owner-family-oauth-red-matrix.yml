name: Owner confidential + Family preservation RED matrix

on:
  push:
    branches:
      - fix/owner-legacy-confidential-family-safe-20260827
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      - name: Family / Mom preservation baseline
        shell: bash
        run: |
          set -euo pipefail
          npm run test:family-selection

      - name: Owner legacy confidential RED contract
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types tests/owner-oauth-legacy-confidential-compat.test.ts
