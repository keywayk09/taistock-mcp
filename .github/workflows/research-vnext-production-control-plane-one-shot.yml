name: Research VNext Production Control-Plane One-Shot

on:
  push:
    branches:
      - 'refactor/research-vnext-foundation-20260901'
    paths:
      - 'runtime/research-vnext-production-control-plane-one-shot-authorization.json'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout authorization commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Fail closed on exact one-shot authorization
        shell: bash
        env:
          EXPECTED_BRANCH: refactor/research-vnext-foundation-20260901
          EXPECTED_SOURCE_SHA: 9fa1499eeaeb2ccaa7e118502f8b618c76401a31
          AUTH_PATH: runtime/research-vnext-production-control-plane-one-shot-authorization.json
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" != "$EXPECTED_BRANCH" ]; then
            echo 'FAIL: unexpected branch'
            exit 78
          fi
          if [ "$GITHUB_SHA" != "$AFTER_SHA" ]; then
            echo 'FAIL: event after SHA mismatch'
            exit 78
          fi
          mapfile -t changed < <(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")
          if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != "$AUTH_PATH" ]; then
            echo 'FAIL: one-shot trigger commit must change only the authorization file'
            printf '%s\n' "${changed[@]}"
            exit 78
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const path = process.env.AUTH_PATH;
          const expectedSha = process.env.EXPECTED_SOURCE_SHA;
          const body = JSON.parse(fs.readFileSync(path, 'utf8'));
          const fail = (message) => { throw new Error(message); };
          if (body.schema !== 'RESEARCH_VNEXT_PRODUCTION_CONTROL_PLANE_ONE_SHOT_AUTH_V1') fail('INVALID_AUTH_SCHEMA');
          if (body.mode !== 'READ_ONLY_PRODUCTION_CONTROL_PLANE_SNAPSHOT') fail('INVALID_AUTH_MODE');
          if (body.source_sha !== expectedSha) fail('INVALID_AUTH_SOURCE_SHA');
          if (body.production_deploy_authorized !== false) fail('DEPLOY_MUST_REMAIN_UNAUTHORIZED');
          if (body.production_mutation !== 'NONE') fail('MUTATION_MUST_REMAIN_NONE');
          if (!/^vnext-live-snapshot-20260901-[a-z0-9-]{8,64}$/.test(String(body.authorization_nonce ?? ''))) fail('INVALID_AUTH_NONCE');
          console.log('READ_ONLY_PRODUCTION_CONTROL_PLANE_SNAPSHOT=AUTHORIZED');
          console.log('production_deploy_authorized=false');
          console.log('production_mutation=NONE');
          NODE

      - name: Checkout sealed snapshot source
        uses: actions/checkout@v4
        with:
          ref: 9fa1499eeaeb2ccaa7e118502f8b618c76401a31
          path: sealed
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Capture exactly one GET-only Production control-plane snapshot
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEARCH_VNEXT_EXPECTED_SHA: 9fa1499eeaeb2ccaa7e118502f8b618c76401a31
        run: |
          set -euo pipefail
          node --experimental-strip-types sealed/scripts/research-vnext-production-control-plane-live-snapshot.mjs \
            > research-vnext-production-control-plane-one-shot-receipt.json

      - name: Upload immutable-style one-shot receipt
        uses: actions/upload-artifact@v4
        with:
          name: research-vnext-production-control-plane-one-shot-${{ github.run_id }}
          path: research-vnext-production-control-plane-one-shot-receipt.json
          if-no-files-found: error
          retention-days: 30
