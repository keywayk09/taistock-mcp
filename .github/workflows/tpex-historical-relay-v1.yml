name: TPEx Historical Relay V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tpex-historical-relay-v1.yml'

permissions:
  contents: read

concurrency:
  group: tpex-official-relay-v2
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe exact-date official TPEx APIs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request, urllib.parse
          HEADERS = {
            'Accept': 'application/json,text/plain,*/*',
            'Accept-Language': 'zh-TW,zh;q=0.9,en;q=0.8',
            'Referer': 'https://www.tpex.org.tw/',
            'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140.0.0.0 Safari/537.36',
          }
          day_roc = '115/08/18'
          day_ad = '2026/08/18'
          candidates = {
            'institutional': [
              f'https://www.tpex.org.tw/www/zh-tw/insti/dailyTrade?type=Daily&sect=EW&date={urllib.parse.quote(day_roc, safe="")}&id=&response=json',
            ],
            'margin': [
              f'https://www.tpex.org.tw/www/zh-tw/margin/transactions?date={urllib.parse.quote(day_roc, safe="")}&id=&response=json',
              f'https://www.tpex.org.tw/www/zh-tw/margin/transactions?date={urllib.parse.quote(day_ad, safe="")}&id=&response=json',
              f'https://www.tpex.org.tw/www/zh-tw/margin/balance?date={urllib.parse.quote(day_roc, safe="")}&id=&response=json',
            ],
            'sbl': [
              f'https://www.tpex.org.tw/www/zh-tw/margin/sbl?date={urllib.parse.quote(day_ad, safe="")}&id=&response=json',
              f'https://www.tpex.org.tw/www/zh-tw/margin/sbl?date={urllib.parse.quote(day_roc, safe="")}&id=&response=json',
            ],
          }
          def summarize(body):
            out = {'type': type(body).__name__}
            if isinstance(body, dict):
              out['keys'] = list(body.keys())[:30]
              out['date'] = body.get('date') or body.get('Date')
              tables = body.get('tables')
              if isinstance(tables, list):
                out['tables'] = []
                for t in tables[:5]:
                  if not isinstance(t, dict): continue
                  data = t.get('data') if isinstance(t.get('data'), list) else []
                  out['tables'].append({'title': t.get('title'), 'date': t.get('date'), 'fields': t.get('fields'), 'rows': len(data), 'sample': data[:1]})
              if isinstance(body.get('data'), list): out['rows'] = len(body['data'])
            elif isinstance(body, list):
              out['rows'] = len(body)
              out['sample'] = body[:1]
            return out
          any_success = False
          for label, urls in candidates.items():
            print(f'=== {label} ===')
            for url in urls:
              try:
                req = urllib.request.Request(url, headers=HEADERS)
                with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read()
                  print('URL', url)
                  print('HTTP', response.status, 'FINAL', response.geturl(), 'BYTES', len(raw))
                body = json.loads(raw.decode('utf-8-sig'))
                print(json.dumps(summarize(body), ensure_ascii=False)[:12000])
                any_success = True
              except Exception as exc:
                print('ERROR', url, type(exc).__name__, str(exc)[:1000])
          if not any_success:
            raise SystemExit('all TPEx modern API probes failed')
          PY
