name: TPEx Historical Relay V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tpex-historical-relay-v1.yml'
  schedule:
    # Temporary one-shot bootstrap cadence. The workflow disables itself after COMPLETE.
    - cron: '25,55 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: tpex-official-relay-v2
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load relay branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/tpex-history
          mkdir -p /tmp/tpex-history/data/market-data/tpex-relay
          git fetch origin market-data-relay:refs/remotes/origin/market-data-relay
          git archive refs/remotes/origin/market-data-relay data/market-data/tpex-relay | tar -x -C /tmp/tpex-history

      - name: Capture exact-date TPEx history
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt
          import hashlib
          import json
          import pathlib
          import re
          import urllib.parse
          import urllib.request

          ROOT = pathlib.Path('/tmp/tpex-history/data/market-data/tpex-relay')
          STATE = ROOT / 'history-state.json'
          BATCH_DAYS = 10
          HORIZON_DAYS = 180
          HEADERS = {
              'Accept': 'application/json,text/plain,*/*',
              'Accept-Language': 'zh-TW,zh;q=0.9,en;q=0.8',
              'Referer': 'https://www.tpex.org.tw/',
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140.0.0.0 Safari/537.36',
          }

          def clean(value):
              return re.sub(r'<[^>]*>', '', str(value or '')).replace('&nbsp;', ' ').strip()

          def number(value):
              try:
                  return float(clean(value).replace(',', ''))
              except Exception:
                  return 0.0

          def stable_payload(body):
              return json.dumps(body, ensure_ascii=False, separators=(',', ':'), sort_keys=True)

          def fetch_json(url, label):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read()
                  final_url = response.geturl()
                  if response.status != 200:
                      raise RuntimeError(f'{label}_http_{response.status}')
                  if '/errors' in final_url:
                      raise RuntimeError(f'{label}_redirected_to_errors:{final_url}')
              try:
                  body = json.loads(raw.decode('utf-8-sig'))
              except Exception as exc:
                  raise RuntimeError(f'{label}_invalid_json:{exc}')
              return body

          def exact_table(body, day, label):
              expected_ad = day.strftime('%Y%m%d')
              expected_roc = f'{day.year - 1911:03d}/{day.month:02d}/{day.day:02d}'
              if not isinstance(body, dict):
                  raise RuntimeError(f'{label}_root_not_object')
              if str(body.get('date') or '') != expected_ad:
                  raise RuntimeError(f'{label}_source_date_mismatch:{body.get("date")}')
              tables = body.get('tables')
              if not isinstance(tables, list) or not tables or not isinstance(tables[0], dict):
                  raise RuntimeError(f'{label}_tables_missing')
              table = tables[0]
              table_date = str(table.get('date') or '')
              if table_date and table_date != expected_roc:
                  raise RuntimeError(f'{label}_table_date_mismatch:{table_date}')
              rows = table.get('data')
              if not isinstance(rows, list):
                  raise RuntimeError(f'{label}_table_data_missing')
              return [row for row in rows if isinstance(row, list)]

          def urls_for(day):
              roc = urllib.parse.quote(f'{day.year - 1911:03d}/{day.month:02d}/{day.day:02d}', safe='')
              ad = urllib.parse.quote(day.strftime('%Y/%m/%d'), safe='')
              return {
                  'institutional': f'https://www.tpex.org.tw/www/zh-tw/insti/dailyTrade?type=Daily&sect=EW&date={roc}&id=&response=json',
                  'margin': f'https://www.tpex.org.tw/www/zh-tw/margin/balance?date={roc}&id=&response=json',
                  'sbl': f'https://www.tpex.org.tw/www/zh-tw/margin/sbl?date={ad}&id=&response=json',
              }

          def capture_day(day):
              trade_date = day.isoformat()
              urls = urls_for(day)
              inst_body = fetch_json(urls['institutional'], 'TPEX_INSTI_MODERN')
              margin_body = fetch_json(urls['margin'], 'TPEX_MARGIN_MODERN')
              sbl_body = fetch_json(urls['sbl'], 'TPEX_SBL_MODERN')
              inst = exact_table(inst_body, day, 'TPEX_INSTI_MODERN')
              margin = exact_table(margin_body, day, 'TPEX_MARGIN_MODERN')
              sbl = exact_table(sbl_body, day, 'TPEX_SBL_MODERN')

              empty_count = sum(1 for rows in (inst, margin, sbl) if not rows)
              if empty_count:
                  # Never silently classify a weekday as no-trading from one empty dataset.
                  raise RuntimeError(f'exact_date_dataset_empty:inst={len(inst)}:margin={len(margin)}:sbl={len(sbl)}')

              datasets = {
                  'institutional': [{
                      'Date': trade_date,
                      '證券代號': clean(row[0]),
                      '證券名稱': clean(row[1]),
                      '外資及陸資買賣超股數': row[10],
                      '投信買賣超股數': row[13],
                      '自營商買賣超股數': row[22],
                      '三大法人買賣超股數': row[23],
                  } for row in inst if len(row) > 23 and clean(row[0])],
                  'margin': [{
                      'Date': trade_date,
                      '證券代號': clean(row[0]),
                      '證券名稱': clean(row[1]),
                      '融資前日餘額': row[2],
                      '融資今日餘額': row[6],
                      '融券前日餘額': row[10],
                      '融券今日餘額': row[14],
                  } for row in margin if len(row) > 14 and clean(row[0])],
                  'sbl_balance': [{
                      'Date': trade_date,
                      'SecuritiesCompanyCode': clean(row[0]),
                      'CompanyName': clean(row[1]),
                      'SecuritiesBorrowingBalancePreviousDay': row[8],
                      'SecuritiesBorrowingSale': row[9],
                      'SecuritiesBorrowingReturn': row[10],
                      'SecuritiesBorrowingAdjustment': row[11],
                      'SecuritiesBorrowingBalanceOfTheMarketDay': row[12],
                      'AvailableVolumesForSBLShortSale': row[13],
                  } for row in sbl if len(row) > 13 and clean(row[0])],
                  'sbl_volume': [{
                      'Date': trade_date,
                      'SecuritiesCompanyCode': clean(row[0]),
                      'CompanyName': clean(row[1]),
                      'SBLVolume': number(row[9]) / 1000,
                      'SBLAmount': None,
                  } for row in sbl if len(row) > 9 and clean(row[0])],
              }
              if any(not rows for rows in datasets.values()):
                  raise RuntimeError('historical_dataset_empty_after_normalization')

              base = ROOT / trade_date
              base.mkdir(parents=True, exist_ok=True)
              now = dt.datetime.now(dt.timezone.utc).isoformat().replace('+00:00', 'Z')
              manifest = {
                  'schema': 'TPEX_OFFICIAL_RELAY_V2',
                  'trade_date': trade_date,
                  'captured_at_utc': now,
                  'source_owner': 'TPEx',
                  'transport': 'GitHub hosted runner exact-date modern official TPEx JSON API',
                  'canonical_storage': 'keywayk09/tv-papertrader main/data',
                  'datasets': {},
                  'capture_errors': {},
              }
              endpoint_map = {
                  'institutional': urls['institutional'],
                  'margin': urls['margin'],
                  'sbl_balance': urls['sbl'],
                  'sbl_volume': urls['sbl'],
              }
              for name, rows in datasets.items():
                  payload = stable_payload(rows)
                  sha = hashlib.sha256(payload.encode('utf-8')).hexdigest()
                  file_name = f'{name}.json'
                  (base / file_name).write_text(payload + '\n', encoding='utf-8')
                  manifest['datasets'][name] = {
                      'source_date': trade_date,
                      'row_count': len(rows),
                      'sha256': sha,
                      'endpoint': endpoint_map[name],
                      'file': file_name,
                  }
              (base / 'manifest.json').write_text(
                  json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8'
              )
              return {name: len(rows) for name, rows in datasets.items()}

          latest = json.loads((ROOT / 'latest.json').read_text(encoding='utf-8'))
          anchor = dt.date.fromisoformat(latest['trade_date'])
          target = anchor - dt.timedelta(days=HORIZON_DAYS)
          state = json.loads(STATE.read_text(encoding='utf-8')) if STATE.exists() else {
              'schema': 'TPEX_HISTORICAL_RELAY_STATE_V1',
              'anchor_trade_date': anchor.isoformat(),
              'target_start_date': target.isoformat(),
              'cursor_date': (anchor - dt.timedelta(days=1)).isoformat(),
              'status': 'RUNNING', 'processed_dates': 0,
              'updated_at': None, 'completed_at': None,
          }
          if state.get('status') == 'COMPLETE':
              pathlib.Path('/tmp/tpex-history-complete').write_text('1')
              print(json.dumps(state, ensure_ascii=False))
              raise SystemExit(0)

          # Retention may only shrink; never reopen or move a cursor backward here.
          state['target_start_date'] = max(str(state.get('target_start_date') or target.isoformat()), target.isoformat())
          cursor = dt.date.fromisoformat(state['cursor_date'])
          done = 0
          while done < BATCH_DAYS and cursor >= dt.date.fromisoformat(state['target_start_date']):
              if cursor.weekday() >= 5:
                  cursor -= dt.timedelta(days=1)
                  state['cursor_date'] = cursor.isoformat()
                  continue
              print(f'historical relay attempting {cursor}')
              try:
                  counts = capture_day(cursor)
                  print(f'historical relay READY {cursor} {counts}')
              except Exception as exc:
                  state['last_error'] = f'{type(exc).__name__}: {exc}'[:500]
                  state['updated_at'] = dt.datetime.now(dt.timezone.utc).isoformat().replace('+00:00', 'Z')
                  STATE.write_text(json.dumps(state, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
                  raise
              state.pop('last_error', None)
              state['processed_dates'] = int(state.get('processed_dates', 0)) + 1
              cursor -= dt.timedelta(days=1)
              state['cursor_date'] = cursor.isoformat()
              state['updated_at'] = dt.datetime.now(dt.timezone.utc).isoformat().replace('+00:00', 'Z')
              done += 1

          if cursor < dt.date.fromisoformat(state['target_start_date']):
              state['status'] = 'COMPLETE'
              state['completed_at'] = state.get('completed_at') or dt.datetime.now(dt.timezone.utc).isoformat().replace('+00:00', 'Z')
              pathlib.Path('/tmp/tpex-history-complete').write_text('1')
          state['cursor_date'] = cursor.isoformat()
          state['updated_at'] = dt.datetime.now(dt.timezone.utc).isoformat().replace('+00:00', 'Z')
          STATE.write_text(json.dumps(state, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(state, ensure_ascii=False))
          PY

      - name: Publish historical relay cache
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tpex-official-relay-bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin market-data-relay:refs/remotes/origin/market-data-relay
          git checkout -B market-data-relay refs/remotes/origin/market-data-relay
          mkdir -p data/market-data/tpex-relay
          cp -a /tmp/tpex-history/data/market-data/tpex-relay/. data/market-data/tpex-relay/
          git add data/market-data/tpex-relay
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'market-data: backfill TPEx exact-date historical relay'
          git push origin HEAD:refs/heads/market-data-relay

      - name: Disable completed one-shot workflow
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f /tmp/tpex-history-complete ]; then exit 0; fi
          curl --fail-with-body -sS -L \
            -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/tpex-historical-relay-v1.yml/disable"
