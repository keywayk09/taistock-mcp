name: TPEx Historical Relay V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tpex-historical-relay-v1.yml'

permissions:
  contents: write

concurrency:
  group: tpex-official-relay-v2
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Probe exact-date official TPEx APIs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request, urllib.parse, pathlib
          HEADERS = {
            'Accept': 'application/json,text/plain,*/*',
            'Accept-Language': 'zh-TW,zh;q=0.9,en;q=0.8',
            'Referer': 'https://www.tpex.org.tw/',
            'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140.0.0.0 Safari/537.36',
          }
          day_roc = '115/08/18'
          day_ad = '2026/08/18'
          candidates = {
            'institutional': [
              f'https://www.tpex.org.tw/www/zh-tw/insti/dailyTrade?type=Daily&sect=EW&date={urllib.parse.quote(day_roc, safe="")}&id=&response=json',
            ],
            'margin': [
              f'https://www.tpex.org.tw/www/zh-tw/margin/transactions?date={urllib.parse.quote(day_roc, safe="")}&id=&response=json',
              f'https://www.tpex.org.tw/www/zh-tw/margin/transactions?date={urllib.parse.quote(day_ad, safe="")}&id=&response=json',
              f'https://www.tpex.org.tw/www/zh-tw/margin/balance?date={urllib.parse.quote(day_roc, safe="")}&id=&response=json',
            ],
            'sbl': [
              f'https://www.tpex.org.tw/www/zh-tw/margin/sbl?date={urllib.parse.quote(day_ad, safe="")}&id=&response=json',
              f'https://www.tpex.org.tw/www/zh-tw/margin/sbl?date={urllib.parse.quote(day_roc, safe="")}&id=&response=json',
            ],
          }
          def summarize(body):
            out = {'type': type(body).__name__}
            if isinstance(body, dict):
              out['keys'] = list(body.keys())[:40]
              out['date'] = body.get('date') or body.get('Date')
              tables = body.get('tables')
              if isinstance(tables, list):
                out['tables'] = []
                for t in tables[:8]:
                  if not isinstance(t, dict): continue
                  data = t.get('data') if isinstance(t.get('data'), list) else []
                  out['tables'].append({'title': t.get('title'), 'date': t.get('date'), 'fields': t.get('fields'), 'rows': len(data), 'sample': data[:2]})
              if isinstance(body.get('data'), list):
                out['rows'] = len(body['data']); out['sample'] = body['data'][:2]
            elif isinstance(body, list):
              out['rows'] = len(body); out['sample'] = body[:2]
            return out
          result = {'trade_date': '2026-08-18', 'candidates': {}}
          for label, urls in candidates.items():
            result['candidates'][label] = []
            for url in urls:
              entry = {'url': url}
              try:
                req = urllib.request.Request(url, headers=HEADERS)
                with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read()
                  entry.update({'http': response.status, 'final_url': response.geturl(), 'bytes': len(raw)})
                try:
                  body = json.loads(raw.decode('utf-8-sig'))
                  entry['json'] = summarize(body)
                except Exception as exc:
                  entry['decode_error'] = f'{type(exc).__name__}: {exc}'
                  entry['body_head'] = raw[:500].decode('utf-8', 'replace')
              except Exception as exc:
                entry['error'] = f'{type(exc).__name__}: {exc}'
              result['candidates'][label].append(entry)
          pathlib.Path('/tmp/tpex-probe.json').write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Publish probe result only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tpex-official-relay-bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin market-data-relay:refs/remotes/origin/market-data-relay
          git checkout -B market-data-relay refs/remotes/origin/market-data-relay
          mkdir -p data/market-data/tpex-relay/diagnostics
          cp /tmp/tpex-probe.json data/market-data/tpex-relay/diagnostics/probe-2026-08-18.json
          git add data/market-data/tpex-relay/diagnostics/probe-2026-08-18.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'market-data: record TPEx historical API probe'
          git push origin HEAD:refs/heads/market-data-relay
