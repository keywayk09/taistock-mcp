name: One-shot TWSE MIS fallback v1.6 corrected

on:
  push:
    branches:
      - feature/twchips-official-v7
    paths:
      - .github/workflows/patch-twse-mis-fallback-v16b.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/twchips-official-v7
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build v1.6 selector from v1.5
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          base = Path('src/v8/family-stock-selection-v14.ts')
          new = Path('src/v8/family-stock-selection-v15.ts')
          text = base.read_text(encoding='utf-8')
          if 'family-stock-selection/production-v1.5.0' not in text:
              raise SystemExit('expected v1.5 base')

          text = text.replace('family-stock-selection/production-v1.5.0', 'family-stock-selection/production-v1.6.0', 1)
          text = text.replace('taistock-mcp-family-selector/1.5', 'taistock-mcp-family-selector/1.6', 1)
          text = text.replace(
              '"FUGLE_OTC" | "FUGLE_TICKERS_MIS_OTC"',
              '"FUGLE_OTC" | "FUGLE_TICKERS_MIS_TWSE" | "FUGLE_TICKERS_MIS_OTC"',
              1,
          )

          # Bound official provider latency; keep redirect blocking from v1.5.
          old = '''const response = await fetch(url, {
              redirect: "manual",
              headers: { Accept: "application/json", "User-Agent": USER_AGENT },
            });'''
          new_fetch = '''const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 5_000);
            let response: Response;
            try {
              response = await fetch(url, {
                redirect: "manual",
                signal: controller.signal,
                headers: { Accept: "application/json", "User-Agent": USER_AGENT },
              });
            } finally {
              clearTimeout(timer);
            }'''
          if old not in text:
              raise SystemExit('official fetch block not found')
          text = text.replace(old, new_fetch, 1)

          # Reuse the already-tested OTC ticker+MIS implementation to create the listed-market twin.
          start = text.index('async function fetchMisOtcBatch')
          end = text.index('async function tryFugleMarket', start)
          otc = text[start:end]
          twse = otc
          twse = twse.replace('fetchMisOtcBatch', 'fetchMisTwseBatch')
          twse = twse.replace('normalizeMisOtcRow', 'normalizeMisTwseRow')
          twse = twse.replace('tryFugleTickersMisOtc', 'tryFugleTickersMisTwse')
          twse = twse.replace('FUGLE_TICKERS_MIS_OTC', 'FUGLE_TICKERS_MIS_TWSE')
          twse = twse.replace('MIN_COVERAGE.TPEx', 'MIN_COVERAGE.TWSE')
          twse = twse.replace('`otc_${symbol}.tw`', '`tse_${symbol}.tw`')
          twse = twse.replace('market: "TPEx"', 'market: "TWSE"')
          twse = twse.replace('exchange: "TPEx"', 'exchange: "TWSE"')
          twse = twse.replace('market: "OTC"', 'market: "TSE"')
          twse = twse.replace('TPEx OTC', 'TWSE TSE')
          twse = twse.replace('MIS OTC', 'MIS listed')
          twse = twse.replace('Fugle TPEx ticker universe', 'Fugle TWSE ticker universe')
          text = text[:start] + twse + text[start:]

          insertion = '''  if (deficient("TWSE")) {
            const misFallback = await tryFugleTickersMisTwse(env);
            diagnostics.TWSE.attempts.push({ provider: misFallback.provider, count: misFallback.normalized_count, errors: misFallback.errors });
            if (misFallback.normalized_count >= MIN_COVERAGE.TWSE) chosen.TWSE = misFallback;
          }

          '''
          target = '  if (deficient("TPEx")) {'
          if target not in text:
              raise SystemExit('TPEx fallback insertion point not found')
          text = text.replace(target, insertion + target, 1)

          for required in ['tryFugleTickersMisTwse', 'FUGLE_TICKERS_MIS_TWSE', 'AbortController', 'tryFugleTickersMisOtc']:
              if required not in text:
                  raise SystemExit(f'missing {required}')
          new.write_text(text, encoding='utf-8')

          entry_path = Path('src/production-entry.ts')
          entry = entry_path.read_text(encoding='utf-8')
          if 'from "./v8/family-stock-selection-v14";' not in entry:
              raise SystemExit('v14 production import not found')
          entry_path.write_text(entry.replace('from "./v8/family-stock-selection-v14";', 'from "./v8/family-stock-selection-v15";', 1), encoding='utf-8')

          test_path = Path('tests/production-family-selector.test.mjs')
          test = test_path.read_text(encoding='utf-8')
          test = test.replace('src/v8/family-stock-selection-v14.ts', 'src/v8/family-stock-selection-v15.ts', 1)
          test = test.replace('production-v1\\.5\\.0', 'production-v1\\.6\\.0', 1)
          test = test.replace('/\\.\\/v8\\/family-stock-selection-v14/', '/\\.\\/v8\\/family-stock-selection-v15/', 1)
          marker = 'assert.match(selector, /tryFugleTickersMisOtc/);'
          if marker in test and 'tryFugleTickersMisTwse' not in test:
              test = test.replace(marker, marker + '\nassert.match(selector, /tryFugleTickersMisTwse/);\nassert.match(selector, /FUGLE_TICKERS_MIS_TWSE/);\nassert.match(selector, /AbortController/);', 1)
          test = re.sub(r'Production family selector provider-fallback v1\.\d+ regression contract passed', 'Production family selector provider-fallback v1.6 regression contract passed', test, count=1)
          test_path.write_text(test, encoding='utf-8')
          PY

      - name: Verify TypeScript and production contract
        run: |
          npm install
          npm run type-check
          node tests/production-family-selector.test.mjs
          npx wrangler deploy --dry-run --outdir dist

      - name: Commit patch and clean helper workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/patch-twse-mis-fallback-v16.yml .github/workflows/patch-twse-mis-fallback-v16b.yml
          git add src/v8/family-stock-selection-v15.ts src/production-entry.ts tests/production-family-selector.test.mjs
          git commit -m "P17e: add TWSE MIS fallback and official timeout"
          git push origin HEAD:feature/twchips-official-v7
