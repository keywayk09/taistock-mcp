name: Migrate Pre-Fix Owner Confidential Clients

on:
  push:
    branches:
      - diag/owner-live-client-inventory-20260827
    paths:
      - '.github/workflows/diag-migrate-pre-fix-owner-confidential.yml'

permissions:
  contents: read

jobs:
  migrate-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MCP_BASE: https://taistock-mcp.keywayk09.workers.dev
      OWNER_BASE: https://taistock-owner-oauth.keywayk09.workers.dev
    steps:
      - name: Migrate bounded pre-fix clients and verify Production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import datetime as dt
          import hashlib
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          account=os.environ.get('CLOUDFLARE_ACCOUNT_ID','')
          token=os.environ.get('CLOUDFLARE_API_TOKEN','')
          mcp=os.environ['MCP_BASE'].rstrip('/')
          owner=os.environ['OWNER_BASE'].rstrip('/')
          if not account or not token:
              raise SystemExit('cloudflare_credentials_missing')

          cf_headers={'Authorization':f'Bearer {token}','Content-Type':'application/json','User-Agent':'taistock-owner-pre-fix-migration/1'}

          def http(url,method='GET',data=None,headers=None):
              h={'User-Agent':'taistock-owner-pre-fix-migration/1'}
              if headers: h.update(headers)
              r=urllib.request.Request(url,data=data,headers=h,method=method)
              try:
                  with urllib.request.urlopen(r,timeout=20) as resp:
                      return resp.status,{k.lower():v for k,v in resp.headers.items()},resp.read()
              except urllib.error.HTTPError as e:
                  return e.code,{k.lower():v for k,v in e.headers.items()},e.read()

          def json_req(url,method='GET',obj=None,headers=None):
              h=dict(headers or {})
              data=None
              if obj is not None:
                  data=json.dumps(obj).encode()
                  h['Content-Type']='application/json'
              st,rh,raw=http(url,method,data,h)
              try: body=json.loads(raw.decode('utf-8'))
              except Exception: body=None
              return st,rh,body,raw

          st,_,body,_=json_req(f'https://api.cloudflare.com/client/v4/accounts/{account}/storage/kv/namespaces?per_page=1000',headers=cf_headers)
          if st!=200 or not isinstance(body,dict) or body.get('success') is not True:
              raise SystemExit('oauth_kv_list_failed')
          rows=body.get('result') or []
          preferred=[x for x in rows if x.get('title')=='taistock-mcp-OAUTH_KV']
          legacy=[x for x in rows if x.get('title')=='OAUTH_KV']
          chosen=preferred[0] if len(preferred)==1 else (legacy[0] if len(legacy)==1 else None)
          if not chosen:
              raise SystemExit('oauth_kv_not_resolved')
          kv=chosen['id']

          def kv_keys(prefix):
              q=urllib.parse.urlencode({'prefix':prefix,'limit':'1000'})
              st,_,b,_=json_req(f'https://api.cloudflare.com/client/v4/accounts/{account}/storage/kv/namespaces/{kv}/keys?{q}',headers=cf_headers)
              if st!=200 or not isinstance(b,dict) or b.get('success') is not True:
                  raise SystemExit('kv_keys_failed')
              return [str(x.get('name') or '') for x in (b.get('result') or [])]

          def kv_url(key):
              return f'https://api.cloudflare.com/client/v4/accounts/{account}/storage/kv/namespaces/{kv}/values/{urllib.parse.quote(key,safe="")}'

          def kv_get(key):
              st,_,raw=http(kv_url(key),headers={'Authorization':f'Bearer {token}'})
              if st==404: return None
              if st!=200: raise SystemExit('kv_get_failed')
              return raw.decode('utf-8','replace')

          def kv_put(key,value):
              st,_,raw=http(kv_url(key),method='PUT',data=value.encode(),headers={'Authorization':f'Bearer {token}','Content-Type':'text/plain'})
              if st not in (200,201):
                  raise SystemExit('kv_put_failed')
              try:
                  b=json.loads(raw.decode('utf-8')) if raw else {'success':True}
              except Exception:
                  b={'success':True}
              if isinstance(b,dict) and b.get('success') is False:
                  raise SystemExit('kv_put_unsuccessful')

          def kv_delete(key):
              st,_,_=http(kv_url(key),method='DELETE',headers={'Authorization':f'Bearer {token}'})
              if st not in (200,204,404):
                  raise SystemExit('kv_delete_failed')

          def trusted_redirect(raw):
              try: u=urllib.parse.urlparse(raw)
              except Exception: return False
              if u.scheme!='https' or u.username or u.password or u.query or u.fragment: return False
              if u.hostname not in {'chatgpt.com','chat.openai.com'}: return False
              return bool(re.fullmatch(r'/connector/oauth/[A-Za-z0-9_-]{8,256}',u.path) or u.path=='/connector_platform_oauth_redirect')

          cutoff=dt.datetime(2026,8,27,14,13,3,tzinfo=dt.timezone.utc).timestamp()
          marker_prefix='owner-oauth:legacy-confidential:'
          before_markers=set(kv_keys(marker_prefix))
          candidates=[]
          for key in kv_keys('client:'):
              raw=kv_get(key)
              if not raw: continue
              try: rec=json.loads(raw)
              except Exception: continue
              cid=str(rec.get('clientId') or rec.get('client_id') or key[7:])
              method=str(rec.get('tokenEndpointAuthMethod') or rec.get('token_endpoint_auth_method') or '')
              secret=str(rec.get('clientSecret') or rec.get('client_secret') or '')
              redirects=rec.get('redirectUris') or rec.get('redirect_uris') or []
              grants=rec.get('grantTypes') or rec.get('grant_types') or []
              responses=rec.get('responseTypes') or rec.get('response_types') or []
              reg=rec.get('registrationDate') or rec.get('client_id_issued_at') or 0
              try: reg=float(reg)
              except Exception: reg=0
              if method not in {'client_secret_basic','client_secret_post'}: continue
              if not secret: continue
              if not reg or reg>cutoff: continue
              if not isinstance(redirects,list) or len(redirects)!=1 or not trusted_redirect(str(redirects[0])): continue
              if 'authorization_code' not in grants or 'code' not in responses: continue
              candidates.append((cid,str(redirects[0])))

          if len(candidates)!=18:
              raise SystemExit(f'bounded_candidate_count_changed:{len(candidates)}')

          newly=[]
          for cid,redirect in candidates:
              key=marker_prefix+cid
              if key not in before_markers:
                  kv_put(key,'v1')
                  newly.append((cid,redirect))

          after_markers=set(kv_keys(marker_prefix))
          if len(before_markers)!=3:
              raise SystemExit(f'unexpected_marker_count_before:{len(before_markers)}')
          if len(newly)!=15:
              raise SystemExit(f'unexpected_new_marker_count:{len(newly)}')
          if len(after_markers)!=18:
              raise SystemExit(f'unexpected_marker_count_after:{len(after_markers)}')
          for cid,_ in candidates:
              if kv_get(marker_prefix+cid)!='v1':
                  raise SystemExit('marker_write_verification_failed')

          print('PROD_PRE_FIX_CONFIDENTIAL_CANDIDATES=18')
          print('PROD_NEW_LEGACY_MARKERS=15')
          print('PROD_TOTAL_LEGACY_MARKERS=18')

          # Verify one client that was unmarked before migration can now reach Owner login without PKCE.
          sample_cid,sample_redirect=newly[0]
          params={
              'response_type':'code',
              'client_id':sample_cid,
              'redirect_uri':sample_redirect,
              'resource':f'{mcp}/my-mcp',
              'scope':'offline_access mcp:tools',
              'state':'prod-post-migration-owner',
          }
          st,_,raw=http(f'{owner}/authorize?'+urllib.parse.urlencode(params))
          text=raw.decode('utf-8','replace')
          if st!=200 or 'Owner / 鑽石引擎' not in text or 'Family 授權' in text:
              raise SystemExit('newly_marked_owner_no_pkce_failed')
          params['scope']='offline_access mcp:tools family:read'
          st,_,_=http(f'{owner}/authorize?'+urllib.parse.urlencode(params))
          if st!=400:
              raise SystemExit('owner_family_scope_injection_not_blocked')
          print('PROD_NEWLY_MARKED_OWNER_NO_PKCE=PASS')
          print('PROD_OWNER_FAMILY_SCOPE_ISOLATION=PASS')

          # Fresh confidential DCR must still fail without PKCE and pass with strict S256.
          callback='https://chatgpt.com/connector/oauth/PostMigrationSmoke20260827'
          st,_,fresh,_=json_req(f'{owner}/oauth/register',method='POST',obj={
              'client_name':'Post Migration Owner Boundary Smoke',
              'redirect_uris':[callback],
              'grant_types':['authorization_code','refresh_token'],
              'response_types':['code'],
          })
          if st!=201 or not isinstance(fresh,dict):
              raise SystemExit('fresh_owner_dcr_failed')
          fresh_id=str(fresh.get('client_id') or '')
          if not fresh_id:
              raise SystemExit('fresh_owner_client_missing')
          try:
              if kv_get(marker_prefix+fresh_id) is not None:
                  raise SystemExit('fresh_owner_unexpected_marker')
              p={
                  'response_type':'code','client_id':fresh_id,'redirect_uri':callback,
                  'resource':f'{mcp}/my-mcp','scope':'offline_access mcp:tools','state':'fresh-no-pkce'
              }
              st,_,_=http(f'{owner}/authorize?'+urllib.parse.urlencode(p))
              if st!=400:
                  raise SystemExit('fresh_confidential_no_pkce_not_blocked')
              verifier='post-migration-owner-verifier-20260827-abcdefghijklmnopqrstuvwxyz'
              challenge=base64.urlsafe_b64encode(hashlib.sha256(verifier.encode()).digest()).decode().rstrip('=')
              p['code_challenge']=challenge
              p['code_challenge_method']='S256'
              st,_,raw=http(f'{owner}/authorize?'+urllib.parse.urlencode(p))
              if st!=200 or 'Owner / 鑽石引擎' not in raw.decode('utf-8','replace'):
                  raise SystemExit('fresh_confidential_pkce_failed')
              print('PROD_FRESH_CONFIDENTIAL_PKCE_GATE=PASS')
          finally:
              kv_delete('client:'+fresh_id)
              kv_delete(marker_prefix+fresh_id)

          # Family/Mom public PKCE plane remains intact.
          st,_,fam,_=json_req(f'{mcp}/oauth/register',method='POST',obj={
              'client_name':'Post Migration Family Boundary Smoke',
              'redirect_uris':[callback],
              'grant_types':['authorization_code','refresh_token'],
              'response_types':['code'],
              'token_endpoint_auth_method':'none',
          })
          if st!=201 or not isinstance(fam,dict):
              raise SystemExit('family_dcr_failed')
          fam_id=str(fam.get('client_id') or '')
          if not fam_id:
              raise SystemExit('family_client_missing')
          try:
              fver='post-migration-family-verifier-20260827-abcdefghijklmnopqrstuvwxyz'
              fchallenge=base64.urlsafe_b64encode(hashlib.sha256(fver.encode()).digest()).decode().rstrip('=')
              fp={
                  'response_type':'code','client_id':fam_id,'redirect_uri':callback,
                  'resource':f'{mcp}/family-mcp','scope':'family:read','state':'family-pkce',
                  'code_challenge':fchallenge,'code_challenge_method':'S256'
              }
              st,_,raw=http(f'{mcp}/authorize?'+urllib.parse.urlencode(fp))
              text=raw.decode('utf-8','replace')
              if st!=200 or 'Family 授權' not in text or 'Owner / 鑽石引擎' in text:
                  raise SystemExit('family_plane_regressed')
              print('PROD_FAMILY_MOM_READONLY_PKCE=PASS')
          finally:
              kv_delete('client:'+fam_id)

          print('PRODUCTION_PRE_FIX_OWNER_MIGRATION=PASS')
          PY
