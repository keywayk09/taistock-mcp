name: Diagnose Family OAuth Metadata Resource 20260823

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'ops/diag-family-oauth-metadata-resource-20260823-1431'
    runs-on: ubuntu-latest
    env:
      PROD_URL: https://taistock-mcp.keywayk09.workers.dev
      MOM_CLIENT_ID: 41i_gRq63zL6r2tO
      CURRENT_NAMESPACE_TITLE: taistock-mcp-OAUTH_KV
    steps:
      - name: Inspect live OAuth discovery metadata
        shell: bash
        run: |
          set -euo pipefail
          for path in '.well-known/oauth-authorization-server' '.well-known/oauth-protected-resource' '.well-known/oauth-protected-resource/family-mcp'; do
            code="$(curl -sS -D "/tmp/h-${path//\//_}" -o "/tmp/b-${path//\//_}" -w '%{http_code}' "$PROD_URL/$path")"
            echo "PATH=/$path HTTP=$code"
            BODY="/tmp/b-${path//\//_}" python - <<'PY'
          import json,os
          p=os.environ['BODY']
          try:
              x=json.load(open(p))
          except Exception:
              print('JSON=FALSE')
              raise SystemExit
          print('JSON=TRUE')
          safe=[
              'issuer','authorization_endpoint','token_endpoint','registration_endpoint',
              'client_id_metadata_document_supported','code_challenge_methods_supported',
              'token_endpoint_auth_methods_supported','scopes_supported','resource',
              'authorization_servers','bearer_methods_supported','resource_name'
          ]
          for k in safe:
              if k in x: print(k+'='+json.dumps(x[k],sort_keys=True))
          PY
          done

      - name: Inspect unauthenticated Family MCP challenge
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -D /tmp/family-headers.txt -o /tmp/family-body.txt -w '%{http_code}' -X POST "$PROD_URL/family-mcp" -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"safe-probe","version":"1"}}}')"
          echo "FAMILY_MCP_HTTP=$code"
          python - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/family-headers.txt').read_text(errors='replace').splitlines()
          for line in lines:
              low=line.lower()
              if low.startswith('www-authenticate:'):
                  # Header contains only discovery/scopes; bearer credentials are never present here.
                  print('WWW_AUTHENTICATE='+line.split(':',1)[1].strip())
          PY

      - name: Inspect current grant resource binding safely
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces"
          curl -fsS "${endpoint}?per_page=1000" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" > /tmp/ns.json
          python - <<'PY' > /tmp/nsid
          import json,os
          x=json.load(open('/tmp/ns.json'))
          rows=[r for r in x.get('result',[]) if r.get('title')==os.environ['CURRENT_NAMESPACE_TITLE']]
          if len(rows)!=1: raise SystemExit('current_oauth_namespace_not_unique')
          print(rows[0]['id'])
          PY
          ns_id="$(cat /tmp/nsid)"
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${ns_id}"
          enc="$(python -c 'import urllib.parse; print(urllib.parse.quote("grant:",safe=""))')"
          curl -fsS "$base/keys?prefix=$enc&limit=1000" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" > /tmp/grant-keys.json
          NS_ID="$ns_id" python - <<'PY'
          import json,os,subprocess,urllib.parse,time
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']; ns=os.environ['NS_ID']; cid=os.environ['MOM_CLIENT_ID']
          base=f'https://api.cloudflare.com/client/v4/accounts/{account}/storage/kv/namespaces/{ns}'
          def read(key):
              p=subprocess.run(['curl','-fsS',base+'/values/'+urllib.parse.quote(key,safe=''),'-H',f'Authorization: Bearer {token}'],capture_output=True,text=True)
              if p.returncode: return None
              try: return json.loads(p.stdout)
              except: return None
          def classify_resource(v):
              if not v: return 'none'
              vals=v if isinstance(v,list) else [v]
              out=[]
              for raw in vals:
                  try:
                      u=urllib.parse.urlsplit(str(raw))
                      if u.scheme!='https' or u.hostname!='taistock-mcp.keywayk09.workers.dev': out.append('other_origin')
                      elif u.path=='/family-mcp': out.append('family_mcp')
                      elif u.path in ('','/'): out.append('worker_root')
                      else: out.append('same_origin_other:'+u.path)
                  except: out.append('invalid')
              return ','.join(out)
          rows=[]
          for e in json.load(open('/tmp/grant-keys.json')).get('result') or []:
              key=e.get('name')
              if not key: continue
              g=read(key)
              if isinstance(g,dict) and g.get('clientId')==cid:
                  rows.append((e,g))
          print('MATCHING_GRANTS='+str(len(rows)))
          now=int(time.time())
          for i,(e,g) in enumerate(rows,1):
              exp=int(e.get('expiration') or 0)
              print(f'GRANT_{i}_RESOURCE_CLASS='+classify_resource(g.get('resource')))
              print(f'GRANT_{i}_REDIRECT_HOST='+urllib.parse.urlsplit(str(g.get('redirectUri') or '')).hostname if g.get('redirectUri') else 'none')
              print(f'GRANT_{i}_PKCE_S256='+str(g.get('codeChallengeMethod')=='S256' and bool(g.get('codeChallenge'))).upper())
              print(f'GRANT_{i}_SCOPE='+','.join(str(x) for x in (g.get('scope') or [])))
              print(f'GRANT_{i}_PENDING_AUTH_CODE='+str(bool(g.get('authCodeId')) and bool(g.get('authCodeWrappedKey'))).upper())
              if exp: print(f'GRANT_{i}_SECONDS_TO_EXPIRY={exp-now}')
          PY
