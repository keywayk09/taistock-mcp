name: Test Fugle secret 2026-08-06

on:
  push:
    paths:
      - .github/workflows/test-fugle-secret-20260806.yml

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Fugle API key
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p data/tests
          if [ -z "${FUGLE_API_KEY:-}" ]; then
            printf '{"status":"secret_missing","source":"Fugle"}\n' > data/tests/fugle-secret-2026-08-06.json
            exit 0
          fi
          HTTP=$(curl -sS -o /tmp/fugle.json -w '%{http_code}' \
            -H 'Accept: application/json' \
            -H "X-API-KEY: ${FUGLE_API_KEY}" \
            'https://api.fugle.tw/marketdata/v1.0/stock/intraday/candles/2330?timeframe=5&sort=asc')
          python - "$HTTP" <<'PY'
          import json, sys
          from pathlib import Path
          http = int(sys.argv[1])
          p = Path('/tmp/fugle.json')
          try:
              body = json.loads(p.read_text(encoding='utf-8'))
          except Exception:
              body = None
          data = body.get('data') if isinstance(body, dict) else None
          result = {
              'status': 'ok' if http == 200 and isinstance(data, list) and len(data) > 0 else 'failed',
              'http_status': http,
              'source': 'Fugle',
              'symbol': '2330',
              'timeframe': '5m',
              'bars': len(data) if isinstance(data, list) else 0,
              'has_data': bool(data),
              'message': None if http == 200 else (body.get('message') if isinstance(body, dict) else 'non-json response')
          }
          Path('data/tests/fugle-secret-2026-08-06.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(result, ensure_ascii=False))
          PY
      - name: Commit sanitized test result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/tests/fugle-secret-2026-08-06.json
          git commit -m 'test: verify Fugle API secret' || exit 0
          git push
