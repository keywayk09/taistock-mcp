name: OHLC Production Health Smoke 20260828

on:
  push:
    branches: [test/ohlc-production-health-20260828]
    paths:
      - '.github/workflows/ohlc-production-health-smoke-20260828.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ohlc-production-health-smoke-20260828.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe live OHLC production health
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          url='https://tv-fugle-1d.keikei99887.workers.dev/health'
          req=urllib.request.Request(url,headers={'Accept':'application/json','Cache-Control':'no-cache','User-Agent':'ohlc-prod-health-smoke/20260828'})
          with urllib.request.urlopen(req,timeout=30) as r:
            raw=r.read(); status=r.status
          if status!=200: raise RuntimeError(f'health_http_{status}')
          body=json.loads(raw.decode('utf-8-sig'))
          tools=body.get('tools') or []
          print(json.dumps({'status':status,'tools':tools,'server_version':body.get('mcp_server_version'),'liveness_version':body.get('liveness_version')},ensure_ascii=False))
          if 'read_ohlc' not in tools:
            raise RuntimeError(f'read_ohlc_missing_from_production_health:{tools}')
          PY
