name: Crypto Shadow Stable Source Diagnostic 2026-09-05

on:
  push:
    paths:
      - '.github/workflows/crypto-shadow-stable-source-diagnostic-20260905.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Preview stable core and selected deep requests
        shell: bash
        run: |
          set -euo pipefail

          # Diagnostic only. Print compact health/request metadata and never
          # persist raw ticker, K-line, OI, or exchange payloads.
          stable_body="$(mktemp)"
          stable_code="$(curl -L -sS --connect-timeout 8 --max-time 20 \
            -H 'accept: application/json' \
            -A 'crypto-shadow-source-diagnostic/2026-09-05' \
            -o "$stable_body" -w '%{http_code}' \
            'https://0a7039af-tv-crypto-engine.keikei99887.workers.dev/market/candidate-scan?profile=stable_quality&per_side=1&light_limit=12' || true)"

          echo "STABLE_HTTP_STATUS=${stable_code}"
          if jq -e . "$stable_body" >/dev/null 2>&1; then
            echo "STABLE_CORE_SUMMARY_BEGIN"
            jq -c '{
              ok,
              degraded,
              core_pipeline_ok,
              selected_symbols,
              selected_count,
              diagnostic_stage_counts,
              source_status,
              oi_sync_status,
              market_context_status,
              market_participation_source_health: (.market_participation_shadow.source_health // null)
            }' "$stable_body"
            echo "STABLE_CORE_SUMMARY_END"

            symbols="$(jq -r '(.selected_symbols // []) | join(",")' "$stable_body")"
            if [ -n "$symbols" ]; then
              deep_body="$(mktemp)"
              deep_code="$(curl -L -sS --connect-timeout 8 --max-time 20 \
                -H 'accept: application/json' \
                -A 'crypto-shadow-source-diagnostic/2026-09-05' \
                -o "$deep_body" -w '%{http_code}' \
                "https://0a7039af-tv-crypto-engine.keikei99887.workers.dev/market/deep-probe?symbols=${symbols}" || true)"
              echo "DEEP_HTTP_STATUS=${deep_code} symbols=${symbols}"
              if jq -e . "$deep_body" >/dev/null 2>&1; then
                echo "DEEP_CORE_SUMMARY_BEGIN"
                jq -c '{ok,degraded,usable_symbols,complete_symbols,requested_subrequest_budget}' "$deep_body"
                jq -c '.results[]? | {
                  base,
                  ok,
                  complete,
                  requests_passed,
                  requests_total,
                  request_status,
                  higher_request_status: (.multi_timeframe.higher_context.request_status // [])
                }' "$deep_body"
                echo "DEEP_CORE_SUMMARY_END"
              fi
              rm -f "$deep_body"
            fi
          fi
          rm -f "$stable_body"

          # Direct GitHub-runner controls prove whether an exchange endpoint is
          # globally down versus only rate-limited on the Cloudflare egress path.
          direct_probe() {
            name="$1"; url="$2"; body="$(mktemp)"
            code="$(curl -L -sS --connect-timeout 8 --max-time 15 -o "$body" -w '%{http_code}' "$url" || true)"
            echo "DIRECT_SOURCE name=${name} http_status=${code} bytes=$(wc -c < "$body" | tr -d ' ')"
            rm -f "$body"
          }
          direct_probe kucoin_contracts 'https://api-futures.kucoin.com/api/v1/contracts/active'
          direct_probe kucoin_ticker 'https://api.kucoin.com/api/ua/v2/market/ticker?tradeType=FUTURES'
          direct_probe gate_ticker 'https://api.gateio.ws/api/v4/futures/usdt/tickers'
