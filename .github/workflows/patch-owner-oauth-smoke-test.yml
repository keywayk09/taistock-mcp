name: One-shot patch Owner OAuth smoke test

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/owner-oauth-boundary-20260827'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/owner-oauth-boundary-20260827
      - name: Fix DCR response consumption in temporary smoke
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/owner-oauth-local-smoke.yml')
          s=p.read_text()
          old="""            assert(response.status === 201, 'DCR status', { status: response.status, body: await response.text() });\n            return json(response);"""
          new="""            if (response.status !== 201) {\n              const text = await response.text();\n              throw new Error(`DCR status ${response.status}: ${text.slice(0, 600)}`);\n            }\n            return json(response);"""
          if old not in s:
              raise SystemExit('dcr_response_anchor_missing')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+keywayk09@users.noreply.github.com'
          git add .github/workflows/owner-oauth-local-smoke.yml
          git commit -m 'test: avoid double-reading DCR response in OAuth smoke'
          git push origin HEAD:fix/owner-oauth-boundary-20260827
