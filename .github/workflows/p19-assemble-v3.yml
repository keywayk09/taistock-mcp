name: P19 Assemble Verified Source

on:
  push:
    branches: [p19/github-only-storage]
    paths:
      - '.p19v3.part*'
      - '.github/workflows/p19-assemble-v3.yml'

permissions:
  contents: write

concurrency:
  group: p19-assemble-v3
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p19/github-only-storage
          fetch-depth: 1
      - name: Rebuild and verify local-tested source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .p19v3.part000 .p19v3.part001 .p19v3.part002 .p19v3.part003 .p19v3.part004 .p19v3.part005 > /tmp/p19-remaining.b64
          base64 -d /tmp/p19-remaining.b64 > /tmp/p19-remaining.tgz
          echo '051f877de13642f0a0bad8843acb7d07a0af84d342c2036f5ce4ac0d9c2107e0  /tmp/p19-remaining.tgz' | sha256sum -c -
          tar -xzf /tmp/p19-remaining.tgz -C .
          rm -f .p19v3.part000 .p19v3.part001 .p19v3.part002 .p19v3.part003 .p19v3.part004 .p19v3.part005
          rm -f .p19.patch.part*
          rm -f .github/workflows/p19-assemble-v3.yml .github/workflows/p19-apply-patch.yml .github/workflows/p19-export-source.yml .github/workflows/p19-sbl-probe.yml
          rm -f .github/workflows/tpex-official-relay.yml
          rm -f src/v6/tpex-market-data-backfill.ts src/v6/tpex-official-relay.ts src/v6/tw-market-data-d1.ts src/v6/twse-market-data-capture.ts
          git status --short
      - name: Commit assembled P19 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'p19-github-storage-bot'
          git config user.email 'p19-github-storage-bot@users.noreply.github.com'
          git add -A
          git commit -m 'P19: assemble GitHub-only persistence implementation'
          git push origin HEAD:p19/github-only-storage
