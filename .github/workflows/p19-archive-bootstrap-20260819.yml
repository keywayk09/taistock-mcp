name: P19 Archive Bootstrap 2026-08-19

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p19-archive-bootstrap-20260819.yml'

permissions:
  contents: write

concurrency:
  group: p19-archive-bootstrap-20260819
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.head_ref == 'p19/archive-bootstrap-20260819'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout P19 runtime code
        uses: actions/checkout@v4
        with:
          ref: p19/archive-bootstrap-20260819
          path: code

      - name: Checkout canonical data branch
        uses: actions/checkout@v4
        with:
          ref: diamond-data
          path: archive
          fetch-depth: 0

      - name: Apply candidate MI_MARGN positional parser for acceptance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('code/src/v6/tw-market-data.ts')
          s=p.read_text()
          old='''export function normalizeTwseMargin(body: unknown, requestedDate: string): MarginRow[] {
  const root = rec(body);
  const rows = findTwseMarginTable(body);
  const tradeDate = normalizeTradeDate(root.date) ?? requestedDate;
  return rows.map((row) => normalizeMarginRow(row, "listed", tradeDate, "TWSE_MI_MARGN")).filter((x): x is MarginRow => Boolean(x));
}'''
          new='''export function normalizeTwseMargin(body: unknown, requestedDate: string): MarginRow[] {
  const root = rec(body);
  const tradeDate = normalizeTradeDate(root.date) ?? requestedDate;
  if (Array.isArray(root.tables)) {
    for (const tableValue of root.tables) {
      const table = rec(tableValue);
      if (!/融資融券彙總/.test(String(table.title ?? "")) || !Array.isArray(table.fields) || !Array.isArray(table.data)) continue;
      const keys = table.fields.map((field: unknown) => normalizeKey(String(field)));
      const codeIndex = keys.findIndex((key: string) => ["代號", "證券代號", "股票代號"].map(normalizeKey).includes(key));
      const nameIndex = keys.findIndex((key: string) => ["名稱", "證券名稱", "股票名稱"].map(normalizeKey).includes(key));
      const previousIndexes = keys.map((key: string, index: number) => key.includes(normalizeKey("前日餘額")) ? index : -1).filter((index: number) => index >= 0);
      const todayIndexes = keys.map((key: string, index: number) => key.includes(normalizeKey("今日餘額")) ? index : -1).filter((index: number) => index >= 0);
      if (codeIndex < 0 || previousIndexes.length < 2 || todayIndexes.length < 2) continue;
      return table.data.filter(Array.isArray).map((values: any[]): MarginRow | null => {
        const symbol = String(values[codeIndex] ?? "").trim().replace(/\\s/g, "");
        if (!/^\\d{4,6}$/.test(symbol)) return null;
        const marginPrev = nullableMarketNumber(values[previousIndexes[0]]);
        const marginNow = nullableMarketNumber(values[todayIndexes[0]]);
        const shortPrev = nullableMarketNumber(values[previousIndexes[1]]);
        const shortNow = nullableMarketNumber(values[todayIndexes[1]]);
        return {
          trade_date: tradeDate,
          symbol,
          name: nameIndex >= 0 ? String(values[nameIndex] ?? "").trim() : "",
          market: "listed",
          margin_previous_balance_lots: marginPrev,
          margin_balance_lots: marginNow,
          margin_balance_change_lots: marginNow !== null && marginPrev !== null ? marginNow - marginPrev : null,
          short_previous_balance_lots: shortPrev,
          short_balance_lots: shortNow,
          short_balance_change_lots: shortNow !== null && shortPrev !== null ? shortNow - shortPrev : null,
          source: "TWSE_MI_MARGN",
          source_priority: "OFFICIAL",
        };
      }).filter((x): x is MarginRow => Boolean(x));
    }
  }
  const rows = findTwseMarginTable(body);
  return rows.map((row) => normalizeMarginRow(row, "listed", tradeDate, "TWSE_MI_MARGN")).filter((x): x is MarginRow => Boolean(x));
}'''
          if old not in s:
            raise SystemExit('normalizeTwseMargin source block not found')
          p.write_text(s.replace(old,new,1))
          PY

      - name: Capture exact 2026-08-19 official market data
        env:
          DIAMOND_DATA_ROOT: ${{ github.workspace }}/archive
          TRADE_DATE: '2026-08-19'
        run: node --experimental-strip-types code/scripts/capture-tw-market-data.ts --date 2026-08-19 --out "$DIAMOND_DATA_ROOT"

      - name: Verify 8-of-8 manifest before canonical write
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'archive/data/market-data/daily/2026/08/19/manifest.json';
          const m = JSON.parse(fs.readFileSync(p, 'utf8'));
          const ready = m.layers.filter(x => x.status === 'READY');
          if (m.trade_date !== '2026-08-19' || m.storage !== 'GITHUB_ONLY' || ready.length !== 8 || m.layers.length !== 8) {
            console.error(JSON.stringify(m, null, 2));
            process.exit(1);
          }
          console.log(JSON.stringify({trade_date:m.trade_date, storage:m.storage, ready_count:ready.length, layers:ready.map(x=>({kind:x.kind,market:x.market,rows:x.row_count,source:x.source,sha:x.content_sha256}))}, null, 2));
          NODE

      - name: Commit canonical archive with strict push CAS
        working-directory: archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'diamond-market-data-bot'
          git config user.email 'diamond-market-data-bot@users.noreply.github.com'
          git add data/market-data
          if git diff --cached --quiet; then
            echo '8/19 archive already canonical; nothing to write.'
            exit 0
          fi
          git commit -m 'data(market): bootstrap official 2026-08-19 GitHub-only archive'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:diamond-data; then exit 0; fi
            echo "CAS race attempt $attempt; re-read and re-merge diamond-data"
            git fetch origin diamond-data
            git rebase origin/diamond-data
          done
          echo 'Canonical archive CAS retries exhausted' >&2
          exit 1
