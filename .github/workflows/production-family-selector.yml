name: Production Family Selector

on:
  pull_request:
    branches:
      - feature/twchips-official-v7
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run type-check
      - run: node tests/production-family-selector.test.mjs
      - run: npx wrangler deploy --dry-run --outdir dist
      - name: Probe live family data paths
        run: |
          set -euo pipefail
          base="https://taistock-mcp.keywayk09.workers.dev"

          curl --silent --show-error --fail --max-time 60 "$base/health" -o /tmp/family-health.json
          grep -q 'family-production-runtime/1.7.0' /tmp/family-health.json

          for path in health/family-selection-data health/family-alternative-data health/family-cache; do
            status=$(curl --silent --show-error --max-time 120 \
              -o "/tmp/${path//\//-}.json" -w '%{http_code}' \
              "$base/$path" || true)
            echo "=== /$path HTTP=$status ==="
            cat "/tmp/${path//\//-}.json"
            echo
          done

          grep -q 'family-production-runtime/1.7.0' /tmp/health-family-selection-data.json
