name: Production Family Selector

on:
  pull_request:
    branches:
      - feature/twchips-official-v7
  push:
    branches:
      - feature/twchips-official-v7
  workflow_dispatch:

jobs:
  verify-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run type-check
      - run: node tests/production-family-selector.test.mjs
      - run: node tests/family-smart-query-router.test.mjs
      - run: npx wrangler deploy --dry-run --outdir dist

  verify-live-production:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: verify-code
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed production v1.9, smart router, intent engine, and complete market coverage
        run: |
          set -euo pipefail
          base="https://taistock-mcp.keywayk09.workers.dev"

          ready=0
          for attempt in $(seq 1 36); do
            if curl --silent --show-error --fail --max-time 30 "$base/health" -o /tmp/family-health.json; then
              if grep -q 'family-production-runtime/1.9.0' /tmp/family-health.json && \
                 grep -q 'family-smart-query-router/v1.0.0' /tmp/family-health.json && \
                 grep -q 'family-stock-selection/production-v1.8.0' /tmp/family-health.json && \
                 grep -q 'family-selection-intent/v1' /tmp/family-health.json; then
                ready=1
                break
              fi
            fi
            echo "waiting for Cloudflare production smart-router deployment ($attempt/36)"
            sleep 5
          done
          test "$ready" = "1"

          grep -q '"individual_stock_route": "family_query"' /tmp/family-health.json
          grep -q '"selection_route": "family_stock_selector"' /tmp/family-health.json

          curl --silent --show-error --fail --max-time 60 "$base/health/family-cache" -o /tmp/family-cache.json
          grep -q 'family-selection-lkg/v2' /tmp/family-cache.json
          grep -q 'family-production-runtime/1.9.0' /tmp/family-cache.json
          grep -q '"objective"' /tmp/family-cache.json

          curl --silent --show-error --fail --max-time 30 \
            --get --data-urlencode 'q=有沒有低位階、還沒大漲但開始轉強的波段股 Top 5' \
            "$base/health/family-intent" -o /tmp/family-intent.json
          cat /tmp/family-intent.json
          grep -q 'low_position_turning_up' /tmp/family-intent.json
          grep -q '"avoid_chasing": true' /tmp/family-intent.json
          grep -q 'family-selection-intent/v1' /tmp/family-intent.json

          curl --silent --show-error --fail --max-time 30 \
            --get --data-urlencode 'q=找回檔到支撐附近的波段股 Top 5' \
            "$base/health/family-intent" -o /tmp/family-pullback-intent.json
          grep -q 'pullback_entry' /tmp/family-pullback-intent.json

          status=$(curl --silent --show-error --max-time 120 \
            -o /tmp/family-data.json -w '%{http_code}' \
            "$base/health/family-selection-data" || true)
          echo "family-selection-data HTTP=$status"
          cat /tmp/family-data.json
          echo
          test "$status" = "200"
          grep -q '"usable": true' /tmp/family-data.json
          grep -q 'MOPSFIN_COMPANY_MASTER_MIS_OTC' /tmp/family-data.json
          grep -q 'family-production-runtime/1.9.0' /tmp/family-data.json
          grep -q 'family-selection-intent/v1' /tmp/family-data.json
