name: Production Family Selector

on:
  pull_request:
    branches:
      - feature/twchips-official-v7
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run type-check
      - run: node tests/production-family-selector.test.mjs
      - run: npx wrangler deploy --dry-run --outdir dist
      - name: Probe deployed alternative family data paths
        run: |
          code=$(curl --silent --show-error --max-time 120 \
            https://taistock-mcp.keywayk09.workers.dev/health/family-alternative-data \
            -o /tmp/family-alternative-data.json -w '%{http_code}')
          echo "HTTP=$code"
          cat /tmp/family-alternative-data.json
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/family-alternative-data.json","utf8")); console.log(JSON.stringify(x,null,2));'
