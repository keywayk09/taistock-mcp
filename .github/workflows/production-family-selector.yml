name: Production Family Selector

on:
  pull_request:
    branches:
      - feature/twchips-official-v7
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run type-check
      - run: node tests/production-family-selector.test.mjs
      - run: npx wrangler deploy --dry-run --outdir dist
      - name: Verify deployed family market data v1.2
        run: |
          code=$(curl --silent --show-error --max-time 120 \
            https://taistock-mcp.keywayk09.workers.dev/health/family-selection-data \
            -o /tmp/family-selection-data.json -w '%{http_code}')
          echo "HTTP=$code"
          cat /tmp/family-selection-data.json
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/family-selection-data.json","utf8")); if(x.selector_version!=="family-stock-selection/production-v1.2.0") throw new Error(`wrong version ${x.selector_version}`); if(!x.usable) throw new Error(`not usable ${JSON.stringify(x)}`); if((x.twse?.normalized_count??0)<400) throw new Error(`TWSE ${x.twse?.normalized_count}`); if((x.tpex?.normalized_count??0)<250) throw new Error(`TPEx ${x.tpex?.normalized_count}`); console.log(`PRODUCTION_OK TWSE=${x.twse.normalized_count} via ${x.twse.provider} TPEx=${x.tpex.normalized_count} via ${x.tpex.provider}`);'
