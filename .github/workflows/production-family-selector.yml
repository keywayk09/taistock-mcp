name: Production Family Selector

on:
  pull_request:
    branches:
      - feature/twchips-official-v7
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run type-check
      - run: node tests/production-family-selector.test.mjs
      - run: npx wrangler deploy --dry-run --outdir dist
      - name: Probe TPEx official OpenAPI hosts
        run: |
          for url in \
            'https://tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes' \
            'https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes' \
            'https://tpex.org.tw/openapi/v1/tpex_mainboard_quotes'; do
            echo "=== $url ==="
            curl --silent --show-error --max-time 30 --max-redirs 5 \
              -D /tmp/headers.txt -o /tmp/body.txt -w 'HTTP=%{http_code} redirects=%{num_redirects} final=%{url_effective}\n' "$url" || true
            head -c 400 /tmp/body.txt || true
            echo
          done
