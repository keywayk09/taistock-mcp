name: Production Family Selector

on:
  pull_request:
    branches:
      - feature/twchips-official-v7
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run type-check
      - run: node tests/production-family-selector.test.mjs
      - run: npx wrangler deploy --dry-run --outdir dist
      - name: Compare live production routes
        run: |
          for path in health health/family-selection-data health/family-alternative-data; do
            echo "=== /$path ==="
            curl --silent --show-error --max-time 120 \
              -o "/tmp/${path//\//-}.txt" -w 'HTTP=%{http_code}\n' \
              "https://taistock-mcp.keywayk09.workers.dev/$path" || true
            cat "/tmp/${path//\//-}.txt" || true
            echo
          done
