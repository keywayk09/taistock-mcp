name: One-shot patch Owner effective scope guard

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/owner-oauth-effective-scope-20260827'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/owner-oauth-effective-scope-20260827
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Add fail-closed effective scope checks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('src/v6/family-oauth.ts')
          s = p.read_text()

          # Idempotency: never duplicate the permission guard on reruns.
          if (
              'async function requireEffectiveScope(' in s
              and 'requireEffectiveScope(request, env, FAMILY_SCOPE)' in s
              and 'requireEffectiveScope(request, env, OWNER_SCOPE)' in s
          ):
              print('effective_scope_guard_already_present')
              raise SystemExit(0)

          helper_anchor = '''async function rollbackPreparedTokenBootstrap(prepared: PreparedTokenBootstrap, env: Env) {
            if (!prepared.clientKey || prepared.previousClientRaw === undefined) return;
            await env.OAUTH_KV.put(prepared.clientKey, prepared.previousClientRaw).catch(() => undefined);
          }

          export function createFamilyOAuthProvider(appHandler: ConcreteFetchHandler) {'''
          helper_replacement = '''async function rollbackPreparedTokenBootstrap(prepared: PreparedTokenBootstrap, env: Env) {
            if (!prepared.clientKey || prepared.previousClientRaw === undefined) return;
            await env.OAUTH_KV.put(prepared.clientKey, prepared.previousClientRaw).catch(() => undefined);
          }

          // OAuthProvider authenticates bearer validity and audience before API handlers.
          // The application must still enforce the effective access-token permission scope.
          async function requireEffectiveScope(request: Request, env: Env, requiredScope: string) {
            const authorization = String(request.headers.get("authorization") || "").trim();
            const match = /^Bearer\\s+(\\S+)$/i.exec(authorization);
            const token = match?.[1] || "";
            if (!token) return false;

            const effectiveToken = await env.OAUTH_PROVIDER.unwrapToken(token);
            return Boolean(effectiveToken?.scope.includes(requiredScope));
          }

          export function createFamilyOAuthProvider(appHandler: ConcreteFetchHandler) {'''
          if helper_anchor not in s:
              raise SystemExit('helper_anchor_missing')
          s = s.replace(helper_anchor, helper_replacement, 1)

          family_anchor = '''if (role !== "family" || userId !== "family") {
                return Response.json({ error: "forbidden_family_role" }, { status: 403 });
              }
              try {'''
          family_replacement = '''if (role !== "family" || userId !== "family") {
                return Response.json({ error: "forbidden_family_role" }, { status: 403 });
              }
              if (!(await requireEffectiveScope(request, env, FAMILY_SCOPE))) {
                return Response.json({ error: "insufficient_family_scope" }, { status: 403 });
              }
              try {'''
          if family_anchor not in s:
              raise SystemExit('family_handler_anchor_missing')
          s = s.replace(family_anchor, family_replacement, 1)

          owner_anchor = '''if (role !== "owner" || userId !== "owner") {
                return Response.json({ error: "forbidden_owner_role" }, { status: 403 });
              }
              return appHandler.fetch(request, env, ctx);'''
          owner_replacement = '''if (role !== "owner" || userId !== "owner") {
                return Response.json({ error: "forbidden_owner_role" }, { status: 403 });
              }
              if (!(await requireEffectiveScope(request, env, OWNER_SCOPE))) {
                return Response.json({ error: "insufficient_owner_scope" }, { status: 403 });
              }
              return appHandler.fetch(request, env, ctx);'''
          if owner_anchor not in s:
              raise SystemExit('owner_handler_anchor_missing')
          s = s.replace(owner_anchor, owner_replacement, 1)

          p.write_text(s)
          PY
          git diff --check
          npm run type-check
          npm run test:ops-contracts
          if git diff --quiet; then
            echo 'no_patch_needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/v6/family-oauth.ts
          git commit -m 'fix: enforce effective OAuth scopes on MCP handlers'
          git push origin HEAD:fix/owner-oauth-effective-scope-20260827
