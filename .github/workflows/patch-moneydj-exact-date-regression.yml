name: Patch MoneyDJ exact-date regression

on:
  push:
    branches:
      - feat/moneydj-multi-window-broker-v1
    paths:
      - .github/workflows/patch-moneydj-exact-date-regression.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/moneydj-multi-window-broker-v1
      - name: Add exact-date URL regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/tw-broker-ranked-on-demand.test.ts')
          s=p.read_text()
          old='''  assert.equal(result.persistence, "NONE");\n  assert.equal(result.buys[0]?.broker_branch, "凱基-台北");'''
          new='''  assert.equal(result.persistence, "NONE");\n  assert.equal((result as any).source_query_mode, "CUSTOM_EXACT_DATE");\n  assert.match(result.source_url, /[?&]e=2026-09-03&f=2026-09-03$/);\n  assert.equal(result.buys[0]?.broker_branch, "凱基-台北");'''
          if s.count(old) != 1:
              raise SystemExit(f'first_anchor_count={s.count(old)}')
          s=s.replace(old,new)
          old2='''  assert.deepEqual(bundle.requested_windows, [1, 5, 10, 20, 60]);\n  assert.equal(bundle.windows["5D"].source_window_label, "近五日");'''
          new2='''  assert.deepEqual(bundle.requested_windows, [1, 5, 10, 20, 60]);\n  assert.equal((bundle.windows["1D"] as any).source_query_mode, "CUSTOM_EXACT_DATE");\n  assert.ok(requestedUrls.some((url) => /[?&]e=2026-09-04&f=2026-09-04$/.test(url)), "1D must use MoneyDJ exact-date custom range");\n  assert.equal(bundle.windows["5D"].source_window_label, "近五日");'''
          if s.count(old2) != 1:
              raise SystemExit(f'second_anchor_count={s.count(old2)}')
          p.write_text(s.replace(old2,new2))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/tw-broker-ranked-on-demand.test.ts
          git diff --cached --check
          git commit -m 'test: require MoneyDJ exact-date one-day route'
          git push origin HEAD:feat/moneydj-multi-window-broker-v1
