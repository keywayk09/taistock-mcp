name: P19 Apply GitHub-Only Migration

on:
  push:
    branches: [p19/github-only-storage]
    paths:
      - '.p19/payload.b64'
      - '.github/workflows/p19-apply-patch.yml'
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: p19-apply-github-only
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'p19/github-only-storage' || github.ref == 'refs/heads/p19/github-only-storage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: p19/github-only-storage
      - name: Verify, apply, and self-clean
        shell: bash
        run: |
          set -euo pipefail
          test -f .p19/payload.b64
          base64 -d .p19/payload.b64 > /tmp/p19-changes.tgz
          echo 'ca6f70c4b69647b2a835054a91c6af27e15ed54abfd55052ece61b0b2f49ec2d  /tmp/p19-changes.tgz' | sha256sum -c -
          tar -xzf /tmp/p19-changes.tgz -C .

          rm -f \
            src/v6/tw-market-data-d1.ts \
            src/v6/twse-market-data-capture.ts \
            src/v6/tpex-market-data-backfill.ts \
            src/v6/tpex-official-relay.ts \
            .github/workflows/tpex-official-relay.yml \
            .github/workflows/p19-export-source.yml \
            .github/workflows/p19-sbl-probe.yml \
            .github/workflows/p19-probe-sbl.yml \
            .github/workflows/p19-apply-payload.yml \
            .github/workflows/p19-apply-patch.yml
          rm -rf .p19 scripts/__pycache__

          git config user.name 'p19-github-storage-migration'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'P19: migrate application persistence to GitHub canonical storage'
          git pull --rebase origin p19/github-only-storage
          git push origin HEAD:p19/github-only-storage
