name: P19 Apply Local Migration Patch

on:
  push:
    branches: [p19/github-only-storage]
    paths:
      - '.p19.patch.part*'

permissions:
  contents: write

concurrency:
  group: p19-apply-local-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: p19/github-only-storage
      - name: Apply migration patch and self-clean
        shell: bash
        run: |
          set -euo pipefail
          test -f .p19.patch.part1
          test -f .p19.patch.part2
          test -f .p19.patch.part3
          cat .p19.patch.part1 .p19.patch.part2 .p19.patch.part3 | base64 -d | gzip -d > /tmp/p19.patch
          patch -p1 --forward < /tmp/p19.patch
          rm -f .p19.patch.part1 .p19.patch.part2 .p19.patch.part3
          rm -f .github/workflows/p19-apply-patch.yml
          rm -f .github/workflows/p19-sbl-probe.yml
          rm -f .github/workflows/p19-export-source.yml
          rm -rf scripts/__pycache__
          git status --short
          git config user.name 'p19-github-storage-migration'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'P19: migrate canonical persistence from D1 to GitHub'
          git push origin HEAD:p19/github-only-storage
