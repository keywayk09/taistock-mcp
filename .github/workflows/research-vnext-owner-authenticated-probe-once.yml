name: Research VNext Owner Authenticated Probe Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/research-vnext-owner-authenticated-probe-once.yml'

permissions:
  contents: read

concurrency:
  group: research-vnext-owner-authenticated-probe-once
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MCP_ENDPOINT: https://taistock-mcp.keywayk09.workers.dev/my-mcp
      EXPECTED_MAIN_SOURCE_SHA: 78b985fc5774205a69860fa17a5239a66aa797a4

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify one-shot scope and public Production health
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main
          test "$GITHUB_EVENT_NAME" = push
          curl --fail --silent --show-error --max-time 20 \
            https://taistock-mcp.keywayk09.workers.dev/health > /tmp/health.json
          node <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
          if (body.status !== 'ok') throw new Error(`PRODUCTION_HEALTH_STATUS:${body.status}`);
          if (body.mcp_endpoint !== '/my-mcp') throw new Error(`PRODUCTION_OWNER_MCP_ENDPOINT:${body.mcp_endpoint}`);
          const tools = Number(body.owner_tools ?? body.tools ?? body.tool_count ?? 0);
          if (tools && tools !== 123) throw new Error(`OWNER_TOOL_COUNT_DRIFT:${tools}`);
          console.log(`PRODUCTION_HEALTH=PASS${tools ? `:owner_tools=${tools}` : ''}`);
          NODE

      - name: Resolve strict existing Owner token GET-only
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';

          const accountId = String(process.env.CLOUDFLARE_ACCOUNT_ID || '');
          const apiToken = String(process.env.CLOUDFLARE_API_TOKEN || '');
          if (!accountId || !apiToken) throw new Error('MISSING_CLOUDFLARE_READ_CREDENTIAL');
          const headers = { Authorization: `Bearer ${apiToken}` };

          async function jsonGet(url, label) {
            const r = await fetch(url, { method: 'GET', headers, signal: AbortSignal.timeout(30000) });
            if (!r.ok) throw new Error(`${label}_HTTP_${r.status}`);
            const body = await r.json();
            if (body?.success !== true) throw new Error(`${label}_API_FAILURE`);
            return body;
          }
          async function textGet(url, label) {
            const r = await fetch(url, { method: 'GET', headers, signal: AbortSignal.timeout(30000) });
            if (!r.ok) throw new Error(`${label}_HTTP_${r.status}`);
            return r.text();
          }

          const namespaces = await jsonGet(
            `https://api.cloudflare.com/client/v4/accounts/${accountId}/storage/kv/namespaces?per_page=1000`,
            'KV_NAMESPACES',
          );
          const preferred = (namespaces.result || []).filter((x) => x?.title === 'taistock-mcp-OAUTH_KV');
          const legacy = (namespaces.result || []).filter((x) => x?.title === 'OAUTH_KV');
          if (preferred.length > 1) throw new Error('AMBIGUOUS_PREFERRED_OAUTH_KV');
          const chosen = preferred[0] || (legacy.length === 1 ? legacy[0] : null);
          const namespaceId = String(chosen?.id || '');
          if (!/^[0-9a-fA-F]{32}$/.test(namespaceId)) throw new Error('OAUTH_KV_NOT_RESOLVED');
          const root = `https://api.cloudflare.com/client/v4/accounts/${accountId}/storage/kv/namespaces/${namespaceId}`;

          async function listKeys(prefix) {
            const rows = [];
            let cursor = '';
            for (let page = 0; page < 20; page += 1) {
              const qs = new URLSearchParams({ prefix, limit: '1000' });
              if (cursor) qs.set('cursor', cursor);
              const body = await jsonGet(`${root}/keys?${qs}`, 'KV_KEYS');
              rows.push(...(body.result || []));
              cursor = String(body.result_info?.cursor || '');
              if (!cursor) return rows;
            }
            throw new Error('KV_KEYS_PAGINATION_LIMIT');
          }
          async function readRecord(name) {
            const raw = await textGet(`${root}/values/${encodeURIComponent(name)}`, 'KV_VALUE');
            try { return JSON.parse(raw); } catch { return null; }
          }
          const normalizeScope = (value) => Array.isArray(value)
            ? value.map(String)
            : typeof value === 'string' ? value.split(/\s+/).filter(Boolean) : [];
          const expiryMs = (record, row) => {
            const raw = record?.expiresAt ?? row?.expiration ?? null;
            if (raw === null || raw === undefined || raw === '') return null;
            if (typeof raw === 'number') return raw > 1e12 ? raw : raw * 1000;
            if (/^\d+$/.test(String(raw))) {
              const n = Number(raw); return n > 1e12 ? n : n * 1000;
            }
            const n = Date.parse(String(raw)); return Number.isFinite(n) ? n : Number.NaN;
          };
          const sha256 = (v) => createHash('sha256').update(String(v)).digest('hex');

          const grantRows = await listKeys('grant:owner:');
          const ownerClientIds = new Set();
          for (const row of grantRows) {
            const rec = await readRecord(String(row?.name || ''));
            if (rec && typeof rec.clientId === 'string' && rec.clientId) ownerClientIds.add(rec.clientId);
          }

          const tokenRows = await listKeys('token:');
          const candidates = [];
          for (const row of tokenRows) {
            const keyName = String(row?.name || '');
            if (!keyName.startsWith('token:')) continue;
            const rec = await readRecord(keyName);
            if (!rec || typeof rec !== 'object') continue;
            const props = rec.props && typeof rec.props === 'object' ? rec.props : {};
            const tokenProps = rec.tokenProps && typeof rec.tokenProps === 'object' ? rec.tokenProps : {};
            const role = rec.role ?? props.role ?? tokenProps.role ?? null;
            const userId = rec.userId ?? props.userId ?? tokenProps.userId ?? null;
            const scopes = normalizeScope(rec.scope ?? props.scope ?? tokenProps.scope);
            const clientId = typeof rec.clientId === 'string' ? rec.clientId : '';
            const expiration = expiryMs(rec, row);
            const validExpiry = expiration === null || (Number.isFinite(expiration) && expiration > Date.now());
            if (ownerClientIds.has(clientId) && role === 'owner' && userId === 'owner' && scopes.includes('owner:full') && validExpiry) {
              const bearer = keyName.slice('token:'.length);
              if (bearer.length >= 16) candidates.push({ bearer, keyName, expiration });
            }
          }

          if (!candidates.length) {
            fs.writeFileSync('evidence/owner-token-selection.json', JSON.stringify({
              schema: 'OWNER_AUTHENTICATED_PROBE_TOKEN_SELECTION_V1',
              status: 'NO_STRICT_OWNER_TOKEN',
              owner_grants: grantRows.length,
              owner_client_ids: ownerClientIds.size,
              token_records: tokenRows.length,
              strict_candidates: 0,
              raw_key_names_emitted: false,
              raw_values_emitted: false,
              token_leak: false,
              production_mutation: 'NONE',
            }, null, 2) + '\n');
            throw new Error(`NO_STRICT_OWNER_TOKEN:grants=${grantRows.length}:clients=${ownerClientIds.size}:tokens=${tokenRows.length}`);
          }

          candidates.sort((a, b) => (b.expiration || Number.MAX_SAFE_INTEGER) - (a.expiration || Number.MAX_SAFE_INTEGER));
          const selected = candidates[0];
          console.log(`::add-mask::${selected.bearer}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `RESEARCH_VNEXT_PROBE_TOKEN=${selected.bearer}\n`);
          fs.writeFileSync('evidence/owner-token-selection.json', JSON.stringify({
            schema: 'OWNER_AUTHENTICATED_PROBE_TOKEN_SELECTION_V1',
            status: 'STRICT_OWNER_TOKEN_SELECTED',
            oauth_kv_id: namespaceId,
            owner_grants: grantRows.length,
            owner_client_ids: ownerClientIds.size,
            token_records: tokenRows.length,
            strict_candidates: candidates.length,
            selected_key_sha256: sha256(selected.keyName),
            expiration_present: selected.expiration !== null,
            raw_key_names_emitted: false,
            raw_values_emitted: false,
            token_leak: false,
            production_mutation: 'NONE',
          }, null, 2) + '\n');
          console.log(`STRICT_OWNER_TOKEN_SELECTION=PASS:candidates=${candidates.length}`);
          console.log('token_leak=false');
          console.log('production_mutation=NONE');
          NODE

      - name: Run authenticated read-only Production MCP probe
        shell: bash
        env:
          RESEARCH_VNEXT_PROBE_ENDPOINT: https://taistock-mcp.keywayk09.workers.dev/my-mcp
          RESEARCH_VNEXT_PROBE_CONFIRMATION: READ_ONLY_PRODUCTION_PROBE
          RESEARCH_VNEXT_CALL_REVIEW: 'false'
          RESEARCH_VNEXT_CALL_REPLAY: 'false'
        run: |
          set -euo pipefail
          test -n "${RESEARCH_VNEXT_PROBE_TOKEN:-}"
          node scripts/research-vnext-production-probe.mjs > evidence/owner-authenticated-probe.json
          node <<'NODE'
          const fs = require('node:fs');
          const receipt = JSON.parse(fs.readFileSync('evidence/owner-authenticated-probe.json', 'utf8'));
          if (receipt.status !== 'PASS') throw new Error('OWNER_MCP_PROBE_STATUS_NOT_PASS');
          if (receipt.bearer_token_present !== true) throw new Error('OWNER_MCP_PROBE_NOT_AUTHENTICATED');
          if (receipt.production_mutation !== 'NONE') throw new Error('OWNER_MCP_PROBE_MUTATION_INVALID');
          if (!Array.isArray(receipt.missing_tools) || receipt.missing_tools.length !== 0) throw new Error('OWNER_MCP_EXPECTED_TOOL_MISSING');
          const expected = new Set(['resolve_ambiguous_backtest_with_1m','finalize_daily_review_run','prepare_swing_selection_run']);
          for (const name of expected) if (!receipt.visible_expected_tools?.includes(name)) throw new Error(`EXPECTED_TOOL_NOT_VISIBLE:${name}`);
          console.log(`OWNER_AUTHENTICATED_MCP_PROBE=PASS:protocol=${receipt.protocol_lane}`);
          console.log('production_mutation=NONE');
          NODE

      - name: Upload sanitized probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-vnext-owner-authenticated-probe-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
