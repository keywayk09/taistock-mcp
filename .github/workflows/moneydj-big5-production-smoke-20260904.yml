name: MoneyDJ Big5 Production Smoke 20260904

on:
  push:
    branches:
      - ops/moneydj-big5-production-smoke-20260904
    paths:
      - .github/workflows/moneydj-big5-production-smoke-20260904.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://taistock-mcp.keywayk09.workers.dev
      MOM_GPT_API_KEY: ${{ secrets.MOM_GPT_API_KEY }}
    steps:
      - name: Verify live MoneyDJ ranked Big5 path
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = process.env.BASE_URL;
          const key = process.env.MOM_GPT_API_KEY || '';
          if (!key) throw new Error('MOM_GPT_API_KEY_not_configured');
          const auth = { authorization: `Bearer ${key}`, accept: 'application/json', 'content-type': 'application/json', 'cache-control': 'no-cache' };
          async function readJson(path, init = {}, timeout = 120000) {
            const r = await fetch(`${base}${path}`, { ...init, signal: AbortSignal.timeout(timeout) });
            const text = await r.text();
            let body;
            try { body = JSON.parse(text); } catch { throw new Error(`${path}:not_json:http_${r.status}`); }
            if (!r.ok) throw new Error(`${path}:http_${r.status}:${String(body?.error || body?.message || '').slice(0,160)}`);
            return body;
          }
          function must(value, label) { if (!value) throw new Error(label); }

          const chips = await readJson('/api/family/chips', {
            method: 'POST', headers: auth,
            body: JSON.stringify({ symbol: '2330', as_of: '2026-09-04', calendar_days: 60 }),
          }, 120000);

          const broker = chips?.broker_branch_ranked;
          must(chips?.current_consistency === 'EXACT_DATE_ON_DEMAND', 'chips_not_exact_date_on_demand');
          must(chips?.data_quality?.previous_day_substitution === false, 'previous_day_substitution_enabled');
          must(broker && typeof broker === 'object', 'broker_payload_missing');
          must(broker?.status === 'READY', `broker_not_ready:${broker?.status}:${broker?.error || ''}`);
          must(broker?.requested_as_of === '2026-09-04', `broker_requested_date_wrong:${broker?.requested_as_of}`);
          must(broker?.source_date === '2026-09-04', `broker_source_date_wrong:${broker?.source_date}`);
          must(broker?.source_date_verified === true, 'broker_source_date_not_verified');
          must(broker?.source_charset === 'big5', `broker_charset_wrong:${broker?.source_charset}`);
          must(Number(broker?.transport_attempts) >= 1 && Number(broker?.transport_attempts) <= 2, `broker_transport_attempts_wrong:${broker?.transport_attempts}`);
          must(broker?.completeness === 'RANKED_ONLY', 'broker_not_ranked_only');
          must(broker?.persistence === 'NONE', 'broker_persistence_not_none');
          must(Array.isArray(broker?.buys) && broker.buys.length > 0, 'broker_buy_rows_empty');
          must(Array.isArray(broker?.sells) && broker.sells.length > 0, 'broker_sell_rows_empty');
          must(broker?.rank_count?.buy > 0 && broker?.rank_count?.sell > 0, 'broker_rank_count_empty');

          console.log(`[smoke] MONEYDJ_BIG5_PRODUCTION_PASS symbol=2330 source_date=${broker.source_date} charset=${broker.source_charset} attempts=${broker.transport_attempts} buys=${broker.rank_count.buy} sells=${broker.rank_count.sell}`);
          NODE
