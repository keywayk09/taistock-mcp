name: Crypto MTF OKX 90D V17

on:
  push:
    branches: [research/crypto-mtf-rr-20260830]
    paths:
      - '.github/workflows/crypto-mtf-okx-90d-v17.yml'
      - 'research/crypto_mtf_okx_90d_v17.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run 90d three-window temporal holdout
        run: python research/crypto_mtf_okx_90d_v17.py
      - name: Upload V17 report
        uses: actions/upload-artifact@v4
        with:
          name: crypto-mtf-okx-90d-v17
          path: /tmp/crypto_mtf_okx_90d_v17.json
          retention-days: 3
