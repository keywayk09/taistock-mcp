name: Analyze 2026-08-06 intraday review

on:
  push:
    branches:
      - research/trai-foundation-v1
    paths:
      - .github/workflows/analyze-review-20260806.yml

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/trai-foundation-v1
      - name: Run review analyzer
        run: |
          set -euo pipefail
          python research/scripts/analyze_intraday_review.py
      - name: Commit review output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/daily/2026-08-06.md research/daily/2026-08-06-machine-summary.json
          git commit -m 'research: add 2026-08-06 manual engine review' || exit 0
          git push origin HEAD:research/trai-foundation-v1
