name: Safe Crawler Check

on:
  pull_request:
    paths:
      - "src/safe-crawler/**"
      - "tsconfig.safe-crawler.json"
      - "package.json"
      - ".github/workflows/safe-crawler-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Type-check safe crawler
        run: npx tsc --noEmit -p tsconfig.safe-crawler.json
