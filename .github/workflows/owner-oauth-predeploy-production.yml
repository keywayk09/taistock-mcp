name: Predeploy isolated Owner OAuth production

on:
  push:
    branches:
      - fix/owner-oauth-issuer-isolation-20260827
    paths:
      - '.github/workflows/owner-oauth-predeploy-production.yml'

permissions:
  contents: read

jobs:
  predeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OWNER_BASE: https://taistock-owner-oauth.keywayk09.workers.dev
      MCP_BASE: https://taistock-mcp.keywayk09.workers.dev

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      - name: Type-check and resolve shared OAuth KV
        id: oauth_kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npm run type-check
          npx wrangler deploy --dry-run --config wrangler.owner-oauth.jsonc
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces"
          curl -fsS --max-time 30 "${endpoint}?per_page=1000" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" > /tmp/kv.json
          kv_id="$(python - <<'PY'
          import json
          rows=json.load(open('/tmp/kv.json')).get('result') or []
          preferred=[x for x in rows if x.get('title')=='taistock-mcp-OAUTH_KV']
          legacy=[x for x in rows if x.get('title')=='OAUTH_KV']
          chosen=preferred[0] if len(preferred)==1 else (legacy[0] if len(legacy)==1 else None)
          if not chosen: raise SystemExit('oauth_kv_not_resolved')
          print(chosen['id'])
          PY
          )"
          [[ "$kv_id" =~ ^[0-9a-fA-F]{32}$ ]]
          echo "id=${kv_id}" >> "$GITHUB_OUTPUT"

      - name: Deploy Owner authorization server first
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OAUTH_KV_ID: ${{ steps.oauth_kv.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          cp wrangler.owner-oauth.jsonc wrangler.owner-oauth.production.jsonc
          trap 'rm -f wrangler.owner-oauth.production.jsonc' EXIT
          python - <<'PY'
          import os,re
          from pathlib import Path
          p=Path('wrangler.owner-oauth.production.jsonc')
          s=p.read_text()
          s,n=re.subn(r'("binding"\s*:\s*"OAUTH_KV")(\s*)(\})',lambda m:m.group(1)+',\n      "id": "'+os.environ['OAUTH_KV_ID']+'"'+m.group(2)+m.group(3),s,count=1)
          if n!=1: raise SystemExit('oauth_kv_injection_failed')
          p.write_text(s)
          PY
          timeout 300 npx wrangler deploy --config wrangler.owner-oauth.production.jsonc

      - name: Verify production Owner issuer before metadata cutover
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          const owner=process.env.OWNER_BASE, mcp=process.env.MCP_BASE;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const read=async r=>{const t=await r.text();try{return JSON.parse(t)}catch{return{raw:t}}};
          const ok=(c,m,d)=>{if(!c)throw new Error(`${m}${d===undefined?'':': '+JSON.stringify(d)}`)};
          let meta;
          for(let i=0;i<40;i++){
            try{const r=await fetch(`${owner}/.well-known/oauth-authorization-server`);if(r.status===200){meta=await read(r);break}}catch{}
            await sleep(2000);
          }
          ok(meta,'Owner issuer unavailable');
          ok(meta.issuer===owner,'issuer',meta);
          ok(meta.authorization_endpoint===`${owner}/authorize`,'authorize endpoint',meta);
          ok(meta.token_endpoint===`${owner}/oauth/token`,'token endpoint',meta);
          ok(meta.registration_endpoint===`${owner}/oauth/register`,'registration endpoint',meta);
          ok((meta.scopes_supported||[]).includes('owner:full'),'owner scope',meta);
          ok((meta.scopes_supported||[]).includes('offline_access'),'offline_access',meta);
          ok(!(meta.scopes_supported||[]).includes('family:read'),'Family scope leaked into Owner issuer',meta);

          const health=await fetch(`${owner}/health`), h=await read(health);
          ok(health.status===200&&h.ok===true,'Owner health',{status:health.status,h});
          ok(h.mcp_resource===`${mcp}/my-mcp`,'Owner MCP resource',h);

          const callback='https://chatgpt.com/connector/oauth/OwnerProductionPredeploy123';
          const reg=await fetch(`${owner}/oauth/register`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({client_name:'Owner Production Predeploy Probe',redirect_uris:[callback],grant_types:['authorization_code','refresh_token'],response_types:['code']})});
          const client=await read(reg);
          ok(reg.status===201&&client.client_id,'DCR',{status:reg.status,client});
          const verifier='owner-production-predeploy-pkce-verifier-longer-than-forty-three-chars';
          const challenge=crypto.createHash('sha256').update(verifier).digest('base64url');
          const auth=new URL(`${owner}/authorize`);
          for(const[k,v]of Object.entries({response_type:'code',client_id:client.client_id,redirect_uri:callback,scope:'owner:full offline_access',state:'owner-prod-predeploy',code_challenge:challenge,code_challenge_method:'S256',resource:`${mcp}/my-mcp`}))auth.searchParams.set(k,v);
          const page=await fetch(auth,{redirect:'manual'}), html=await page.text();
          ok(page.status===200,'proxied Owner login page',{status:page.status,body:html.slice(0,160)});
          ok((page.headers.get('content-type')||'').includes('text/html'),'Owner login content type',page.headers.get('content-type'));
          ok(/password|owner|登入|授權/i.test(html),'Owner login page identity',html.slice(0,300));
          console.log('OWNER_OAUTH_PRODUCTION_PREDEPLOY=PASS');
          NODE
