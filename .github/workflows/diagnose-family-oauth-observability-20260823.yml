name: Diagnose Family OAuth Observability 20260823

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  observe:
    if: github.head_ref == 'ops/diag-family-oauth-after-press-20260823-1445'
    runs-on: ubuntu-latest
    steps:
      - name: Query exact reconnect window safely
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/query.json
          import json,datetime
          # User reconnect created the new grant at about 06:45:17Z.
          def ms(s): return int(datetime.datetime.fromisoformat(s.replace('Z','+00:00')).timestamp()*1000)
          print(json.dumps({
            'queryId':'family-oauth-exact-reconnect',
            'timeframe':{'from':ms('2026-08-23T06:44:30Z'),'to':ms('2026-08-23T06:46:10Z')},
            'view':'events',
            'limit':200,
            'parameters':{
              'datasets':['cloudflare-workers'],
              'filterCombination':'and',
              'filters':[{'key':'$metadata.service','operation':'eq','type':'string','value':'taistock-mcp'}]
            }
          }))
          PY
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/observability/telemetry/query"
          http="$(curl -sS -o /tmp/obs.json -w '%{http_code}' -X POST "$endpoint" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' --data-binary @/tmp/query.json)"
          echo "OBS_HTTP=$http"
          test "$http" = '200'
          python - <<'PY'
          import json,urllib.parse,datetime
          x=json.load(open('/tmp/obs.json'))
          result=x.get('result') or {}; events=((result.get('events') or {}).get('events') or [])
          interesting={'/authorize','/token','/oauth/token','/family-mcp'}
          rows=[]
          def safe_path(raw):
              try:
                  u=urllib.parse.urlsplit(str(raw or ''))
                  if u.hostname and u.hostname!='taistock-mcp.keywayk09.workers.dev': return None
                  return u.path or '/'
              except: return None
          def ts(md):
              for k in ('timestamp','startTime','endTime'):
                  v=md.get(k)
                  if isinstance(v,(int,float)):
                      try:return datetime.datetime.fromtimestamp(v/1000,datetime.timezone.utc).strftime('%H:%M:%S.%f')[:12]+'Z'
                      except:pass
                  if isinstance(v,str) and v: return v
              return 'unknown'
          for ev in events:
              if not isinstance(ev,dict): continue
              md=ev.get('$metadata') if isinstance(ev.get('$metadata'),dict) else {}
              workers=ev.get('$workers') if isinstance(ev.get('$workers'),dict) else {}
              we=workers.get('event') if isinstance(workers.get('event'),dict) else {}
              req=we.get('request') if isinstance(we.get('request'),dict) else {}
              resp=we.get('response') if isinstance(we.get('response'),dict) else {}
              p=safe_path(req.get('url'))
              if p not in interesting: continue
              method=str(req.get('method') or 'UNKNOWN').upper()
              try: status=str(int(resp.get('status')))
              except: status='unknown'
              rows.append((ts(md),method,p,status))
          rows.sort()
          print('EXACT_EVENT_COUNT='+str(len(rows)))
          for t,m,p,s in rows:
              print(f'EXACT_EVENT={t}|{m}|{p}|HTTP_{s}')
          print('EXACT_AUTHORIZE_COUNT='+str(sum(1 for _,_,p,_ in rows if p=='/authorize')))
          print('EXACT_LEGACY_TOKEN_COUNT='+str(sum(1 for _,_,p,_ in rows if p=='/token')))
          print('EXACT_CANONICAL_TOKEN_COUNT='+str(sum(1 for _,_,p,_ in rows if p=='/oauth/token')))
          PY
