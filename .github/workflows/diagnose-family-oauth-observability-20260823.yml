name: Diagnose Family OAuth Observability 20260823

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  observe:
    if: github.head_ref == 'ops/diag-family-oauth-after-press-20260823-1445'
    runs-on: ubuntu-latest
    steps:
      - name: Query recent Production request telemetry safely
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          python - <<'PY' > /tmp/query.json
          import json,time
          now=int(time.time()*1000)
          print(json.dumps({
            'queryId':'family-oauth-after-press',
            'timeframe':{'from':now-15*60*1000,'to':now},
            'view':'events',
            'limit':500,
            'parameters':{
              'datasets':['cloudflare-workers'],
              'filterCombination':'and',
              'filters':[{'key':'$metadata.service','operation':'eq','type':'string','value':'taistock-mcp'}]
            }
          }))
          PY
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/observability/telemetry/query"
          http="$(curl -sS -o /tmp/obs.json -w '%{http_code}' -X POST "$endpoint" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' --data-binary @/tmp/query.json)"
          echo "OBS_HTTP=$http"
          if [ "$http" -lt 200 ] || [ "$http" -ge 300 ]; then
            python - <<'PY'
          import json
          try: x=json.load(open('/tmp/obs.json'))
          except: print('OBS_ERROR=NON_JSON'); raise SystemExit
          errs=x.get('errors') or []
          print('OBS_ERROR_COUNT='+str(len(errs)))
          for e in errs[:3]: print('OBS_ERROR_TYPE='+str((e or {}).get('code') or (e or {}).get('message') or 'unknown')[:160])
          PY
            exit 0
          fi
          python - <<'PY'
          import json,urllib.parse,collections
          x=json.load(open('/tmp/obs.json'))
          result=x.get('result') or {}
          events=((result.get('events') or {}).get('events') or []) if isinstance(result,dict) else []
          print('OBS_SUCCESS='+str(bool(x.get('success',True))).upper())
          print('OBS_EVENT_COUNT='+str(len(events)))
          paths=collections.Counter(); statuses=collections.Counter(); methods=collections.Counter(); trigger_paths=collections.Counter()
          def safe_path(raw):
              try:
                  u=urllib.parse.urlsplit(str(raw or ''))
                  if u.hostname and u.hostname!='taistock-mcp.keywayk09.workers.dev': return None
                  return u.path or '/'
              except: return None
          interesting={'/authorize','/token','/oauth/token','/family-mcp','/.well-known/oauth-authorization-server','/.well-known/oauth-protected-resource','/.well-known/oauth-protected-resource/family-mcp','/health'}
          for ev in events:
              if not isinstance(ev,dict): continue
              md=ev.get('$metadata') if isinstance(ev.get('$metadata'),dict) else {}
              workers=ev.get('$workers') if isinstance(ev.get('$workers'),dict) else {}
              we=workers.get('event') if isinstance(workers.get('event'),dict) else {}
              req=we.get('request') if isinstance(we.get('request'),dict) else {}
              resp=we.get('response') if isinstance(we.get('response'),dict) else {}
              p=safe_path(req.get('url'))
              if p in interesting: paths[p]+=1
              m=str(req.get('method') or '').upper()
              if m in ('GET','POST','PUT','DELETE','PATCH','OPTIONS','HEAD'): methods[m]+=1
              try: statuses[str(int(resp.get('status')))]+=1
              except: pass
              trig=str(md.get('trigger') or '')
              for q in interesting:
                  if q in trig: trigger_paths[q]+=1
          for p in ('/authorize','/token','/oauth/token','/family-mcp','/health'):
              key=p.strip('/').replace('/','_').replace('-','_').upper() or 'ROOT'
              print('OBS_PATH_'+key+'='+str(paths[p]))
              print('OBS_TRIGGER_'+key+'='+str(trigger_paths[p]))
          print('OBS_STATUS_COUNTS='+','.join(f'{k}:{v}' for k,v in statuses.most_common(12)))
          print('OBS_METHOD_COUNTS='+','.join(f'{k}:{v}' for k,v in methods.most_common()))
          PY
