name: GitHub Large Contents GREEN

on:
  push:
    branches:
      - test/github-large-contents-read-red-20260902
    paths:
      - src/v6/github-data-store.ts
      - tests/github-data-store-large-contents.test.ts
      - .github/workflows/github-large-contents-green.yml

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Verify large Contents API blob fallback
        run: node --experimental-strip-types tests/github-data-store-large-contents.test.ts
      - name: Type check
        run: npm run type-check
