name: Fix GitHub canonical market-data storage V1

on:
  push:
    branches:
      - feature/diamond-market-data-v1
    paths:
      - .github/workflows/fix-github-canonical-storage-v1.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/diamond-market-data-v1
      - name: Remove remaining R2 assumptions
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/v6/market-data-pipeline.ts')
          text = p.read_text()

          # Schema names are still safe to change: this feature branch has not been deployed.
          text = text.replace('r2_key', 'storage_ref')
          text = text.replace('r2Key', 'storageRef')

          # Remove leftover raw R2 writes in event collector.
          text = text.replace('      const raw = await putJson(env, `market/tw/raw/${tradeDate}/${source.market.toLowerCase()}/events.json`, body, source.market);\n', '')
          text = text.replace('  await putJson(env, `market/tw/daily/${tradeDate}/events.json`, { tradeDate, rows: allEvents }, "OFFICIAL");\n', '')

          # Fundamentals: immutable content is archived directly to GitHub by SHA.
          old = '''async function saveFundamentalVersion(env: Env, dataset: string, market: Market, asOf: string, body: unknown, sourceUrl: string) {
  const text = JSON.stringify(body);
  const sha256 = await sha256Text(text);
  const key = `data/market/tw/fundamentals/${dataset}/${market.toLowerCase()}/${sha256}.json`;
  const rowCount = rows(body).length;
  await env.RESEARCH_DB.prepare(`
    INSERT OR IGNORE INTO fundamental_versions (dataset, market, as_of, row_count, sha256, storage_ref, updated_at)
    VALUES (?, ?, ?, ?, ?, ?, ?)
  `).bind(dataset, market, asOf, rowCount, sha256, key, new Date().toISOString()).run();
  await setStatus(env, asOf, dataset, market, rowCount ? "READY_AS_OF" : "PENDING", {
    dataDate: asOf, rowCount, sourceUrl, storageRef: key, sha256,
    error: rowCount ? null : "rows = 0",
  });
  return { dataset, market, rowCount, sha256, storageRef: key };
}'''
          new = '''async function saveFundamentalVersion(env: Env, dataset: string, market: Market, asOf: string, body: unknown, sourceUrl: string) {
  const serialized = `${JSON.stringify(body, null, 2)}\\n`;
  const sha256 = await sha256Text(JSON.stringify(body));
  const key = `data/market/tw/fundamentals/${dataset}/${market.toLowerCase()}/${sha256}.json`;
  const rowCount = rows(body).length;
  const archive = rowCount
    ? await mirrorGithubFile(env, key, serialized, `data: archive ${market} ${dataset} ${sha256.slice(0, 12)}`)
    : { status: "SKIPPED_EMPTY", path: key };
  await env.RESEARCH_DB.prepare(`
    INSERT OR IGNORE INTO fundamental_versions (dataset, market, as_of, row_count, sha256, storage_ref, updated_at)
    VALUES (?, ?, ?, ?, ?, ?, ?)
  `).bind(dataset, market, asOf, rowCount, sha256, key, new Date().toISOString()).run();
  await setStatus(env, asOf, dataset, market, rowCount ? (archive.status === "READY" ? "READY_AS_OF" : "PENDING_ARCHIVE") : "PENDING", {
    dataDate: asOf, rowCount, sourceUrl, storageRef: key, sha256,
    error: rowCount ? (archive.status === "READY" ? null : `GitHub archive ${archive.status}`) : "rows = 0",
  });
  return { dataset, market, rowCount, sha256, storageRef: key, archive };
}'''
          if old not in text:
              raise SystemExit('saveFundamentalVersion block not found')
          text = text.replace(old, new)

          # Remove R2 reader and replace daily snapshot assembly with D1 facts.
          s = text.index('async function readR2Json(')
          e = text.index('\nexport async function buildMarketDayManifest', s)
          replacement = '''async function loadDailyFactsFromD1(env: Env, tradeDate: string) {
  const [institutional, margin, events] = await Promise.all([
    env.RESEARCH_DB.prepare(`
      SELECT market, symbol, name, foreign_net, trust_net, dealer_net
      FROM institutional_daily WHERE trade_date = ? ORDER BY market, symbol
    `).bind(tradeDate).all<any>(),
    env.RESEARCH_DB.prepare(`
      SELECT market, symbol, name, margin_prev, margin_buy, margin_sell, margin_cash_repay,
             margin_balance, short_prev, short_sell, short_buy, short_repay, short_balance
      FROM margin_daily WHERE trade_date = ? ORDER BY market, symbol
    `).bind(tradeDate).all<any>(),
    env.RESEARCH_DB.prepare(`
      SELECT event_id, market, symbol, event_date, event_time, event_type, title, source
      FROM market_events WHERE event_date = ? ORDER BY market, symbol, event_time
    `).bind(tradeDate).all<any>(),
  ]);
  return {
    institutional: { tradeDate, rows: institutional.results },
    margin: { tradeDate, rows: margin.results },
    events: { tradeDate, rows: events.results },
  };
}
'''
          text = text[:s] + replacement + text[e:]

          # Manifest must not write R2.
          text = text.replace('  await putJson(env, `market/tw/daily/${tradeDate}/manifest.json`, manifest, "DIAMOND_MARKET_DATA_V1");\n', '')

          old = '''async function mirrorDailySnapshot(env: Env, tradeDate: string, manifest: unknown) {
  const [institutional, margin, events] = await Promise.all([
    readR2Json(env, `market/tw/daily/${tradeDate}/institutional.json`),
    readR2Json(env, `market/tw/daily/${tradeDate}/margin.json`),
    readR2Json(env, `market/tw/daily/${tradeDate}/events.json`),
  ]);
  const [year, month, day] = tradeDate.split("-");
  const root = `data/market/tw/daily/${year}/${month}/${day}`;
  const files: Array<[string, unknown]> = [
    [`${root}/manifest.json`, manifest],
    [`${root}/institutional.json`, institutional],
    [`${root}/margin.json`, margin],
    [`${root}/events.json`, events],
  ];
  const results = [];
  for (const [path, value] of files) {
    if (value === null) continue;
    try {
      results.push(await mirrorGithubFile(env, path, `${JSON.stringify(value, null, 2)}\\n`, `data: mirror Taiwan market ${tradeDate} ${path.split("/").at(-1)}`));
    } catch (error) {
      results.push({ status: "FAILED", path, error: error instanceof Error ? error.message : String(error) });
    }
  }
  return results;
}'''
          new = '''async function archiveDailySnapshot(env: Env, tradeDate: string, manifest: unknown) {
  const facts = await loadDailyFactsFromD1(env, tradeDate);
  const [year, month, day] = tradeDate.split("-");
  const root = `data/market/tw/daily/${year}/${month}/${day}`;
  const files: Array<[string, unknown]> = [
    [`${root}/manifest.json`, manifest],
    [`${root}/institutional.json`, facts.institutional],
    [`${root}/margin.json`, facts.margin],
    [`${root}/events.json`, facts.events],
  ];
  const results = [];
  for (const [path, value] of files) {
    try {
      results.push(await mirrorGithubFile(env, path, `${JSON.stringify(value, null, 2)}\\n`, `data: archive Taiwan market ${tradeDate} ${path.split("/").at(-1)}`));
    } catch (error) {
      results.push({ status: "FAILED", path, error: error instanceof Error ? error.message : String(error) });
    }
  }
  return results;
}'''
          if old not in text:
              raise SystemExit('mirrorDailySnapshot block not found')
          text = text.replace(old, new)

          old = '''export async function getMarketDataStatus(env: Env, tradeDate = taipeiDate()) {
  await ensureMarketDataSchema(env);
  const manifest = await readR2Json(env, `market/tw/daily/${tradeDate}/manifest.json`);
  const latestRun = await env.RESEARCH_DB.prepare(`'''
          new = '''export async function getMarketDataStatus(env: Env, tradeDate = taipeiDate()) {
  await ensureMarketDataSchema(env);
  const manifest = await buildMarketDayManifest(env, tradeDate);
  const latestRun = await env.RESEARCH_DB.prepare(`'''
          if old not in text:
              raise SystemExit('getMarketDataStatus header not found')
          text = text.replace(old, new)

          text = text.replace('      const githubMirror = await mirrorDailySnapshot(env, tradeDate, manifest);\n      result = { institutional, margin, manifest, githubMirror };', '      const githubArchive = await archiveDailySnapshot(env, tradeDate, manifest);\n      result = { institutional, margin, manifest, githubArchive };')

          # The top comment/schema should not mention R2 any more.
          text = text.replace('r2', 'storage')
          text = text.replace('R2', 'storage')
          p.write_text(text)

          # Clean docs produced during the earlier R2 design.
          for path in [
              Path('docs/DIAMOND_MARKET_DATA_V1.md'),
              Path('docs/DIAMOND_MARKET_DATA_V1_LIVE_PROBE_20260818.md'),
              Path('docs/DIAMOND_MARKET_DATA_V1_VALIDATION.md'),
          ]:
              if not path.exists():
                  continue
              t = path.read_text()
              t = t.replace('D1/R2', 'D1/GitHub')
              t = t.replace('R2/D1', 'GitHub/D1')
              t = t.replace('R2', 'GitHub')
              t = t.replace('mirror', 'archive')
              path.write_text(t)

          Path('.github/workflows/fix-github-canonical-storage-v1.yml').unlink()
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/v6/market-data-pipeline.ts docs .github/workflows/fix-github-canonical-storage-v1.yml
          git commit -m 'fix: complete GitHub canonical market-data refactor'
          git push origin HEAD:feature/diamond-market-data-v1
