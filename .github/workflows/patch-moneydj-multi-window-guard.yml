name: Patch MoneyDJ multi-window semantic guard

on:
  push:
    branches:
      - feat/moneydj-multi-window-broker-v1
    paths:
      - .github/workflows/patch-moneydj-multi-window-guard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/moneydj-multi-window-broker-v1
      - name: Preserve frozen missing-branch safety wording
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('src/v6/tw-broker-ranked-on-demand.ts')
          s=p.read_text()
          old='Rows shown are MoneyDJ server-ranked public-page output. Missing branches/windows are UNKNOWN, never zero. Ranked-output totals cover displayed ranked rows only and are not a complete branch inventory.'
          new='Rows shown are MoneyDJ server-ranked public-page output. Missing branches must NOT be interpreted as zero activity; missing branches/windows are UNKNOWN, never zero. Ranked-output totals cover displayed ranked rows only and are not a complete branch inventory.'
          if s.count(old) != 1:
              raise SystemExit(f'expected_exactly_one_guard_phrase_found_{s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/v6/tw-broker-ranked-on-demand.ts
          git diff --cached --check
          git commit -m 'fix: preserve missing-branch safety invariant'
          git push origin HEAD:feat/moneydj-multi-window-broker-v1
