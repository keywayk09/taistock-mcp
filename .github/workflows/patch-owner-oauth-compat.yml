name: One-shot patch Owner OAuth compatibility

on:
  push:
    branches:
      - fix/owner-oauth-boundary-20260827

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/owner-oauth-boundary-20260827
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply minimal OAuth compatibility and effective-scope guards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          owner = Path('src/v6/owner-oauth.ts')
          s = owner.read_text()
          old = '''function ownerClientMatches(raw: string | null, candidate: OwnerConnectorCandidate) {
            if (!raw) return false;
            try {
              const stored = JSON.parse(raw) as StoredOwnerConnectorClient;
              return stored.clientId === candidate.clientId
                && Array.isArray(stored.redirectUris)
                && stored.redirectUris.length === 1
                && stored.redirectUris[0] === candidate.redirectUri
                && Array.isArray(stored.grantTypes)
                && stored.grantTypes.includes("authorization_code")
                && Array.isArray(stored.responseTypes)
                && stored.responseTypes.includes("code")
                && stored.tokenEndpointAuthMethod === "none"
                && !stored.clientSecret;
            } catch {
              return false;
            }
          }
          '''
          new = '''function ownerClientMatches(raw: string | null, candidate: OwnerConnectorCandidate) {
            if (!raw) return false;
            try {
              const stored = JSON.parse(raw) as StoredOwnerConnectorClient;
              const authMethod = stored.tokenEndpointAuthMethod;
              const authCompatible = authMethod === "none"
                ? !stored.clientSecret
                : (authMethod === "client_secret_basic" || authMethod === "client_secret_post")
                  && Boolean(stored.clientSecret);

              return stored.clientId === candidate.clientId
                && Array.isArray(stored.redirectUris)
                && stored.redirectUris.length === 1
                && stored.redirectUris[0] === candidate.redirectUri
                && Array.isArray(stored.grantTypes)
                && stored.grantTypes.includes("authorization_code")
                && Array.isArray(stored.responseTypes)
                && stored.responseTypes.includes("code")
                && authCompatible;
            } catch {
              return false;
            }
          }
          '''
          if old not in s:
              raise SystemExit('owner_client_match_anchor_missing')
          owner.write_text(s.replace(old, new, 1))

          family = Path('src/v6/family-oauth.ts')
          s = family.read_text()
          anchor = '''async function rollbackPreparedTokenBootstrap(prepared: PreparedTokenBootstrap, env: Env) {
            if (!prepared.clientKey || prepared.previousClientRaw === undefined) return;
            await env.OAUTH_KV.put(prepared.clientKey, prepared.previousClientRaw).catch(() => undefined);
          }

          export function createFamilyOAuthProvider(appHandler: ConcreteFetchHandler) {
          '''
          replacement = '''async function rollbackPreparedTokenBootstrap(prepared: PreparedTokenBootstrap, env: Env) {
            if (!prepared.clientKey || prepared.previousClientRaw === undefined) return;
            await env.OAUTH_KV.put(prepared.clientKey, prepared.previousClientRaw).catch(() => undefined);
          }

          function bearerAccessToken(request: Request) {
            const header = request.headers.get("authorization") || "";
            const match = /^Bearer\\s+(.+)$/i.exec(header.trim());
            return match?.[1]?.trim() || "";
          }

          async function hasEffectiveOAuthScope(request: Request, env: Env, requiredScope: string) {
            const token = bearerAccessToken(request);
            if (!token) return false;
            const summary = await env.OAUTH_PROVIDER.unwrapToken(token);
            return Boolean(summary?.scope?.includes(requiredScope));
          }

          export function createFamilyOAuthProvider(appHandler: ConcreteFetchHandler) {
          '''
          if anchor not in s:
              raise SystemExit('scope_helper_anchor_missing')
          s = s.replace(anchor, replacement, 1)

          old_family = '''      if (role !== "family" || userId !== "family") {
                return Response.json({ error: "forbidden_family_role" }, { status: 403 });
              }
              try {
          '''
          new_family = '''      if (role !== "family" || userId !== "family") {
                return Response.json({ error: "forbidden_family_role" }, { status: 403 });
              }
              if (!await hasEffectiveOAuthScope(request, env, FAMILY_SCOPE)) {
                return Response.json({ error: "insufficient_family_scope" }, { status: 403 });
              }
              try {
          '''
          if old_family not in s:
              raise SystemExit('family_scope_guard_anchor_missing')
          s = s.replace(old_family, new_family, 1)

          old_owner = '''      if (role !== "owner" || userId !== "owner") {
                return Response.json({ error: "forbidden_owner_role" }, { status: 403 });
              }
              return appHandler.fetch(request, env, ctx);
          '''
          new_owner = '''      if (role !== "owner" || userId !== "owner") {
                return Response.json({ error: "forbidden_owner_role" }, { status: 403 });
              }
              if (!await hasEffectiveOAuthScope(request, env, OWNER_SCOPE)) {
                return Response.json({ error: "insufficient_owner_scope" }, { status: 403 });
              }
              return appHandler.fetch(request, env, ctx);
          '''
          if old_owner not in s:
              raise SystemExit('owner_scope_guard_anchor_missing')
          family.write_text(s.replace(old_owner, new_owner, 1))

          test = Path('tests/owner-oauth-protected-surface.test.ts')
          t = test.read_text()
          if 'const ownerOAuth = fs.readFileSync' not in t:
              t = t.replace(
                  'const oauth = fs.readFileSync(path.join(root, "src/v6/family-oauth.ts"), "utf8");\n',
                  'const oauth = fs.readFileSync(path.join(root, "src/v6/family-oauth.ts"), "utf8");\nconst ownerOAuth = fs.readFileSync(path.join(root, "src/v6/owner-oauth.ts"), "utf8");\n',
                  1,
              )
          appendix = '''

          // OWNER_DCR_AUTH_COMPAT_V1
          // ChatGPT/standards-compliant DCR may omit token_endpoint_auth_method;
          // workers-oauth-provider then creates a confidential client using
          // client_secret_basic. Reusing that already-registered client is safe only
          // because Owner grant creation still requires the Owner login secret.
          assert.match(ownerOAuth, /client_secret_basic/);
          assert.match(ownerOAuth, /client_secret_post/);
          assert.match(ownerOAuth, /Boolean\\(stored\\.clientSecret\\)/);
          '''
          if 'OWNER_DCR_AUTH_COMPAT_V1' not in t:
              t += appendix
          test.write_text(t)
          PY

          git diff --check

      - name: Install dependencies
        run: npm install

      - name: Static and regression gates
        shell: bash
        run: |
          set -euo pipefail
          npm run type-check
          npm run test:ops-contracts

      - name: Full local OAuth flows including default confidential DCR
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 \
            --var MCP_API_KEY:owner-local-secret \
            --var MOM_GPT_API_KEY:family-local-secret \
            >/tmp/owner-compat-local.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; tail -120 /tmp/owner-compat-local.log || true' EXIT

          for i in $(seq 1 45); do
            if curl --silent --max-time 2 http://127.0.0.1:8787/health >/dev/null 2>&1; then break; fi
            sleep 1
          done

          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          const base = 'http://127.0.0.1:8787';
          const callback = 'https://chatgpt.com/connector/oauth/OwnerCompatLocal123';
          const verifier = 'owner-confidential-dcr-verifier-that-is-at-least-43-characters';
          const challenge = crypto.createHash('sha256').update(verifier).digest('base64url');
          const assert = (c,m,d) => { if (!c) throw new Error(`${m}: ${JSON.stringify(d)}`); };

          async function register(body) {
            const r = await fetch(`${base}/oauth/register`, {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
            const text = await r.text();
            let json; try { json=JSON.parse(text); } catch { json={raw:text}; }
            assert(r.status===201,'DCR', {status:r.status,json});
            return json;
          }
          async function start(clientId, resource) {
            const u = new URL(`${base}/authorize`);
            for (const [k,v] of Object.entries({response_type:'code',client_id:clientId,redirect_uri:callback,scope:'owner:full offline_access',state:'compat-local',code_challenge:challenge,code_challenge_method:'S256',resource})) u.searchParams.set(k,v);
            const r=await fetch(u,{redirect:'manual'});
            const text=await r.text();
            assert(r.status===200 && text.includes('Owner / 鑽石引擎'),'Owner authorize start',{status:r.status,text:text.slice(0,300)});
            return u.searchParams.toString();
          }
          async function finish(query) {
            const r=await fetch(`${base}/authorize`,{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams({oauth_query:query,login_secret:'owner-local-secret'}),redirect:'manual'});
            assert(r.status===302,'Owner authorize finish',{status:r.status,body:(await r.text()).slice(0,300)});
            const loc=r.headers.get('location');
            const code=new URL(loc).searchParams.get('code');
            assert(code,'authorization code',loc);
            return code;
          }
          async function token(params, basic) {
            const headers={'content-type':'application/x-www-form-urlencoded'};
            if (basic) headers.authorization=`Basic ${Buffer.from(`${basic.id}:${basic.secret}`).toString('base64')}`;
            const r=await fetch(`${base}/oauth/token`,{method:'POST',headers,body:new URLSearchParams(params)});
            const text=await r.text(); let body; try{body=JSON.parse(text)}catch{body={raw:text}};
            assert(r.status===200,'token exchange',{status:r.status,body});
            return body;
          }
          async function mcp(tokenValue) {
            const r=await fetch(`${base}/my-mcp`,{method:'POST',headers:{authorization:`Bearer ${tokenValue}`,'content-type':'application/json',accept:'application/json, text/event-stream'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'initialize',params:{protocolVersion:'2025-03-26',capabilities:{},clientInfo:{name:'owner-compat-local',version:'1'}}})});
            assert(r.status!==401 && r.status!==403,'protected Owner MCP',{status:r.status,body:(await r.text()).slice(0,300)});
          }

          // DCR with omitted auth method => provider defaults to confidential Basic.
          const confidential=await register({client_name:'Owner Default DCR',redirect_uris:[callback],grant_types:['authorization_code','refresh_token'],response_types:['code']});
          assert(confidential.token_endpoint_auth_method==='client_secret_basic','default DCR method',confidential);
          assert(confidential.client_secret,'default DCR secret',confidential);
          const q1=await start(confidential.client_id,`${base}/my-mcp`);
          const c1=await finish(q1);
          const t1=await token({grant_type:'authorization_code',code:c1,redirect_uri:callback,code_verifier:verifier,resource:`${base}/my-mcp`},{id:confidential.client_id,secret:confidential.client_secret});
          assert((t1.scope||'').split(/\s+/).includes('owner:full'),'confidential Owner scope',t1);
          await mcp(t1.access_token);
          const r1=await token({grant_type:'refresh_token',refresh_token:t1.refresh_token,resource:`${base}/my-mcp`},{id:confidential.client_id,secret:confidential.client_secret});
          await mcp(r1.access_token);

          // Explicit public PKCE DCR remains supported.
          const pub=await register({client_name:'Owner Public DCR',redirect_uris:[callback],grant_types:['authorization_code','refresh_token'],response_types:['code'],token_endpoint_auth_method:'none'});
          assert(pub.token_endpoint_auth_method==='none' && !pub.client_secret,'public DCR',pub);
          const q2=await start(pub.client_id,`${base}/my-mcp`);
          const c2=await finish(q2);
          const t2=await token({grant_type:'authorization_code',code:c2,redirect_uri:callback,code_verifier:verifier,client_id:pub.client_id,resource:`${base}/my-mcp`});
          await mcp(t2.access_token);

          console.log('OWNER_CONFIDENTIAL_AND_PUBLIC_DCR_LOCAL_FLOW=PASS');
          NODE

      - name: Full research suite and dry-run
        shell: bash
        run: |
          set -euo pipefail
          npm run test:research
          npx wrangler deploy --dry-run

      - name: Commit tested patch to branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/v6/owner-oauth.ts src/v6/family-oauth.ts tests/owner-oauth-protected-surface.test.ts
          git commit -m 'fix: accept compatible ChatGPT OAuth client auth modes'
          git push origin HEAD:fix/owner-oauth-boundary-20260827
