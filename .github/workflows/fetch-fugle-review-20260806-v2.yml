name: Fetch Fugle 5m review data 2026-08-06 v2

on:
  push:
    paths:
      - .github/workflows/fetch-fugle-review-20260806-v2.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and normalize Fugle 5m candles
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${FUGLE_API_KEY:-}"
          OUT='data/intraday/2026-08-06/fugle-5m'
          mkdir -p "$OUT/raw"
          for s in 2330 2337 2408 2454 3081 3481 5347 6147 6196; do
            curl -fsS --retry 3 \
              -H 'Accept: application/json' \
              -H "X-API-KEY: ${FUGLE_API_KEY}" \
              "https://api.fugle.tw/marketdata/v1.0/stock/intraday/candles/${s}?timeframe=5&sort=asc" \
              -o "$OUT/raw/${s}.json"
          done
          python - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          root = Path('data/intraday/2026-08-06/fugle-5m')
          tw = timezone(timedelta(hours=8))
          summary = {'date':'2026-08-06','source':'Fugle','timeframe':'5m','symbols':{}}

          def num(v):
              try: return float(v)
              except: return 0.0

          def tw_time(v):
              s = str(v or '')
              if not s: return s
              try:
                  dt = datetime.fromisoformat(s.replace('Z','+00:00'))
                  if dt.tzinfo is None: dt = dt.replace(tzinfo=timezone.utc)
                  return dt.astimezone(tw).isoformat()
              except Exception:
                  return s

          for p in sorted((root/'raw').glob('*.json')):
              symbol = p.stem
              body = json.loads(p.read_text(encoding='utf-8'))
              data = body.get('data') if isinstance(body, dict) else None
              if not isinstance(data, list):
                  raise SystemExit(f'{symbol}: missing data')
              bars=[]
              for x in data:
                  if not isinstance(x, dict): continue
                  bars.append({
                      'time': tw_time(x.get('date') or x.get('time') or x.get('timestamp')),
                      'open': num(x.get('open')),
                      'high': num(x.get('high')),
                      'low': num(x.get('low')),
                      'close': num(x.get('close')),
                      'volume': num(x.get('volume')),
                      'average': num(x.get('average')),
                  })
              out = {
                  'symbol': symbol,
                  'source': 'Fugle',
                  'date': '2026-08-06',
                  'timeframe': '5m',
                  'data': bars,
                  'raw_keys': sorted(data[0].keys()) if data else [],
              }
              (root/f'{symbol}.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
              summary['symbols'][symbol] = {
                  'bars': len(bars),
                  'first': bars[0] if bars else None,
                  'last': bars[-1] if bars else None,
                  'volume_bars': sum(1 for b in bars if b['volume']>0),
                  'raw_keys': out['raw_keys'],
              }
          (root/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False))
          PY
      - name: Commit Fugle review data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/intraday/2026-08-06/fugle-5m
          git commit -m 'data: fetch Fugle 5m candles for 2026-08-06 review' || exit 0
          git push
