name: Crypto MTF OKX 60D V11

on:
  push:
    branches: [research/crypto-mtf-rr-20260830]
    paths:
      - '.github/workflows/crypto-mtf-okx-60d-v11.yml'
      - 'research/crypto_mtf_okx_60d_v11.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run OKX 60-day temporal holdout
        run: python research/crypto_mtf_okx_60d_v11.py
      - name: Upload OKX 60d report
        uses: actions/upload-artifact@v4
        with:
          name: crypto-mtf-okx-60d-v11
          path: /tmp/crypto_mtf_okx_60d_v11.json
          retention-days: 3
