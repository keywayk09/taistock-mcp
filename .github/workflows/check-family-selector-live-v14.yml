name: One-shot family selector live v1.4 check

on:
  push:
    branches:
      - feature/twchips-official-v7
    paths:
      - .github/workflows/check-family-selector-live-v14.yml

permissions:
  contents: read

jobs:
  live-check:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare deployment
        run: sleep 20

      - name: Check production health and selector data
        shell: bash
        run: |
          set +e
          for path in health health/family-selection-data health/family-alternative-data; do
            echo "=== /$path ==="
            code=$(curl --silent --show-error --max-time 120 -o "/tmp/${path//\//-}.txt" -w '%{http_code}' "https://taistock-mcp.keywayk09.workers.dev/$path")
            echo "HTTP=$code"
            cat "/tmp/${path//\//-}.txt" || true
            echo
          done
          code=$(curl --silent --show-error --max-time 120 -o /tmp/family-selection.txt -w '%{http_code}' "https://taistock-mcp.keywayk09.workers.dev/health/family-selection-data")
          test "$code" = "200"
