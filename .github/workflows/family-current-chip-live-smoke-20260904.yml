name: Family Current Chip Live Smoke 20260904

on:
  push:
    branches:
      - ops/family-current-chip-live-smoke-20260904
    paths:
      - .github/workflows/family-current-chip-live-smoke-20260904.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE_URL: https://taistock-mcp.keywayk09.workers.dev
    steps:
      - name: Verify live Family public surface and auth boundary
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = process.env.BASE_URL;
          function must(value, label) { if (!value) throw new Error(label); }
          async function fetchText(path, init = {}, timeout = 30000) {
            const r = await fetch(`${base}${path}`, { ...init, signal: AbortSignal.timeout(timeout) });
            const text = await r.text();
            return { r, text };
          }
          function parseJson(text, label) {
            try { return JSON.parse(text); } catch { throw new Error(`${label}_not_json`); }
          }

          const healthRes = await fetchText('/health', { headers: { accept: 'application/json', 'cache-control': 'no-cache' } }, 20000);
          const health = parseJson(healthRes.text, 'health');
          const healthText = JSON.stringify(health);
          must(healthRes.r.ok && health?.status === 'ok', `health_not_ok_http_${healthRes.r.status}`);
          must(healthText.includes('/family-mcp'), 'family_mcp_endpoint_missing');
          must(healthText.includes('family-mcp/v3.6.0'), 'family_mcp_v3_6_missing');
          must(healthText.includes('get_family_market_chip_summary'), 'family_chip_tool_missing');
          must(healthText.includes('OFFICIAL_EXACT_DATE_ON_DEMAND_CURRENT+PUBLISHED_HISTORY_CONTEXT'), 'family_mcp_current_chip_identity_missing');
          console.log('[smoke] HEALTH_PASS family=/family-mcp version=3.6.0 chip=official_on_demand+published_history');

          const openapiRes = await fetchText('/family-openapi.json', { headers: { accept: 'application/json', 'cache-control': 'no-cache' } }, 20000);
          const openapi = parseJson(openapiRes.text, 'family_openapi');
          const openapiText = JSON.stringify(openapi);
          must(openapiRes.r.ok, `family_openapi_http_${openapiRes.r.status}`);
          must(openapi?.info?.version === 'family-action-openapi/v3.2.0', 'family_openapi_wrong_version');
          must(openapi?.paths?.['/api/family/chips']?.post?.operationId === 'getFamilyMarketChipSummary', 'family_openapi_chips_route_missing');
          must(openapi?.paths?.['/api/family/query']?.post?.operationId === 'queryTaiwanStockSystem', 'family_openapi_query_route_missing');
          must(openapiText.includes('exact-date on-demand'), 'family_openapi_on_demand_semantics_missing');
          must(openapiText.includes('RANKED_ONLY'), 'family_openapi_ranked_only_missing');
          must(openapiText.includes('Published generation') && (openapiText.includes('historical') || openapiText.includes('歷史')), 'family_openapi_published_history_missing');
          must(!openapiText.includes('正式籌碼只認 Published generation'), 'family_openapi_stale_published_only_semantics');
          console.log('[smoke] OPENAPI_PASS chips=query routes present; broker=RANKED_ONLY; Published=history');

          for (const [path, method, body] of [
            ['/api/family/status', 'GET', undefined],
            ['/api/family/chips', 'POST', JSON.stringify({ symbol: '2330', as_of: '2026-09-04' })],
            ['/api/family/query', 'POST', JSON.stringify({ query: '2330 台積電 籌碼與分點狀況', as_of_date: '2026-09-04' })],
          ]) {
            const res = await fetchText(path, {
              method,
              headers: { accept: 'application/json', 'content-type': 'application/json' },
              ...(body ? { body } : {}),
            }, 30000);
            const parsed = parseJson(res.text, path.replaceAll('/', '_'));
            must(res.r.status === 401, `${path}_unauthorized_expected_401_got_${res.r.status}`);
            must(parsed?.error === 'unauthorized', `${path}_wrong_unauthorized_body`);
            must((res.r.headers.get('www-authenticate') || '').includes('taistock-family'), `${path}_missing_www_authenticate`);
          }
          console.log('[smoke] AUTH_BOUNDARY_PASS status/chips/query reject unauthenticated requests with 401');
          console.log('[smoke] FAMILY_PRODUCTION_PUBLIC_SURFACE_PASS');
          NODE
