name: Diagnostic Owner OAuth Client Inventory

on:
  push:
    branches:
      - diag/owner-live-client-inventory-20260827

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect sanitized Production OAuth client inventory
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt
          import hashlib
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          account=os.environ.get('CLOUDFLARE_ACCOUNT_ID','')
          token=os.environ.get('CLOUDFLARE_API_TOKEN','')
          if not account or not token:
              raise SystemExit('cloudflare_credentials_missing')

          auth={'Authorization':f'Bearer {token}','Content-Type':'application/json','User-Agent':'taistock-owner-client-inventory/1'}

          def req(url):
              r=urllib.request.Request(url,headers=auth)
              try:
                  with urllib.request.urlopen(r,timeout=20) as resp:
                      return resp.status,resp.read()
              except urllib.error.HTTPError as e:
                  return e.code,e.read()

          ns_url=f'https://api.cloudflare.com/client/v4/accounts/{account}/storage/kv/namespaces?per_page=1000'
          st,raw=req(ns_url)
          if st!=200:
              raise SystemExit('kv_namespace_list_failed')
          body=json.loads(raw)
          rows=body.get('result') or []
          preferred=[x for x in rows if x.get('title')=='taistock-mcp-OAUTH_KV']
          legacy=[x for x in rows if x.get('title')=='OAUTH_KV']
          chosen=preferred[0] if len(preferred)==1 else (legacy[0] if len(legacy)==1 else None)
          if not chosen:
              raise SystemExit('oauth_kv_not_resolved')
          kv=chosen['id']

          def list_keys(prefix):
              q=urllib.parse.urlencode({'prefix':prefix,'limit':'1000'})
              st,raw=req(f'https://api.cloudflare.com/client/v4/accounts/{account}/storage/kv/namespaces/{kv}/keys?{q}')
              if st!=200:
                  raise SystemExit('kv_key_list_failed')
              b=json.loads(raw)
              if not b.get('success'):
                  raise SystemExit('kv_key_list_unsuccessful')
              return [str(x.get('name') or '') for x in (b.get('result') or [])]

          def get_value(key):
              url=f'https://api.cloudflare.com/client/v4/accounts/{account}/storage/kv/namespaces/{kv}/values/{urllib.parse.quote(key,safe="")}'
              st,raw=req(url)
              if st==404:
                  return None
              if st!=200:
                  raise SystemExit('kv_value_read_failed')
              return raw.decode('utf-8','replace')

          markers=set(list_keys('owner-oauth:legacy-confidential:'))
          client_keys=list_keys('client:')
          now=dt.datetime.now(dt.timezone.utc).timestamp()
          cutoff=dt.datetime(2026,8,27,14,13,3,tzinfo=dt.timezone.utc).timestamp()
          out=[]

          def redirect_kind(raw):
              try:
                  u=urllib.parse.urlparse(raw)
              except Exception:
                  return 'invalid'
              if u.scheme!='https' or u.hostname not in {'chatgpt.com','chat.openai.com'}:
                  return 'other'
              if re.fullmatch(r'/connector/oauth/[A-Za-z0-9_-]{8,256}',u.path):
                  return 'chatgpt_connector'
              if u.path=='/connector_platform_oauth_redirect':
                  return 'chatgpt_legacy'
              if re.fullmatch(r'/aip/[A-Za-z0-9_-]{3,256}/oauth/callback',u.path):
                  return 'chatgpt_action'
              return 'chatgpt_other'

          for key in client_keys:
              raw=get_value(key)
              if not raw:
                  continue
              try:
                  rec=json.loads(raw)
              except Exception:
                  continue
              cid=str(rec.get('clientId') or rec.get('client_id') or key[7:])
              method=str(rec.get('tokenEndpointAuthMethod') or rec.get('token_endpoint_auth_method') or '')
              redirects=rec.get('redirectUris') or rec.get('redirect_uris') or []
              if not isinstance(redirects,list) or len(redirects)!=1:
                  continue
              rkind=redirect_kind(str(redirects[0]))
              if not rkind.startswith('chatgpt_'):
                  continue
              reg=rec.get('registrationDate') or rec.get('client_id_issued_at') or 0
              try:
                  reg=float(reg)
              except Exception:
                  reg=0
              confidential=method in {'client_secret_basic','client_secret_post'}
              marker=f'owner-oauth:legacy-confidential:{cid}' in markers
              age_min=round((now-reg)/60,1) if reg else None
              out.append({
                  'hash':hashlib.sha256(cid.encode()).hexdigest()[:10],
                  'method':method or 'unknown',
                  'confidential':confidential,
                  'redirect':rkind,
                  'marked':marker,
                  'created_before_fix':bool(reg and reg<=cutoff),
                  'age_min':age_min,
                  'grant_types':sorted([str(x) for x in (rec.get('grantTypes') or rec.get('grant_types') or [])]),
                  'response_types':sorted([str(x) for x in (rec.get('responseTypes') or rec.get('response_types') or [])]),
              })

          out.sort(key=lambda x:(10**9 if x['age_min'] is None else x['age_min']))
          confidential=[x for x in out if x['confidential']]
          recent=[x for x in confidential if x['age_min'] is not None and x['age_min']<=30]
          unmarked=[x for x in confidential if not x['marked']]
          print('SAFE_OWNER_CLIENT_INVENTORY_V1')
          print('trusted_chatgpt_clients='+str(len(out)))
          print('trusted_confidential_clients='+str(len(confidential)))
          print('legacy_markers='+str(len(markers)))
          print('unmarked_trusted_confidential='+str(len(unmarked)))
          print('recent_30m_trusted_confidential='+str(len(recent)))
          print('--- newest trusted confidential clients ---')
          for row in confidential[:20]:
              print(json.dumps(row,separators=(',',':'),sort_keys=True))
          PY
