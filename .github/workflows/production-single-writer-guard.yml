name: Production Single Writer Guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  single-writer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Enforce taistock-mcp single-writer contract
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const dir = '.github/workflows';
          const canonical = 'deploy-cloudflare-production.yml';
          const files = fs.readdirSync(dir).filter((name) => /\.ya?ml$/i.test(name));
          const violations = [];

          for (const name of files) {
            if (name === canonical) continue;
            const text = fs.readFileSync(path.join(dir, name), 'utf8');
            const lines = text.split(/\r?\n/);

            // A Wrangler dry-run is validation, not a writer. Real deploy commands are
            // forbidden when they use the taistock-mcp default/unified config or omit
            // an explicit config (which would fall back to the repository default).
            for (const line of lines) {
              if (!/\bwrangler\s+deploy\b/i.test(line)) continue;
              if (/--dry-run\b/i.test(line)) continue;

              const configMatch = line.match(/--config\s+([^\s]+)/i);
              const config = configMatch ? configMatch[1].replace(/["']/g, '') : null;
              const taistockConfig = !config ||
                /(?:^|\/)wrangler\.jsonc$/i.test(config) ||
                /(?:^|\/)wrangler\.unified(?:\.production)?\.jsonc$/i.test(config);

              if (taistockConfig) {
                violations.push(`${name}: ${line.trim()}`);
              }
            }

            // Direct Cloudflare Workers API writes to the taistock-mcp script are
            // forbidden outside the canonical workflow.
            const directScriptTarget = /workers\/scripts\/taistock-mcp\b/i.test(text);
            const mutatingHttp = /(?:-x|--request)\s+(?:post|put|patch|delete)\b/i.test(text);
            if (directScriptTarget && mutatingHttp) {
              violations.push(`${name}: direct Workers API mutation`);
            }
          }

          if (violations.length) {
            console.error('PRODUCTION_SINGLE_WRITER_VIOLATION');
            console.error(`Only ${canonical} may mutate taistock-mcp Production.`);
            for (const item of violations) console.error(`- ${item}`);
            process.exit(1);
          }

          console.log('PRODUCTION_SINGLE_WRITER=PASS');
          console.log(`canonical_writer=${canonical}`);
          NODE
