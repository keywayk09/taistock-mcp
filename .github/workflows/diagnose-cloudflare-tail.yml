name: Diagnose Cloudflare Market Data Tail
# retrigger 2026-08-21T01:04+08:00

on:
  push:
    branches:
      - diag/cloudflare-market-data-runtime
    paths:
      - '.github/workflows/diagnose-cloudflare-tail.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Tail one scheduled interval
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set +e
          mkdir -p tmp/diagnostics
          timeout 370s npx wrangler tail taistock-mcp --format json > /tmp/tail.jsonl 2>/tmp/tail.stderr
          tail_rc=$?
          TAIL_RC=$tail_rc python - <<'PY'
          import json, os, re
          from pathlib import Path
          safe=[]
          p=Path('/tmp/tail.jsonl')
          if p.exists():
              for raw in p.read_text(errors='replace').splitlines():
                  try:
                      obj=json.loads(raw)
                  except Exception:
                      continue
                  event=obj.get('event') if isinstance(obj,dict) else None
                  logs=obj.get('logs') if isinstance(obj,dict) else None
                  exceptions=obj.get('exceptions') if isinstance(obj,dict) else None
                  outcome=obj.get('outcome') if isinstance(obj,dict) else None
                  item={'outcome':outcome}
                  if isinstance(event,dict):
                      item['event_type']=event.get('type')
                      if 'scheduledTime' in event: item['scheduledTime']=event.get('scheduledTime')
                      if 'cron' in event: item['cron']=event.get('cron')
                  if isinstance(logs,list):
                      msgs=[]
                      for x in logs:
                          if not isinstance(x,dict): continue
                          msg=x.get('message')
                          if isinstance(msg,list): msg=' '.join(str(v) for v in msg)
                          if isinstance(msg,str):
                              msg=re.sub(r'Bearer\s+[A-Za-z0-9._~+\-/]+=*','Bearer [REDACTED]',msg,flags=re.I)
                              msgs.append({'level':x.get('level'),'message':msg[:2000]})
                      if msgs: item['logs']=msgs
                  if isinstance(exceptions,list):
                      exc=[]
                      for x in exceptions:
                          if isinstance(x,dict):
                              exc.append({'name':x.get('name'),'message':str(x.get('message',''))[:3000]})
                      if exc: item['exceptions']=exc
                  if item.get('event_type')=='scheduled' or item.get('exceptions') or item.get('logs'):
                      safe.append(item)
          stderr=''
          sp=Path('/tmp/tail.stderr')
          if sp.exists(): stderr=sp.read_text(errors='replace')[-3000:]
          receipt={'tail_rc':int(os.environ.get('TAIL_RC','0')),'events':safe[-50:],'stderr_tail':stderr}
          Path('tmp/diagnostics/cloudflare-market-data-tail.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/diagnostics/cloudflare-market-data-tail.json
          git commit -m 'diag: record Cloudflare market-data tail' || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
