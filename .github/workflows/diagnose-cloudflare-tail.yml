name: Diagnose Cloudflare Market Data Tail
# aligned retrigger for immediate */5 cron observation

on:
  push:
    branches:
      - diag/cloudflare-market-data-runtime
    paths:
      - '.github/workflows/diagnose-cloudflare-tail.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Tail production scheduled runtime
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set +e
          mkdir -p tmp/diagnostics
          timeout 150s npx wrangler tail taistock-mcp --format json --sampling-rate 1 > /tmp/tail.jsonl 2>/tmp/tail.stderr
          tail_rc=$?
          TAIL_RC=$tail_rc python - <<'PY'
          import json, os, re
          from pathlib import Path
          safe=[]
          p=Path('/tmp/tail.jsonl')
          if p.exists():
              for raw in p.read_text(errors='replace').splitlines():
                  try: obj=json.loads(raw)
                  except Exception: continue
                  if not isinstance(obj,dict): continue
                  event=obj.get('event'); logs=obj.get('logs'); exceptions=obj.get('exceptions')
                  item={'outcome':obj.get('outcome')}
                  if isinstance(event,dict):
                      item['event_type']=event.get('type')
                      item['scheduledTime']=event.get('scheduledTime')
                      item['cron']=event.get('cron')
                  if isinstance(logs,list):
                      msgs=[]
                      for x in logs:
                          if not isinstance(x,dict): continue
                          msg=x.get('message')
                          if isinstance(msg,list): msg=' '.join(str(v) for v in msg)
                          if isinstance(msg,str):
                              msg=re.sub(r'Bearer\s+\S+','Bearer [REDACTED]',msg,flags=re.I)
                              msgs.append({'level':x.get('level'),'message':msg[:2500]})
                      if msgs: item['logs']=msgs
                  if isinstance(exceptions,list):
                      exc=[]
                      for x in exceptions:
                          if isinstance(x,dict): exc.append({'name':x.get('name'),'message':str(x.get('message',''))[:4000]})
                      if exc: item['exceptions']=exc
                  safe.append(item)
          stderr=Path('/tmp/tail.stderr').read_text(errors='replace')[-3000:] if Path('/tmp/tail.stderr').exists() else ''
          Path('tmp/diagnostics/cloudflare-market-data-tail.json').write_text(json.dumps({'tail_rc':int(os.environ.get('TAIL_RC','0')),'events':safe[-100:],'stderr_tail':stderr},indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/diagnostics/cloudflare-market-data-tail.json
          git commit -m 'diag: record aligned Cloudflare market-data tail' || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
