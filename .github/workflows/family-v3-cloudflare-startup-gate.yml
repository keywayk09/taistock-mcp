name: Family V3 Cloudflare Startup Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package.json'
      - 'wrangler.jsonc'
      - '.github/workflows/family-v3-cloudflare-startup-gate.yml'

permissions:
  contents: read

concurrency:
  group: family-v3-cloudflare-startup-gate
  cancel-in-progress: true

jobs:
  startup-gate:
    if: github.head_ref == 'feature/family-shared-read-intelligence-v3-20260822'
    runs-on: ubuntu-latest
    env:
      GATE_WORKER_NAME: taistock-mcp-family-v3-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      - name: Resolve existing OAuth KV without mutation
        id: oauth_kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces"
          curl -fsS "${endpoint}?per_page=1000" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' > /tmp/oauth-kv-list.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          body=json.loads(Path('/tmp/oauth-kv-list.json').read_text())
          if not body.get('success'):
              raise SystemExit('oauth_kv_list_failed')
          rows=body.get('result') or []
          preferred=[x for x in rows if x.get('title')=='taistock-mcp-OAUTH_KV']
          if len(preferred) != 1:
              raise SystemExit(f'expected_exactly_one_existing_oauth_kv:found={len(preferred)}')
          kv_id=str(preferred[0].get('id') or '')
          if len(kv_id) != 32:
              raise SystemExit('invalid_existing_oauth_kv_id')
          print(f'id={kv_id}')
          print('title=taistock-mcp-OAUTH_KV')
          PY

      - name: Build isolated gate config
        env:
          OAUTH_KV_ID: ${{ steps.oauth_kv.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          kv=os.environ['OAUTH_KV_ID']
          worker=os.environ['GATE_WORKER_NAME']
          config=f'''{{
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "{worker}",
            "main": "src/index-v6.ts",
            "compatibility_date": "2025-03-10",
            "compatibility_flags": ["nodejs_compat", "global_fetch_strictly_public"],
            "vars": {{
              "RESEARCH_MAX_SYMBOLS": "40",
              "RESEARCH_MAX_ONE_MINUTE": "8",
              "GITHUB_DATA_REPO": "keywayk09/tv-papertrader",
              "GITHUB_DATA_BRANCH": "main"
            }},
            "kv_namespaces": [{{"binding": "OAUTH_KV", "id": "{kv}"}}],
            "exports": {{
              "MyMCP": {{"type": "durable-object", "storage": "sqlite"}},
              "FamilyMCP": {{"type": "durable-object", "storage": "sqlite"}}
            }},
            "durable_objects": {{
              "bindings": [
                {{"class_name": "MyMCP", "name": "MCP_OBJECT"}},
                {{"class_name": "FamilyMCP", "name": "FAMILY_MCP_OBJECT"}}
              ]
            }},
            "observability": {{"enabled": false}}
          }}\n'''
          Path('/tmp/wrangler.family-v3-gate.jsonc').write_text(config)
          PY

      - name: Real Cloudflare upload and startup validation
        id: deploy_gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/family-v3-gate.log
          set +e
          npx wrangler deploy --config /tmp/wrangler.family-v3-gate.jsonc 2>&1 | tee /tmp/family-v3-gate.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          import re
          from pathlib import Path
          p=Path('/tmp/family-v3-gate.log')
          text=p.read_text(errors='replace') if p.exists() else ''
          text=re.sub(r'(?i)(authorization\s*:\s*bearer\s+)[^\s]+', r'\1[REDACTED]', text)
          text=re.sub(r'(?i)(bearer\s+)[A-Za-z0-9._~+/=-]{16,}', r'\1[REDACTED]', text)
          text=re.sub(r'(?i)((?:api[_ -]?token|token|secret|password)\s*[=:]\s*)[^\s]+', r'\1[REDACTED]', text)
          selected=[line for line in text.splitlines() if re.search(r'(?i)(error|failed|failure|code|startup|validation|class2|zod|modelcontextprotocol|worker|module)', line)]
          print('\n'.join(selected[-120:] or text.splitlines()[-80:]))
          PY
            exit "$status"
          fi
          echo 'REAL_CLOUDFLARE_STARTUP_VALIDATION=PASS'

      - name: Delete isolated gate Worker
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set +e
          npx wrangler delete --name "$GATE_WORKER_NAME" --force >/tmp/family-v3-gate-delete.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo 'Gate cleanup command did not confirm deletion; checking script state through Cloudflare API.'
            http_code="$(curl -sS -o /tmp/family-v3-gate-check.json -w '%{http_code}' \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${GATE_WORKER_NAME}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json')"
            if [ "$http_code" = '404' ]; then
              echo 'Gate Worker absent; cleanup verified.'
              exit 0
            fi
            echo "Gate Worker cleanup verification failed (HTTP ${http_code})." >&2
            exit 1
          fi
          echo 'Gate Worker deleted.'
