name: Stage isolated Owner OAuth issuer v3

on:
  push:
    branches:
      - fix/owner-oauth-issuer-isolation-20260827

permissions:
  contents: read

jobs:
  cross-origin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STAGE_BASE: https://taistock-owner-oauth-stage3.keywayk09.workers.dev
      MCP_BASE: https://taistock-mcp.keywayk09.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      - name: Deploy isolated staging issuer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npm run type-check
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces"
          curl -fsS --max-time 30 "${endpoint}?per_page=1000" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" > /tmp/kv.json
          export OAUTH_KV_ID="$(python - <<'PY'
          import json
          rows=json.load(open('/tmp/kv.json')).get('result') or []
          p=[x for x in rows if x.get('title')=='taistock-mcp-OAUTH_KV']; l=[x for x in rows if x.get('title')=='OAUTH_KV']
          c=p[0] if len(p)==1 else (l[0] if len(l)==1 else None)
          if not c: raise SystemExit('oauth_kv_not_resolved')
          print(c['id'])
          PY
          )"
          cp wrangler.owner-oauth.jsonc wrangler.owner-oauth.stage3.jsonc
          python - <<'PY'
          import os,re
          from pathlib import Path
          p=Path('wrangler.owner-oauth.stage3.jsonc'); s=p.read_text()
          s=s.replace('"name": "taistock-owner-oauth"','"name": "taistock-owner-oauth-stage3"',1)
          s,n=re.subn(r'("binding"\s*:\s*"OAUTH_KV")(\s*)(\})',lambda m:m.group(1)+',\n      "id": "'+os.environ['OAUTH_KV_ID']+'"'+m.group(2)+m.group(3),s,count=1)
          if n!=1: raise SystemExit('oauth_kv_injection_failed')
          p.write_text(s)
          PY
          npx wrangler deploy --config wrangler.owner-oauth.stage3.jsonc
          secret="$(openssl rand -hex 32)"; echo "::add-mask::${secret}"
          printf '%s' "$secret" | npx wrangler secret put OWNER_OAUTH_STAGING_SECRET --config wrangler.owner-oauth.stage3.jsonc >/dev/null
          printf '%s' "$secret" >/tmp/stage3-secret

      - name: Wait for secret activation and run matrix
        shell: bash
        run: |
          set -euo pipefail
          STAGING_SECRET="$(cat /tmp/stage3-secret)" node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          const stage=process.env.STAGE_BASE, mcp=process.env.MCP_BASE, secret=process.env.STAGING_SECRET;
          const callback='https://chatgpt.com/connector/oauth/OwnerIssuerIsolationStage789';
          const resource=`${mcp}/my-mcp`;
          const verifier='owner-isolated-issuer-pkce-verifier-longer-than-forty-three-chars';
          const challenge=crypto.createHash('sha256').update(verifier).digest('base64url');
          const read=async r=>{const t=await r.text();try{return JSON.parse(t)}catch{return{raw:t}}};
          const ok=(c,m,d)=>{if(!c)throw new Error(`${m}${d===undefined?'':': '+JSON.stringify(d)}`)};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));

          let meta;
          for(let i=0;i<40;i++){
            try{const r=await fetch(`${stage}/.well-known/oauth-authorization-server`); if(r.status===200){meta=await read(r);break}}catch{}
            await sleep(2000);
          }
          ok(meta,'stage metadata unavailable');
          ok(meta.issuer===stage,'issuer',meta);
          ok(meta.authorization_endpoint===`${stage}/authorize`&&meta.token_endpoint===`${stage}/oauth/token`&&meta.registration_endpoint===`${stage}/oauth/register`,'endpoint identity',meta);
          ok((meta.scopes_supported||[]).includes('owner:full')&&!(meta.scopes_supported||[]).includes('family:read'),'scope isolation',meta);

          const rr=await fetch(`${stage}/oauth/register`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({client_name:'Owner Issuer Isolation Stage v3',redirect_uris:[callback],grant_types:['authorization_code','refresh_token'],response_types:['code']})});
          const client=await read(rr); ok(rr.status===201&&client.client_id&&client.client_secret,'DCR',{status:rr.status,client});
          const auth=new URL(`${stage}/authorize`);
          for(const[k,v]of Object.entries({response_type:'code',client_id:client.client_id,redirect_uri:callback,scope:'owner:full offline_access',state:'stage-v3',code_challenge:challenge,code_challenge_method:'S256',resource}))auth.searchParams.set(k,v);
          const pg=await fetch(auth,{redirect:'manual'}), html=await pg.text(); ok(pg.status===200&&html.includes('Owner OAuth staging'),'staging page',{status:pg.status,html:html.slice(0,200)});
          const q=auth.searchParams.toString();

          let secretActive=false;
          for(let i=0;i<30;i++){
            const bad=await fetch(`${stage}/authorize`,{method:'POST',redirect:'manual',headers:{'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams({oauth_query:q,login_secret:'definitely-wrong'})});
            if(bad.status===403){secretActive=true;break}
            await sleep(2000);
          }
          ok(secretActive,'staging secret never became active');

          const done=await fetch(`${stage}/authorize`,{method:'POST',redirect:'manual',headers:{'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams({oauth_query:q,login_secret:secret})});
          ok(done.status===302,'authorize complete',done.status);
          const code=new URL(done.headers.get('location')).searchParams.get('code'); ok(code,'authorization code');
          const basic='Basic '+Buffer.from(`${client.client_id}:${client.client_secret}`).toString('base64');
          async function token(params){const r=await fetch(`${stage}/oauth/token`,{method:'POST',headers:{authorization:basic,'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams(params)});return{r,j:await read(r)}}
          async function mcpCall(path,t){return fetch(`${mcp}${path}`,{method:'POST',headers:{authorization:`Bearer ${t}`,'content-type':'application/json',accept:'application/json, text/event-stream'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'initialize',params:{protocolVersion:'2025-03-26',capabilities:{},clientInfo:{name:'owner-issuer-stage-v3',version:'1'}}})})}
          const x=await token({grant_type:'authorization_code',code,redirect_uri:callback,code_verifier:verifier,resource});
          ok(x.r.status===200&&x.j.access_token&&x.j.refresh_token,'token exchange',{status:x.r.status,j:{...x.j,access_token:!!x.j.access_token,refresh_token:!!x.j.refresh_token}});
          ok((x.j.scope||'').split(/\s+/).includes('owner:full'),'owner token scope',x.j.scope);
          const owner=await mcpCall('/my-mcp',x.j.access_token); ok(owner.status===200,'CROSS_ORIGIN_OWNER_TOKEN_ACCEPTED_BY_PRODUCTION',owner.status);
          const family=await mcpCall('/family-mcp',x.j.access_token); ok([401,403].includes(family.status),'Owner token rejected by Family',family.status);
          const cross=await token({grant_type:'refresh_token',refresh_token:x.j.refresh_token,resource:`${mcp}/family-mcp`}); ok(cross.r.status===400,'cross-target refresh blocked',{status:cross.r.status,j:cross.j});
          const fresh=await token({grant_type:'refresh_token',refresh_token:x.j.refresh_token,resource}); ok(fresh.r.status===200&&fresh.j.access_token,'same-target refresh',fresh.j);
          ok((await mcpCall('/my-mcp',fresh.j.access_token)).status===200,'refreshed isolated token accepted');
          console.log('ISOLATED_OWNER_ISSUER_CROSS_ORIGIN_MATRIX=PASS');
          NODE

      - name: Delete staging issuer
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set +e
          [ -f wrangler.owner-oauth.stage3.jsonc ] && npx wrangler delete --config wrangler.owner-oauth.stage3.jsonc --force >/tmp/stage3-delete.log 2>&1
          rm -f wrangler.owner-oauth.stage3.jsonc /tmp/stage3-secret
          exit 0
