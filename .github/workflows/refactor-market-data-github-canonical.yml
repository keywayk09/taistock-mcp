name: Refactor Diamond Market Data to GitHub canonical

on:
  push:
    branches:
      - feature/diamond-market-data-v1
    paths:
      - .github/workflows/refactor-market-data-github-canonical.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/diamond-market-data-v1
      - name: Refactor market data storage
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/v6/market-data-pipeline.ts')
          text = p.read_text()
          text = text.replace('    RESEARCH_BUCKET: R2Bucket;\n', '')
          text = text.replace('  if (!env.RESEARCH_DB || !env.RESEARCH_BUCKET) throw new Error("RESEARCH_DB 或 RESEARCH_BUCKET 尚未綁定");', '  if (!env.RESEARCH_DB) throw new Error("RESEARCH_DB 尚未綁定");')
          start = text.index('async function putJson(')
          end = text.index('\nasync function setStatus(', start)
          text = text[:start] + text[end+1:]
          text = text.replace('      const raw = await putJson(env, `market/tw/raw/${tradeDate}/${source.market.toLowerCase()}/symbol-master.json`, body, source.market);\n', '')
          text = text.replace('        dataDate: tradeDate, rowCount: normalized.length, sourceUrl: source.url, r2Key: raw.key, sha256: raw.sha256,\n', '        dataDate: tradeDate, rowCount: normalized.length, sourceUrl: source.url,\n')
          text = text.replace('      const raw = await putJson(env, `market/tw/raw/${tradeDate}/${source.market.toLowerCase()}/institutional-${suffix}.json`, body, source.market);\n', '')
          text = text.replace('        dataDate: tradeDate, rowCount: normalized.length, sourceUrl: source.url, r2Key: raw.key, sha256: raw.sha256,\n', '        dataDate: tradeDate, rowCount: normalized.length, sourceUrl: source.url,\n')
          text = text.replace('  if (combined.length) await putJson(env, `market/tw/daily/${tradeDate}/institutional.json`, { tradeDate, final, rows: combined }, "OFFICIAL");\n', '')
          text = text.replace('      const raw = await putJson(env, `market/tw/raw/${tradeDate}/${source.market.toLowerCase()}/margin.json`, body, source.market);\n', '')
          text = text.replace('        dataDate: tradeDate, rowCount: normalized.length, sourceUrl: source.url, r2Key: raw.key, sha256: raw.sha256,\n', '        dataDate: tradeDate, rowCount: normalized.length, sourceUrl: source.url,\n')
          text = text.replace('  if (combined.length) await putJson(env, `market/tw/daily/${tradeDate}/margin.json`, { tradeDate, rows: combined }, "OFFICIAL");\n', '')
          old = '''  const text = JSON.stringify(body);\n  const sha256 = await sha256Text(text);\n  const key = `market/tw/fundamentals/${dataset}/${market.toLowerCase()}/${sha256}.json`;\n  const existing = await env.RESEARCH_BUCKET.head(key);\n  if (!existing) await env.RESEARCH_BUCKET.put(key, text, { httpMetadata: { contentType: "application/json; charset=utf-8" }, customMetadata: { source: market, sha256, storedAt: new Date().toISOString() } });\n  const rowCount = rows(body).length;'''
          new = '''  const text = JSON.stringify(body);\n  const sha256 = await sha256Text(text);\n  const key = `data/market/tw/fundamentals/${dataset}/${market.toLowerCase()}/${sha256}.json`;\n  const rowCount = rows(body).length;'''
          if old not in text:
              raise SystemExit('fundamental R2 block not found')
          text = text.replace(old, new)
          text = text.replace('  if (allEvents.length) await putJson(env, `market/tw/daily/${tradeDate}/events.json`, { tradeDate, rows: allEvents }, "OFFICIAL");\n', '')
          text = text.replace('  const dailyPrefix = `market/tw/daily/${tradeDate}`;', '  const dailyPrefix = `data/market/tw/daily/${tradeDate.replaceAll("-", "/")}`;')
          # Remove R2 object reads in finalize; rebuild daily payloads directly from D1.
          marker = 'async function loadR2Json('
          if marker in text:
              s = text.index(marker)
              e = text.index('\nasync function githubUpsert(', s)
              text = text[:s] + text[e+1:]
          text = text.replace('      research_r2: env.RESEARCH_BUCKET ? "connected" : "pending",\n', '')
          p.write_text(text)

          w = Path('wrangler.jsonc')
          wt = w.read_text()
          wt = wt.replace('\n\t"r2_buckets": [\n\t\t{\n\t\t\t"binding": "RESEARCH_BUCKET",\n\t\t\t"bucket_name": "taistock-research-data"\n\t\t}\n\t],', '')
          wt = wt.replace('Cloudflare D1/R2 is the runtime execution and market-data layer.', 'Cloudflare D1 is the runtime query/index layer; GitHub is the canonical market-data archive.')
          w.write_text(wt)

          d = Path('docs/DIAMOND_MARKET_DATA_V1.md')
          dt = d.read_text()
          dt = dt.replace('Cloudflare is the execution path.\n\n### D1 (`RESEARCH_DB`)', 'Cloudflare is the execution path. GitHub is the canonical market-data archive.\n\n### D1 (`RESEARCH_DB`)')
          if '### R2 (`RESEARCH_BUCKET`)' in dt:
              a = dt.index('### R2 (`RESEARCH_BUCKET`)')
              b = dt.index('## GitHub daily mirror')
              dt = dt[:a] + '### GitHub canonical storage\n\nRaw/normalized daily market facts are written directly to GitHub under `data/market/tw/`. No R2 dependency is used in V1.\n\n' + dt[b:]
          dt = dt.replace('## GitHub daily mirror', '## GitHub canonical daily storage')
          dt = dt.replace('For human-readable daily inspection, finalize may mirror the R2 daily snapshot into `keywayk09/tv-papertrader`:', 'Finalize writes the frozen daily snapshot directly into `keywayk09/tv-papertrader`:')
          dt = dt.replace('The mirror is non-blocking and uses read-before-write CAS retry.', 'GitHub is the canonical daily archive and uses read-before-write CAS retry.')
          dt = dt.replace('Without the secret, mirror status is `PENDING_SECRET`; market capture remains valid in D1/R2.', 'Without the secret, archival status is `PENDING_SECRET`; D1 index/status remains available but the day is not canonical-complete.')
          dt = dt.replace('R2/D1 capture is allowed to succeed even if GitHub is unavailable.\n\n', '')
          d.write_text(dt)

          Path('.github/workflows/refactor-market-data-github-canonical.yml').unlink()
      - name: Commit refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/v6/market-data-pipeline.ts wrangler.jsonc docs/DIAMOND_MARKET_DATA_V1.md .github/workflows/refactor-market-data-github-canonical.yml
          git commit -m 'refactor: use GitHub as canonical market-data storage'
          git push origin HEAD:feature/diamond-market-data-v1
