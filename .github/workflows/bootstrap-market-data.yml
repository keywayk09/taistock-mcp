name: Bootstrap Diamond Market Data V1

on:
  push:
    branches:
      - feature/diamond-market-data-v1
    paths:
      - .github/workflows/bootstrap-market-data.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/diamond-market-data-v1
      - name: Materialize market data pipeline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/v6
          printf '%s' '' | base64 -d | xz -d > src/v6/market-data-pipeline.ts
          rm .github/workflows/bootstrap-market-data.yml
      - name: Commit generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/v6/market-data-pipeline.ts .github/workflows/bootstrap-market-data.yml
          git commit -m 'feat: add Diamond market data pipeline'
          git push origin HEAD:feature/diamond-market-data-v1
