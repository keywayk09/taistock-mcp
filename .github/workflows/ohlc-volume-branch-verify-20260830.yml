name: OHLC Volume Branch Verify 20260830

on:
  push:
    branches:
      - ops/fugle-control-plane-public-runner-20260829
    paths:
      - .github/workflows/ohlc-volume-branch-verify-20260830.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone isolated OHLC branch
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch fix/ohlc-volume-canonical-shares-20260830 https://github.com/keywayk09/tv-papertrader.git work

      - name: Install OHLC build dependency
        working-directory: work/cloudflare/ohlc-tv-fugle-1d
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund

      - name: Run full OHLC local build and contract tests
        working-directory: work/cloudflare/ohlc-tv-fugle-1d
        shell: bash
        run: |
          set -euo pipefail
          npm run build
