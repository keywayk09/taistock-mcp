name: Final Worker Smoke 20260829

on:
  push:
    branches:
      - ops/fugle-control-plane-public-runner-20260829
    paths:
      - .github/workflows/fugle-jin10-retire-public-runner-20260829.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify final OHLC and Global Futures health
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const checks = [
            ['OHLC', 'https://tv-fugle-1d.keikei99887.workers.dev/health'],
            ['GLOBAL_FUTURES', 'https://tv-global-futures.keikei99887.workers.dev/health'],
          ];

          for (const [name, url] of checks) {
            const response = await fetch(url, {
              headers: { Accept: 'application/json', 'Cache-Control': 'no-cache' },
              signal: AbortSignal.timeout(15000),
            });
            if (!response.ok) throw new Error(`${name.toLowerCase()}_health_http_${response.status}`);
            const body = await response.json();
            if (!body || typeof body !== 'object') throw new Error(`${name.toLowerCase()}_health_shape_invalid`);
            if (name === 'OHLC' && Object.prototype.hasOwnProperty.call(body, 'jin10_retired_secret_present')) {
              throw new Error('temporary_jin10_health_proof_still_present');
            }
            console.log(`[smoke] ${name}=PASS`);
          }

          console.log('[smoke] FINAL_CLEAN_DEPLOY_PASS');
          NODE
