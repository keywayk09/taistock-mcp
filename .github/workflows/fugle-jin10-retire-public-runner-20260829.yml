name: Fugle Deployment Readonly Audit 20260829

on:
  push:
    branches:
      - ops/fugle-control-plane-public-runner-20260829
    paths:
      - .github/workflows/fugle-jin10-retire-public-runner-20260829.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.FUGLE_CF_API_TOKEN }}
    steps:
      - name: Inspect current Production and latest version
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const token = String(process.env.CLOUDFLARE_API_TOKEN || '').trim();
          const worker = 'tv-fugle-1d';
          const expectedSubdomain = 'keikei99887';
          const base = 'https://api.cloudflare.com/client/v4';
          if (!token) throw new Error('isolated_token_missing');

          async function cf(path) {
            const r = await fetch(`${base}${path}`, {
              headers: { Authorization: `Bearer ${token}`, Accept: 'application/json' },
              signal: AbortSignal.timeout(15000),
            });
            const b = await r.json();
            if (!r.ok || b?.success !== true) {
              const code = Array.isArray(b?.errors) && b.errors[0]?.code != null ? b.errors[0].code : 'unknown';
              throw new Error(`cf_${r.status}_${code}`);
            }
            return b.result;
          }

          const accounts = await cf('/accounts?per_page=50');
          const matches = [];
          for (const a of Array.isArray(accounts) ? accounts : []) {
            const id = String(a?.id || '');
            if (!id) continue;
            try {
              const sd = await cf(`/accounts/${encodeURIComponent(id)}/workers/subdomain`);
              if (String(sd?.subdomain || '') === expectedSubdomain) matches.push(id);
            } catch {}
          }
          if (matches.length !== 1) throw new Error(`account_match_${matches.length}`);
          const accountId = matches[0];
          console.log(`[audit] ACCOUNT_IDENTITY_VERIFIED subdomain=${expectedSubdomain}`);

          const deploymentResult = await cf(`/accounts/${encodeURIComponent(accountId)}/workers/scripts/${encodeURIComponent(worker)}/deployments`);
          const deployments = Array.isArray(deploymentResult?.deployments) ? deploymentResult.deployments : (Array.isArray(deploymentResult) ? deploymentResult : []);
          if (!deployments.length) throw new Error('no_deployments');
          const active = deployments[0];
          const activeVersions = Array.isArray(active?.versions) ? active.versions : [];
          const production = activeVersions.find(v => Number(v?.percentage) === 100) || (activeVersions.length === 1 ? activeVersions[0] : null);
          if (!production?.version_id) throw new Error('production_version_not_single_100');

          const versionsResult = await cf(`/accounts/${encodeURIComponent(accountId)}/workers/scripts/${encodeURIComponent(worker)}/versions?per_page=5`);
          const versions = Array.isArray(versionsResult) ? versionsResult : (Array.isArray(versionsResult?.items) ? versionsResult.items : []);
          if (!versions.length) throw new Error('no_versions');

          console.log(`[audit] PRODUCTION_VERSION=${String(production.version_id)}`);
          console.log(`[audit] LATEST_VERSION=${String(versions[0]?.id || '')}`);
          console.log(`[audit] LATEST_CREATED_ON=${String(versions[0]?.metadata?.created_on || versions[0]?.created_on || 'unknown')}`);
          console.log(`[audit] PRODUCTION_IS_LATEST=${String(production.version_id) === String(versions[0]?.id || '') ? 'true' : 'false'}`);
          console.log('[audit] READ_ONLY_DEPLOYMENT_AUDIT_PASS');
          NODE
