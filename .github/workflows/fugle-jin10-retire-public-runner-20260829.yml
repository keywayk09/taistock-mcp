name: Fugle Jin10 Retire Public Runner 20260829

on:
  push:
    branches:
      - ops/fugle-control-plane-public-runner-20260829
    paths:
      - .github/workflows/fugle-jin10-retire-public-runner-20260829.yml

permissions:
  contents: read

concurrency:
  group: fugle-jin10-retire-public-runner-20260829
  cancel-in-progress: false

jobs:
  retire-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.FUGLE_CF_API_TOKEN }}
    steps:
      - name: Retire only tv-fugle-1d JIN10_MCP_TOKEN and verify
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const apiToken = String(process.env.CLOUDFLARE_API_TOKEN || '').trim();
          const workerName = 'tv-fugle-1d';
          const secretName = 'JIN10_MCP_TOKEN';
          const expectedSubdomain = 'keikei99887';
          const healthUrl = `https://${workerName}.${expectedSubdomain}.workers.dev/health`;
          const base = 'https://api.cloudflare.com/client/v4';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          if (!apiToken) {
            console.error('[retire-fugle-jin10] FAIL isolated_token_missing');
            process.exit(64);
          }

          async function cf(path, options = {}) {
            const response = await fetch(`${base}${path}`, {
              ...options,
              headers: {
                Authorization: `Bearer ${apiToken}`,
                Accept: 'application/json',
                ...(options.headers || {}),
              },
              signal: AbortSignal.timeout(15000),
            });
            let body = null;
            const raw = await response.text();
            if (raw) {
              try { body = JSON.parse(raw); }
              catch { throw new Error('cloudflare_invalid_json'); }
            }
            if (!response.ok || body?.success !== true) {
              throw new Error(`cloudflare_api_failed_${response.status}`);
            }
            return body;
          }

          async function discoverAccountId() {
            const accounts = await cf('/accounts?per_page=50');
            const candidates = Array.isArray(accounts?.result) ? accounts.result : [];
            const matches = [];
            for (const account of candidates) {
              const accountId = String(account?.id || '').trim();
              if (!accountId) continue;
              try {
                const subdomain = await cf(`/accounts/${encodeURIComponent(accountId)}/workers/subdomain`);
                if (String(subdomain?.result?.subdomain || '').trim() === expectedSubdomain) {
                  matches.push(accountId);
                }
              } catch {
                // Ignore accounts not inspectable by this isolated token.
              }
            }
            if (matches.length !== 1) throw new Error(`account_identity_match_count_${matches.length}`);
            console.log(`[retire-fugle-jin10] ACCOUNT_IDENTITY_VERIFIED subdomain=${expectedSubdomain}`);
            return matches[0];
          }

          async function secretPresent(accountId) {
            const secrets = await cf(`/accounts/${encodeURIComponent(accountId)}/workers/scripts/${encodeURIComponent(workerName)}/secrets`);
            const rows = Array.isArray(secrets?.result) ? secrets.result : [];
            return rows.some((item) => String(item?.name || '') === secretName);
          }

          async function readHealthPresence() {
            const response = await fetch(healthUrl, {
              headers: { Accept: 'application/json', 'Cache-Control': 'no-cache' },
              signal: AbortSignal.timeout(15000),
            });
            if (!response.ok) throw new Error(`production_health_http_${response.status}`);
            const body = await response.json();
            if (typeof body?.jin10_retired_secret_present !== 'boolean') {
              throw new Error('production_health_proof_missing');
            }
            return body.jin10_retired_secret_present;
          }

          try {
            const accountId = await discoverAccountId();
            console.log(`[retire-fugle-jin10] CONTROL_PLANE_REACHABLE worker=${workerName}`);

            if (await secretPresent(accountId)) {
              await cf(
                `/accounts/${encodeURIComponent(accountId)}/workers/scripts/${encodeURIComponent(workerName)}/secrets/${encodeURIComponent(secretName)}`,
                { method: 'DELETE' },
              );
            }

            if (await secretPresent(accountId)) {
              throw new Error('secret_cleanup_not_effective');
            }

            console.log(`[retire-fugle-jin10] CONTROL_PLANE_PASS worker=${workerName} ${secretName}=absent`);

            let last = 'unverified';
            for (let attempt = 1; attempt <= 12; attempt += 1) {
              try {
                const present = await readHealthPresence();
                last = present ? 'true' : 'false';
                if (present === false) {
                  console.log('[retire-fugle-jin10] PRODUCTION_HEALTH_PASS jin10_retired_secret_present=false');
                  console.log('[retire-fugle-jin10] PASS control-plane-and-runtime-verified');
                  process.exit(0);
                }
              } catch (error) {
                last = error instanceof Error ? error.message : 'health_check_failed';
              }
              if (attempt < 12) await sleep(3000);
            }
            throw new Error(`production_health_not_false:${last}`);
          } catch (error) {
            console.error(`[retire-fugle-jin10] FAIL ${error instanceof Error ? error.message : 'unknown_error'}`);
            process.exit(1);
          }
          NODE
