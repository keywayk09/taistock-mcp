name: Final Worker Smoke 20260829

on:
  push:
    branches:
      - ops/fugle-control-plane-public-runner-20260829
    paths:
      - .github/workflows/fugle-jin10-retire-public-runner-20260829.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify OHLC and Global Futures health
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const checks = [
            {
              name: 'OHLC',
              url: 'https://tv-fugle-1d.keikei99887.workers.dev/health',
              validate(body) {
                if (!body || typeof body !== 'object') throw new Error('ohlc_health_shape_invalid');
                if (Object.prototype.hasOwnProperty.call(body, 'jin10_retired_secret_present')) {
                  throw new Error('temporary_jin10_health_proof_still_present');
                }
              },
            },
            {
              name: 'GLOBAL_FUTURES',
              url: 'https://tv-global-futures.keikei99887.workers.dev/health',
              validate(body) {
                if (!body || typeof body !== 'object') throw new Error('global_futures_health_shape_invalid');
              },
            },
          ];

          for (const check of checks) {
            const response = await fetch(check.url, {
              headers: { Accept: 'application/json', 'Cache-Control': 'no-cache' },
              signal: AbortSignal.timeout(15000),
            });
            if (!response.ok) throw new Error(`${check.name.toLowerCase()}_health_http_${response.status}`);
            const body = await response.json();
            check.validate(body);
            console.log(`[smoke] ${check.name}=PASS`);
          }

          console.log('[smoke] FINAL_WORKER_SMOKE_PASS');
          NODE
