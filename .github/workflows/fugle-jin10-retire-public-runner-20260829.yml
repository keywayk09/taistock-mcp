name: Fugle Jin10 Retire Public Runner 20260829

on:
  push:
    branches:
      - ops/fugle-control-plane-public-runner-20260829
    paths:
      - .github/workflows/fugle-jin10-retire-public-runner-20260829.yml

permissions:
  contents: read

concurrency:
  group: fugle-jin10-retire-public-runner-20260829
  cancel-in-progress: false

jobs:
  discover-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.FUGLE_CF_API_TOKEN }}
    steps:
      - name: Runner proof
        shell: bash
        run: |
          set -euo pipefail
          echo 'PUBLIC_RUNNER_PASS'

      - name: Require isolated Fugle token
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo 'FUGLE_CF_API_TOKEN_MISSING'; exit 64; }
          echo 'FUGLE_CF_API_TOKEN_PRESENT'

      - name: Read-only discover correct Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const apiToken = String(process.env.CLOUDFLARE_API_TOKEN || '').trim();
          const workerName = 'tv-fugle-1d';
          const secretName = 'JIN10_MCP_TOKEN';
          const expectedSubdomain = 'keikei99887';
          const base = 'https://api.cloudflare.com/client/v4';

          async function cf(path) {
            const response = await fetch(`${base}${path}`, {
              headers: {
                Authorization: `Bearer ${apiToken}`,
                Accept: 'application/json',
              },
              signal: AbortSignal.timeout(15000),
            });
            let body;
            try { body = await response.json(); }
            catch { throw new Error('cloudflare_invalid_json'); }
            if (!response.ok || body?.success !== true) {
              throw new Error(`cloudflare_api_failed_${response.status}`);
            }
            return body;
          }

          try {
            const accounts = await cf('/accounts?per_page=50');
            const candidates = Array.isArray(accounts?.result) ? accounts.result : [];
            if (!candidates.length) throw new Error('no_accessible_accounts');

            const matches = [];
            for (const account of candidates) {
              const accountId = String(account?.id || '').trim();
              if (!accountId) continue;
              try {
                const subdomain = await cf(`/accounts/${encodeURIComponent(accountId)}/workers/subdomain`);
                if (String(subdomain?.result?.subdomain || '').trim() === expectedSubdomain) {
                  matches.push(accountId);
                }
              } catch {
                // Ignore accounts that the isolated token cannot inspect for Workers.
              }
            }

            if (matches.length !== 1) {
              throw new Error(`account_identity_match_count_${matches.length}`);
            }

            const accountId = matches[0];
            console.log(`[fugle-discovery] ACCOUNT_IDENTITY_VERIFIED subdomain=${expectedSubdomain}`);

            const secrets = await cf(`/accounts/${encodeURIComponent(accountId)}/workers/scripts/${encodeURIComponent(workerName)}/secrets`);
            const rows = Array.isArray(secrets?.result) ? secrets.result : [];
            const present = rows.some((item) => String(item?.name || '') === secretName);

            console.log(`[fugle-discovery] CONTROL_PLANE_REACHABLE worker=${workerName}`);
            console.log(`[fugle-discovery] JIN10_MCP_TOKEN_PRESENT=${present ? 'true' : 'false'}`);
            console.log('[fugle-discovery] READ_ONLY_DISCOVERY_PASS');
          } catch (error) {
            console.error(`[fugle-discovery] FAIL ${error instanceof Error ? error.message : 'unknown_error'}`);
            process.exit(1);
          }
          NODE
