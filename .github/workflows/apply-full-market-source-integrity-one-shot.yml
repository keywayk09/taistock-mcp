name: Apply Full Market Source Integrity One Shot

on:
  push:
    branches:
      - fix/full-market-source-integrity-v1
    paths:
      - .github/workflows/apply-full-market-source-integrity-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-market-source-integrity-v1
          fetch-depth: 0

      - name: Apply isolated patch
        run: python scripts/apply-full-market-source-integrity-patch.py

      - name: Validate and commit branch patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: fail closed on partial full-market source coverage'
          git push origin HEAD:fix/full-market-source-integrity-v1
