name: Bootstrap TPEx Relay 2026-08-19

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch, validate, and publish 8/19 official TPEx relay
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt, hashlib, json, pathlib, urllib.request
          endpoints={
            'institutional':'https://www.tpex.org.tw/openapi/v1/tpex_3insti_daily_trading',
            'margin':'https://www.tpex.org.tw/openapi/v1/tpex_mainboard_margin_balance',
          }
          headers={'Accept':'application/json,text/plain,*/*','Referer':'https://www.tpex.org.tw/','User-Agent':'Mozilla/5.0'}
          def date(v):
            s=str(v or '').strip()
            if len(s)==7 and s.isdigit(): return f'{int(s[:3])+1911:04d}-{s[3:5]}-{s[5:7]}'
            raise RuntimeError(f'bad Date={s!r}')
          out={}
          for kind,url in endpoints.items():
            with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as r:
              body=json.loads(r.read().decode('utf-8-sig'))
            if not isinstance(body,list) or not body: raise RuntimeError(f'{kind}: empty')
            d=date(body[0].get('Date'))
            if d!='2026-08-19': raise RuntimeError(f'{kind}: expected 2026-08-19 got {d}')
            out[kind]=(body,url)
          base=pathlib.Path('data/market-data/tpex-relay/2026-08-19'); base.mkdir(parents=True,exist_ok=True)
          manifest={'schema':'TPEX_OFFICIAL_RELAY_V1','trade_date':'2026-08-19','captured_at_utc':dt.datetime.now(dt.timezone.utc).isoformat().replace('+00:00','Z'),'source_owner':'TPEx','transport':'GitHub Actions official endpoint relay','datasets':{}}
          for kind,(body,url) in out.items():
            payload=json.dumps(body,ensure_ascii=False,separators=(',',':'),sort_keys=True).encode()
            sha=hashlib.sha256(payload).hexdigest(); fn=f'{kind}.json'
            (base/fn).write_bytes(payload+b'\n')
            manifest['datasets'][kind]={'source_date':'2026-08-19','row_count':len(body),'sha256':sha,'endpoint':url,'file':fn}
          (base/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
          git config user.name 'tpex-official-relay-bot'
          git config user.email 'actions@users.noreply.github.com'
          TMP=$(mktemp -d); cp -a data/market-data/tpex-relay "$TMP/"
          if git fetch origin market-data-relay:refs/remotes/origin/market-data-relay; then
            git checkout -B market-data-relay refs/remotes/origin/market-data-relay
          else
            git checkout -b market-data-relay
          fi
          mkdir -p data/market-data
          cp -a "$TMP/tpex-relay" data/market-data/
          git add data/market-data/tpex-relay
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'market-data: bootstrap TPEx official 2026-08-19'
          git push origin HEAD:refs/heads/market-data-relay
