name: Crypto MTF RR Regime V16

on:
  push:
    branches: [research/crypto-mtf-rr-20260830]
    paths:
      - '.github/workflows/crypto-mtf-rr-regime-v16.yml'
      - 'research/crypto_mtf_rr_regime_v16.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run gate integrity and RR horizon validation
        run: python research/crypto_mtf_rr_regime_v16.py
      - name: Upload V16 report
        uses: actions/upload-artifact@v4
        with:
          name: crypto-mtf-rr-regime-v16
          path: /tmp/crypto_mtf_rr_regime_v16.json
          retention-days: 3
