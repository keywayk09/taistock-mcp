name: Crypto V1.3.0 TAKE HTF Diagnostic 2026-09-05

on:
  push:
    paths:
      - '.github/workflows/crypto-v130-take-htf-diagnostic-20260905.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect TAKE higher-timeframe completeness once
        shell: bash
        run: |
          set -euo pipefail
          out="$(mktemp)"
          trap 'rm -f "$out"' EXIT

          # Single call only; return compact analytical metadata, not raw bars.
          code="$(curl -L -sS --connect-timeout 10 --max-time 45 \
            -H 'accept: application/json' \
            -A 'crypto-v130-take-htf-diagnostic/2026-09-05' \
            -o "$out" -w '%{http_code}' \
            'https://7d75ff6c-tv-crypto-engine.keikei99887.workers.dev/market/deep-probe?symbols=TAKE&kucoin_symbols=TAKEUSDTM' || true)"

          echo "HTTP=${code}"
          jq -c '{
            ok,version,
            result:(.results[0] | {
              base,complete,requests_passed,request_status,
              higher_available:.multi_timeframe.higher_timeframes_available,
              alignment:.multi_timeframe.alignment,
              higher:(.multi_timeframe.higher_context | {
                ok,kucoin_symbol,mexc_symbol,aggregation,request_status,
                timeframes
              })
            })
          }' "$out"
          test "$code" = '200'
