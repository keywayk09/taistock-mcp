name: Patch Diamond Market Data financial endpoints

on:
  push:
    branches:
      - feature/diamond-market-data-v1
    paths:
      - .github/workflows/patch-market-data-financial-endpoints.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/diamond-market-data-v1
      - name: Correct official TPEx financial endpoint variants
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/v6/market-data-pipeline.ts')
          text = p.read_text()
          old = '''const FINANCIAL_ENDPOINTS: Array<{ market: Market; dataset: string; path: string }> = [
            ...["basi", "bd", "ci", "fh", "ins", "mim"].flatMap((kind) => [
              { market: "TWSE" as const, dataset: `income_${kind}`, path: `${TWSE_OPENAPI}/opendata/t187ap06_L_${kind}` },
              { market: "TWSE" as const, dataset: `balance_${kind}`, path: `${TWSE_OPENAPI}/opendata/t187ap07_L_${kind}` },
              { market: "TPEx" as const, dataset: `income_${kind}`, path: `${TPEX_OPENAPI}/mopsfin_t187ap06_O_${kind}` },
              { market: "TPEx" as const, dataset: `balance_${kind}`, path: `${TPEX_OPENAPI}/mopsfin_t187ap07_O_${kind}` },
            ]),
          ];'''.replace('            ', '')
          new = '''const FINANCIAL_ENDPOINTS: Array<{ market: Market; dataset: string; path: string }> = [
            ...["basi", "bd", "ci", "fh", "ins", "mim"].flatMap((kind) => [
              { market: "TWSE" as const, dataset: `income_${kind}`, path: `${TWSE_OPENAPI}/opendata/t187ap06_L_${kind}` },
              { market: "TWSE" as const, dataset: `balance_${kind}`, path: `${TWSE_OPENAPI}/opendata/t187ap07_L_${kind}` },
            ]),
            ...["basi", "bd", "ci", "fh", "ins", "mim"].map((kind) => ({
              market: "TPEx" as const,
              dataset: `income_${kind}`,
              path: `${TPEX_OPENAPI}/mopsfin_t187ap06_O_${kind}`,
            })),
            ...([
              ["basi", "basi"],
              ["bd", "bd"],
              ["ci", "ci"],
              ["fh", "fh"],
              ["ins", "insA"],
              ["mim", "mimA"],
            ] as const).map(([datasetKind, endpointKind]) => ({
              market: "TPEx" as const,
              dataset: `balance_${datasetKind}`,
              path: `${TPEX_OPENAPI}/mopsfin_t187ap07_O_${endpointKind}`,
            })),
          ];'''.replace('            ', '')
          if old not in text:
              raise SystemExit('expected FINANCIAL_ENDPOINTS block not found')
          p.write_text(text.replace(old, new))
          Path('.github/workflows/patch-market-data-financial-endpoints.yml').unlink()
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/v6/market-data-pipeline.ts .github/workflows/patch-market-data-financial-endpoints.yml
          git commit -m 'fix: align TPEx financial statement endpoint variants'
          git push origin HEAD:feature/diamond-market-data-v1
