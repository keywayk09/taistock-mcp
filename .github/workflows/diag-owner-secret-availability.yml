name: Diagnose Owner OAuth secret availability

on:
  push:
    branches:
      - diag/owner-oauth-production-state-20260827

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check configured secret names without exposing values
        env:
          GH_MCP_API_KEY: ${{ secrets.MCP_API_KEY }}
          GH_OWNER_OAUTH_LOGIN_SECRET: ${{ secrets.OWNER_OAUTH_LOGIN_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${GH_MCP_API_KEY:-}" ] && echo 'GITHUB_MCP_API_KEY_CONFIGURED=true' || echo 'GITHUB_MCP_API_KEY_CONFIGURED=false'
          [ -n "${GH_OWNER_OAUTH_LOGIN_SECRET:-}" ] && echo 'GITHUB_OWNER_OAUTH_LOGIN_SECRET_CONFIGURED=true' || echo 'GITHUB_OWNER_OAUTH_LOGIN_SECRET_CONFIGURED=false'
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/taistock-mcp/secrets"
            code="$(curl -sS -o /tmp/secrets.json -w '%{http_code}' --max-time 30 "$endpoint" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
            echo "CLOUDFLARE_SECRET_LIST_STATUS=${code}"
            if [ "$code" = 200 ]; then
              python - <<'PY'
          import json
          b=json.load(open('/tmp/secrets.json'))
          names=sorted(x.get('name') for x in (b.get('result') or []) if isinstance(x,dict) and x.get('name'))
          print('CLOUDFLARE_HAS_MCP_API_KEY='+str('MCP_API_KEY' in names).lower())
          print('CLOUDFLARE_HAS_OWNER_OAUTH_LOGIN_SECRET='+str('OWNER_OAUTH_LOGIN_SECRET' in names).lower())
          PY
            fi
          fi
