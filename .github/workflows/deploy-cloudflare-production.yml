name: Deploy taistock-mcp to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-cloudflare-production.yml'
  workflow_dispatch:

permissions:
  contents: write

# Production is latest-wins. A stale/hung deployment must never block a newer
# source commit from reaching Cloudflare.
concurrency:
  group: taistock-mcp-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WORKER_BASE_URL: https://taistock-mcp.keywayk09.workers.dev

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Inspect deployment credential presence
        id: auth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo 'token_configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'token_configured=false' >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo 'account_id_configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'account_id_configured=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve or create dedicated OAuth KV
        id: oauth_kv
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo 'Cloudflare token/account ID is required to resolve OAuth KV.' >&2
            exit 78
          fi
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces"
          curl --fail --silent --show-error --max-time 30 "${endpoint}?per_page=1000" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' > /tmp/oauth-kv-list.json
          python - <<'PY' > /tmp/oauth-kv-choice.json
          import json
          from pathlib import Path
          body=json.loads(Path('/tmp/oauth-kv-list.json').read_text())
          if not body.get('success'):
              raise SystemExit(f"kv_list_failed:{body.get('errors')}")
          rows=body.get('result') or []
          preferred=[x for x in rows if x.get('title')=='taistock-mcp-OAUTH_KV']
          legacy=[x for x in rows if x.get('title')=='OAUTH_KV']
          if len(preferred)>1:
              raise SystemExit('ambiguous_preferred_oauth_kv')
          if preferred:
              chosen=preferred[0]
          elif len(legacy)==1:
              chosen=legacy[0]
          elif len(legacy)>1:
              raise SystemExit('ambiguous_legacy_oauth_kv')
          else:
              chosen=None
          print(json.dumps(chosen or {}))
          PY
          kv_id="$(python - <<'PY'
          import json
          from pathlib import Path
          print((json.loads(Path('/tmp/oauth-kv-choice.json').read_text()) or {}).get('id',''))
          PY
          )"
          kv_title="$(python - <<'PY'
          import json
          from pathlib import Path
          print((json.loads(Path('/tmp/oauth-kv-choice.json').read_text()) or {}).get('title',''))
          PY
          )"
          created=false
          if [ -z "${kv_id}" ]; then
            curl --fail --silent --show-error --max-time 30 -X POST "$endpoint" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data '{"title":"taistock-mcp-OAUTH_KV"}' > /tmp/oauth-kv-create.json
            kv_id="$(python - <<'PY'
          import json
          from pathlib import Path
          body=json.loads(Path('/tmp/oauth-kv-create.json').read_text())
          if not body.get('success'):
              raise SystemExit(f"kv_create_failed:{body.get('errors')}")
          print((body.get('result') or {}).get('id',''))
          PY
            )"
            kv_title='taistock-mcp-OAUTH_KV'
            created=true
          fi
          if ! [[ "$kv_id" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo 'invalid OAuth KV namespace id' >&2
            exit 1
          fi
          echo "id=${kv_id}" >> "$GITHUB_OUTPUT"
          echo "title=${kv_title}" >> "$GITHUB_OUTPUT"
          echo "created=${created}" >> "$GITHUB_OUTPUT"

      - name: Deploy production Worker
        id: deploy
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OAUTH_KV_ID: ${{ steps.oauth_kv.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo 'CLOUDFLARE_API_TOKEN is not configured.' >&2
            exit 78
          fi
          if [ "${{ steps.oauth_kv.outcome }}" != 'success' ] || [ -z "${OAUTH_KV_ID:-}" ]; then
            echo 'OAuth KV resolution failed; refusing Production deploy.' >&2
            exit 78
          fi
          cp wrangler.jsonc wrangler.production.jsonc
          trap 'rm -f wrangler.production.jsonc' EXIT
          python - <<'PY'
          import os,re
          from pathlib import Path
          path=Path('wrangler.production.jsonc')
          text=path.read_text()
          kv=os.environ['OAUTH_KV_ID']
          pattern=r'("binding"\s*:\s*"OAUTH_KV")(\s*)(\})'
          updated,n=re.subn(pattern, lambda m: m.group(1)+',\n\t\t\t"id": "'+kv+'"'+m.group(2)+m.group(3), text, count=1)
          if n != 1:
              raise SystemExit('oauth_kv_binding_injection_failed')
          path.write_text(updated)
          PY

          rm -f /tmp/wrangler-deploy.log /tmp/wrangler-deploy-diagnostic.txt
          set +e
          timeout 300 npx wrangler deploy --config wrangler.production.jsonc 2>&1 | tee /tmp/wrangler-deploy.log
          deploy_status=${PIPESTATUS[0]}
          set -e

          if [ "$deploy_status" -ne 0 ]; then
            DEPLOY_EXIT_CODE="$deploy_status" python - <<'PY'
          import os,re
          from pathlib import Path
          source=Path('/tmp/wrangler-deploy.log')
          text=source.read_text(errors='replace') if source.exists() else ''
          text=re.sub(r'(?i)(authorization\s*:\s*bearer\s+)[^\s]+', r'\1[REDACTED]', text)
          text=re.sub(r'(?i)(bearer\s+)[A-Za-z0-9._~+/=-]{16,}', r'\1[REDACTED]', text)
          text=re.sub(r'(?i)((?:api[_ -]?token|token|secret|password)\s*[=:]\s*)[^\s]+', r'\1[REDACTED]', text)
          lines=[line.rstrip() for line in text.splitlines()]
          selected=lines[-120:]
          header=[
              'SAFE_WRANGLER_DEPLOY_DIAGNOSTIC_V2',
              f'source_sha={os.environ.get("GITHUB_SHA", "unknown")}',
              f'exit_code={os.environ.get("DEPLOY_EXIT_CODE", "unknown")}',
              '---',
          ]
          Path('/tmp/wrangler-deploy-diagnostic.txt').write_text('\n'.join(header+selected)+'\n')
          PY
            exit "$deploy_status"
          fi

      - name: Install and verify five-minute Cron Trigger
        id: cron
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/taistock-mcp/schedules"
          curl --fail --silent --show-error --max-time 30 -X PUT "$endpoint" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '[{"cron":"*/5 * * * *"}]' > /tmp/cron-put.json
          curl --fail --silent --show-error --max-time 30 "$endpoint" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' > /tmp/cron-get.json
          python - <<'PY'
          import json
          from pathlib import Path
          put=json.loads(Path('/tmp/cron-put.json').read_text())
          get=json.loads(Path('/tmp/cron-get.json').read_text())
          schedules=((get.get('result') or {}).get('schedules') or [])
          crons=[x.get('cron') for x in schedules if isinstance(x,dict)]
          if not put.get('success'):
              raise SystemExit('cron_put_failed')
          if '*/5 * * * *' not in crons:
              raise SystemExit(f'cron_verify_failed:{crons}')
          PY

      - name: Verify live Production health and full-market contract
        id: smoke
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/smoke-health.json /tmp/smoke-full-market.json /tmp/smoke-error.txt
          passed=false
          for attempt in 1 2 3; do
            echo "Production smoke attempt ${attempt}/3"
            if curl --fail --silent --show-error --max-time 20 "${WORKER_BASE_URL}/health" > /tmp/smoke-health.json \
              && curl --fail --silent --show-error --max-time 45 "${WORKER_BASE_URL}/health/full-market" > /tmp/smoke-full-market.json \
              && python - <<'PY'
          import json
          from pathlib import Path
          health=json.loads(Path('/tmp/smoke-health.json').read_text())
          market=json.loads(Path('/tmp/smoke-full-market.json').read_text())
          if health.get('status') != 'ok':
              raise SystemExit(f"health_status={health.get('status')}")
          if health.get('mcp_endpoint') != '/my-mcp':
              raise SystemExit(f"owner_mcp={health.get('mcp_endpoint')}")
          if market.get('source_contract') != 'tw-full-market-source-contract/v1.0.0':
              raise SystemExit(f"source_contract={market.get('source_contract')}")
          if market.get('usable') is not True:
              raise SystemExit(f"full_market_usable={market.get('usable')}")
          listed=(market.get('listed') or {}).get('rows') or 0
          otc=(market.get('otc') or {}).get('rows') or 0
          if listed < 400 or otc < 250:
              raise SystemExit(f"coverage listed={listed} otc={otc}")
          print(f"smoke ok listed={listed} otc={otc}")
          PY
            then
              passed=true
              break
            fi
            sleep 10
          done
          if [ "$passed" != true ]; then
            {
              echo 'PRODUCTION_SMOKE_FAILED_V1'
              echo "source_sha=${GITHUB_SHA}"
              echo '--- /health ---'
              cat /tmp/smoke-health.json 2>/dev/null || true
              echo
              echo '--- /health/full-market ---'
              cat /tmp/smoke-full-market.json 2>/dev/null || true
            } > /tmp/smoke-error.txt
            exit 1
          fi

      - name: Persist deploy receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/deploy-receipts
          diagnostic_path='tmp/deploy-receipts/taistock-mcp-cloudflare-error.txt'

          if [ "${{ steps.auth.outputs.token_configured }}" != 'true' ]; then
            reason='MISSING_CLOUDFLARE_API_TOKEN'
          elif [ "${{ steps.oauth_kv.outcome }}" != 'success' ]; then
            reason='OAUTH_KV_RESOLUTION_FAILED'
          elif [ "${{ steps.deploy.outcome }}" != 'success' ]; then
            reason='WRANGLER_DEPLOY_FAILED'
          elif [ "${{ steps.cron.outcome }}" != 'success' ]; then
            reason='CRON_TRIGGER_INSTALL_FAILED'
          elif [ "${{ steps.smoke.outcome }}" != 'success' ]; then
            reason='PRODUCTION_SMOKE_FAILED'
          else
            reason='DEPLOYED_CRON_AND_FULL_MARKET_SMOKE_VERIFIED'
          fi

          if [ "$reason" != 'DEPLOYED_CRON_AND_FULL_MARKET_SMOKE_VERIFIED' ]; then
            {
              echo 'SAFE_PRODUCTION_DEPLOY_DIAGNOSTIC_V2'
              echo "source_sha=${GITHUB_SHA}"
              echo "reason=${reason}"
              echo '--- wrangler ---'
              cat /tmp/wrangler-deploy-diagnostic.txt 2>/dev/null || true
              echo '--- smoke ---'
              cat /tmp/smoke-error.txt 2>/dev/null || true
            } > "$diagnostic_path"
          else
            rm -f "$diagnostic_path"
          fi

          cat > tmp/deploy-receipts/taistock-mcp-cloudflare.json <<EOF
          {
            "source_sha": "${GITHUB_SHA}",
            "oauth_kv_outcome": "${{ steps.oauth_kv.outcome }}",
            "oauth_kv_title": "${{ steps.oauth_kv.outputs.title }}",
            "oauth_kv_created": "${{ steps.oauth_kv.outputs.created }}",
            "deploy_outcome": "${{ steps.deploy.outcome }}",
            "cron_outcome": "${{ steps.cron.outcome }}",
            "smoke_outcome": "${{ steps.smoke.outcome }}",
            "reason": "${reason}",
            "diagnostic_path": "${diagnostic_path}",
            "token_configured": ${{ steps.auth.outputs.token_configured }},
            "account_id_configured": ${{ steps.auth.outputs.account_id_configured }},
            "cron": "*/5 * * * *",
            "recorded_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/deploy-receipts/taistock-mcp-cloudflare.json
          git add -A "$diagnostic_path"
          git commit -m 'ops: record Cloudflare production deploy result' || exit 0
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo 'deploy receipt push retries exhausted' >&2
          exit 1

      - name: Enforce deployment result
        if: steps.oauth_kv.outcome != 'success' || steps.deploy.outcome != 'success' || steps.cron.outcome != 'success' || steps.smoke.outcome != 'success'
        run: exit 1
