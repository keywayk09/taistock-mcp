name: Inspect Original Family OAuth Token State 20260823

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect-token-state:
    if: github.head_ref == 'ops/find-original-family-oauth-client-20260823'
    runs-on: ubuntu-latest
    env:
      MOM_CLIENT_ID: 41i_gRq63zL6r2tO
      OLD_NAMESPACE_TITLE: taistock-mcp-oauth
    steps:
      - name: Inspect only sanitized original grant/token state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces"
          curl -fsS "${endpoint}?per_page=1000" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" > /tmp/ns.json
          ns_id="$(python - <<'PY'
          import json,os
          x=json.load(open('/tmp/ns.json'))
          rows=[r for r in x.get('result',[]) if r.get('title')==os.environ['OLD_NAMESPACE_TITLE']]
          if len(rows)!=1: raise SystemExit('old_namespace_not_unique')
          print(rows[0]['id'])
          PY
          )"
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${ns_id}"
          for prefix in 'grant:' 'token:'; do
            enc="$(python -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1],safe=""))' "$prefix")"
            curl -fsS "$base/keys?prefix=$enc&limit=1000" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" > "/tmp/${prefix%:}-keys.json"
          done
          NS_ID="$ns_id" python - <<'PY'
          import json,os,subprocess,urllib.parse,time
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']; ns=os.environ['NS_ID']; cid=os.environ['MOM_CLIENT_ID']
          base=f'https://api.cloudflare.com/client/v4/accounts/{account}/storage/kv/namespaces/{ns}'
          def read(key):
              p=subprocess.run(['curl','-fsS',base+'/values/'+urllib.parse.quote(key,safe=''),'-H',f'Authorization: Bearer {token}'],capture_output=True,text=True)
              if p.returncode: return None
              try: return json.loads(p.stdout)
              except: return None
          gkeys=[x.get('name') for x in (json.load(open('/tmp/grant-keys.json')).get('result') or []) if x.get('name')]
          grants=[]
          grant_ids=set()
          for key in gkeys:
              x=read(key)
              if isinstance(x,dict) and x.get('clientId')==cid:
                  grants.append(x)
                  if x.get('id'): grant_ids.add(str(x.get('id')))
          print('OLD_MATCHING_GRANTS='+str(len(grants)))
          for i,g in enumerate(grants,1):
              scope=g.get('scope') or []
              scope_class='family_read' if scope==['family:read'] else ('legacy_taistock_read' if scope==['taistock.read'] else 'other')
              print(f'OLD_GRANT_{i}_SCOPE_CLASS={scope_class}')
              print(f'OLD_GRANT_{i}_HAS_REFRESH_TOKEN='+str(bool(g.get('refreshTokenId'))).upper())
              print(f'OLD_GRANT_{i}_HAS_REFRESH_WRAPPED_KEY='+str(bool(g.get('refreshTokenWrappedKey'))).upper())
              print(f'OLD_GRANT_{i}_HAS_RESOURCE='+str(bool(g.get('resource'))).upper())
              print(f'OLD_GRANT_{i}_ROLE_FAMILY='+str((g.get('metadata') or {}).get('clientName') is not None or g.get('userId')=='family').upper())
          tkeys=[x.get('name') for x in (json.load(open('/tmp/token-keys.json')).get('result') or []) if x.get('name')]
          matching=[]
          now=int(time.time())
          for key in tkeys:
              x=read(key)
              if not isinstance(x,dict): continue
              embedded=x.get('grant') or {}
              if embedded.get('clientId')==cid or str(x.get('grantId') or '') in grant_ids:
                  matching.append(x)
          print('OLD_MATCHING_ACCESS_TOKEN_RECORDS='+str(len(matching)))
          print('OLD_ANY_UNEXPIRED_ACCESS_TOKEN='+str(any(int(x.get('expiresAt') or 0)>now for x in matching)).upper())
          print('OLD_ANY_TOKEN_AUDIENCE_PRESENT='+str(any(bool(x.get('audience')) for x in matching)).upper())
          PY
