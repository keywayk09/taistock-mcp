name: OHLC Cloudflare Worker List 20260828

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ohlc-cloudflare-worker-list-20260828.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List Worker script names only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ]
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]
          url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts"
          curl --fail --silent --show-error --max-time 60 "$url" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Accept: application/json' \
            -o /tmp/workers.json
          python - <<'PY'
          import json
          from pathlib import Path
          body=json.loads(Path('/tmp/workers.json').read_text())
          if body.get('success') is not True:
            raise SystemExit('WORKER_LIST_API_FAILED')
          rows=body.get('result') or []
          names=sorted(str(x.get('id') or x.get('name') or '') for x in rows if isinstance(x,dict))
          print('worker_count=',len(names))
          print('worker_names=',names)
          matches=[x for x in names if 'fugle' in x.lower() or 'ohlc' in x.lower() or 'tv-' in x.lower()]
          print('ohlc_like=',matches)
          PY
