name: One-shot MCP Relay Refactor Gate

on:
  push:
    branches:
      - test/mcp-relay-separation-red-20260827
    paths:
      - '.github/workflows/ops-mcp-relay-refactor-once.yml'

permissions:
  contents: write

jobs:
  refactor-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/mcp-relay-separation-red-20260827
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply minimal relay extraction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if text.count(old) != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {text.count(old)}")
              return text.replace(old, new, 1)

          # 1) OAuth becomes protocol/access only; Family content is injected.
          p = Path('src/v6/family-oauth.ts')
          s = p.read_text()
          s = replace_once(s, 'import { FamilyMCP } from "./family-mcp";\n', '', 'remove FamilyMCP import')
          s = replace_once(s, '    FAMILY_MCP_OBJECT: DurableObjectNamespace<FamilyMCP>;\n', '', 'remove FamilyMCP Env coupling')
          s = replace_once(
              s,
              'export function createFamilyOAuthProvider(appHandler: ConcreteFetchHandler) {',
              'export function createFamilyOAuthProvider(\n  appHandler: ConcreteFetchHandler,\n  familyContentHandler: ConcreteFetchHandler,\n) {',
              'inject Family content handler',
          )
          old_family_serve = '''      try {
                return await FamilyMCP.serve("/family-mcp", { binding: "FAMILY_MCP_OBJECT" }).fetch(request, env, ctx);
              } catch (error) {
                const message = error instanceof Error ? error.message : String(error);
                if (message.includes("FAMILY_MCP_OBJECT") && message.includes("binding")) {
                  return Response.json({
                    error: "family_mcp_binding_missing",
                    message: "FAMILY_MCP_OBJECT is required; refusing to fall back to the full MCP_OBJECT namespace.",
                  }, { status: 503 });
                }
                throw error;
              }'''
          s = replace_once(
              s,
              old_family_serve,
              '      return familyContentHandler.fetch(request, env, ctx);',
              'delegate authorized Family request to content handler',
          )
          p.write_text(s)

          # 2) index-v6 becomes a composition root that knows one broker only.
          p = Path('src/index-v6.ts')
          s = p.read_text()
          old_imports = '''import { createFamilyOAuthProvider } from "./v6/family-oauth";
          import { createFamilyOAuthLegacyEndpointWrapper } from "./v6/family-oauth-legacy-endpoints";
          import { createFamilyOAuthPublicClientCompatWrapper } from "./v6/family-oauth-public-client-compat";
          import { createFamilyOAuthTokenRecoveryWrapper } from "./v6/family-oauth-token-recovery";'''.replace('          ', '')
          new_imports = '''import { familyContentHandler } from "./v6/family-content-handler";
          import { createMcpAccessBroker } from "./v6/mcp-access-broker";'''.replace('          ', '')
          s = replace_once(s, old_imports, new_imports, 'replace direct OAuth shim imports')
          old_comp = '''const familyOAuthProvider = createFamilyOAuthLegacyEndpointWrapper(
            createFamilyOAuthPublicClientCompatWrapper(
              createFamilyOAuthTokenRecoveryWrapper(createFamilyOAuthProvider(appHandler)),
            ),
          );'''.replace('          ', '')
          s = replace_once(
              s,
              old_comp,
              'const mcpAccessBroker = createMcpAccessBroker(appHandler, familyContentHandler);',
              'compose one access broker',
          )
          s = replace_once(
              s,
              '    return familyOAuthProvider.fetch(request, env, ctx);',
              '    return mcpAccessBroker.fetch(request, env, ctx);',
              'route through access broker',
          )
          p.write_text(s)

          # 3) Move source-contract assertions to the new layer locations.
          p = Path('tests/family-oauth-contract.test.ts')
          s = p.read_text()
          s = replace_once(
              s,
              'const oauth = read("src/v6/family-oauth.ts");\n',
              'const oauth = read("src/v6/family-oauth.ts");\nconst familyContent = read("src/v6/family-content-handler.ts");\nconst broker = read("src/v6/mcp-access-broker.ts");\n',
              'family oauth test source handles',
          )
          s = replace_once(
              s,
              'assert.match(oauth, /FamilyMCP\\.serve\\("\\/family-mcp", \\{ binding: "FAMILY_MCP_OBJECT" \\}\\)/);\nassert.match(oauth, /refusing to fall back to the full MCP_OBJECT namespace/);',
              'assert.match(oauth, /familyContentHandler\\.fetch\\(request, env, ctx\\)/);\nassert.match(familyContent, /FamilyMCP\\.serve\\("\\/family-mcp", \\{ binding: "FAMILY_MCP_OBJECT" \\}\\)/);\nassert.match(familyContent, /refusing to fall back to the full MCP_OBJECT namespace/);',
              'move Family content runtime assertions',
          )
          s = replace_once(
              s,
              'assert.match(indexV6, /createFamilyOAuthTokenRecoveryWrapper/);\nassert.match(indexV6, /createFamilyOAuthTokenRecoveryWrapper\\(createFamilyOAuthProvider\\(appHandler\\)\\)/);',
              'assert.doesNotMatch(indexV6, /family-oauth-token-recovery/);\nassert.match(broker, /createFamilyOAuthTokenRecoveryWrapper/);\nassert.match(broker, /createFamilyOAuthProvider\\(appHandler, familyContentHandler\\)/);',
              'move OAuth composition assertions to broker',
          )
          p.write_text(s)

          p = Path('tests/family-mcp-isolation.test.ts')
          s = p.read_text()
          s = replace_once(
              s,
              'const oauth = read("src/v6/family-oauth.ts");\n',
              'const oauth = read("src/v6/family-oauth.ts");\nconst familyContent = read("src/v6/family-content-handler.ts");\n',
              'family isolation source handle',
          )
          s = replace_once(
              s,
              'assert.match(oauth, /FamilyMCP\\.serve\\("\\/family-mcp", \\{ binding: "FAMILY_MCP_OBJECT" \\}\\)/);\nassert.match(oauth, /family_mcp_binding_missing/);\nassert.match(oauth, /refusing to fall back to the full MCP_OBJECT namespace/);',
              'assert.match(familyContent, /FamilyMCP\\.serve\\("\\/family-mcp", \\{ binding: "FAMILY_MCP_OBJECT" \\}\\)/);\nassert.match(familyContent, /family_mcp_binding_missing/);\nassert.match(familyContent, /refusing to fall back to the full MCP_OBJECT namespace/);',
              'move Family binding assertions',
          )
          s = replace_once(
              s,
              'assert.match(index, /createFamilyOAuthProvider\\(appHandler\\)/);',
              'assert.match(index, /createMcpAccessBroker\\(appHandler, familyContentHandler\\)/);',
              'assert broker composition',
          )
          p.write_text(s)

          p = Path('tests/public-ingress-freeze.test.ts')
          s = p.read_text()
          s = replace_once(
              s,
              'const familyOAuth = read("src/v6/family-oauth.ts");',
              'const familyContent = read("src/v6/family-content-handler.ts");',
              'public ingress source handle',
          )
          s = replace_once(
              s,
              'assert.match(familyOAuth, /FamilyMCP\\.serve\\("\\/family-mcp"/);',
              'assert.match(familyContent, /FamilyMCP\\.serve\\("\\/family-mcp"/);',
              'public ingress Family content assertion',
          )
          p.write_text(s)

          # New architecture files must not know each other's forbidden details.
          broker = Path('src/v6/mcp-access-broker.ts').read_text()
          if 'family-mcp' in broker or 'shared-stock-market-context-tools' in broker:
              raise SystemExit('broker imported content implementation')
          content = Path('src/v6/family-content-handler.ts').read_text()
          if 'workers-oauth-provider' in content or 'code_challenge' in content or 'redirect_uri' in content:
              raise SystemExit('Family content handler leaked OAuth protocol details')
          PY

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run type-check

      - name: Full regression
        run: npm run test:research

      - name: Wrangler dry-run
        run: npx wrangler deploy --dry-run --outdir dist

      - name: Commit only validated refactor
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist .github/workflows/ops-mcp-relay-refactor-once.yml
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index-v6.ts src/v6/family-oauth.ts src/v6/family-content-handler.ts src/v6/mcp-access-broker.ts tests/family-oauth-contract.test.ts tests/family-mcp-isolation.test.ts tests/public-ingress-freeze.test.ts tests/mcp-relay-separation.test.ts package.json .github/workflows/ops-mcp-relay-refactor-once.yml
          git commit -m "Refactor MCP access relay without content changes"
          git push origin HEAD:test/mcp-relay-separation-red-20260827
