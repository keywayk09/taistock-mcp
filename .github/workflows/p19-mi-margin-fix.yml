name: P19 MI_MARGN Positional Parser Fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p19-mi-margin-fix.yml'

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.head_ref == 'p19/mi-margin-positional-fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p19/mi-margin-positional-fix
          fetch-depth: 1
      - name: Apply MI_MARGN positional parser and fixture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          p=Path('src/v6/tw-market-data.ts')
          s=p.read_text()
          old='''export function normalizeTwseMargin(body: unknown, requestedDate: string): MarginRow[] {
  const root = rec(body);
  const rows = findTwseMarginTable(body);
  const tradeDate = normalizeTradeDate(root.date) ?? requestedDate;
  return rows.map((row) => normalizeMarginRow(row, "listed", tradeDate, "TWSE_MI_MARGN")).filter((x): x is MarginRow => Boolean(x));
}'''
          new='''export function normalizeTwseMargin(body: unknown, requestedDate: string): MarginRow[] {
  const root = rec(body);
  const tradeDate = normalizeTradeDate(root.date) ?? requestedDate;
  if (Array.isArray(root.tables)) {
    for (const tableValue of root.tables) {
      const table = rec(tableValue);
      if (!/融資融券彙總/.test(String(table.title ?? "")) || !Array.isArray(table.fields) || !Array.isArray(table.data)) continue;
      const keys = table.fields.map((field: unknown) => normalizeKey(String(field)));
      const codeAliases = ["代號", "證券代號", "股票代號"].map(normalizeKey);
      const nameAliases = ["名稱", "證券名稱", "股票名稱"].map(normalizeKey);
      const codeIndex = keys.findIndex((key: string) => codeAliases.includes(key));
      const nameIndex = keys.findIndex((key: string) => nameAliases.includes(key));
      const previousIndexes = keys.map((key: string, index: number) => key.includes(normalizeKey("前日餘額")) ? index : -1).filter((index: number) => index >= 0);
      const todayIndexes = keys.map((key: string, index: number) => key.includes(normalizeKey("今日餘額")) ? index : -1).filter((index: number) => index >= 0);
      if (codeIndex < 0 || previousIndexes.length < 2 || todayIndexes.length < 2) continue;
      return table.data.filter(Array.isArray).map((values: any[]): MarginRow | null => {
        const symbol = String(values[codeIndex] ?? "").trim().replace(/\\s/g, "");
        if (!/^\\d{4,6}$/.test(symbol)) return null;
        const marginPrev = nullableMarketNumber(values[previousIndexes[0]]);
        const marginNow = nullableMarketNumber(values[todayIndexes[0]]);
        const shortPrev = nullableMarketNumber(values[previousIndexes[1]]);
        const shortNow = nullableMarketNumber(values[todayIndexes[1]]);
        return {
          trade_date: tradeDate,
          symbol,
          name: nameIndex >= 0 ? String(values[nameIndex] ?? "").trim() : "",
          market: "listed",
          margin_previous_balance_lots: marginPrev,
          margin_balance_lots: marginNow,
          margin_balance_change_lots: marginNow !== null && marginPrev !== null ? marginNow - marginPrev : null,
          short_previous_balance_lots: shortPrev,
          short_balance_lots: shortNow,
          short_balance_change_lots: shortNow !== null && shortPrev !== null ? shortNow - shortPrev : null,
          source: "TWSE_MI_MARGN",
          source_priority: "OFFICIAL",
        };
      }).filter((x): x is MarginRow => Boolean(x));
    }
  }
  const rows = findTwseMarginTable(body);
  return rows.map((row) => normalizeMarginRow(row, "listed", tradeDate, "TWSE_MI_MARGN")).filter((x): x is MarginRow => Boolean(x));
}'''
          if old not in s:
            raise SystemExit('normalizeTwseMargin source block not found')
          p.write_text(s.replace(old,new,1))

          Path('tests/twse-mi-margin-positional.test.ts').write_text(r'''import assert from "node:assert/strict";
import { normalizeTwseMargin } from "../src/v6/tw-market-data.ts";

const body = {
  stat: "OK",
  date: "20260819",
  tables: [
    {
      title: "115年08月19日 信用交易統計",
      fields: ["項目", "買進", "賣出", "現金(券)償還", "前日餘額", "今日餘額"],
      data: [["融資(交易單位)", "303,949", "284,455", "6,465", "8,815,336", "8,828,365"]],
    },
    {
      title: "115年08月19日 融資融券彙總 (全部)",
      fields: [
        "代號", "名稱",
        "買進", "賣出", "現金償還", "前日餘額", "今日餘額", "次一營業日限額",
        "買進", "賣出", "現券償還", "前日餘額", "今日餘額", "次一營業日限額",
        "資券互抵", "註記",
      ],
      data: [
        ["00400A", "主動國泰動能高息", "833", "180", "0", "8,150", "8,803", "491,910", "12", "0", "0", "32", "20", "491,910", "12", " "],
        ["2330", "台積電", "100", "80", "1", "1,000", "1,019", "500,000", "5", "2", "0", "30", "33", "500,000", "1", ""],
      ],
    },
  ],
};

const rows = normalizeTwseMargin(body, "2026-08-19");
assert.equal(rows.length, 1);
assert.deepEqual(rows[0], {
  trade_date: "2026-08-19",
  symbol: "2330",
  name: "台積電",
  market: "listed",
  margin_previous_balance_lots: 1000,
  margin_balance_lots: 1019,
  margin_balance_change_lots: 19,
  short_previous_balance_lots: 30,
  short_balance_lots: 33,
  short_balance_change_lots: 3,
  source: "TWSE_MI_MARGN",
  source_priority: "OFFICIAL",
});
console.log("TWSE MI_MARGN positional parser: ok");
''')

          pkg=Path('package.json')
          obj=json.loads(pkg.read_text())
          current=obj['scripts']['test:market-data']
          probe='node --experimental-strip-types tests/twse-mi-margin-positional.test.ts'
          if probe not in current:
            obj['scripts']['test:market-data']=current + ' && ' + probe
          pkg.write_text(json.dumps(obj,ensure_ascii=False,indent='\t')+'\n')

          Path('.github/workflows/p19-mi-margin-fix.yml').unlink()
          PY

          npm install
          npm run type-check
          npm run test:market-data
          git status --short
          git config user.name 'p19-mi-margin-fix-bot'
          git config user.email 'p19-mi-margin-fix-bot@users.noreply.github.com'
          git add -A
          git commit -m 'P19: fix TWSE MI_MARGN repeated-field parser'
          git push origin HEAD:p19/mi-margin-positional-fix
