name: Patch TPEx Cloudflare transport

on:
  push:
    branches:
      - fix/tpex-cloudflare-direct-transport
    paths:
      - '.github/workflows/patch-tpex-cloudflare-transport.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tpex-cloudflare-direct-transport
          fetch-depth: 0
      - name: Route TPEx calls through browser-compatible transport
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/v6/market-data-cloudflare-chunked-runner.ts')
          s = p.read_text()
          marker = 'import { normalizeTwseMiMargnOfficial } from "./twse-mi-margin-official";'
          replacement = marker + '\nimport { getTpexJson } from "./tpex-cloudflare-transport";'
          if 'getTpexJson' not in s:
              if marker not in s: raise SystemExit('import marker missing')
              s = s.replace(marker, replacement, 1)
          replacements = {
            'getJson("https://www.tpex.org.tw/openapi/v1/tpex_3insti_daily_trading", "TPEX_3INSTI")': 'getTpexJson("https://www.tpex.org.tw/openapi/v1/tpex_3insti_daily_trading", "TPEX_3INSTI")',
            'getJson("https://www.tpex.org.tw/openapi/v1/tpex_mainboard_margin_balance", "TPEX_MARGIN")': 'getTpexJson("https://www.tpex.org.tw/openapi/v1/tpex_mainboard_margin_balance", "TPEX_MARGIN")',
            'getJson("https://www.tpex.org.tw/openapi/v1/tpex_margin_sbl", "TPEX_MARGIN_SBL")': 'getTpexJson("https://www.tpex.org.tw/openapi/v1/tpex_margin_sbl", "TPEX_MARGIN_SBL")',
            'getJson("https://www.tpex.org.tw/openapi/v1/tpex_short_sell", "TPEX_SHORT_SELL")': 'getTpexJson("https://www.tpex.org.tw/openapi/v1/tpex_short_sell", "TPEX_SHORT_SELL")',
          }
          for old, new in replacements.items():
              if old in s: s = s.replace(old, new)
              elif new not in s: raise SystemExit(f'missing call: {old}')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/v6/market-data-cloudflare-chunked-runner.ts
          git commit -m 'fix(tpex): route Cloudflare fetches through browser transport' || exit 0
          git push origin HEAD:fix/tpex-cloudflare-direct-transport
