name: Automation Research Bridge Preflight 20260830

on:
  push:
    branches:
      - test/automation-research-bridge-preflight-20260830

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run type-check

      - name: Existing Formal Blind contract
        run: npm run test:formal-blind-ohlc

      - name: Existing Market Cross Section contract
        run: node --experimental-strip-types tests/market-data-cross-section.test.ts

      - name: Weekday and weekend automation preflight
        run: node --experimental-strip-types tests/automation-research-bridge-preflight.test.ts

      - name: Production Formal Blind canary
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --max-time 30 \
            'https://taistock-mcp.keywayk09.workers.dev/health/formal-blind')"
          BODY="$body" node - <<'NODE'
          const body = JSON.parse(process.env.BODY || '{}');
          if (body.status !== 'ok') throw new Error(`formal blind canary status=${body.status}`);
          if (body.formal_blind_eligible !== true) throw new Error('formal_blind_eligible must be true');
          if (body.formal_research_eligible !== true) throw new Error('formal_research_eligible must be true');
          if (body.scorecard_eligible !== true) throw new Error('scorecard_eligible must be true');
          if (body.cutoff?.leakage_validated !== true) throw new Error('leakage_validated must be true');
          if (body.cutoff?.prefix_completeness !== true) throw new Error('prefix_completeness must be true');
          if (body.canonical_verification?.verification?.accepted_for_research !== true) throw new Error('official verification must be accepted');
          console.log('PRODUCTION_FORMAL_BLIND_CANARY_PASS');
          NODE

      - name: Production service health
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --max-time 30 \
            'https://taistock-mcp.keywayk09.workers.dev/health')"
          BODY="$body" node - <<'NODE'
          const body = JSON.parse(process.env.BODY || '{}');
          if (body.status !== 'ok') throw new Error(`service status=${body.status}`);
          if (body.market_data?.formal_blind_canary_endpoint !== '/health/formal-blind') throw new Error('formal blind canary endpoint missing');
          if (body.market_data?.full_market_status_endpoint !== '/health/full-market') throw new Error('full market endpoint missing');
          console.log('PRODUCTION_RESEARCH_SURFACE_PASS');
          NODE
