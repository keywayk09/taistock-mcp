name: Worker auth secret presence diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect secret names only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          curl --fail --silent --show-error --max-time 30 \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/taistock-mcp/secrets" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' > /tmp/secrets.json
          python - <<'PY'
          import json
          from pathlib import Path
          body=json.loads(Path('/tmp/secrets.json').read_text())
          if not body.get('success'):
              raise SystemExit('secret_list_failed')
          names={str(x.get('name') or '') for x in (body.get('result') or [])}
          for name in ['OWNER_OAUTH_LOGIN_SECRET','MCP_API_KEY','FAMILY_OAUTH_LOGIN_SECRET','MOM_GPT_API_KEY']:
              print(f'{name}_configured={str(name in names).lower()}')
          PY
