name: Probe TPEx Market Data V1 schemas

on:
  push:
    branches:
      - feature/diamond-market-data-v1
    paths:
      - .github/workflows/probe-tpex-market-data-v1.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/diamond-market-data-v1
      - name: Probe official TPEx schemas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/diamond-market-data-validation
          curl -fsSL --retry 3 'https://www.tpex.org.tw/openapi/v1/tpex_3insti_daily_trading' -o /tmp/tpex_inst.json
          curl -fsSL --retry 3 'https://www.tpex.org.tw/openapi/v1/tpex_mainboard_margin_balance' -o /tmp/tpex_margin.json
          python - <<'PY'
          import json
          from pathlib import Path
          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8-sig'))
          def probe(name, payload):
              rows = payload if isinstance(payload, list) else payload.get('data', []) if isinstance(payload, dict) else []
              first = rows[0] if rows and isinstance(rows[0], dict) else {}
              dates = []
              for r in rows[:100]:
                  if not isinstance(r, dict):
                      continue
                  for k in ('Date','date','資料日期','日期'):
                      if k in r and str(r[k]).strip():
                          dates.append(str(r[k]).strip())
                          break
              return {
                  'name': name,
                  'row_count': len(rows),
                  'first_row_keys': list(first.keys()),
                  'date_values_first_100': sorted(set(dates)),
                  'first_row': first,
              }
          output = {
              'source': 'official TPEx OpenAPI live probe',
              'institutional': probe('tpex_3insti_daily_trading', load('/tmp/tpex_inst.json')),
              'margin': probe('tpex_mainboard_margin_balance', load('/tmp/tpex_margin.json')),
          }
          Path('tmp/diamond-market-data-validation/tpex-live-schema.json').write_text(
              json.dumps(output, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print(json.dumps(output, ensure_ascii=False, indent=2))
          PY
          rm .github/workflows/probe-tpex-market-data-v1.yml
      - name: Commit probe summary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/diamond-market-data-validation/tpex-live-schema.json .github/workflows/probe-tpex-market-data-v1.yml
          git commit -m 'test: probe live TPEx market-data schemas'
          git push origin HEAD:feature/diamond-market-data-v1
