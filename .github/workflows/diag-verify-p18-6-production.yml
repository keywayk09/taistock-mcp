name: Verify P18.6 Production Backfill

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Snapshot 8/19 production status
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 10 --max-time 30 'https://taistock-mcp.keywayk09.workers.dev/health'
          echo
          curl -fsS --connect-timeout 10 --max-time 30 'https://taistock-mcp.keywayk09.workers.dev/market-data/status?trade_date=2026-08-19'
          echo
