name: Crypto MTF RR Split Stability

on:
  push:
    branches: [research/crypto-mtf-rr-20260830]
    paths:
      - '.github/workflows/crypto-mtf-rr-probe.yml'
      - 'research/crypto_mtf_rr_backtest.py'
      - 'research/crypto_mtf_rr_splitcheck.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Run 30d two-half stability check
        run: python research/crypto_mtf_rr_splitcheck.py
      - name: Upload split report
        uses: actions/upload-artifact@v4
        with:
          name: crypto-mtf-rr-splitcheck
          path: /tmp/crypto_mtf_rr_splitcheck.json
          retention-days: 3
