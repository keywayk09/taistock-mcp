name: Crypto MTF RR Research

on:
  push:
    branches: [research/crypto-mtf-rr-20260830]
    paths:
      - '.github/workflows/crypto-mtf-rr-probe.yml'
      - 'research/crypto_mtf_rr_backtest.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Run Gate historical MTF risk-reward backtest
        run: python research/crypto_mtf_rr_backtest.py
      - name: Upload research report
        uses: actions/upload-artifact@v4
        with:
          name: crypto-mtf-rr-report
          path: /tmp/crypto_mtf_rr_report.json
          retention-days: 3
