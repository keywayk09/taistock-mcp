name: Check 2026-08-06 margin data
on:
  push:
    paths:
      - .github/workflows/check-margin-20260806.yml
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch margin data
        run: |
          python - <<'PY'
          import requests, json, os
          out={}
          urls={
            'twse':'https://www.twse.com.tw/rwd/zh/marginTrading/MI_MARGN?date=20260806&selectType=ALL&response=json',
            'tpex':'https://www.tpex.org.tw/www/zh-tw/margin/balance?date=2026/08/06&id=&response=json'
          }
          for k,u in urls.items():
            r=requests.get(u,timeout=30,headers={'User-Agent':'Mozilla/5.0'})
            out[k]={'status':r.status_code,'text':r.text[:500000]}
          os.makedirs('tmp',exist_ok=True)
          open('tmp/margin-20260806.json','w').write(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit result
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add tmp/margin-20260806.json
          git commit -m 'chore: refresh 2026-08-06 margin data' || exit 0
          git push
