name: P16 GPT Judgment Memory

on:
  pull_request:
    paths:
      - 'src/v6/gpt-judgment-memory.ts'
      - 'src/v6/gpt-judgment-memory-tools.ts'
      - 'src/v6/diamond-capability-p16.ts'
      - 'src/v6/diamond-capability-tools.ts'
      - 'src/v6/research-tools.ts'
      - 'src/index-v6.ts'
      - 'tests/gpt-judgment-memory.test.ts'
      - 'migrations/0005_gpt_judgment_memory.sql'
      - 'package.json'
      - '.github/workflows/p16-gpt-judgment-memory.yml'
  push:
    branches: [main]
    paths:
      - 'src/v6/gpt-judgment-memory.ts'
      - 'src/v6/gpt-judgment-memory-tools.ts'
      - 'src/v6/diamond-capability-p16.ts'
      - 'src/v6/diamond-capability-tools.ts'
      - 'src/v6/research-tools.ts'
      - 'src/index-v6.ts'
      - 'tests/gpt-judgment-memory.test.ts'
      - 'migrations/0005_gpt_judgment_memory.sql'
      - 'package.json'

permissions:
  contents: read

jobs:
  verify-p16:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run type-check
      - run: npm run test:judgment-memory
      - run: npm run test:research
      - run: npx wrangler deploy --dry-run --outdir dist-p16
