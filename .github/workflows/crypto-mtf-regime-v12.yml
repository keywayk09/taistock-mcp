name: Crypto MTF Regime V12

on:
  push:
    branches: [research/crypto-mtf-rr-20260830]
    paths:
      - '.github/workflows/crypto-mtf-regime-v12.yml'
      - 'research/crypto_mtf_regime_v12.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run 60d market-regime holdout
        run: python research/crypto_mtf_regime_v12.py
      - name: Upload regime report
        uses: actions/upload-artifact@v4
        with:
          name: crypto-mtf-regime-v12
          path: /tmp/crypto_mtf_regime_v12.json
          retention-days: 3
