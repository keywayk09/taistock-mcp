name: Diagnose Cloudflare Market Data Runtime V2

on:
  push:
    branches:
      - diag/cloudflare-market-data-runtime
    paths:
      - '.github/workflows/diagnose-cloudflare-market-data-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Capture safe live diagnostics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set +e
          mkdir -p tmp/diagnostics
          npx wrangler secret list > /tmp/secrets.txt 2>&1
          if grep -q 'GITHUB_DATA_TOKEN' /tmp/secrets.txt; then has_github_data_token=true; else has_github_data_token=false; fi
          if grep -q 'GITHUB_TOKEN' /tmp/secrets.txt; then has_github_token=true; else has_github_token=false; fi

          curl -L -sS --max-time 30 -o /tmp/health.json -w '%{http_code}' 'https://taistock-mcp.keywayk09.workers.dev/health' > /tmp/health.status
          curl -L -sS --max-time 30 -o /tmp/status19.json -w '%{http_code}' 'https://taistock-mcp.keywayk09.workers.dev/market-data/status?trade_date=2026-08-19' > /tmp/status19.http
          curl -L -sS --max-time 30 -o /tmp/status20.json -w '%{http_code}' 'https://taistock-mcp.keywayk09.workers.dev/market-data/status?trade_date=2026-08-20' > /tmp/status20.http
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/taistock-mcp/schedules"
          curl -sS --max-time 30 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "$endpoint" > /tmp/schedules.json

          HAS_GITHUB_DATA_TOKEN=$has_github_data_token HAS_GITHUB_TOKEN=$has_github_token python - <<'PY'
          import json, os
          from pathlib import Path
          def load(path):
              try: return json.loads(Path(path).read_text())
              except Exception: return {}
          def txt(path):
              try: return Path(path).read_text().strip()
              except Exception: return ''
          h=load('/tmp/health.json'); s19=load('/tmp/status19.json'); s20=load('/tmp/status20.json'); sc=load('/tmp/schedules.json')
          result=sc.get('result') if isinstance(sc,dict) else {}
          schedules=result.get('schedules',[]) if isinstance(result,dict) else []
          out={
            'health_http': txt('/tmp/health.status'),
            'capture_owner': (h.get('market_data') or {}).get('capture_owner') if isinstance(h,dict) else None,
            'execution_policy': (h.get('market_data') or {}).get('execution_policy') if isinstance(h,dict) else None,
            'github_store_health': (h.get('storage') or {}).get('github') if isinstance(h,dict) else None,
            'github_data_token_configured': os.environ['HAS_GITHUB_DATA_TOKEN']=='true',
            'github_token_configured': os.environ['HAS_GITHUB_TOKEN']=='true',
            'cron_schedules': [x.get('cron') for x in schedules if isinstance(x,dict)],
            'cron_api_success': bool(sc.get('success')) if isinstance(sc,dict) else False,
            'status_2026_08_19_http': txt('/tmp/status19.http'),
            'status_2026_08_19': s19,
            'status_2026_08_20_http': txt('/tmp/status20.http'),
            'status_2026_08_20': s20,
          }
          Path('tmp/diagnostics/cloudflare-market-data-runtime-v2.json').write_text(json.dumps(out,indent=2)+'\n')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/diagnostics/cloudflare-market-data-runtime-v2.json
          git commit -m 'diag: record live market-data runtime v2' || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
