name: GitHub Large Contents RED

on:
  push:
    branches:
      - test/github-large-contents-read-red-20260902
    paths:
      - tests/github-data-store-large-contents.test.ts
      - .github/workflows/github-large-contents-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Reproduce large Contents API read
        run: node --experimental-strip-types tests/github-data-store-large-contents.test.ts
