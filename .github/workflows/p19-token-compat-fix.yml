name: P19 Token Compatibility Fix

on:
  push:
    branches: [p19/github-only-storage]
    paths:
      - '.github/workflows/p19-token-compat-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p19/github-only-storage
          fetch-depth: 1
      - name: Apply token compatibility and TypeScript fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path('src/v6/github-data-store.ts')
          text = path.read_text()
          replacements = [
              (
                  '    GITHUB_DATA_TOKEN?: string;\n',
                  '    GITHUB_DATA_TOKEN?: string;\n    GITHUB_TOKEN?: string;\n',
              ),
              (
                  '    token: String(env.GITHUB_DATA_TOKEN || "").trim(),',
                  '    token: String(env.GITHUB_DATA_TOKEN || env.GITHUB_TOKEN || "").trim(),',
              ),
              (
                  '      "GITHUB_DATA_TOKEN is required for GitHub canonical-data writes",',
                  '      "GITHUB_DATA_TOKEN or GITHUB_TOKEN is required for GitHub canonical-data writes",',
              ),
              (
                  '  return records.filter((value): value is T => value !== null);',
                  '  return records.filter((value) => value !== null) as T[];',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'expected source fragment missing: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)

          test = Path('tests/github-data-store-token.test.ts')
          test.write_text(r'''import assert from "node:assert/strict";
import { updateGitHubJson } from "../src/v6/github-data-store.ts";

const originalFetch = globalThis.fetch;
const calls: Array<{ method: string; authorization: string | null }> = [];

globalThis.fetch = async (_input: RequestInfo | URL, init?: RequestInit) => {
  const method = String(init?.method || "GET").toUpperCase();
  const headers = new Headers(init?.headers);
  calls.push({ method, authorization: headers.get("Authorization") });
  if (method === "GET") {
    return new Response(JSON.stringify({ message: "Not Found" }), {
      status: 404,
      headers: { "content-type": "application/json" },
    });
  }
  if (method === "PUT") {
    return new Response(JSON.stringify({ content: { sha: "test-sha" } }), {
      status: 201,
      headers: { "content-type": "application/json" },
    });
  }
  throw new Error(`unexpected method ${method}`);
};

try {
  const env = {
    GITHUB_TOKEN: "existing-cloudflare-token",
    GITHUB_DATA_REPO: "keywayk09/taistock-mcp",
    GITHUB_DATA_BRANCH: "diamond-data",
  } as unknown as Env;

  const result = await updateGitHubJson(env, {
    path: "data/tests/token-fallback.json",
    defaultValue: { value: 0 },
    message: "test token fallback",
    merge: () => ({ value: 1 }),
  });

  assert.equal(result.ok, true);
  const put = calls.find((call) => call.method === "PUT");
  assert.equal(put?.authorization, "Bearer existing-cloudflare-token");
  console.log("github-data-store token fallback: ok");
} finally {
  globalThis.fetch = originalFetch;
}
''')

          pkg_path = Path('package.json')
          pkg = json.loads(pkg_path.read_text())
          scripts = pkg['scripts']
          scripts['test:github-store'] = 'node --experimental-strip-types tests/github-data-store-token.test.ts'
          marker = ' && npm run test:no-r2'
          research = scripts['test:research']
          if 'npm run test:github-store' not in research:
              if marker not in research:
                  raise SystemExit('test:research marker missing')
              research = research.replace(marker, ' && npm run test:github-store' + marker)
          scripts['test:research'] = research
          pkg_path.write_text(json.dumps(pkg, ensure_ascii=False, indent='\t') + '\n')

          workflow = Path('.github/workflows/p19-token-compat-fix.yml')
          workflow.unlink()
          PY
          npm install
          npm run type-check
          npm run test:github-store
          git status --short
          git config user.name 'p19-token-compat-bot'
          git config user.email 'p19-token-compat-bot@users.noreply.github.com'
          git add -A
          git commit -m 'P19: reuse existing GITHUB_TOKEN for canonical writes'
          git push origin HEAD:p19/github-only-storage
