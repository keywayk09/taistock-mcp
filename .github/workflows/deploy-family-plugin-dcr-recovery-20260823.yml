name: Deploy Family Plugin DCR Recovery 20260823

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy-and-live-smoke:
    if: github.head_ref == 'ops/deploy-family-plugin-dcr-recovery-20260823'
    runs-on: ubuntu-latest
    env:
      PROD_URL: https://taistock-mcp.keywayk09.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      - name: Resolve existing Production OAuth KV
        id: oauth_kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces"
          curl -fsS "${endpoint}?per_page=1000" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" > /tmp/kv.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          body=json.load(open('/tmp/kv.json'))
          rows=[x for x in body.get('result',[]) if x.get('title')=='taistock-mcp-OAUTH_KV']
          if len(rows)!=1: raise SystemExit(f'expected_exactly_one_production_oauth_kv:{len(rows)}')
          kv_id=str(rows[0].get('id') or '')
          if len(kv_id)!=32: raise SystemExit('invalid_oauth_kv_id')
          print(f'id={kv_id}')
          PY

      - name: Confirm Mom real DCR client is still missing before user proof
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OAUTH_KV_ID: ${{ steps.oauth_kv.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          encoded="$(python - <<'PY'
          import urllib.parse
          print(urllib.parse.quote('client:41i_gRq63zL6r2tO',safe=''))
          PY
          )"
          url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${OAUTH_KV_ID}/values/${encoded}"
          code="$(curl -sS -o /tmp/mom-client -w '%{http_code}' "$url" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          echo "MOM_DCR_PREDEPLOY_HTTP=${code}"
          test "$code" = '404'
          echo 'MOM_DCR_STILL_MISSING_UNTIL_USER_PROOF=PASS'

      - name: Build Production config
        env:
          OAUTH_KV_ID: ${{ steps.oauth_kv.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          cp wrangler.jsonc wrangler.force-production.jsonc
          python - <<'PY'
          import os,re
          from pathlib import Path
          p=Path('wrangler.force-production.jsonc')
          text=p.read_text(); kv=os.environ['OAUTH_KV_ID']
          pattern=r'("binding"\s*:\s*"OAUTH_KV")(\s*)(\})'
          out,n=re.subn(pattern,lambda m:m.group(1)+',\n\t\t\t"id": "'+kv+'"'+m.group(2)+m.group(3),text,count=1)
          if n!=1: raise SystemExit('oauth_kv_binding_injection_failed')
          p.write_text(out)
          PY

      - name: Deploy merged Plugin DCR recovery to Production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.force-production.jsonc

      - name: Verify Production Cron
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/taistock-mcp/schedules"
          curl -fsS -X PUT "$endpoint" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' --data '[{"cron":"*/5 * * * *"}]' >/tmp/cron-put.json
          curl -fsS "$endpoint" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" >/tmp/cron-get.json
          python - <<'PY'
          import json
          put=json.load(open('/tmp/cron-put.json')); get=json.load(open('/tmp/cron-get.json'))
          if not put.get('success'): raise SystemExit('cron_put_failed')
          crons=[x.get('cron') for x in ((get.get('result') or {}).get('schedules') or []) if isinstance(x,dict)]
          if '*/5 * * * *' not in crons: raise SystemExit(f'cron_verify_failed:{crons}')
          print('PRODUCTION_CRON=PASS')
          PY

      - name: Production health smoke
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-delay 2 --max-time 30 -fsS "$PROD_URL/health" >/tmp/health.json
          python - <<'PY'
          import json
          body=json.load(open('/tmp/health.json'))
          text=json.dumps(body,ensure_ascii=False)
          if 'SAME_RESEARCH_BRAIN_DIFFERENT_PERMISSIONS' not in text: raise SystemExit('family_v3_health_marker_missing')
          print('PRODUCTION_HEALTH=PASS')
          PY

      - name: Production missing Plugin DCR client recovery smoke
        shell: bash
        run: |
          set -euo pipefail
          auth_url="$(python - <<'PY'
          import base64,hashlib,os,urllib.parse
          verifier='prod-plugin-dcr-smoke-'+'c'*48
          challenge=base64.urlsafe_b64encode(hashlib.sha256(verifier.encode()).digest()).rstrip(b'=').decode()
          params={
            'response_type':'code',
            'client_id':'pluginProdMissingDcrSmoke20260823',
            'redirect_uri':'https://chatgpt.com/connector/oauth/familyplugindcrprod20260823',
            'state':'prod-plugin-dcr-smoke-state',
            'code_challenge':challenge,
            'code_challenge_method':'S256',
            'resource':os.environ['PROD_URL']+'/family-mcp',
          }
          print(os.environ['PROD_URL']+'/authorize?'+urllib.parse.urlencode(params))
          PY
          )"
          code="$(curl --retry 5 --retry-delay 2 --max-time 30 -sS -o /tmp/plugin.html -w '%{http_code}' "$auth_url")"
          echo "PRODUCTION_PLUGIN_DCR_HTTP=${code}"
          test "$code" = '200'
          grep -q '家人連線驗證碼' /tmp/plugin.html
          grep -q 'ChatGPT Family Plugin / MCP App' /tmp/plugin.html
          ! grep -q 'Invalid client_id' /tmp/plugin.html
          echo 'PRODUCTION_MISSING_PLUGIN_DCR_RECOVERY=PASS'

      - name: Production unsupported scope stays fail closed
        shell: bash
        run: |
          set -euo pipefail
          bad_url="$(python - <<'PY'
          import base64,hashlib,os,urllib.parse
          challenge=base64.urlsafe_b64encode(hashlib.sha256(('bad-scope-'+'d'*48).encode()).digest()).rstrip(b'=').decode()
          params={
            'response_type':'code','client_id':'pluginProdBadScope20260823',
            'redirect_uri':'https://chatgpt.com/connector/oauth/familyplugindcrprod20260823',
            'scope':'files:write','state':'bad-scope-state','code_challenge':challenge,
            'code_challenge_method':'S256','resource':os.environ['PROD_URL']+'/family-mcp'
          }
          print(os.environ['PROD_URL']+'/authorize?'+urllib.parse.urlencode(params))
          PY
          )"
          code="$(curl --max-time 30 -sS -o /tmp/bad.html -w '%{http_code}' "$bad_url")"
          echo "PRODUCTION_BAD_SCOPE_HTTP=${code}"
          test "$code" = '400'
          grep -q 'FAM-OAUTH-DIAG' /tmp/bad.html
          grep -q 'scope=unsupported' /tmp/bad.html
          ! grep -q '家人連線驗證碼' /tmp/bad.html
          echo 'PRODUCTION_PLUGIN_SCOPE_FAIL_CLOSED=PASS'
