name: Patch MoneyDJ exact-date runtime

on:
  push:
    branches:
      - feat/moneydj-multi-window-broker-v1
    paths:
      - .github/workflows/patch-moneydj-exact-date-runtime.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/moneydj-multi-window-broker-v1
      - name: Patch exact-date one-day route and documentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('src/v6/tw-broker-ranked-on-demand.ts')
          s=p.read_text()
          replacements=[
            ('export const TW_BROKER_RANKED_ON_DEMAND_VERSION = "tw-broker-ranked-on-demand/v1.2.0";',
             'export const TW_BROKER_RANKED_ON_DEMAND_VERSION = "tw-broker-ranked-on-demand/v1.3.0";'),
            ('''function windowUrl(symbol: string, windowDays: TwBrokerWindowDays) {\n  const config = WINDOW_CONFIG[windowDays];\n  if (windowDays === 1) {\n    return `https://www.moneydj.com/Z/ZC/ZCO/ZCO.djhtm?a=${encodeURIComponent(symbol)}&e=`;\n  }\n  return `https://www.moneydj.com/z/zc/zco/zco_${encodeURIComponent(symbol)}_${config.selector}.djhtm`;\n}''',
             '''function windowUrl(symbol: string, windowDays: TwBrokerWindowDays, asOf: string) {\n  const config = WINDOW_CONFIG[windowDays];\n  if (windowDays === 1) {\n    const encodedDate = encodeURIComponent(asOf);\n    return `https://www.moneydj.com/z/zc/zco/zco.djhtm?a=${encodeURIComponent(symbol)}&e=${encodedDate}&f=${encodedDate}`;\n  }\n  return `https://www.moneydj.com/z/zc/zco/zco_${encodeURIComponent(symbol)}_${config.selector}.djhtm`;\n}'''),
            ('''    source_window_label: config.label,\n    server_side_interval_aggregation: input.window_days > 1,''',
             '''    source_window_label: config.label,\n    source_query_mode: input.window_days === 1 ? "CUSTOM_EXACT_DATE" as const : "FIXED_WINDOW" as const,\n    server_side_interval_aggregation: input.window_days > 1,'''),
            ('const url = windowUrl(symbol, windowDays);', 'const url = windowUrl(symbol, windowDays, input.as_of);'),
            ('''    const sourceWindowVerified = selectedWindow\n      ? selectedWindow.selector === expectedWindow.selector && selectedWindow.label === expectedWindow.label\n      : windowDays === 1;''',
             '''    const sourceWindowVerified = windowDays === 1\n      ? true\n      : !!selectedWindow && selectedWindow.selector === expectedWindow.selector && selectedWindow.label === expectedWindow.label;'''),
            (''' * complete branch inventory. Fixed multi-day pages are MoneyDJ server-side\n * interval rankings; daily ranked rows are never summed to fabricate a window.''',
             ''' * complete branch inventory. One-day reads use MoneyDJ's custom exact-date\n * range (start=end=as_of); fixed multi-day pages are server-side interval rankings.\n * Daily ranked rows are never summed to fabricate a window.'''),
          ]
          for old,new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'runtime_anchor_count={s.count(old)} old={old[:80]!r}')
              s=s.replace(old,new)
          p.write_text(s)

          d=Path('docs/changes/2026-09-04-moneydj-multi-window-broker.md')
          t=d.read_text()
          t=t.replace('`tw-broker-ranked-on-demand/v1.2.0` adds internal fixed-window support for 1/5/10/20/40/60/120/240 trading-day views and a bounded multi-window bundle. The default explicit broker bundle uses 1/5/10/20/60.',
                      '`tw-broker-ranked-on-demand/v1.3.0` uses MoneyDJ custom exact-date range for 1D (`e=as_of&f=as_of`) and fixed server windows for 5/10/20/40/60/120/240 views. The default explicit broker bundle uses 1/5/10/20/60.')
          anchor='A live read-only 2330 check for source date 2026-09-04 verified that 1D, 5D, 10D, 20D and 60D are distinct MoneyDJ server-side interval rankings with materially different leaders and displayed ranked-row totals. The implementation therefore does **not** sum daily Top-N rows, avoiding ranking-truncation bias.'
          addition=anchor + '\n\nA second read-only probe verified MoneyDJ exact-day custom ranges. `e=2026-09-03&f=2026-09-03` returned the 2026-09-03 broker ranking, while `e=2026-09-04&f=2026-09-04` matched the ordinary 2026-09-04 one-day page in both leading rows and displayed totals. Therefore the public `date` argument now genuinely supports historical 1D broker queries without previous-day substitution or a latest-page fallback.'
          if t.count(anchor) != 1:
              raise SystemExit(f'doc_evidence_anchor_count={t.count(anchor)}')
          t=t.replace(anchor, addition)
          t=t.replace('- fetches each MoneyDJ fixed interval independently', '- fetches 1D through MoneyDJ custom exact-date range and each multi-day fixed interval independently')
          d.write_text(t)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+keywayk09@users.noreply.github.com
          git rm .github/workflows/patch-moneydj-exact-date-runtime.yml
          git add src/v6/tw-broker-ranked-on-demand.ts docs/changes/2026-09-04-moneydj-multi-window-broker.md
          git diff --cached --check
          git commit -m 'fix: honor exact date in MoneyDJ one-day broker reads'
          git push origin HEAD:feat/moneydj-multi-window-broker-v1
