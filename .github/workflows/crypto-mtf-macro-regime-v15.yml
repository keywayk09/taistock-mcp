name: Crypto MTF Macro Regime V15

on:
  push:
    branches: [research/crypto-mtf-rr-20260830]
    paths:
      - '.github/workflows/crypto-mtf-macro-regime-v15.yml'
      - 'research/crypto_mtf_macro_regime_v15.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run 60d longer-horizon macro regime holdout
        run: python research/crypto_mtf_macro_regime_v15.py
      - name: Upload macro regime report
        uses: actions/upload-artifact@v4
        with:
          name: crypto-mtf-macro-regime-v15
          path: /tmp/crypto_mtf_macro_regime_v15.json
          retention-days: 3
