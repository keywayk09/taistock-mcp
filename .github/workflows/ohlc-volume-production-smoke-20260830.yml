name: OHLC Volume Production Smoke 20260830

on:
  push:
    branches:
      - ops/fugle-control-plane-public-runner-20260829
    paths:
      - .github/workflows/ohlc-volume-production-smoke-20260830.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify production health surfaces
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const targets=[
            ['OHLC','https://tv-fugle-1d.keikei99887.workers.dev/health'],
            ['GLOBAL_FUTURES','https://tv-global-futures.keikei99887.workers.dev/health']
          ];
          for(const [name,url] of targets){
            const r=await fetch(url,{headers:{accept:'application/json','cache-control':'no-cache'},signal:AbortSignal.timeout(15000)});
            const text=await r.text();
            let body=null; try{body=JSON.parse(text)}catch{}
            if(!r.ok||!body||typeof body!=='object')throw new Error(`${name}_health_failed:${r.status}`);
            if(name==='OHLC'){
              if(String(body.liveness_version||'')!=='EDGE_DIRECT_RECOVERY_V3')throw new Error(`OHLC_liveness_mismatch:${String(body.liveness_version||'')}`);
              if(String(body?.day?.phase||'')!=='DONE')throw new Error(`OHLC_day_not_done:${String(body?.day?.phase||'')}`);
              if(Object.prototype.hasOwnProperty.call(body,'jin10_retired_secret_present'))throw new Error('OHLC_temporary_jin10_proof_present');
              console.log(`[smoke] OHLC=PASS liveness=${body.liveness_version} trade_date=${String(body?.day?.trade_date||'')} phase=${String(body?.day?.phase||'')}`);
              console.log(`[smoke] OHLC_MCP_ENTRY=${String(body.oauth_mcp_entry||'<none>')}`);
              console.log(`[smoke] OHLC_MCP_ROUTES=${JSON.stringify(body.oauth_mcp_routes||[])}`);
            }else console.log('[smoke] GLOBAL_FUTURES=PASS');
          }
          console.log('[smoke] PRODUCTION_HEALTH_PASS');
          NODE
