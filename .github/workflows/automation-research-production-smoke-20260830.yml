name: Automation Research Production Smoke 20260830

on:
  push:
    branches:
      - test/automation-research-production-smoke-20260830

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Smoke bridge health and readers
        shell: bash
        run: |
          set -euo pipefail
          base='https://taistock-mcp.keywayk09.workers.dev'

          health="$(curl --fail --silent --show-error --max-time 30 "$base/research/automation/health")"
          HEALTH="$health" node - <<'NODE'
          const body = JSON.parse(process.env.HEALTH || '{}');
          if (body.ok !== true || body.read_only !== true || body.writer_routes !== false) throw new Error('bridge health contract failed');
          console.log('BRIDGE_HEALTH_PASS');
          NODE

          blind="$(curl --fail --silent --show-error --max-time 30 "$base/research/automation/formal-blind?symbol=2426&trade_date=2026-08-27&timeframe=1m&decision_time=10:00:00")"
          BLIND="$blind" node - <<'NODE'
          const body = JSON.parse(process.env.BLIND || '{}');
          if (body.formal_blind_eligible !== true) throw new Error(`formal blind blocked: ${body.eligibility_reason}`);
          if (body.leakage_validated !== true || body.scorecard_eligible !== true) throw new Error('blind safety contract failed');
          if (!(Number(body.returned) > 1)) throw new Error(`default limit appears truncated: returned=${body.returned}`);
          console.log(`FORMAL_BLIND_DEFAULT_PASS returned=${body.returned}`);
          NODE

          latest="$(curl --fail --silent --show-error --max-time 45 "$base/research/automation/market-latest")"
          revision="$(LATEST="$latest" node - <<'NODE'
          const text = process.env.LATEST || '';
          if (!/formal_research_eligible=true/.test(text)) throw new Error('latest market is not formal');
          const match = text.match(/source_revision=([0-9a-f]{40})/i);
          if (!match) throw new Error('source revision missing');
          process.stdout.write(match[1]);
          NODE
          )"
          echo "MARKET_LATEST_PASS"

          market="$(curl --fail --silent --show-error --max-time 60 "$base/research/automation/market?as_of=2026-08-28&source_revision=$revision&prefix=2&page=1")"
          MARKET="$market" node - <<'NODE'
          const text = process.env.MARKET || '';
          if (!/formal_research_eligible=true/.test(text)) throw new Error('market page not formal');
          if (!/source_revision=/.test(text) || !/<table/.test(text)) throw new Error('market page contract incomplete');
          console.log('MARKET_PREFIX_PASS');
          NODE

          curl --fail --silent --show-error --max-time 45 \
            "$base/research/automation/ohlc-1d?symbol=2330&as_of=2026-08-28&source_revision=$revision" \
            -o /tmp/ohlc.json
          node - <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/ohlc.json', 'utf8'));
          if (body.ok !== true || body.formal_research_eligible !== true) throw new Error(`OHLC bridge blocked: ${body.error || body.reader_error}`);
          if (!(Number(body.returned) > 20)) throw new Error(`default 1d limit appears truncated: returned=${body.returned}`);
          for (const row of body.rows || []) {
            if (row.volume_raw_unit === 'lot') {
              if (Number(row.volume) !== Number(row.volume_raw) * 1000) throw new Error('legacy volume conversion mismatch');
              if (row.volume_unit !== 'share') throw new Error('legacy volume unit mismatch');
            }
          }
          console.log(`OHLC_1D_DEFAULT_PASS returned=${body.returned}`);
          NODE

          echo 'PRODUCTION_AUTOMATION_RESEARCH_BRIDGE_PASS'
