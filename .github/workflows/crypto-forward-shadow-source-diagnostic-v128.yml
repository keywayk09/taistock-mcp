name: Crypto Forward Shadow V1.2.8 Source Diagnostic

on:
  push:
    branches:
      - research/crypto-mtf-rr-20260830
    paths:
      - .github/workflows/crypto-forward-shadow-source-diagnostic-v128.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe required stable sources without storing raw market data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          probes = {
              "kucoin_contracts": "https://api-futures.kucoin.com/api/v1/contracts/active",
              "kucoin_tickers": "https://api.kucoin.com/api/ua/v2/market/ticker?tradeType=FUTURES",
              "gate_tickers": "https://api.gateio.ws/api/v4/futures/usdt/tickers",
              "stable_preview": "https://0a7039af-tv-crypto-engine.keikei99887.workers.dev/market/candidate-scan?profile=stable_quality&per_side=1&light_limit=12",
          }

          def request(url):
              req = urllib.request.Request(url, headers={"Accept": "application/json", "User-Agent": "crypto-shadow-source-diagnostic/1"})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return r.status, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()
              except Exception as e:
                  return None, str(e).encode()

          for name, url in probes.items():
              status, raw = request(url)
              result = {"source": name, "http_status": status}
              try:
                  body = json.loads(raw.decode("utf-8", errors="replace"))
                  if name == "kucoin_contracts":
                      data = body.get("data")
                      result.update({"provider_code": body.get("code"), "count": len(data) if isinstance(data, list) else (1 if isinstance(data, dict) else 0)})
                  elif name == "kucoin_tickers":
                      data = body.get("data")
                      rows = data.get("list") if isinstance(data, dict) else data
                      result.update({"provider_code": body.get("code"), "count": len(rows) if isinstance(rows, list) else 0})
                  elif name == "gate_tickers":
                      result.update({"count": len(body) if isinstance(body, list) else 0})
                  else:
                      # Only sanitized source-health metadata is printed; candidate/raw rows are intentionally omitted.
                      result.update({
                          "ok": body.get("ok"),
                          "degraded": body.get("degraded"),
                          "ticker_status": body.get("ticker_status"),
                          "source_roles": body.get("source_roles"),
                      })
              except Exception as e:
                  result["parse_error"] = type(e).__name__
                  result["body_preview"] = raw.decode("utf-8", errors="replace")[:180]
              print("SOURCE_DIAGNOSTIC", json.dumps(result, sort_keys=True, ensure_ascii=False))
          PY
