name: Family OpenAPI Production Smoke 20260830

on:
  push:
    branches:
      - ops/family-openapi-production-smoke-20260830
    paths:
      - .github/workflows/family-openapi-production-smoke-20260830.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify public Family Action OpenAPI
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const url='https://taistock-mcp.keywayk09.workers.dev/family-openapi.json';
          const r=await fetch(url,{headers:{accept:'application/json','cache-control':'no-cache'},signal:AbortSignal.timeout(15000)});
          const text=await r.text();
          let body=null;
          try{body=JSON.parse(text)}catch{}
          if(!r.ok||!body)throw new Error(`family_openapi_http_${r.status}`);
          if(String(body.openapi)!=='3.1.0')throw new Error(`openapi_version:${String(body.openapi||'')}`);
          const q=body?.paths?.['/api/family/query']?.post;
          if(!q)throw new Error('family_query_missing');
          if(String(q.operationId)!=='queryTaiwanStockSystem')throw new Error(`operation_id:${String(q.operationId||'')}`);
          const auth=body?.components?.securitySchemes?.bearerAuth;
          if(String(auth?.type)!=='http'||String(auth?.scheme)!=='bearer')throw new Error('bearer_auth_missing');
          console.log(`[smoke] FAMILY_OPENAPI_PASS version=${String(body?.info?.version||'')} operation=${String(q.operationId)}`);
          NODE
