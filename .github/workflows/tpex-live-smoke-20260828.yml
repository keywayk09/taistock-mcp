name: TPEx Live Exact-Date Smoke 20260828

on:
  push:
    branches: [test/tpex-live-smoke-20260828]
    paths:
      - '.github/workflows/tpex-live-smoke-20260828.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tpex-live-smoke-20260828.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify 2026-08-27 modern TPEx exact-date endpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          day='2026-08-27'
          y,m,d=map(int,day.split('-'))
          roc=urllib.parse.quote(f'{y-1911:03d}/{m:02d}/{d:02d}',safe='')
          ad=urllib.parse.quote(f'{y:04d}/{m:02d}/{d:02d}',safe='')
          urls={
            'institutional':f'https://www.tpex.org.tw/www/zh-tw/insti/dailyTrade?type=Daily&sect=EW&date={roc}&id=&response=json',
            'margin':f'https://www.tpex.org.tw/www/zh-tw/margin/balance?date={roc}&id=&response=json',
            'sbl':f'https://www.tpex.org.tw/www/zh-tw/margin/sbl?date={ad}&id=&response=json',
          }
          headers={
            'Accept':'application/json,text/plain,*/*',
            'Accept-Language':'zh-TW,zh;q=0.9,en;q=0.8',
            'Referer':'https://www.tpex.org.tw/',
            'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140.0.0.0 Safari/537.36',
          }
          for name,url in urls.items():
            req=urllib.request.Request(url,headers=headers)
            with urllib.request.urlopen(req,timeout=30) as r:
              raw=r.read(); final=r.geturl()
              if r.status!=200: raise RuntimeError(f'{name}:http:{r.status}')
              if '/errors' in final: raise RuntimeError(f'{name}:redirected:{final}')
            body=json.loads(raw.decode('utf-8-sig'))
            if not isinstance(body,dict): raise RuntimeError(f'{name}:root_not_object')
            if str(body.get('date') or '')!='20260827': raise RuntimeError(f'{name}:wrong_date:{body.get("date")}')
            tables=body.get('tables')
            if not isinstance(tables,list) or not tables: raise RuntimeError(f'{name}:tables_missing')
            rows=tables[0].get('data') if isinstance(tables[0],dict) else None
            if not isinstance(rows,list) or not rows: raise RuntimeError(f'{name}:rows_empty')
            print(f'{name}: PASS rows={len(rows)} final={final}')
          PY
