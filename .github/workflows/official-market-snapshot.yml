name: Official Market Snapshot

on:
  push:
    branches:
      - 'automation-research-relay*'
    paths:
      - 'runtime/official-market-snapshots/requests/**.json'
  schedule:
    - cron: '0 7 * * 1-5'

permissions:
  contents: write

concurrency:
  group: official-market-snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Build exact-date official market snapshot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import datetime as dt
          import hashlib
          import json
          import pathlib
          import re
          import sys
          import urllib.parse
          import urllib.request
          from zoneinfo import ZoneInfo

          root = pathlib.Path('runtime/official-market-snapshots')
          requests = sorted((root / 'requests').glob('*.json'))

          if '${{ github.event_name }}' == 'schedule':
              trade_date = dt.datetime.now(ZoneInfo('Asia/Taipei')).date().isoformat()
          else:
              changed = []
              # HEAD is the request-triggering commit; identify only newly changed request files.
              import subprocess
              raw = subprocess.check_output(['git','diff-tree','--no-commit-id','--name-only','-r','HEAD'], text=True)
              for line in raw.splitlines():
                  p = pathlib.Path(line.strip())
                  if str(p).startswith(str(root / 'requests')) and p.suffix == '.json':
                      changed.append(p)
              if len(changed) != 1:
                  raise SystemExit(f'expected exactly one snapshot request, got {len(changed)}')
              request = json.loads(changed[0].read_text(encoding='utf-8'))
              trade_date = str(request.get('trade_date',''))

          if not re.fullmatch(r'\d{4}-\d{2}-\d{2}', trade_date):
              raise SystemExit('invalid trade_date')

          y, m, d = map(int, trade_date.split('-'))
          roc_date = f'{y-1911:03d}/{m:02d}/{d:02d}'
          ymd = trade_date.replace('-','')

          endpoints = {
              'TWSE_MI_INDEX': f'https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date={ymd}&type=ALLBUT0999&response=json',
              'TPEX_HISTORICAL_DAILY': 'https://www.tpex.org.tw/web/stock/aftertrading/otc_quotes_no1430/stk_wn1430_result.php?' + urllib.parse.urlencode({'l':'zh-tw','d':roc_date,'se':'EW','o':'json'}),
          }

          def fetch_json(url):
              req = urllib.request.Request(url, headers={
                  'Accept':'application/json',
                  'Cache-Control':'no-cache',
                  'User-Agent':'Mozilla/5.0 official-market-snapshot/1.0',
              })
              with urllib.request.urlopen(req, timeout=40) as r:
                  raw = r.read()
                  final_url = r.geturl()
                  status = r.status
              if status != 200:
                  raise RuntimeError(f'http_{status}')
              return json.loads(raw.decode('utf-8-sig')), raw, final_url

          def num(v):
              s = str(v if v is not None else '').strip().replace(',','')
              if s in ('','--','---','-'):
                  return None
              try:
                  n = float(s)
              except Exception:
                  return None
              return n

          def valid_ohlc(o,h,l,c):
              if None in (o,h,l,c): return False
              return h >= max(o,c,l) and l <= min(o,c,h) and h >= l

          snapshot = {
              'schema':'OFFICIAL_MARKET_SNAPSHOT_V1',
              'trade_date':trade_date,
              'generated_at_utc':dt.datetime.now(dt.timezone.utc).isoformat().replace('+00:00','Z'),
              'generated_by':'github-actions/official-market-snapshot-v1',
              'sources':{},
              'symbols':{},
          }

          # TWSE bulk historical daily table.
          body, raw, final_url = fetch_json(endpoints['TWSE_MI_INDEX'])
          if str(body.get('stat','')).upper() != 'OK' or str(body.get('date','')) != ymd:
              raise RuntimeError('twse_date_or_status_mismatch')
          table = None
          for candidate in body.get('tables') or []:
              fields = [str(x).strip() for x in candidate.get('fields') or []]
              if '證券代號' in fields and '開盤價' in fields and '最高價' in fields and '最低價' in fields and '收盤價' in fields:
                  table = candidate; break
          if not table:
              raise RuntimeError('twse_daily_table_missing')
          fields = [str(x).strip() for x in table.get('fields') or []]
          idx = {name: fields.index(name) for name in ['證券代號','開盤價','最高價','最低價','收盤價']}
          twse_count = 0
          for row in table.get('data') or []:
              if not isinstance(row,list): continue
              symbol = str(row[idx['證券代號']]).strip()
              if not re.fullmatch(r'\d{4,6}', symbol): continue
              o,h,l,c = [num(row[idx[k]]) for k in ['開盤價','最高價','最低價','收盤價']]
              if not valid_ohlc(o,h,l,c): continue
              snapshot['symbols'][symbol] = {'market':'TWSE','source':'TWSE_MI_INDEX','open':o,'high':h,'low':l,'close':c}
              twse_count += 1
          snapshot['sources']['TWSE_MI_INDEX'] = {
              'url':final_url,'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw),'accepted_rows':twse_count
          }

          # TPEx bulk historical daily table.
          body, raw, final_url = fetch_json(endpoints['TPEX_HISTORICAL_DAILY'])
          body_date = str(body.get('date','')).replace('/','').replace('-','')
          if str(body.get('stat','')).lower() not in ('ok','success') or body_date != ymd:
              raise RuntimeError('tpex_date_or_status_mismatch')
          tables = body.get('tables') or []
          if not tables:
              raise RuntimeError('tpex_daily_table_missing')
          table = tables[0]
          fields = [re.sub(r'<[^>]*>','',str(x)).strip() for x in table.get('fields') or []]
          def find_field(candidates):
              for i, field in enumerate(fields):
                  cleaned = re.sub(r'\s+','',field)
                  for c in candidates:
                      if cleaned == re.sub(r'\s+','',c): return i
              raise RuntimeError(f'tpex_field_missing:{candidates}')
          ix_code = find_field(['代號','證券代號'])
          ix_close = find_field(['收盤','收盤價'])
          ix_open = find_field(['開盤','開盤價'])
          ix_high = find_field(['最高','最高價'])
          ix_low = find_field(['最低','最低價'])
          tpex_count = 0
          for row in table.get('data') or []:
              if not isinstance(row,list): continue
              symbol = str(row[ix_code]).strip()
              if not re.fullmatch(r'\d{4,6}', symbol): continue
              o,h,l,c = num(row[ix_open]),num(row[ix_high]),num(row[ix_low]),num(row[ix_close])
              if not valid_ohlc(o,h,l,c): continue
              snapshot['symbols'][symbol] = {'market':'TPEx','source':'TPEX_HISTORICAL_DAILY','open':o,'high':h,'low':l,'close':c}
              tpex_count += 1
          snapshot['sources']['TPEX_HISTORICAL_DAILY'] = {
              'url':final_url,'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw),'accepted_rows':tpex_count
          }

          snapshot['symbol_count'] = len(snapshot['symbols'])
          if snapshot['symbol_count'] < 1500:
              raise RuntimeError(f'implausibly_small_snapshot:{snapshot["symbol_count"]}')

          out = root / f'{trade_date}.json'
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(snapshot, ensure_ascii=False, separators=(',',':')) + '\n', encoding='utf-8')
          print(json.dumps({'trade_date':trade_date,'symbol_count':snapshot['symbol_count'],'twse':twse_count,'tpex':tpex_count,'out':str(out)}, ensure_ascii=False))
          PY

      - name: Commit official snapshot
        shell: bash
        run: |
          set -euo pipefail
          git add runtime/official-market-snapshots/*.json
          if git diff --cached --quiet; then
            echo 'No snapshot change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: write official market snapshot'
          git push origin "HEAD:${GITHUB_REF_NAME}"
