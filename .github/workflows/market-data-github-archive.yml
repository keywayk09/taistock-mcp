name: Diamond GitHub Market Data Archive

# P19 bootstrap trigger: keep the GitHub-only canonical archive path live after migration.
on:
  schedule:
    # 18:15 / 20:15 Asia/Taipei, weekdays.
    - cron: '15 10 * * 1-5'
    - cron: '15 12 * * 1-5'
  workflow_dispatch:
    inputs:
      trade_date:
        description: 'YYYY-MM-DD or auto'
        required: false
        default: 'auto'
  push:
    branches: [main]
    paths:
      - 'scripts/capture-tw-market-data.ts'
      - 'src/v6/tw-market-data.ts'
      - '.github/workflows/market-data-github-archive.yml'

permissions:
  contents: write

concurrency:
  group: diamond-market-data-archive
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runtime code
        uses: actions/checkout@v4
        with:
          path: code

      - name: Checkout canonical data branch
        uses: actions/checkout@v4
        with:
          ref: diamond-data
          path: archive
          fetch-depth: 1

      - name: Capture official Taiwan market data
        env:
          DIAMOND_DATA_ROOT: ${{ github.workspace }}/archive
          TRADE_DATE: ${{ github.event.inputs.trade_date || 'auto' }}
        run: node --experimental-strip-types code/scripts/capture-tw-market-data.ts --date "$TRADE_DATE" --out "$DIAMOND_DATA_ROOT"

      - name: Commit canonical GitHub archive
        working-directory: archive
        run: |
          git config user.name 'diamond-market-data-bot'
          git config user.email 'diamond-market-data-bot@users.noreply.github.com'
          git add data/market-data
          if git diff --cached --quiet; then
            echo 'No archive changes.'
            exit 0
          fi
          git commit -m "data(market): official archive $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Strict push-CAS. A race is resolved by rebase then retry; never force-push canonical data.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:diamond-data; then exit 0; fi
            echo "Push race attempt $attempt; re-reading and re-merging canonical branch"
            git fetch origin diamond-data
            git rebase origin/diamond-data
          done
          echo 'GitHub canonical archive CAS retries exhausted' >&2
          exit 1
