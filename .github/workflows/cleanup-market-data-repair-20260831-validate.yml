name: Validate 2026-08-31 market-data repair cleanup

on:
  push:
    branches:
      - cleanup/market-data-repair-20260831
    paths:
      - src/v6/market-data-scheduled-dispatch.ts
      - src/v6/market-data-one-shot-repair-20260831.ts
      - tests/market-data-one-shot-repair-20260831.test.ts
      - .github/workflows/test-market-data-repair-20260831.yml
      - .github/workflows/cleanup-market-data-repair-20260831-validate.yml

permissions:
  contents: read

jobs:
  validate-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Type check
        run: npm run type-check
      - name: Research tests
        run: npm run test:research
      - name: Wrangler dry-run
        run: npx wrangler deploy --dry-run --outdir dist
