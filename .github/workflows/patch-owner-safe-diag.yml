name: Patch Owner safe OAuth diagnostics

on:
  push:
    branches:
      - fix/owner-safe-diag-20260827

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/owner-safe-diag-20260827
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch safe diagnostic reason codes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('src/v6/owner-oauth.ts')
          s=p.read_text()
          anchor='''function ownerConnectorCandidate(url: URL): OwnerConnectorCandidate | null {\n'''
          if anchor not in s: raise SystemExit('candidate_anchor_missing')
          diag='''type OwnerAuthorizeDiag =\n  | "METHOD_OR_RESPONSE"\n  | "RESOURCE"\n  | "CLIENT_ID"\n  | "REDIRECT_URI"\n  | "PKCE"\n  | "STATE"\n  | "SCOPE"\n  | "CLIENT_AUTH";\n\nfunction ownerAuthorizeDiag(url: URL): OwnerAuthorizeDiag | null {\n  if (url.pathname !== "/authorize" || url.searchParams.get("response_type") !== "code") return "METHOD_OR_RESPONSE";\n  if (!canonicalOwnerResource(String(url.searchParams.get("resource") || "").trim(), url.origin)) return "RESOURCE";\n  if (!OPAQUE_CLIENT_ID.test(String(url.searchParams.get("client_id") || ""))) return "CLIENT_ID";\n  if (!trustedConnectorRedirect(String(url.searchParams.get("redirect_uri") || ""))) return "REDIRECT_URI";\n  const method = String(url.searchParams.get("code_challenge_method") || "");\n  const challenge = String(url.searchParams.get("code_challenge") || "");\n  if (Boolean(method || challenge) && (method !== "S256" || !PKCE_S256_CHALLENGE.test(challenge))) return "PKCE";\n  const state = String(url.searchParams.get("state") || "");\n  if (!state || state.length > 2_000) return "STATE";\n  if (!requestedOwnerScopes(String(url.searchParams.get("scope") || ""))) return "SCOPE";\n  return null;\n}\n\nfunction renderOwnerInvalid(diag: OwnerAuthorizeDiag) {\n  return html(`<h2>Owner OAuth 授權要求無效</h2><p><small>OAUTH-DIAG: ${escapeHtml(diag)}</small></p>`, 400);\n}\n\n'''
          s=s.replace(anchor,diag+anchor,1)
          s=s.replace('''    const candidate = ownerConnectorCandidate(url);\n    if (!candidate) return html("<h2>Owner OAuth 授權要求無效</h2>", 400);''','''    const candidate = ownerConnectorCandidate(url);\n    if (!candidate) return renderOwnerInvalid(ownerAuthorizeDiag(url) || "METHOD_OR_RESPONSE");''',1)
          s=s.replace('''    if (!state.authorizationCompatible) return html("<h2>Owner OAuth 授權要求無效</h2>", 400);''','''    if (!state.authorizationCompatible) return renderOwnerInvalid("CLIENT_AUTH");''',1)
          s=s.replace('''    const candidate = ownerConnectorCandidate(synthetic);\n    if (!candidate) return html("<h2>Owner OAuth 授權要求無效</h2>", 400);''','''    const candidate = ownerConnectorCandidate(synthetic);\n    if (!candidate) return renderOwnerInvalid(ownerAuthorizeDiag(synthetic) || "METHOD_OR_RESPONSE");''',1)
          s=s.replace('''    if (!state.authorizationCompatible) return html("<h2>Owner OAuth 授權要求無效</h2>", 400);''','''    if (!state.authorizationCompatible) return renderOwnerInvalid("CLIENT_AUTH");''',1)
          p.write_text(s)
          PY
          cat > tests/owner-oauth-safe-diag.test.ts <<'NODE'
          import assert from 'node:assert/strict';
          import { handleOwnerAuthorize } from '../src/v6/owner-oauth.ts';
          const ORIGIN='https://taistock-mcp.keywayk09.workers.dev';
          const env={MCP_API_KEY:'x',OAUTH_KV:{async get(){return null},async put(){},async delete(){}},OAUTH_PROVIDER:{}} as unknown as Env;
          async function body(params:Record<string,string>){const u=new URL(`${ORIGIN}/authorize`);for(const[k,v]of Object.entries(params))u.searchParams.set(k,v);const r=await handleOwnerAuthorize(new Request(u),env);return {status:r.status,text:await r.text()}}
          const base={response_type:'code',client_id:'abcdefgh12345678',redirect_uri:'https://chatgpt.com/connector/oauth/OwnerDiag123',resource:`${ORIGIN}/my-mcp`,scope:'owner:full offline_access mcp:tools',state:'state'};
          for(const [label,patch] of [
            ['RESOURCE',{resource:`${ORIGIN}/family-mcp`}],
            ['CLIENT_ID',{client_id:'x'}],
            ['REDIRECT_URI',{redirect_uri:'https://example.com/callback'}],
            ['STATE',{state:''}],
            ['SCOPE',{scope:'family:read'}],
          ] as const){const x=await body({...base,...patch});assert.equal(x.status,400);assert.match(x.text,new RegExp(`OAUTH-DIAG: ${label}`));assert.ok(!x.text.includes(base.client_id));assert.ok(!x.text.includes('chatgpt.com/connector/oauth/OwnerDiag123'));}
          console.log('Owner safe OAuth diagnostics passed');
          NODE
          git diff --check
      - run: npm install
      - name: Full regression gates
        shell: bash
        run: |
          set -euo pipefail
          npm run type-check
          node --experimental-strip-types tests/owner-oauth-safe-diag.test.ts
          npm run test:ops-contracts
          npm run test:family-selection
          npx wrangler deploy --dry-run
          npx wrangler deploy --dry-run --config wrangler.owner-oauth.jsonc
      - name: Commit tested source and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-owner-safe-diag.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/v6/owner-oauth.ts tests/owner-oauth-safe-diag.test.ts .github/workflows/patch-owner-safe-diag.yml
          git commit -m 'diag: expose safe Owner OAuth rejection class'
          git push origin HEAD:fix/owner-safe-diag-20260827
