name: Type check

on:
  push:
    branches:
      - research/trai-foundation-v1
      - main
  pull_request:

permissions:
  contents: write

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: p19/github-only-storage
      - name: Apply P19 migration patch once
        shell: bash
        run: |
          set -euo pipefail
          if ! ls .p19.patch.part* >/dev/null 2>&1; then
            echo 'P19 patch already applied.'
            exit 0
          fi
          cat .p19.patch.part* | base64 -d | gzip -d > /tmp/p19.patch
          patch -p1 --forward < /tmp/p19.patch
          rm -f .p19.patch.part*
          rm -f .github/workflows/p19-apply-patch.yml
          rm -f .github/workflows/p19-sbl-probe.yml
          rm -f .github/workflows/p19-export-source.yml
          rm -rf scripts/__pycache__
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name 'p19-github-storage-migration'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'P19: migrate canonical persistence from D1 to GitHub'
          git push origin HEAD:p19/github-only-storage
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run type-check
      - run: npm run test:research
      - run: npx wrangler deploy --dry-run --outdir dist
