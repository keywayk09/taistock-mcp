name: Type check

on:
  push:
    branches:
      - research/trai-foundation-v1
      - main
  pull_request:

permissions:
  contents: read

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run type-check
      - run: npm run test:research
      - run: npx wrangler deploy --dry-run --outdir dist

  family-v3-cloudflare-startup-gate:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/family-shared-read-intelligence-v3-20260822'
    runs-on: ubuntu-latest
    env:
      GATE_WORKER_NAME: taistock-mcp-family-v3-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Dependency graph
        run: npm ls agents @modelcontextprotocol/sdk zod @cloudflare/codemode @cloudflare/workers-oauth-provider wrangler || true

      - name: Resolve existing OAuth KV without mutation
        id: oauth_kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces"
          curl -fsS "${endpoint}?per_page=1000" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' > /tmp/oauth-kv-list.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          body=json.loads(Path('/tmp/oauth-kv-list.json').read_text())
          rows=body.get('result') or []
          matches=[x for x in rows if x.get('title')=='taistock-mcp-OAUTH_KV']
          if not body.get('success') or len(matches) != 1:
              raise SystemExit('existing_oauth_kv_resolution_failed')
          kv_id=str(matches[0].get('id') or '')
          if len(kv_id) != 32:
              raise SystemExit('invalid_existing_oauth_kv_id')
          print(f'id={kv_id}')
          PY

      - name: Build isolated gate config
        env:
          OAUTH_KV_ID: ${{ steps.oauth_kv.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          kv=os.environ['OAUTH_KV_ID']; worker=os.environ['GATE_WORKER_NAME']
          Path('wrangler.family-v3-gate.jsonc').write_text(f'''{{
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "{worker}",
            "main": "src/index-v6.ts",
            "compatibility_date": "2025-03-10",
            "compatibility_flags": ["nodejs_compat", "global_fetch_strictly_public"],
            "vars": {{"RESEARCH_MAX_SYMBOLS":"40","RESEARCH_MAX_ONE_MINUTE":"8","GITHUB_DATA_REPO":"keywayk09/tv-papertrader","GITHUB_DATA_BRANCH":"main"}},
            "kv_namespaces": [{{"binding":"OAUTH_KV","id":"{kv}"}}],
            "exports": {{"MyMCP":{{"type":"durable-object","storage":"sqlite"}},"FamilyMCP":{{"type":"durable-object","storage":"sqlite"}}}},
            "durable_objects": {{"bindings":[{{"class_name":"MyMCP","name":"MCP_OBJECT"}},{{"class_name":"FamilyMCP","name":"FAMILY_MCP_OBJECT"}}]}},
            "observability": {{"enabled":false}}
          }}\n''')
          PY

      - name: Real Cloudflare upload and startup validation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.family-v3-gate.jsonc

      - name: Delete isolated gate Worker
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set +e
          npx wrangler delete --name "$GATE_WORKER_NAME" --force >/tmp/gate-delete.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then exit 0; fi
          code="$(curl -sS -o /tmp/gate-check.json -w '%{http_code}' "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${GATE_WORKER_NAME}" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          test "$code" = '404'

  family-lkg-cloudflare-startup-control:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/family-shared-read-intelligence-v3-20260822'
    runs-on: ubuntu-latest
    env:
      GATE_WORKER_NAME: taistock-mcp-family-lkg-gate
      LKG_SHA: fe152fc160e65e3972999fd70035626e573e7d57
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fe152fc160e65e3972999fd70035626e573e7d57
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: LKG dependency graph with current npm resolution
        run: npm ls agents @modelcontextprotocol/sdk zod @cloudflare/codemode @cloudflare/workers-oauth-provider wrangler || true

      - name: Resolve existing OAuth KV without mutation
        id: oauth_kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces"
          curl -fsS "${endpoint}?per_page=1000" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' > /tmp/oauth-kv-list.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          body=json.loads(Path('/tmp/oauth-kv-list.json').read_text())
          matches=[x for x in (body.get('result') or []) if x.get('title')=='taistock-mcp-OAUTH_KV']
          if not body.get('success') or len(matches) != 1:
              raise SystemExit('existing_oauth_kv_resolution_failed')
          kv_id=str(matches[0].get('id') or '')
          if len(kv_id) != 32:
              raise SystemExit('invalid_existing_oauth_kv_id')
          print(f'id={kv_id}')
          PY

      - name: Build isolated LKG control config
        env:
          OAUTH_KV_ID: ${{ steps.oauth_kv.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          kv=os.environ['OAUTH_KV_ID']; worker=os.environ['GATE_WORKER_NAME']
          Path('wrangler.family-lkg-gate.jsonc').write_text(f'''{{
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "{worker}",
            "main": "src/index-v6.ts",
            "compatibility_date": "2025-03-10",
            "compatibility_flags": ["nodejs_compat", "global_fetch_strictly_public"],
            "vars": {{"RESEARCH_MAX_SYMBOLS":"40","RESEARCH_MAX_ONE_MINUTE":"8","GITHUB_DATA_REPO":"keywayk09/tv-papertrader","GITHUB_DATA_BRANCH":"main"}},
            "kv_namespaces": [{{"binding":"OAUTH_KV","id":"{kv}"}}],
            "exports": {{"MyMCP":{{"type":"durable-object","storage":"sqlite"}},"FamilyMCP":{{"type":"durable-object","storage":"sqlite"}}}},
            "durable_objects": {{"bindings":[{{"class_name":"MyMCP","name":"MCP_OBJECT"}},{{"class_name":"FamilyMCP","name":"FAMILY_MCP_OBJECT"}}]}},
            "observability": {{"enabled":false}}
          }}\n''')
          PY

      - name: Real Cloudflare LKG startup control
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.family-lkg-gate.jsonc

      - name: Delete isolated LKG Worker
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set +e
          npx wrangler delete --name "$GATE_WORKER_NAME" --force >/tmp/lkg-delete.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then exit 0; fi
          code="$(curl -sS -o /tmp/lkg-check.json -w '%{http_code}' "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${GATE_WORKER_NAME}" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          test "$code" = '404'

  family-v3-production-live-smoke:
    if: github.event_name == 'pull_request' && github.head_ref == 'ops/family-v3-live-smoke-20260822'
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://taistock-mcp.keywayk09.workers.dev
      MOM_GPT_API_KEY: ${{ secrets.MOM_GPT_API_KEY }}
    steps:
      - name: Verify live health and Family V3 contract
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 --retry-delay 2 --max-time 60 -fsS "$BASE_URL/health" > /tmp/health.json
          python - <<'PY'
          import json
          from pathlib import Path
          body=json.loads(Path('/tmp/health.json').read_text())
          assert body.get('status') == 'ok', body
          family=body.get('family_mcp') or {}
          assert family.get('intelligence') == 'V3_ADAPTIVE_SHARED_READ_OPEN_WORLD', family
          assert family.get('permission_model') == 'SAME_RESEARCH_BRAIN_DIFFERENT_PERMISSIONS', family
          expected=[
            'family_engine_status',
            'screen_family_swing_candidates',
            'get_family_market_chip_summary',
            'analyze_family_stock',
            'compare_family_stocks',
          ]
          assert family.get('tools') == expected, family.get('tools')
          actions=body.get('family_read_only_actions') or {}
          for key in ['adaptive_query','analyze_11_point','compare_11_point','swing_screen_v2','status']:
              assert key in actions, actions
          print('LIVE_HEALTH_V3=PASS')
          PY

      - name: Verify live Family OpenAPI routes
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 --retry-delay 2 --max-time 60 -fsS "$BASE_URL/family-openapi.json" > /tmp/openapi.json
          python - <<'PY'
          import json
          from pathlib import Path
          body=json.loads(Path('/tmp/openapi.json').read_text())
          assert body.get('openapi') == '3.1.0', body.get('openapi')
          assert (body.get('info') or {}).get('version') == 'family-action-openapi/v3.0.0', body.get('info')
          paths=body.get('paths') or {}
          expected={'/api/family/query','/api/family/analyze','/api/family/compare','/api/family/screen','/api/family/status'}
          assert expected.issubset(paths.keys()), paths.keys()
          print('LIVE_OPENAPI_V3=PASS')
          PY

      - name: Verify Family REST stays protected
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --retry 3 --retry-delay 2 --max-time 60 -sS -o /tmp/unauth.json -w '%{http_code}' -X POST "$BASE_URL/api/family/analyze" -H 'content-type: application/json' --data '{"symbol":"2317"}')"
          test "$code" = '401'
          python - <<'PY'
          import json
          from pathlib import Path
          body=json.loads(Path('/tmp/unauth.json').read_text())
          assert body.get('error') == 'unauthorized', body
          print('LIVE_READ_ONLY_AUTH_GATE=PASS')
          PY

      - name: Verify authenticated 2317 eleven-point contract when repo key exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MOM_GPT_API_KEY:-}" ]; then
            echo 'LIVE_AUTHENTICATED_2317=SKIP_NO_REPO_SECRET'
            exit 0
          fi
          curl --retry 2 --retry-delay 2 --max-time 180 -fsS -X POST "$BASE_URL/api/family/analyze" \
            -H "Authorization: Bearer ${MOM_GPT_API_KEY}" \
            -H 'content-type: application/json' \
            --data '{"symbol":"2317"}' > /tmp/analyze-2317.json
          python - <<'PY'
          import json
          from pathlib import Path
          body=json.loads(Path('/tmp/analyze-2317.json').read_text())
          assert body.get('version') == 'family-smart-analysis/v3.0.0', body.get('version')
          rows=body.get('stock_analyses') or []
          assert len(rows) == 1 and str(rows[0].get('symbol')) == '2317', rows
          eleven=rows[0].get('eleven_point_analysis') or {}
          assert (eleven.get('coverage') or {}).get('point_count') == 11, eleven.get('coverage')
          assert len(eleven.get('points') or []) == 11, len(eleven.get('points') or [])
          assert (body.get('family_policy') or {}).get('read_only') is True, body.get('family_policy')
          assert (body.get('family_policy') or {}).get('same_research_brain_as_owner') is True, body.get('family_policy')
          print('LIVE_AUTHENTICATED_2317=PASS')
          PY
