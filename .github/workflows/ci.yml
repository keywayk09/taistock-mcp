name: Type check

on:
  push:
    branches:
      - research/trai-foundation-v1
      - main
  pull_request:

permissions:
  contents: read

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run type-check
      - run: npm run test:research
      - run: npx wrangler deploy --dry-run --outdir dist

  family-v3-cloudflare-startup-gate:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/family-shared-read-intelligence-v3-20260822'
    runs-on: ubuntu-latest
    env:
      GATE_WORKER_NAME: taistock-mcp-family-v3-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Dependency graph
        run: npm ls agents @modelcontextprotocol/sdk zod @cloudflare/codemode @cloudflare/workers-oauth-provider wrangler || true

      - name: Resolve existing OAuth KV without mutation
        id: oauth_kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces"
          curl -fsS "${endpoint}?per_page=1000" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' > /tmp/oauth-kv-list.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          body=json.loads(Path('/tmp/oauth-kv-list.json').read_text())
          rows=body.get('result') or []
          matches=[x for x in rows if x.get('title')=='taistock-mcp-OAUTH_KV']
          if not body.get('success') or len(matches) != 1:
              raise SystemExit('existing_oauth_kv_resolution_failed')
          kv_id=str(matches[0].get('id') or '')
          if len(kv_id) != 32:
              raise SystemExit('invalid_existing_oauth_kv_id')
          print(f'id={kv_id}')
          PY

      - name: Build isolated gate config
        env:
          OAUTH_KV_ID: ${{ steps.oauth_kv.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          kv=os.environ['OAUTH_KV_ID']; worker=os.environ['GATE_WORKER_NAME']
          Path('wrangler.family-v3-gate.jsonc').write_text(f'''{{
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "{worker}",
            "main": "src/index-v6.ts",
            "compatibility_date": "2025-03-10",
            "compatibility_flags": ["nodejs_compat", "global_fetch_strictly_public"],
            "vars": {{"RESEARCH_MAX_SYMBOLS":"40","RESEARCH_MAX_ONE_MINUTE":"8","GITHUB_DATA_REPO":"keywayk09/tv-papertrader","GITHUB_DATA_BRANCH":"main"}},
            "kv_namespaces": [{{"binding":"OAUTH_KV","id":"{kv}"}}],
            "exports": {{"MyMCP":{{"type":"durable-object","storage":"sqlite"}},"FamilyMCP":{{"type":"durable-object","storage":"sqlite"}}}},
            "durable_objects": {{"bindings":[{{"class_name":"MyMCP","name":"MCP_OBJECT"}},{{"class_name":"FamilyMCP","name":"FAMILY_MCP_OBJECT"}}]}},
            "observability": {{"enabled":false}}
          }}\n''')
          PY

      - name: Real Cloudflare upload and startup validation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.family-v3-gate.jsonc

      - name: Delete isolated gate Worker
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set +e
          npx wrangler delete --name "$GATE_WORKER_NAME" --force >/tmp/gate-delete.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then exit 0; fi
          code="$(curl -sS -o /tmp/gate-check.json -w '%{http_code}' "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${GATE_WORKER_NAME}" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          test "$code" = '404'

  family-lkg-cloudflare-startup-control:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/family-shared-read-intelligence-v3-20260822'
    runs-on: ubuntu-latest
    env:
      GATE_WORKER_NAME: taistock-mcp-family-lkg-gate
      LKG_SHA: fe152fc160e65e3972999fd70035626e573e7d57
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fe152fc160e65e3972999fd70035626e573e7d57
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: LKG dependency graph with current npm resolution
        run: npm ls agents @modelcontextprotocol/sdk zod @cloudflare/codemode @cloudflare/workers-oauth-provider wrangler || true

      - name: Resolve existing OAuth KV without mutation
        id: oauth_kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces"
          curl -fsS "${endpoint}?per_page=1000" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' > /tmp/oauth-kv-list.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          body=json.loads(Path('/tmp/oauth-kv-list.json').read_text())
          matches=[x for x in (body.get('result') or []) if x.get('title')=='taistock-mcp-OAUTH_KV']
          if not body.get('success') or len(matches) != 1:
              raise SystemExit('existing_oauth_kv_resolution_failed')
          kv_id=str(matches[0].get('id') or '')
          if len(kv_id) != 32:
              raise SystemExit('invalid_existing_oauth_kv_id')
          print(f'id={kv_id}')
          PY

      - name: Build isolated LKG control config
        env:
          OAUTH_KV_ID: ${{ steps.oauth_kv.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          kv=os.environ['OAUTH_KV_ID']; worker=os.environ['GATE_WORKER_NAME']
          Path('wrangler.family-lkg-gate.jsonc').write_text(f'''{{
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "{worker}",
            "main": "src/index-v6.ts",
            "compatibility_date": "2025-03-10",
            "compatibility_flags": ["nodejs_compat", "global_fetch_strictly_public"],
            "vars": {{"RESEARCH_MAX_SYMBOLS":"40","RESEARCH_MAX_ONE_MINUTE":"8","GITHUB_DATA_REPO":"keywayk09/tv-papertrader","GITHUB_DATA_BRANCH":"main"}},
            "kv_namespaces": [{{"binding":"OAUTH_KV","id":"{kv}"}}],
            "exports": {{"MyMCP":{{"type":"durable-object","storage":"sqlite"}},"FamilyMCP":{{"type":"durable-object","storage":"sqlite"}}}},
            "durable_objects": {{"bindings":[{{"class_name":"MyMCP","name":"MCP_OBJECT"}},{{"class_name":"FamilyMCP","name":"FAMILY_MCP_OBJECT"}}]}},
            "observability": {{"enabled":false}}
          }}\n''')
          PY

      - name: Real Cloudflare LKG startup control
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.family-lkg-gate.jsonc

      - name: Delete isolated LKG Worker
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set +e
          npx wrangler delete --name "$GATE_WORKER_NAME" --force >/tmp/lkg-delete.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then exit 0; fi
          code="$(curl -sS -o /tmp/lkg-check.json -w '%{http_code}' "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${GATE_WORKER_NAME}" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          test "$code" = '404'
