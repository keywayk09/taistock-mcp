name: MoneyDJ exact-date Production smoke 20260904

on:
  push:
    branches:
      - ops/moneydj-exact-date-production-smoke-20260904
    paths:
      - .github/workflows/moneydj-exact-date-production-smoke-20260904.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://taistock-mcp.keywayk09.workers.dev
      MOM_GPT_API_KEY: ${{ secrets.MOM_GPT_API_KEY }}
    steps:
      - name: Verify deployed historical and current exact-date broker reads
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = process.env.BASE_URL;
          const key = process.env.MOM_GPT_API_KEY || '';
          if (!key) throw new Error('MOM_GPT_API_KEY_not_configured');
          const headers = {
            authorization: `Bearer ${key}`,
            accept: 'application/json',
            'content-type': 'application/json',
            'cache-control': 'no-cache',
          };
          async function chips(asOf) {
            const r = await fetch(`${base}/api/family/chips`, {
              method: 'POST', headers,
              body: JSON.stringify({ symbol: '2330', as_of: asOf, calendar_days: 60 }),
              signal: AbortSignal.timeout(120000),
            });
            const text = await r.text();
            let body;
            try { body = JSON.parse(text); } catch { throw new Error(`${asOf}:not_json:http_${r.status}`); }
            if (!r.ok) throw new Error(`${asOf}:http_${r.status}:${String(body?.error || body?.message || '').slice(0,180)}`);
            return body;
          }
          function must(v, msg) { if (!v) throw new Error(msg); }
          function verifyCommon(body, asOf) {
            must(body?.current_consistency === 'EXACT_DATE_ON_DEMAND', `${asOf}:current_consistency=${body?.current_consistency}`);
            must(body?.data_quality?.previous_day_substitution === false, `${asOf}:previous_day_substitution_enabled`);
            const b = body?.broker_branch_ranked;
            must(b && typeof b === 'object', `${asOf}:broker_missing`);
            must(b.status === 'READY', `${asOf}:broker_status=${b.status}:${b.error || ''}`);
            must(b.requested_as_of === asOf, `${asOf}:requested_as_of=${b.requested_as_of}`);
            must(b.source_date === asOf, `${asOf}:source_date=${b.source_date}`);
            must(b.source_date_verified === true, `${asOf}:source_date_not_verified`);
            must(b.source_query_mode === 'CUSTOM_EXACT_DATE', `${asOf}:query_mode=${b.source_query_mode}`);
            const suffix = `e=${asOf}&f=${asOf}`;
            must(String(b.source_url || '').endsWith(suffix), `${asOf}:source_url=${b.source_url}`);
            must(b.completeness === 'RANKED_ONLY', `${asOf}:completeness=${b.completeness}`);
            must(b.persistence === 'NONE', `${asOf}:persistence=${b.persistence}`);
            must(Array.isArray(b.buys) && b.buys.length > 0, `${asOf}:buys_empty`);
            must(Array.isArray(b.sells) && b.sells.length > 0, `${asOf}:sells_empty`);
            return b;
          }

          const d0903 = await chips('2026-09-03');
          const b0903 = verifyCommon(d0903, '2026-09-03');
          must(b0903.buys[0]?.broker_branch === '凱基-台北', `0903:top_buyer=${b0903.buys[0]?.broker_branch}`);
          must(Number(b0903.buys[0]?.net_lots) === 700, `0903:top_buy_net=${b0903.buys[0]?.net_lots}`);
          must(b0903.sells[0]?.broker_branch === '花旗環球', `0903:top_seller=${b0903.sells[0]?.broker_branch}`);
          must(Number(b0903.sells[0]?.net_lots) === -906, `0903:top_sell_net=${b0903.sells[0]?.net_lots}`);
          console.log(`[smoke] BROKER_0903_PRODUCTION_EXACT_DATE_PASS charset=${b0903.source_charset} top_buy=${b0903.buys[0].broker_branch}:${b0903.buys[0].net_lots} top_sell=${b0903.sells[0].broker_branch}:${b0903.sells[0].net_lots}`);

          const d0904 = await chips('2026-09-04');
          const b0904 = verifyCommon(d0904, '2026-09-04');
          console.log(`[smoke] BROKER_0904_PRODUCTION_EXACT_DATE_PASS charset=${b0904.source_charset} buys=${b0904.rank_count?.buy ?? b0904.buys.length} sells=${b0904.rank_count?.sell ?? b0904.sells.length}`);
          NODE
