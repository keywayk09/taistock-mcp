name: MoneyDJ exact-date live-source smoke 20260904

on:
  push:
    branches:
      - ops/moneydj-exact-date-production-smoke-20260904
    paths:
      - .github/workflows/moneydj-exact-date-production-smoke-20260904.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify merged adapter against live MoneyDJ
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types <<'NODE'
          import {
            getTwBrokerRankedOnDemand,
            getTwBrokerRankedWindowBundleOnDemand,
            resetTwBrokerRankedCacheForTests,
          } from './src/v6/tw-broker-ranked-on-demand.ts';

          function must(v, msg) { if (!v) throw new Error(msg); }

          resetTwBrokerRankedCacheForTests();
          const d3 = await getTwBrokerRankedOnDemand({ symbol: '2330', as_of: '2026-09-03' });
          must(d3.status === 'READY', `0903_status=${d3.status}:${'error' in d3 ? d3.error : ''}`);
          must(d3.source_date === '2026-09-03', `0903_source_date=${d3.source_date}`);
          must(d3.source_date_verified === true, '0903_source_date_not_verified');
          must(d3.source_query_mode === 'CUSTOM_EXACT_DATE', `0903_query_mode=${d3.source_query_mode}`);
          must(String(d3.source_url).endsWith('e=2026-09-03&f=2026-09-03'), `0903_url=${d3.source_url}`);
          must(d3.persistence === 'NONE' && d3.completeness === 'RANKED_ONLY', '0903_contract_wrong');
          must(d3.buys[0]?.broker_branch === '凱基-台北' && Number(d3.buys[0]?.net_lots) === 700,
            `0903_top_buy=${d3.buys[0]?.broker_branch}:${d3.buys[0]?.net_lots}`);
          must(d3.sells[0]?.broker_branch === '花旗環球' && Number(d3.sells[0]?.net_lots) === -906,
            `0903_top_sell=${d3.sells[0]?.broker_branch}:${d3.sells[0]?.net_lots}`);
          console.log(`[smoke] LIVE_0903_EXACT_DATE_PASS charset=${d3.source_charset} attempts=${d3.transport_attempts} top_buy=${d3.buys[0].broker_branch}:${d3.buys[0].net_lots} top_sell=${d3.sells[0].broker_branch}:${d3.sells[0].net_lots}`);

          resetTwBrokerRankedCacheForTests();
          const histBundle = await getTwBrokerRankedWindowBundleOnDemand({ symbol: '2330', as_of: '2026-09-03' });
          for (const key of ['5D','10D','20D','60D']) {
            const w = histBundle.windows[key];
            must(w?.status === 'PENDING', `0903_${key}_status=${w?.status}:${w && 'error' in w ? w.error : ''}`);
            must(w?.source_date_verified === false, `0903_${key}_wrongly_verified`);
          }
          must(histBundle.daily_rank_summing === false, 'historical_daily_rank_summing_enabled');
          console.log('[smoke] LIVE_0903_FIXED_WINDOWS_FAIL_CLOSED_PASS windows=5D,10D,20D,60D');

          resetTwBrokerRankedCacheForTests();
          const d4 = await getTwBrokerRankedOnDemand({ symbol: '2330', as_of: '2026-09-04' });
          must(d4.status === 'READY', `0904_status=${d4.status}:${'error' in d4 ? d4.error : ''}`);
          must(d4.source_date === '2026-09-04' && d4.source_date_verified === true, `0904_source_date=${d4.source_date}`);
          must(d4.source_query_mode === 'CUSTOM_EXACT_DATE', `0904_query_mode=${d4.source_query_mode}`);
          must(String(d4.source_url).endsWith('e=2026-09-04&f=2026-09-04'), `0904_url=${d4.source_url}`);

          const bundle = await getTwBrokerRankedWindowBundleOnDemand({ symbol: '2330', as_of: '2026-09-04' });
          must(bundle.status === 'READY', `0904_bundle_status=${bundle.status}`);
          must(bundle.server_side_interval_aggregation === true, 'server_side_interval_aggregation_false');
          must(bundle.daily_rank_summing === false, 'daily_rank_summing_enabled');
          for (const key of ['5D','10D','20D','60D']) {
            const w = bundle.windows[key];
            must(w?.status === 'READY', `0904_${key}_status=${w?.status}:${w && 'error' in w ? w.error : ''}`);
            must(w?.source_date === '2026-09-04' && w?.source_date_verified === true, `0904_${key}_source_date=${w?.source_date}`);
            must(Array.isArray(w?.buys) && w.buys.length > 0, `0904_${key}_buys_empty`);
          }
          must(Array.isArray(bundle.branch_matrix) && bundle.branch_matrix.length > 0, '0904_branch_matrix_empty');
          console.log(`[smoke] LIVE_0904_MULTI_WINDOW_PASS windows=5D,10D,20D,60D matrix=${bundle.branch_matrix.length} charset=${d4.source_charset}`);
          NODE
