name: MoneyDJ exact-date Production smoke 20260904

on:
  push:
    branches:
      - ops/moneydj-exact-date-production-smoke-20260904
    paths:
      - .github/workflows/moneydj-exact-date-production-smoke-20260904.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OWNER_MCP_URL: https://taistock-mcp.keywayk09.workers.dev/my-mcp
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify frozen broker tool schema
        shell: bash
        run: |
          set -euo pipefail
          npx -y @modelcontextprotocol/inspector@latest --cli "$OWNER_MCP_URL" \
            --transport http --method tools/list --format json > /tmp/tools.json
          node <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/tools.json', 'utf8'));
          const tools = body?.result?.tools || body?.tools || [];
          const tool = tools.find((x) => x?.name === 'get_broker_chips');
          if (!tool) throw new Error('missing_live_tool:get_broker_chips');
          const keys = Object.keys(tool?.inputSchema?.properties || {}).sort();
          const expected = ['date','symbol','top_n'];
          if (JSON.stringify(keys) !== JSON.stringify(expected)) {
            throw new Error(`broker_schema_drift:${JSON.stringify(keys)}`);
          }
          console.log(`[smoke] BROKER_SCHEMA_PASS keys=${keys.join(',')}`);
          NODE

      - name: Verify historical exact-date broker read
        shell: bash
        run: |
          set -euo pipefail
          npx -y @modelcontextprotocol/inspector@latest --cli "$OWNER_MCP_URL" \
            --transport http --method tools/call --tool-name get_broker_chips \
            --tool-args-json '{"symbol":"2330","date":"2026-09-03","top_n":10}' --format json > /tmp/broker-0903.json
          node <<'NODE'
          const fs = require('fs');
          function toolPayload(path) {
            const outer = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (outer?.result?.isError === true || outer?.isError === true) throw new Error(`${path}:tool_error`);
            const text = outer?.result?.content?.find?.((x) => x?.type === 'text')?.text
              ?? outer?.content?.find?.((x) => x?.type === 'text')?.text;
            if (typeof text !== 'string') throw new Error(`${path}:text_payload_missing`);
            return JSON.parse(text);
          }
          function must(v, msg) { if (!v) throw new Error(msg); }
          const b = toolPayload('/tmp/broker-0903.json');
          must(b.provider === 'MoneyDJ', `provider=${b.provider}`);
          must(b.status === 'READY', `status=${b.status}:${b.error || ''}`);
          must(b.date === '2026-09-03', `requested_date=${b.date}`);
          must(b.source_date === '2026-09-03', `source_date=${b.source_date}`);
          must(b.source_date_verified === true, 'source_date_not_verified');
          must(b.previous_day_substitution === false, 'previous_day_substitution_enabled');
          must(b.persistence === 'NONE', `persistence=${b.persistence}`);
          must(b.completeness === 'RANKED_ONLY', `completeness=${b.completeness}`);
          must(Array.isArray(b.top_net_buyers) && b.top_net_buyers.length > 0, 'buyers_empty');
          must(Array.isArray(b.top_net_sellers) && b.top_net_sellers.length > 0, 'sellers_empty');
          must(b.top_net_buyers[0]?.broker_branch === '凱基-台北', `unexpected_top_buyer=${b.top_net_buyers[0]?.broker_branch}`);
          must(Number(b.top_net_buyers[0]?.net_lots) === 700, `unexpected_top_buy_net=${b.top_net_buyers[0]?.net_lots}`);
          must(b.top_net_sellers[0]?.broker_branch === '花旗環球', `unexpected_top_seller=${b.top_net_sellers[0]?.broker_branch}`);
          must(Number(b.top_net_sellers[0]?.net_lots) === -906, `unexpected_top_sell_net=${b.top_net_sellers[0]?.net_lots}`);
          const windows = b?.multi_window?.windows || {};
          for (const key of ['5D','10D','20D','60D']) {
            must(windows[key]?.status === 'PENDING', `${key}_must_fail_closed:${windows[key]?.status}`);
            must(windows[key]?.source_date_verified === false, `${key}_historical_date_wrongly_verified`);
          }
          must(b?.multi_window?.daily_rank_summing === false, 'daily_rank_summing_enabled');
          console.log(`[smoke] BROKER_0903_EXACT_DATE_PASS top_buy=${b.top_net_buyers[0].broker_branch}:${b.top_net_buyers[0].net_lots} top_sell=${b.top_net_sellers[0].broker_branch}:${b.top_net_sellers[0].net_lots} fixed_windows_fail_closed=true`);
          NODE

      - name: Verify current multi-window broker read
        shell: bash
        run: |
          set -euo pipefail
          npx -y @modelcontextprotocol/inspector@latest --cli "$OWNER_MCP_URL" \
            --transport http --method tools/call --tool-name get_broker_chips \
            --tool-args-json '{"symbol":"2330","date":"2026-09-04","top_n":10}' --format json > /tmp/broker-0904.json
          node <<'NODE'
          const fs = require('fs');
          function toolPayload(path) {
            const outer = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (outer?.result?.isError === true || outer?.isError === true) throw new Error(`${path}:tool_error`);
            const text = outer?.result?.content?.find?.((x) => x?.type === 'text')?.text
              ?? outer?.content?.find?.((x) => x?.type === 'text')?.text;
            if (typeof text !== 'string') throw new Error(`${path}:text_payload_missing`);
            return JSON.parse(text);
          }
          function must(v, msg) { if (!v) throw new Error(msg); }
          const b = toolPayload('/tmp/broker-0904.json');
          must(b.status === 'READY', `status=${b.status}:${b.error || ''}`);
          must(b.source_date === '2026-09-04' && b.source_date_verified === true, `source_date=${b.source_date}`);
          must(b.previous_day_substitution === false, 'previous_day_substitution_enabled');
          must(b?.multi_window?.status === 'READY', `multi_window_status=${b?.multi_window?.status}`);
          must(b?.multi_window?.server_side_interval_aggregation === true, 'server_interval_aggregation_false');
          must(b?.multi_window?.daily_rank_summing === false, 'daily_rank_summing_enabled');
          const windows = b?.multi_window?.windows || {};
          for (const key of ['5D','10D','20D','60D']) {
            must(windows[key]?.status === 'READY', `${key}_status=${windows[key]?.status}:${windows[key]?.error || ''}`);
            must(windows[key]?.source_date === '2026-09-04', `${key}_source_date=${windows[key]?.source_date}`);
            must(windows[key]?.source_date_verified === true, `${key}_source_date_not_verified`);
            must(Array.isArray(windows[key]?.top_net_buyers) && windows[key].top_net_buyers.length > 0, `${key}_buyers_empty`);
          }
          must(Array.isArray(b?.multi_window?.branch_matrix) && b.multi_window.branch_matrix.length > 0, 'branch_matrix_empty');
          console.log(`[smoke] BROKER_0904_MULTI_WINDOW_PASS windows=5D,10D,20D,60D matrix=${b.multi_window.branch_matrix.length}`);
          NODE
