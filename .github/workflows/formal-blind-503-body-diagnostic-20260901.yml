name: Diagnose FORMAL Blind downstream 503 body

on:
  push:
    branches:
      - ops/formal-blind-503-diagnostic-20260901
    paths:
      - '.github/workflows/formal-blind-503-body-diagnostic-20260901.yml'

permissions:
  contents: read
  checks: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require PR380 Cloudflare Production build success
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: keywayk09/tv-papertrader
          TARGET_SHA: ca8c577fc3d1d226d0caa7de4f328e85c3f12ebe
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const repo = process.env.TARGET_REPO;
          const sha = process.env.TARGET_SHA;
          const token = process.env.GH_TOKEN;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          for (let attempt = 1; attempt <= 48; attempt += 1) {
            const response = await fetch(`https://api.github.com/repos/${repo}/commits/${sha}/check-runs`, {
              headers: {
                accept: 'application/vnd.github+json',
                authorization: `Bearer ${token}`,
                'x-github-api-version': '2022-11-28',
                'user-agent': 'formal-blind-post-pr380-gate/1.0',
              },
            });
            if (!response.ok) throw new Error(`github_check_runs_http_${response.status}:${(await response.text()).slice(0,500)}`);
            const body = await response.json();
            const check = (body.check_runs || []).find((x) => x.name === 'Workers Builds: tv-fugle-1d');
            console.log(JSON.stringify({ attempt, status: check?.status ?? null, conclusion: check?.conclusion ?? null, external_id: check?.external_id ?? null }));
            if (check?.status === 'completed') {
              if (check.conclusion !== 'success') throw new Error(`cloudflare_build_not_success:${check.conclusion}`);
              console.log(`CLOUDFLARE_PR380_BUILD_SUCCESS=${check.external_id || 'unknown'}`);
              process.exit(0);
            }
            if (attempt < 48) await sleep(5000);
          }
          throw new Error('cloudflare_build_status_timeout');
          NODE

      - name: Probe frozen 60 symbols directly against OHLC verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/formal-blind-503-diagnostic
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import { performance } from 'node:perf_hooks';

          const requestPath = 'runtime/automation-research-relay/requests/intraday-blind-20260831-0935-pr379-merged-final-v4.json';
          const request = JSON.parse(await fs.readFile(requestPath, 'utf8'));
          const base = 'https://tv-fugle-1d.keikei99887.workers.dev/research/formal-blind-verification';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const rows = [];

          for (let i = 0; i < request.items.length; i += 1) {
            const item = request.items[i];
            const params = new URLSearchParams({
              symbol: String(item.symbol),
              timeframe: String(item.timeframe),
              trade_date: String(item.trade_date),
              decision_time: String(item.decision_time).length === 5 ? `${item.decision_time}:00` : String(item.decision_time),
            });
            const started = performance.now();
            let row;
            try {
              const response = await fetch(`${base}?${params}`, {
                method: 'GET',
                redirect: 'error',
                signal: AbortSignal.timeout(70_000),
                headers: {
                  accept: 'application/json',
                  'cache-control': 'no-cache',
                  'user-agent': 'formal-blind-503-diagnostic/post-pr380',
                },
              });
              const text = await response.text();
              row = {
                index: i + 1,
                id: item.id,
                symbol: item.symbol,
                status: response.status,
                ok: response.ok,
                elapsed_ms: Math.round(performance.now() - started),
                content_type: response.headers.get('content-type'),
                content_length: response.headers.get('content-length'),
                cf_ray: response.headers.get('cf-ray'),
                server: response.headers.get('server'),
                body_bytes: Buffer.byteLength(text, 'utf8'),
                body_prefix: text.slice(0, 4000),
              };
            } catch (error) {
              row = {
                index: i + 1,
                id: item.id,
                symbol: item.symbol,
                status: null,
                ok: false,
                elapsed_ms: Math.round(performance.now() - started),
                error: String(error?.stack || error),
              };
            }
            rows.push(row);
            const marker = row.status === 503 ? 'HTTP503' : row.status === 429 ? 'HTTP429' : row.ok ? 'PASS' : 'FAIL';
            console.log(JSON.stringify({
              marker,
              index: row.index,
              symbol: row.symbol,
              status: row.status,
              elapsed_ms: row.elapsed_ms,
              content_type: row.content_type ?? null,
              cf_ray: row.cf_ray ?? null,
              body_bytes: row.body_bytes ?? null,
              body_prefix: row.ok ? undefined : row.body_prefix ?? row.error ?? null,
            }));
            if (i < request.items.length - 1) await sleep(650);
          }

          const summary = {
            schema: 'FORMAL_BLIND_503_DIAGNOSTIC_V2_POST_PR380',
            generated_at: new Date().toISOString(),
            target_merge_sha: 'ca8c577fc3d1d226d0caa7de4f328e85c3f12ebe',
            request_id: request.request_id,
            item_count: rows.length,
            http_200_count: rows.filter((x) => x.status === 200).length,
            http_503_count: rows.filter((x) => x.status === 503).length,
            http_429_count: rows.filter((x) => x.status === 429).length,
            network_error_count: rows.filter((x) => x.status == null).length,
            first_503_index: rows.find((x) => x.status === 503)?.index ?? null,
            first_503_symbol: rows.find((x) => x.status === 503)?.symbol ?? null,
            rows,
          };
          await fs.writeFile('tmp/formal-blind-503-diagnostic/result.json', `${JSON.stringify(summary, null, 2)}\n`);
          console.log('FORMAL_BLIND_503_DIAGNOSTIC_SUMMARY=' + JSON.stringify({
            item_count: summary.item_count,
            http_200_count: summary.http_200_count,
            http_503_count: summary.http_503_count,
            http_429_count: summary.http_429_count,
            network_error_count: summary.network_error_count,
            first_503_index: summary.first_503_index,
            first_503_symbol: summary.first_503_symbol,
          }));
          NODE

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: formal-blind-503-diagnostic-post-pr380-${{ github.run_id }}
          path: tmp/formal-blind-503-diagnostic/result.json
          retention-days: 14
