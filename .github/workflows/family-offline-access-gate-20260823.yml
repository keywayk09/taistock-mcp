name: Family Offline Access Gate 20260823

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  family-offline-access-gate:
    if: github.head_ref == 'fix/family-oauth-offline-access-metadata-20260823'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run type-check
      - run: npm run test:family-selection
      - run: npx wrangler deploy --dry-run --outdir dist
