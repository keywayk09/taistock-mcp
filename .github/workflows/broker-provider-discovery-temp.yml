name: TEMP Broker Provider Discovery

on:
  push:
    branches:
      - fix/broker-provider-bundle-router-v1

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe HiStock range selector and nStock page
        run: |
          node <<'NODE'
          const urls = [
            'https://histock.tw/stock/branch.aspx?no=2317',
            'https://histock.tw/stock/branch.aspx?no=2317&day=4',
            'https://histock.tw/stock/branch.aspx?no=2317&day=11',
            'https://histock.tw/stock/branch.aspx?no=2317&day=25',
            'https://histock.tw/stock/branch.aspx?no=2317&day=84',
            'https://histock.tw/stock/branch.aspx?no=2317&day=7',
            'https://histock.tw/stock/branch.aspx?no=2317&day=60',
            'https://www.nstock.tw/stock_info?status=9&stock_id=2317',
          ];
          for (const url of urls) {
            try {
              const res = await fetch(url, { headers: { 'user-agent': 'Mozilla/5.0 taistock-readonly-provider-probe/1.0' } });
              const text = await res.text();
              const normalized = text.replace(/<script[\s\S]*?<\/script>/gi, ' ').replace(/<style[\s\S]*?<\/style>/gi, ' ').replace(/<[^>]+>/g, ' ').replace(/&nbsp;|&#160;/gi, ' ').replace(/\s+/g, ' ');
              const ranges = [...normalized.matchAll(/(20\d{2})[\/\-.](\d{1,2})[\/\-.](\d{1,2})(?:\s*~\s*(20\d{2})[\/\-.](\d{1,2})[\/\-.](\d{1,2}))?/g)].slice(0, 5).map(m => m[0]);
              const update = normalized.match(/(?:更新日期|最後更新日|資料日期)\s*[:：]?\s*(\d{1,4}[\/\-.]\d{1,2}(?:[\/\-.]\d{1,2})?)/)?.[1] ?? null;
              const marker = normalized.includes('券商分點買賣日報') || normalized.includes('買超Top10');
              console.log(JSON.stringify({ url, http: res.status, bytes: text.length, marker, ranges, update }));
            } catch (error) {
              console.log(JSON.stringify({ url, error: String(error) }));
            }
          }
          NODE
