name: OHLC Formal Blind Live Probe 20260828

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ohlc-formal-blind-live-probe-20260828.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe canonical FORMAL Blind verification endpoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.parse, urllib.request, urllib.error
          base='https://tv-fugle-1d.keikei99887.workers.dev/research/formal-blind-verification'
          qs=urllib.parse.urlencode({
            'symbol':'2426',
            'timeframe':'1m',
            'trade_date':'2026-08-27',
            'decision_time':'10:00',
          })
          req=urllib.request.Request(base+'?'+qs,headers={
            'Accept':'application/json',
            'Cache-Control':'no-cache',
            'User-Agent':'formal-blind-live-probe/20260828',
          })
          try:
            with urllib.request.urlopen(req,timeout=30) as r:
              status=r.status; raw=r.read().decode('utf-8-sig',errors='replace')
          except urllib.error.HTTPError as e:
            status=e.code; raw=e.read().decode('utf-8-sig',errors='replace')
          print(json.dumps({'status':status,'body':raw[:12000]},ensure_ascii=False))
          if status != 200:
            raise RuntimeError(f'formal_blind_endpoint_http_{status}')
          body=json.loads(raw)
          if 'bars' in body or 'rows' in body:
            raise RuntimeError('proof_endpoint_leaked_market_rows')
          if body.get('formal_blind_eligible') is not True:
            raise RuntimeError('canonical_formal_blind_not_eligible:'+str(body.get('eligibility_reason') or body.get('error')))
          cutoff=body.get('cutoff') or {}
          verify=body.get('verification') or {}
          if cutoff.get('leakage_validated') is not True:
            raise RuntimeError('canonical_leakage_validation_failed')
          if cutoff.get('prefix_completeness') is not True:
            raise RuntimeError('canonical_prefix_incomplete')
          if verify.get('accepted_for_research') is not True:
            raise RuntimeError('canonical_official_verification_not_accepted')
          print('CANONICAL_FORMAL_BLIND_LIVE_PASS')
          PY
