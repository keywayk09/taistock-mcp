name: One-shot TPEx official fallback v1.4

on:
  push:
    branches:
      - feature/twchips-official-v7
    paths:
      - .github/workflows/patch-tpex-official-fallback-v13.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/twchips-official-v7
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build v1.4 selector from current v1.3 base without overwriting base
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          base = Path('src/v8/family-stock-selection-v12.ts')
          new = Path('src/v8/family-stock-selection-v13.ts')
          text = base.read_text(encoding='utf-8')

          if 'family-stock-selection/production-v1.3.0' not in text:
              raise SystemExit('expected current selector production-v1.3.0 base')
          if 'tryFugleTickersMisOtc' not in text:
              raise SystemExit('expected existing MIS OTC fallback in current base')

          text = text.replace(
              'export const FAMILY_STOCK_SELECTION_VERSION = "family-stock-selection/production-v1.3.0";',
              'export const FAMILY_STOCK_SELECTION_VERSION = "family-stock-selection/production-v1.4.0";',
              1,
          )
          text = text.replace(
              'const TPEX_QUOTES_URL = "https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes";',
              'const TPEX_QUOTES_URL = "https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes";\n'
              'const TPEX_QUOTES_ALT_URL = "https://www.tpex.org.tw/openapi/v1/tpex_mainboard_quotes";',
              1,
          )
          text = text.replace(
              'const USER_AGENT = "taistock-mcp-family-selector/1.3 (+https://github.com/keywayk09/taistock-mcp)";',
              'const USER_AGENT = "taistock-mcp-family-selector/1.4 (+https://github.com/keywayk09/taistock-mcp)";',
              1,
          )

          provider_pattern = re.compile(r'type Provider = ([^;]+);')
          match = provider_pattern.search(text)
          if not match:
              raise SystemExit('Provider union not found')
          provider_union = match.group(1)
          if '"TPEX_QUOTES_OPENAPI"' not in provider_union:
              provider_union = provider_union.replace('"TPEX_OPENAPI"', '"TPEX_OPENAPI" | "TPEX_QUOTES_OPENAPI"', 1)
              text = text[:match.start(1)] + provider_union + text[match.end(1):]

          pattern = re.compile(
              r'async function tryOfficialMarket\(market: Market\): Promise<MarketSnapshot> \{.*?\n\}\n\n(?=function chunked)',
              re.S,
          )
          replacement = r'''async function tryOfficialEndpoint(
            market: Market,
            url: string,
            provider: Provider,
            source: string,
          ): Promise<MarketSnapshot> {
            try {
              const raw = await fetchOfficialRows(url, source);
              const rows = raw.map((row) => normalizeOfficialRow(market, row)).filter((row): row is SnapshotRow => Boolean(row));
              return {
                market, provider, rows,
                raw_count: raw.length,
                normalized_count: rows.length,
                sample_keys: Object.keys(raw[0] ?? {}).slice(0, 24),
                errors: rows.length ? [] : [`${source} 有回傳，但欄位正規化後為 0 筆`],
              };
            } catch (error) {
              return {
                market, provider: "UNAVAILABLE", rows: [], raw_count: 0, normalized_count: 0, sample_keys: [],
                errors: [error instanceof Error ? error.message : String(error)],
              };
            }
          }

          async function tryOfficialMarket(market: Market): Promise<MarketSnapshot> {
            if (market === "TWSE") {
              return tryOfficialEndpoint("TWSE", TWSE_QUOTES_URL, "TWSE_OPENAPI", "TWSE OpenAPI");
            }

            const primary = await tryOfficialEndpoint(
              "TPEx",
              TPEX_QUOTES_URL,
              "TPEX_OPENAPI",
              "TPEx daily_close_quotes OpenAPI",
            );
            if (primary.normalized_count >= MIN_COVERAGE.TPEx) return primary;

            // 第二個來源仍然是 TPEx 官方 OpenAPI。只有兩個官方端點都不足時，
            // 才繼續走既有 Fugle ticker + TWSE MIS OTC、Fugle snapshot、FinMind fallback。
            const alternate = await tryOfficialEndpoint(
              "TPEx",
              TPEX_QUOTES_ALT_URL,
              "TPEX_QUOTES_OPENAPI",
              "TPEx mainboard_quotes OpenAPI",
            );
            if (alternate.normalized_count >= MIN_COVERAGE.TPEx) {
              return {
                ...alternate,
                errors: primary.errors.length
                  ? ["TPEx daily_close_quotes 不可用，已切換 mainboard_quotes 官方備援", ...primary.errors]
                  : alternate.errors,
              };
            }

            const best = alternate.normalized_count > primary.normalized_count ? alternate : primary;
            return {
              ...best,
              provider: best.normalized_count > 0 ? best.provider : "UNAVAILABLE",
              errors: [
                ...primary.errors.map((message) => `daily_close_quotes: ${message}`),
                ...alternate.errors.map((message) => `mainboard_quotes: ${message}`),
                ...(best.normalized_count > 0 ? [] : ["TPEx 兩個官方 OpenAPI 均不可用"]),
              ],
            };
          }

          '''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one tryOfficialMarket replacement, got {count}')
          if 'tryFugleTickersMisOtc' not in text:
              raise SystemExit('MIS OTC fallback was accidentally removed')

          old_source = 'source: "TWSE/TPEx official OpenAPI with Fugle/FinMind provider fallback",'
          if old_source in text:
              text = text.replace(
                  old_source,
                  'source: "TWSE/TPEx official OpenAPI (TPEx dual-endpoint) with Fugle ticker + TWSE MIS OTC / Fugle / FinMind fallbacks",',
                  1,
              )

          new.write_text(text, encoding='utf-8')

          entry_path = Path('src/production-entry.ts')
          entry = entry_path.read_text(encoding='utf-8')
          old_import = 'from "./v8/family-stock-selection-v12";'
          new_import = 'from "./v8/family-stock-selection-v13";'
          if old_import not in entry:
              raise SystemExit('production-entry v12 import not found')
          entry_path.write_text(entry.replace(old_import, new_import, 1), encoding='utf-8')

          test_path = Path('tests/production-family-selector.test.mjs')
          test = test_path.read_text(encoding='utf-8')
          test = test.replace('src/v8/family-stock-selection-v12.ts', 'src/v8/family-stock-selection-v13.ts')
          test = re.sub(
              r'FAMILY_STOCK_SELECTION_VERSION = "family-stock-selection\\/production-v1\\\.\d+\\\.\d+"',
              'FAMILY_STOCK_SELECTION_VERSION = "family-stock-selection\\/production-v1\\.4\\.0"',
              test,
              count=1,
          )
          if 'tpex_mainboard_quotes' not in test:
              marker = 'assert.match(selector, /www\\.tpex\\.org\\.tw\\/openapi\\/v1\\/tpex_mainboard_daily_close_quotes/);'
              addition = marker + '\nassert.match(selector, /www\\.tpex\\.org\\.tw\\/openapi\\/v1\\/tpex_mainboard_quotes/);\nassert.match(selector, /TPEX_QUOTES_OPENAPI/);\nassert.match(selector, /tryFugleTickersMisOtc/);'
              if marker not in test:
                  raise SystemExit('TPEx primary endpoint test marker not found')
              test = test.replace(marker, addition, 1)
          test = test.replace('/\\.\\/v8\\/family-stock-selection-v12/', '/\\.\\/v8\\/family-stock-selection-v13/', 1)
          test = re.sub(
              r'Production family selector provider-fallback v1\.\d+ regression contract passed',
              'Production family selector provider-fallback v1.4 regression contract passed',
              test,
              count=1,
          )
          test_path.write_text(test, encoding='utf-8')
          PY

      - name: Verify TypeScript and production selector contract
        run: |
          npm install
          npm run type-check
          node tests/production-family-selector.test.mjs
          npx wrangler deploy --dry-run --outdir dist

      - name: Commit one-shot patch and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-tpex-official-fallback-v13.yml
          git add src/v8/family-stock-selection-v13.ts src/production-entry.ts tests/production-family-selector.test.mjs
          git commit -m "P17c: add TPEx dual official quote fallback"
          git push origin HEAD:feature/twchips-official-v7
