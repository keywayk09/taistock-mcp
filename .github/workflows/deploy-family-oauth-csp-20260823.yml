name: Deploy Family OAuth CSP Production 20260823

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy-and-smoke:
    if: github.head_ref == 'ops/deploy-family-oauth-csp-20260823'
    runs-on: ubuntu-latest
    env:
      PROD_URL: https://taistock-mcp.keywayk09.workers.dev
      EXPECTED_MAIN_SHA: cb8a75e52bae931068118ace14df08fa0ae49184
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirm exact merged main
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "MAIN_SHA=${actual}"
          test "$actual" = "$EXPECTED_MAIN_SHA"
      - run: npm install
      - run: npm run type-check
      - run: npm run test:family-selection
      - name: Resolve existing Production OAuth KV
        id: oauth_kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces"
          curl -fsS "${endpoint}?per_page=1000" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" > /tmp/kv.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          body=json.load(open('/tmp/kv.json'))
          rows=[x for x in body.get('result',[]) if x.get('title')=='taistock-mcp-OAUTH_KV']
          if not body.get('success') or len(rows)!=1: raise SystemExit('production_oauth_kv_resolution_failed')
          kv_id=str(rows[0].get('id') or '')
          if len(kv_id)!=32: raise SystemExit('invalid_oauth_kv_id')
          print('id='+kv_id)
          PY
      - name: Build exact Production config
        env:
          OAUTH_KV_ID: ${{ steps.oauth_kv.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          cp wrangler.jsonc wrangler.family-csp-production.jsonc
          python - <<'PY'
          import os,re
          from pathlib import Path
          p=Path('wrangler.family-csp-production.jsonc')
          s=p.read_text(); kv=os.environ['OAUTH_KV_ID']
          pat=r'("binding"\s*:\s*"OAUTH_KV")(\s*)(\})'
          out,n=re.subn(pat, lambda m: m.group(1)+',\n\t\t\t"id": "'+kv+'"'+m.group(2)+m.group(3), s, count=1)
          if n!=1: raise SystemExit('oauth_kv_binding_injection_failed')
          p.write_text(out)
          PY
      - name: Deploy exact merged main to Production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.family-csp-production.jsonc
      - name: Verify Production health and Family safety boundary
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-delay 2 --max-time 30 -fsS "$PROD_URL/health" > /tmp/health.json
          python - <<'PY'
          import json
          body=json.load(open('/tmp/health.json')); fam=body.get('family_mcp') or {}
          assert body.get('status')=='ok', body
          assert fam.get('permission_model')=='SAME_RESEARCH_BRAIN_DIFFERENT_PERMISSIONS', fam
          assert fam.get('access')=='READ_ONLY_ALLOWLIST', fam
          assert fam.get('oauth_required') is True, fam
          assert fam.get('endpoint')=='/family-mcp', fam
          print('PRODUCTION_HEALTH=PASS')
          print('FAMILY_ACCESS=READ_ONLY_ALLOWLIST')
          PY
      - name: Verify authorize CSP allows trusted ChatGPT callback handoff
        shell: bash
        run: |
          set -euo pipefail
          challenge='AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA'
          redirect='https://chatgpt.com/connector/oauth/SyntheticCspCheck1234'
          resource="$PROD_URL/family-mcp"
          url="$PROD_URL/authorize?response_type=code&client_id=SyntheticCspCheck1234&redirect_uri=$(python -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe=""))' "$redirect")&code_challenge=$challenge&code_challenge_method=S256&state=synthetic-csp-state&scope=family%3Aread&resource=$(python -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe=""))' "$resource")"
          status="$(curl --max-time 30 -sS -D /tmp/authorize-headers.txt -o /tmp/authorize-body.html -w '%{http_code}' "$url")"
          test "$status" = '200'
          tr -d '\r' < /tmp/authorize-headers.txt > /tmp/authorize-headers-clean.txt
          grep -Fi "content-security-policy: default-src 'none'; style-src 'unsafe-inline'; form-action 'self' https://chatgpt.com https://chat.openai.com; base-uri 'none'; frame-ancestors 'none'" /tmp/authorize-headers-clean.txt >/dev/null
          if grep -Fi "form-action 'self'; base-uri" /tmp/authorize-headers-clean.txt >/dev/null; then
            echo 'SELF_ONLY_FORM_ACTION_REGRESSION' >&2
            exit 1
          fi
          grep -F '<title>台股引擎 Family 授權</title>' /tmp/authorize-body.html >/dev/null
          echo 'FAMILY_AUTHORIZE_CSP_CALLBACK_HANDOFF=PASS'
      - name: Verify OAuth discovery and Family MCP challenge
        shell: bash
        run: |
          set -euo pipefail
          curl --max-time 30 -fsS "$PROD_URL/.well-known/oauth-authorization-server" > /tmp/auth.json
          curl --max-time 30 -fsS "$PROD_URL/.well-known/openid-configuration" > /tmp/oidc.json
          python - <<'PY'
          import json
          for p in ('/tmp/auth.json','/tmp/oidc.json'):
              body=json.load(open(p))
              assert body.get('token_endpoint')=='https://taistock-mcp.keywayk09.workers.dev/oauth/token', body
              assert 'family:read' in (body.get('scopes_supported') or []), body
          print('OAUTH_DISCOVERY=PASS')
          PY
          code="$(curl --max-time 30 -sS -D /tmp/family-headers.txt -o /tmp/family-body.txt -w '%{http_code}' -X POST "$PROD_URL/family-mcp" -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"safe-smoke","version":"1"}}}')"
          test "$code" = '401'
          grep -F 'scope="family:read"' /tmp/family-headers.txt >/dev/null
          echo 'FAMILY_MCP_CHALLENGE=PASS'
      - name: Verify five-minute Cron without changing it
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/taistock-mcp/schedules"
          curl -fsS "$endpoint" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" > /tmp/cron.json
          python - <<'PY'
          import json
          body=json.load(open('/tmp/cron.json'))
          assert body.get('success'), body
          schedules=((body.get('result') or {}).get('schedules') or [])
          assert '*/5 * * * *' in [x.get('cron') for x in schedules if isinstance(x,dict)], schedules
          print('PRODUCTION_CRON=PASS')
          PY
