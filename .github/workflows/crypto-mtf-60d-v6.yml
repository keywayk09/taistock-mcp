name: Crypto MTF 60D V6

on:
  push:
    branches: [research/crypto-mtf-rr-20260830]
    paths:
      - '.github/workflows/crypto-mtf-60d-v6.yml'
      - 'research/crypto_mtf_60d_windows_v6.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run 60-day two-window validation
        run: python research/crypto_mtf_60d_windows_v6.py
      - name: Upload 60-day report
        uses: actions/upload-artifact@v4
        with:
          name: crypto-mtf-60d-v6
          path: /tmp/crypto_mtf_60d_windows_v6.json
          retention-days: 3
