name: P14 TXF Dual-market Review

on:
  pull_request:
    paths:
      - 'src/v6/txf-review-engine.ts'
      - 'src/v6/txf-review-tools.ts'
      - 'src/v6/txf-signal-ledger.ts'
      - 'src/v6/diamond-capability-p14.ts'
      - 'src/v6/diamond-capability-tools.ts'
      - 'src/v6/research-tools.ts'
      - 'src/index-v6.ts'
      - 'tests/txf-review.test.ts'
      - 'package.json'
      - '.github/workflows/p14-txf-dual-market-review.yml'
  push:
    branches: [main]
    paths:
      - 'src/v6/txf-review-engine.ts'
      - 'src/v6/txf-review-tools.ts'
      - 'src/v6/txf-signal-ledger.ts'
      - 'src/v6/diamond-capability-p14.ts'
      - 'src/v6/diamond-capability-tools.ts'
      - 'src/v6/research-tools.ts'
      - 'src/index-v6.ts'
      - 'tests/txf-review.test.ts'
      - 'package.json'

permissions:
  contents: read

jobs:
  verify-p14:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run type-check
      - run: npm run test:txf
      - run: npm run test:research
      - run: npx wrangler deploy --dry-run --outdir dist-p14
