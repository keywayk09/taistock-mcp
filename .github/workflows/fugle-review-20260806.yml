name: Fetch Fugle intraday for 2026-08-06 review

on:
  push:
    branches:
      - research/trai-foundation-v1
    paths:
      - .github/workflows/fugle-review-20260806.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/trai-foundation-v1
      - name: Fetch 5 minute candles
        run: |
          set -euo pipefail
          mkdir -p data/intraday/2026-08-06/fugle-5m
          if [ -z "${FUGLE_API_KEY:-}" ]; then
            printf '{"status":"secret_missing","source":"Fugle"}\n' > data/intraday/2026-08-06/fugle-5m/status.json
          else
            symbols='2330 2337 2408 2454 3481 3081 5347 6147 6196'
            for symbol in $symbols; do
              curl -fsSL --retry 3 \
                -H 'Accept: application/json' \
                -H "X-API-KEY: ${FUGLE_API_KEY}" \
                "https://api.fugle.tw/marketdata/v1.0/stock/intraday/candles/${symbol}?timeframe=5&sort=asc" \
                -o "data/intraday/2026-08-06/fugle-5m/${symbol}.json"
            done
            python - <<'PY'
          import json
          from pathlib import Path

          root = Path('data/intraday/2026-08-06/fugle-5m')
          out = {'date':'2026-08-06','source':'Fugle','timeframe':'5m','symbols':{}}
          for path in sorted(root.glob('*.json')):
              if path.name in {'status.json','summary.json'}:
                  continue
              obj = json.loads(path.read_text(encoding='utf-8'))
              rows = obj.get('data', []) if isinstance(obj, dict) else []
              out['symbols'][path.stem] = {
                  'bars': len(rows),
                  'first': rows[0] if rows else None,
                  'last': rows[-1] if rows else None,
              }
          (root/'summary.json').write_text(json.dumps(out, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
          fi
      - name: Commit research data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/intraday/2026-08-06/fugle-5m
          git commit -m 'data: add Fugle 5m candles for 2026-08-06 review' || exit 0
          git push origin HEAD:research/trai-foundation-v1
