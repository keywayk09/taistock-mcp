name: Global Futures Build Marker Probe 20260828

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/global-futures-build-marker-probe-20260828.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Global Futures Production build marker
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, urllib.request
          url='https://tv-global-futures.keikei99887.workers.dev/health'
          last=None
          for attempt in range(1,7):
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'global-futures-build-marker-probe/1'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      body=json.loads(r.read().decode('utf-8-sig'))
                  print(json.dumps({'attempt':attempt,'body':body},ensure_ascii=False))
                  last=body
                  if body.get('ohlc_bridge_probe_version')=='v1':
                      print('GLOBAL_FUTURES_CLOUDFLARE_BUILD_LIVE_PASS')
                      raise SystemExit(0)
              except SystemExit:
                  raise
              except Exception as e:
                  print(f'attempt={attempt} error={e}')
              time.sleep(5)
          raise RuntimeError('global_futures_build_marker_not_live:'+str(last))
          PY
