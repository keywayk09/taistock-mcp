name: Diagnose MoneyDJ broker window semantics

on:
  push:
    branches:
      - diag/moneydj-broker-window-semantics-20260904
    paths:
      - .github/workflows/diag-moneydj-broker-window-semantics.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify fixed broker windows from public MoneyDJ page
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, urllib.request, html as htmlmod, hashlib
          ua='Diamond-Broker-Ranked-ReadOnly/1.0'
          expected={1:'近一日',2:'近五日',3:'近十日',4:'近20日',6:'近60日'}
          seen=[]
          for e,label in expected.items():
              url=f'https://www.moneydj.com/Z/ZC/ZCO/ZCO.djhtm?a=2330&e={e}'
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'text/html,*/*'})
              with urllib.request.urlopen(req,timeout=25) as r:
                  raw=r.read(); ctype=r.headers.get('Content-Type','')
              text=raw.decode('big5' if 'big5' in ctype.lower() else 'utf-8','replace')
              plain=re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',htmlmod.unescape(text)))
              src=re.search(r'最後更新日\s*[：:]?\s*((?:\d{4}[/-])?\d{1,2}[/-]\d{1,2})',plain)
              select=re.search(r'<select\s+name=["\']?D["\']?[^>]*>([\s\S]*?)</select>',text,re.I)
              selected=None; selected_value=None
              if select:
                  for val,attrs,lab in re.findall(r'<option\s+value=["\']?([^\s"\'>]+)["\']?([^>]*)>([^<]+)</option>',select.group(1),re.I):
                      if re.search(r'\bselected\b',attrs,re.I):
                          selected_value=val; selected=htmlmod.unescape(lab).strip(); break
              rows=re.findall(r'<tr\b[^>]*>[\s\S]*?</tr>',text,re.I)
              first=None
              for tr in rows:
                  cells=[re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',htmlmod.unescape(x))).strip() for x in re.findall(r'<t[dh]\b[^>]*>([\s\S]*?)</t[dh]>',tr,re.I)]
                  if len(cells)>=10 and cells[0] and re.fullmatch(r'[\d,]+',cells[1] or ''):
                      first={'buy_branch':cells[0],'buy_net':cells[3],'sell_branch':cells[5],'sell_net':cells[8]}; break
              totals=re.search(r'合計買超張數\s*([\d,]+).*?合計賣超張數\s*([\d,]+)',plain)
              record={'e':e,'expected':label,'selected_value':selected_value,'selected':selected,'source_date':src.group(1) if src else None,'first':first,'totals':(totals.group(1),totals.group(2)) if totals else None,'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
              print(record)
              assert selected_value==str(e), f'e={e}: selected_value={selected_value}'
              assert selected==label, f'e={e}: selected={selected}'
              assert src, f'e={e}: missing source date'
              assert first, f'e={e}: missing ranked row'
              seen.append((e, first, record['totals'], record['sha256']))
          assert len({x[3] for x in seen})>=4, 'window responses are unexpectedly identical'
          assert len({str(x[1]) for x in seen})>=3, 'rankings did not materially change across windows'
          print('MONEYDJ_FIXED_WINDOWS_SEMANTICS_PASS')
          PY
