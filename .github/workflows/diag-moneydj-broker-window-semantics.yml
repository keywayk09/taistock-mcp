name: Diagnose MoneyDJ broker window semantics

on:
  push:
    branches:
      - diag/moneydj-broker-window-semantics-20260904
    paths:
      - .github/workflows/diag-moneydj-broker-window-semantics.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Locate goA implementation across loaded MoneyDJ scripts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, urllib.request, urllib.parse
          ua='Diamond-Broker-Ranked-ReadOnly/1.0'
          page='https://www.moneydj.com/Z/ZC/ZCO/ZCO.djhtm?a=2330&e='
          req=urllib.request.Request(page,headers={'User-Agent':ua,'Accept':'text/html,*/*'})
          with urllib.request.urlopen(req,timeout=25) as r:
              raw=r.read(); ctype=r.headers.get('Content-Type','')
          text=raw.decode('big5' if 'big5' in ctype.lower() else 'utf-8','replace')
          sources=[]
          for src in re.findall(r'<script\b[^>]*\bsrc\s*=\s*["\']([^"\']+)["\']',text,re.I):
              url=urllib.parse.urljoin(page,src)
              if 'moneydj.com' in urllib.parse.urlparse(url).netloc and url not in sources:
                  sources.append(url)
          print('SCRIPT_COUNT',len(sources))
          found=False
          for url in sources:
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'text/javascript,*/*'})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      body=r.read(); ct=r.headers.get('Content-Type','')
              except Exception as e:
                  print('FETCH_FAIL',url,type(e).__name__,str(e)[:120]); continue
              # ASCII identifiers survive either UTF-8 or Big5; latin1 preserves bytes 1:1.
              js=body.decode('latin1','replace')
              low=js.lower()
              hits=[]
              for needle in ['function goa','goa=function','goa = function','goa()','function goc','bdate','edate','document.f.d']:
                  idx=low.find(needle)
                  if idx>=0:
                      hits.append(needle)
                      print('SCRIPT_HIT',url,'ctype',ct,'needle',needle)
                      print('SNIP',re.sub(r'\s+',' ',js[max(0,idx-700):idx+2200])[:2900])
              if hits: found=True
          # also inspect inline scripts on page
          for i,inline in enumerate(re.findall(r'<script\b[^>]*>([\s\S]*?)</script>',text,re.I)):
              low=inline.lower()
              for needle in ['function goa','goa=function','goa = function','function goc','bdate','edate','document.f.d']:
                  idx=low.find(needle)
                  if idx>=0:
                      found=True
                      print('INLINE_HIT',i,'needle',needle)
                      print('SNIP',re.sub(r'\s+',' ',inline[max(0,idx-700):idx+2200])[:2900])
          assert found, 'goA/date routing semantics not located'
          print('MONEYDJ_ROUTING_DISCOVERY_PASS')
          PY
