name: Diagnose MoneyDJ broker window semantics

on:
  push:
    branches:
      - diag/moneydj-broker-window-semantics-20260904
    paths:
      - .github/workflows/diag-moneydj-broker-window-semantics.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify MoneyDJ fixed-window server aggregation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, urllib.request, html as htmlmod, hashlib
          ua='Diamond-Broker-Ranked-ReadOnly/1.0'
          pages=[
            (1,'近一日','https://www.moneydj.com/Z/ZC/ZCO/ZCO.djhtm?a=2330&e='),
            (2,'近五日','https://www.moneydj.com/z/zc/zco/zco_2330_2.djhtm'),
            (3,'近十日','https://www.moneydj.com/z/zc/zco/zco_2330_3.djhtm'),
            (4,'近20日','https://www.moneydj.com/z/zc/zco/zco_2330_4.djhtm'),
            (6,'近60日','https://www.moneydj.com/z/zc/zco/zco_2330_6.djhtm'),
          ]
          fingerprints=[]
          first_rows=[]
          source_dates=[]
          for selector,label,url in pages:
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'text/html,*/*'})
              with urllib.request.urlopen(req,timeout=25) as r:
                  raw=r.read(); ctype=r.headers.get('Content-Type','')
              text=raw.decode('big5' if 'big5' in ctype.lower() else 'utf-8','replace')
              plain=re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',htmlmod.unescape(text)))
              src=re.search(r'最後更新日\s*[：:]?\s*((?:\d{4}[/-])?\d{1,2}[/-]\d{1,2})',plain)
              select=re.search(r'<select\s+name=["\']?D["\']?[^>]*>([\s\S]*?)</select>',text,re.I)
              selected=None; selected_value=None
              if select:
                  for val,attrs,lab in re.findall(r'<option\s+value=["\']?([^\s"\'>]+)["\']?([^>]*)>([^<]+)</option>',select.group(1),re.I):
                      if re.search(r'\bselected\b',attrs,re.I):
                          selected_value=val; selected=htmlmod.unescape(lab).strip(); break
              first=None
              for tr in re.findall(r'<tr\b[^>]*>[\s\S]*?</tr>',text,re.I):
                  cells=[re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',htmlmod.unescape(x))).strip() for x in re.findall(r'<t[dh]\b[^>]*>([\s\S]*?)</t[dh]>',tr,re.I)]
                  if len(cells)>=10 and cells[0] and re.fullmatch(r'[\d,]+',cells[1] or ''):
                      first=(cells[0],cells[3],cells[5],cells[8]); break
              totals=re.search(r'合計買超張數\s*([\d,]+).*?合計賣超張數\s*([\d,]+)',plain)
              record={
                'selector':selector,'label':label,'selected_value':selected_value,'selected':selected,
                'source_date':src.group(1) if src else None,'first':first,
                'totals':(totals.group(1),totals.group(2)) if totals else None,
                'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),
              }
              print(record)
              assert selected_value==str(selector), f'{label}: selected value {selected_value}'
              assert selected==label, f'{label}: selected label {selected}'
              assert src, f'{label}: source date missing'
              assert first, f'{label}: ranked row missing'
              fingerprints.append(record['sha256']); first_rows.append(first); source_dates.append(src.group(1))
          assert len(set(source_dates))==1, f'source dates differ: {source_dates}'
          assert len(set(fingerprints))==len(pages), 'window pages are not distinct responses'
          assert len(set(first_rows))>=4, f'window ranking leaders insufficiently distinct: {first_rows}'
          print('MONEYDJ_FIXED_WINDOW_SERVER_AGGREGATION_PASS')
          PY
