name: Full Market Smoke Budget GREEN One Shot

on:
  push:
    branches:
      - fix/production-smoke-budget-20260902
    paths:
      - .github/workflows/full-market-smoke-budget-green-one-shot.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Apply exact bounded smoke-budget patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "4014a04d49cd19ceecf26adae99fd39ee37d445e"
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/deploy-cloudflare-production.yml')
          text = workflow.read_text()
          old = '--max-time 45 "${WORKER_BASE_URL}/health/full-market"'
          new = '--max-time 75 "${WORKER_BASE_URL}/health/full-market"'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one old full-market timeout, got {text.count(old)}')
          workflow.write_text(text.replace(old, new))

          package = Path('package.json')
          pkg = package.read_text()
          anchor = 'node --experimental-strip-types tests/deploy-cloudflare-workflow.test.ts && '
          insert = anchor + 'node --experimental-strip-types tests/deploy-cloudflare-full-market-smoke-budget.test.ts && '
          if pkg.count(anchor) != 1:
              raise SystemExit(f'expected exactly one ops-contract anchor, got {pkg.count(anchor)}')
          package.write_text(pkg.replace(anchor, insert))
          PY
          node --experimental-strip-types tests/deploy-cloudflare-full-market-smoke-budget.test.ts
          npm run test:ops-contracts
          npm run type-check
      - name: Self-delete and commit only bounded files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/full-market-smoke-budget-green-one-shot.yml
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'.github/workflows/deploy-cloudflare-production.yml\n.github/workflows/full-market-smoke-budget-green-one-shot.yml\npackage.json'
          test "$changed" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: give full-market Production smoke a safe time budget'
          git push origin HEAD:fix/production-smoke-budget-20260902
