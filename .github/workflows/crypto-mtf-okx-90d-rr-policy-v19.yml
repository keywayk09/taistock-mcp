name: Crypto MTF OKX 90D RR Policy V19

on:
  push:
    branches: [research/crypto-mtf-rr-20260830]
    paths:
      - '.github/workflows/crypto-mtf-okx-90d-rr-policy-v19.yml'
      - 'research/crypto_mtf_okx_90d_rr_policy_v19.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Run preregistered 90d setup-specific RR validation
        run: python research/crypto_mtf_okx_90d_rr_policy_v19.py
      - name: Upload V19 report
        uses: actions/upload-artifact@v4
        with:
          name: crypto-mtf-okx-90d-rr-policy-v19
          path: /tmp/crypto_mtf_okx_90d_rr_policy_v19.json
          retention-days: 3
