name: Jin10 fixed ABI facade test

on:
  pull_request:

permissions:
  contents: read

jobs:
  jin10-fixed-abi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run type-check
      - run: node --experimental-strip-types tests/jin10-owner-tools.test.ts
      - run: node --experimental-strip-types tests/jin10-facade-provider.test.ts
