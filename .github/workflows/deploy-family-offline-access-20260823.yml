name: Deploy Family Offline Access Production 20260823

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy-and-smoke:
    if: github.head_ref == 'ops/deploy-family-offline-access-20260823'
    runs-on: ubuntu-latest
    env:
      PROD_URL: https://taistock-mcp.keywayk09.workers.dev
      EXPECTED_MAIN_SHA: 32430ef9a6efe16eb8f2980a6cfecca5b5ed546d
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirm exact merged main
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "MAIN_SHA=${actual}"
          test "$actual" = "$EXPECTED_MAIN_SHA"
      - run: npm install
      - run: npm run type-check
      - run: npm run test:family-selection
      - name: Resolve existing Production OAuth KV
        id: oauth_kv
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces"
          curl -fsS "${endpoint}?per_page=1000" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" > /tmp/kv.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          body=json.load(open('/tmp/kv.json'))
          rows=[x for x in body.get('result',[]) if x.get('title')=='taistock-mcp-OAUTH_KV']
          if not body.get('success') or len(rows)!=1: raise SystemExit('production_oauth_kv_resolution_failed')
          kv_id=str(rows[0].get('id') or '')
          if len(kv_id)!=32: raise SystemExit('invalid_oauth_kv_id')
          print('id='+kv_id)
          PY
      - name: Build exact Production config
        env:
          OAUTH_KV_ID: ${{ steps.oauth_kv.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          cp wrangler.jsonc wrangler.family-offline-access-production.jsonc
          python - <<'PY'
          import os,re
          from pathlib import Path
          p=Path('wrangler.family-offline-access-production.jsonc')
          s=p.read_text(); kv=os.environ['OAUTH_KV_ID']
          pat=r'("binding"\s*:\s*"OAUTH_KV")(\s*)(\})'
          out,n=re.subn(pat, lambda m: m.group(1)+',\n\t\t\t"id": "'+kv+'"'+m.group(2)+m.group(3), s, count=1)
          if n!=1: raise SystemExit('oauth_kv_binding_injection_failed')
          p.write_text(out)
          PY
      - name: Deploy exact merged main to Production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.family-offline-access-production.jsonc
      - name: Verify Production health and Family safety boundary
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-delay 2 --max-time 30 -fsS "$PROD_URL/health" > /tmp/health.json
          python - <<'PY'
          import json
          body=json.load(open('/tmp/health.json')); fam=body.get('family_mcp') or {}
          assert body.get('status')=='ok', body
          assert fam.get('permission_model')=='SAME_RESEARCH_BRAIN_DIFFERENT_PERMISSIONS', fam
          assert fam.get('access')=='READ_ONLY_ALLOWLIST', fam
          assert fam.get('oauth_required') is True, fam
          assert fam.get('endpoint')=='/family-mcp', fam
          print('PRODUCTION_HEALTH=PASS')
          print('FAMILY_ACCESS=READ_ONLY_ALLOWLIST')
          PY
      - name: Verify authorization-server discovery advertises offline access
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-delay 2 --max-time 30 -fsS "$PROD_URL/.well-known/oauth-authorization-server" > /tmp/auth-server.json
          python - <<'PY'
          import json
          body=json.load(open('/tmp/auth-server.json'))
          scopes=body.get('scopes_supported') or []
          assert 'family:read' in scopes, body
          assert 'offline_access' in scopes, body
          assert body.get('token_endpoint')=='https://taistock-mcp.keywayk09.workers.dev/oauth/token', body
          grants=body.get('grant_types_supported') or []
          assert 'authorization_code' in grants, body
          assert 'refresh_token' in grants, body
          print('AUTH_SERVER_OFFLINE_ACCESS=PASS')
          PY
      - name: Verify protected resource stays Family read-only
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-delay 2 --max-time 30 -fsS "$PROD_URL/.well-known/oauth-protected-resource" > /tmp/resource.json
          python - <<'PY'
          import json
          body=json.load(open('/tmp/resource.json'))
          assert body.get('resource')=='https://taistock-mcp.keywayk09.workers.dev/family-mcp', body
          assert body.get('scopes_supported')==['family:read'], body
          assert 'offline_access' not in (body.get('scopes_supported') or []), body
          print('PROTECTED_RESOURCE_FAMILY_READ_ONLY=PASS')
          PY
      - name: Verify Family MCP challenge and token routes
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --max-time 30 -sS -D /tmp/family-headers.txt -o /tmp/family-body.txt -w '%{http_code}' -X POST "$PROD_URL/family-mcp" -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"safe-smoke","version":"1"}}}')"
          test "$code" = '401'
          grep -F 'scope="family:read"' /tmp/family-headers.txt >/dev/null
          for path in token oauth/token; do
            status="$(curl --max-time 30 -sS -o /tmp/token-probe.json -w '%{http_code}' -X POST "$PROD_URL/$path" -H 'Content-Type: application/x-www-form-urlencoded' --data 'grant_type=definitely_unsupported')"
            test "$status" != '404'
            test "$status" -ge 400
            test "$status" -lt 500
          done
          echo 'FAMILY_CHALLENGE_AND_TOKEN_ROUTES=PASS'
      - name: Verify five-minute Cron without changing it
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/taistock-mcp/schedules"
          curl -fsS "$endpoint" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" > /tmp/cron.json
          python - <<'PY'
          import json
          body=json.load(open('/tmp/cron.json'))
          assert body.get('success'), body
          schedules=((body.get('result') or {}).get('schedules') or [])
          assert '*/5 * * * *' in [x.get('cron') for x in schedules if isinstance(x,dict)], schedules
          print('PRODUCTION_CRON=PASS')
          PY
