name: Find Original Family OAuth Client 20260823

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  find-client:
    if: github.head_ref == 'ops/find-original-family-oauth-client-20260823'
    runs-on: ubuntu-latest
    env:
      MOM_CLIENT_ID: 41i_gRq63zL6r2tO
      MOM_REDIRECT_URI: https://chatgpt.com/connector/oauth/gDokJPX2DaM_
    steps:
      - name: Scan Cloudflare KV namespaces for exact historical client key and grant state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces"
          curl -fsS "${endpoint}?per_page=1000" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" > /tmp/namespaces.json

          python - <<'PY' > /tmp/candidates.tsv
          import json
          body=json.load(open('/tmp/namespaces.json'))
          if not body.get('success'):
              raise SystemExit('namespace_list_failed')
          for row in body.get('result') or []:
              title=str(row.get('title') or '')
              ident=str(row.get('id') or '')
              if len(ident)==32:
                  print(ident+'\t'+title.replace('\t',' '))
          PY

          encoded_client="$(python - <<'PY'
          import os,urllib.parse
          print(urllib.parse.quote('client:'+os.environ['MOM_CLIENT_ID'], safe=''))
          PY
          )"

          found=0
          while IFS=$'\t' read -r ns_id ns_title; do
            [ -n "$ns_id" ] || continue
            base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${ns_id}"
            status="$(curl -sS -o /tmp/client.raw -w '%{http_code}' "$base/values/$encoded_client" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
            if [ "$status" != 200 ]; then
              continue
            fi
            found=$((found+1))
            NS_TITLE="$ns_title" python - <<'PY'
          import json,os
          x=json.load(open('/tmp/client.raw'))
          print('FOUND_CLIENT_RECORD=TRUE')
          print('NAMESPACE_TITLE='+os.environ['NS_TITLE'])
          print('CLIENT_ID_MATCH='+str(x.get('clientId')==os.environ['MOM_CLIENT_ID']).upper())
          print('CLIENT_REDIRECT_MATCH='+str((x.get('redirectUris') or [])==[os.environ['MOM_REDIRECT_URI']]).upper())
          print('CLIENT_NAME='+str(x.get('clientName') or ''))
          print('TOKEN_AUTH_METHOD='+str(x.get('tokenEndpointAuthMethod')))
          print('AUTH_METHOD_EXPLICIT='+str(bool(x.get('authMethodExplicit'))).upper())
          print('HAS_CLIENT_SECRET='+str(bool(x.get('clientSecret'))).upper())
          print('GRANT_TYPES='+','.join(str(v) for v in (x.get('grantTypes') or [])))
          print('RESPONSE_TYPES='+','.join(str(v) for v in (x.get('responseTypes') or [])))
          PY

            enc_grant="$(python -c 'import urllib.parse; print(urllib.parse.quote("grant:",safe=""))')"
            curl -fsS "$base/keys?prefix=$enc_grant&limit=1000" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" > /tmp/grant-keys.json
            NS_ID="$ns_id" NS_TITLE="$ns_title" python - <<'PY'
          import json,os,subprocess,urllib.parse
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']; ns=os.environ['NS_ID']; cid=os.environ['MOM_CLIENT_ID']
          base=f'https://api.cloudflare.com/client/v4/accounts/{account}/storage/kv/namespaces/{ns}'
          keys=[x.get('name') for x in (json.load(open('/tmp/grant-keys.json')).get('result') or []) if x.get('name')]
          matches=[]
          for key in keys:
              url=base+'/values/'+urllib.parse.quote(key,safe='')
              p=subprocess.run(['curl','-fsS',url,'-H',f'Authorization: Bearer {token}'],capture_output=True,text=True)
              if p.returncode: continue
              try: x=json.loads(p.stdout)
              except: continue
              if isinstance(x,dict) and x.get('clientId')==cid:
                  matches.append(x)
          print('HISTORICAL_MATCHING_GRANTS='+str(len(matches)))
          print('HISTORICAL_ANY_REFRESH_TOKEN='+str(any(bool(x.get('refreshTokenId')) for x in matches)).upper())
          print('HISTORICAL_ANY_PENDING_AUTH_CODE='+str(any(bool(x.get('authCodeId')) and bool(x.get('authCodeWrappedKey')) for x in matches)).upper())
          print('HISTORICAL_ALL_SCOPE_FAMILY_READ='+str(bool(matches) and all((x.get('scope') or [])==['family:read'] for x in matches)).upper())
          print('---')
          PY
          done < /tmp/candidates.tsv

          echo "MATCHING_NAMESPACE_COUNT=${found}"
          if [ "$found" -eq 0 ]; then
            echo 'ORIGINAL_CLIENT_RECORD_FOUND=FALSE'
          else
            echo 'ORIGINAL_CLIENT_RECORD_FOUND=TRUE'
          fi
