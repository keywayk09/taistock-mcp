name: Owner confidential + Family preservation GREEN matrix

on:
  push:
    branches:
      - fix/owner-legacy-confidential-family-safe-20260827
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/owner-legacy-confidential-family-safe-20260827
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply minimal Owner-only compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('src/v6/owner-oauth.ts')
          s = p.read_text()

          old_type = '''type OwnerConnectorCandidate = {
            clientId: string;
            redirectUri: string;
            state: string;
            codeChallenge: string;
            codeChallengeMethod: "S256";
            resource: string;
            requestedScopes: string[];
          };'''
          new_type = '''type OwnerConnectorCandidate = {
            clientId: string;
            redirectUri: string;
            state: string;
            codeChallenge?: string;
            codeChallengeMethod?: "S256";
            resource: string;
            requestedScopes: string[];
          };'''
          if old_type not in s:
              raise SystemExit('candidate_type_anchor_missing')
          s = s.replace(old_type, new_type, 1)

          old_pkce = '''  const method = String(url.searchParams.get("code_challenge_method") || "");
            const challenge = String(url.searchParams.get("code_challenge") || "");
            if (method !== "S256" || !PKCE_S256_CHALLENGE.test(challenge)) return null;
          '''
          new_pkce = '''  const method = String(url.searchParams.get("code_challenge_method") || "");
            const challenge = String(url.searchParams.get("code_challenge") || "");
            const hasPkce = Boolean(method || challenge);
            if (hasPkce && (method !== "S256" || !PKCE_S256_CHALLENGE.test(challenge))) return null;
          '''
          if old_pkce not in s:
              raise SystemExit('pkce_anchor_missing')
          s = s.replace(old_pkce, new_pkce, 1)

          old_return = '''    codeChallenge: challenge,
              codeChallengeMethod: "S256",
              resource,
              requestedScopes,
          '''
          new_return = '''    ...(hasPkce ? { codeChallenge: challenge, codeChallengeMethod: "S256" as const } : {}),
              resource,
              requestedScopes,
          '''
          if old_return not in s:
              raise SystemExit('candidate_return_anchor_missing')
          s = s.replace(old_return, new_return, 1)

          old_state = '''async function ownerClientState(candidate: OwnerConnectorCandidate, env: Env) {
            const raw = await env.OAUTH_KV.get(ownerClientKey(candidate.clientId));
            if (!raw) return { exists: false as const, compatible: true as const };
            return { exists: true as const, compatible: ownerClientMatches(raw, candidate) };
          }'''
          new_state = '''function ownerHasStrictPkce(candidate: OwnerConnectorCandidate) {
            return candidate.codeChallengeMethod === "S256"
              && typeof candidate.codeChallenge === "string"
              && PKCE_S256_CHALLENGE.test(candidate.codeChallenge);
          }

          function storedOwnerAuthMethod(raw: string | null) {
            if (!raw) return null;
            try {
              const stored = JSON.parse(raw) as StoredOwnerConnectorClient;
              return stored.tokenEndpointAuthMethod || null;
            } catch {
              return null;
            }
          }

          async function ownerClientState(candidate: OwnerConnectorCandidate, env: Env) {
            const raw = await env.OAUTH_KV.get(ownerClientKey(candidate.clientId));
            if (!raw) {
              return {
                exists: false as const,
                compatible: true as const,
                authorizationCompatible: ownerHasStrictPkce(candidate),
              };
            }

            const compatible = ownerClientMatches(raw, candidate);
            if (!compatible) {
              return { exists: true as const, compatible: false as const, authorizationCompatible: false as const };
            }

            const authMethod = storedOwnerAuthMethod(raw);
            const confidential = authMethod === "client_secret_basic" || authMethod === "client_secret_post";
            return {
              exists: true as const,
              compatible: true as const,
              authorizationCompatible: confidential || ownerHasStrictPkce(candidate),
            };
          }'''
          if old_state not in s:
              raise SystemExit('client_state_anchor_missing')
          s = s.replace(old_state, new_state, 1)

          old_auth_req = '''function ownerAuthRequest(candidate: OwnerConnectorCandidate, origin: string, scopes: string[]): AuthRequest {
            return {
              responseType: "code",
              clientId: candidate.clientId,
              redirectUri: candidate.redirectUri,
              scope: scopes,
              state: candidate.state,
              codeChallenge: candidate.codeChallenge,
              codeChallengeMethod: candidate.codeChallengeMethod,
              resource: candidate.resource,
              issuer: origin,
            };
          }'''
          new_auth_req = '''function ownerAuthRequest(candidate: OwnerConnectorCandidate, origin: string, scopes: string[]): AuthRequest {
            return {
              responseType: "code",
              clientId: candidate.clientId,
              redirectUri: candidate.redirectUri,
              scope: scopes,
              state: candidate.state,
              ...(ownerHasStrictPkce(candidate)
                ? { codeChallenge: candidate.codeChallenge, codeChallengeMethod: candidate.codeChallengeMethod }
                : {}),
              resource: candidate.resource,
              issuer: origin,
            };
          }'''
          if old_auth_req not in s:
              raise SystemExit('auth_request_anchor_missing')
          s = s.replace(old_auth_req, new_auth_req, 1)

          get_guard = '''    const state = await ownerClientState(candidate, env);
              if (!state.compatible) return html("<h2>Owner OAuth client 不相容</h2><p>拒絕覆寫既有 OAuth client 身分。</p>", 409);
          '''
          get_guard_new = '''    const state = await ownerClientState(candidate, env);
              if (!state.compatible) return html("<h2>Owner OAuth client 不相容</h2><p>拒絕覆寫既有 OAuth client 身分。</p>", 409);
              if (!state.authorizationCompatible) return html("<h2>Owner OAuth 授權要求無效</h2>", 400);
          '''
          if get_guard not in s:
              raise SystemExit('get_guard_anchor_missing')
          s = s.replace(get_guard, get_guard_new, 1)

          post_anchor = '''    const candidate = ownerConnectorCandidate(synthetic);
              if (!candidate) return html("<h2>Owner OAuth 授權要求無效</h2>", 400);

              const checked = await validateOwnerSecret(
          '''
          post_new = '''    const candidate = ownerConnectorCandidate(synthetic);
              if (!candidate) return html("<h2>Owner OAuth 授權要求無效</h2>", 400);

              const state = await ownerClientState(candidate, env);
              if (!state.compatible) return html("<h2>Owner OAuth client 不相容</h2><p>拒絕覆寫既有 OAuth client 身分。</p>", 409);
              if (!state.authorizationCompatible) return html("<h2>Owner OAuth 授權要求無效</h2>", 400);

              const checked = await validateOwnerSecret(
          '''
          if post_anchor not in s:
              raise SystemExit('post_guard_anchor_missing')
          s = s.replace(post_anchor, post_new, 1)

          p.write_text(s)

          # Keep the regression in the permanent ops-contract suite.
          pkg = Path('package.json')
          t = pkg.read_text()
          old = 'tests/owner-oauth-protected-surface.test.ts"'
          new = 'tests/owner-oauth-protected-surface.test.ts && node --experimental-strip-types tests/owner-oauth-legacy-confidential-compat.test.ts"'
          if old not in t:
              raise SystemExit('ops_contract_anchor_missing')
          pkg.write_text(t.replace(old, new, 1))
          PY
          git diff --check

      - run: npm install

      - name: Type check and focused Owner/Family contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run type-check
          npm run test:family-selection
          node --experimental-strip-types tests/owner-oauth-legacy-confidential-compat.test.ts
          npm run test:ops-contracts

      - name: Full local OAuth provider matrix
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 \
            --var MCP_API_KEY:owner-local-secret \
            --var MOM_GPT_API_KEY:family-local-secret \
            >/tmp/owner-family-local.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; tail -160 /tmp/owner-family-local.log || true' EXIT
          ready=false
          for i in $(seq 1 45); do
            if curl --silent --max-time 2 http://127.0.0.1:8787/health >/dev/null 2>&1; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true

          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          const base='http://127.0.0.1:8787';
          const callback='https://chatgpt.com/connector/oauth/OwnerFamilyMatrix123';
          const assert=(c,m,d)=>{if(!c)throw new Error(`${m}${d===undefined?'':': '+JSON.stringify(d)}`)};
          const parse=async r=>{const t=await r.text();try{return JSON.parse(t)}catch{return{raw:t}}};
          const pkce=v=>crypto.createHash('sha256').update(v).digest('base64url');

          async function register(body){
            const r=await fetch(`${base}/oauth/register`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
            const j=await parse(r); assert(r.status===201,'DCR',{status:r.status,j}); return j;
          }
          async function finish(query, secret){
            const r=await fetch(`${base}/authorize`,{method:'POST',redirect:'manual',headers:{'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams({oauth_query:query,login_secret:secret})});
            assert(r.status===302,'authorize finish',{status:r.status,body:await r.text()});
            return new URL(r.headers.get('location')).searchParams.get('code');
          }
          async function token(client,params){
            const headers={'content-type':'application/x-www-form-urlencoded'}; const p={...params};
            if(client.client_secret){headers.authorization=`Basic ${Buffer.from(`${client.client_id}:${client.client_secret}`).toString('base64')}`;delete p.client_id}else p.client_id=client.client_id;
            const r=await fetch(`${base}/oauth/token`,{method:'POST',headers,body:new URLSearchParams(p)}); return {r,j:await parse(r)};
          }
          async function mcp(path,t){
            const r=await fetch(`${base}${path}`,{method:'POST',headers:{authorization:`Bearer ${t}`,'content-type':'application/json',accept:'application/json, text/event-stream'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'initialize',params:{protocolVersion:'2025-03-26',capabilities:{},clientInfo:{name:'owner-family-matrix',version:'1'}}})});
            return {status:r.status,text:await r.text()};
          }

          // OWNER: default DCR is confidential client_secret_basic, deliberately NO PKCE.
          const owner=await register({client_name:'Owner Legacy Confidential Matrix',redirect_uris:[callback],grant_types:['authorization_code','refresh_token'],response_types:['code']});
          assert(owner.token_endpoint_auth_method==='client_secret_basic'&&owner.client_secret,'Owner confidential DCR',owner);
          const ou=new URL(`${base}/authorize`);
          for(const[k,v]of Object.entries({response_type:'code',client_id:owner.client_id,redirect_uri:callback,scope:'offline_access mcp:tools',state:'owner-state',resource:`${base}/my-mcp`}))ou.searchParams.set(k,v);
          const og=await fetch(ou,{redirect:'manual'}); const opage=await og.text();
          assert(og.status===200&&opage.includes('Owner / 鑽石引擎'),'Owner confidential no-PKCE login',{status:og.status,body:opage.slice(0,300)});
          const ocode=await finish(ou.searchParams.toString(),'owner-local-secret');
          const ox=await token(owner,{grant_type:'authorization_code',code:ocode,redirect_uri:callback,resource:`${base}/my-mcp`});
          assert(ox.r.status===200&&ox.j.access_token&&ox.j.refresh_token,'Owner token',{status:ox.r.status,j:ox.j});
          for(const s of ['owner:full','offline_access','mcp:tools'])assert((ox.j.scope||'').split(/\s+/).includes(s),'Owner scope '+s,ox.j);
          assert((await mcp('/my-mcp',ox.j.access_token)).status===200,'Owner /my-mcp');
          assert([401,403].includes((await mcp('/family-mcp',ox.j.access_token)).status),'Owner must not enter Family');
          const ocross=await token(owner,{grant_type:'refresh_token',refresh_token:ox.j.refresh_token,resource:`${base}/family-mcp`});
          assert(ocross.r.status===400&&ocross.j.error==='invalid_target','Owner refresh must not drift to Family',ocross.j);
          const orf=await token(owner,{grant_type:'refresh_token',refresh_token:ox.j.refresh_token,resource:`${base}/my-mcp`});
          assert(orf.r.status===200&&(await mcp('/my-mcp',orf.j.access_token)).status===200,'Owner refresh');

          // FAMILY/MOM: public connector stays strict PKCE S256 and family:read only.
          const verifier='family-matrix-verifier-longer-than-forty-three-characters';
          const family=await register({client_name:'Family Mom Public Matrix',redirect_uris:[callback],grant_types:['authorization_code','refresh_token'],response_types:['code'],token_endpoint_auth_method:'none'});
          assert(family.token_endpoint_auth_method==='none'&&!family.client_secret,'Family public DCR',family);
          const fu=new URL(`${base}/authorize`);
          for(const[k,v]of Object.entries({response_type:'code',client_id:family.client_id,redirect_uri:callback,scope:'family:read',state:'family-state',code_challenge:pkce(verifier),code_challenge_method:'S256',resource:`${base}/family-mcp`}))fu.searchParams.set(k,v);
          const fg=await fetch(fu,{redirect:'manual'}); const fpage=await fg.text();
          assert(fg.status===200,'Family login',{status:fg.status,body:fpage.slice(0,300)});
          const fcode=await finish(fu.searchParams.toString(),'family-local-secret');
          const fx=await token(family,{grant_type:'authorization_code',code:fcode,redirect_uri:callback,code_verifier:verifier,resource:`${base}/family-mcp`});
          assert(fx.r.status===200&&fx.j.access_token&&fx.j.refresh_token,'Family token',{status:fx.r.status,j:fx.j});
          assert((fx.j.scope||'').trim()==='family:read','Family scope must remain read-only',fx.j);
          assert((await mcp('/family-mcp',fx.j.access_token)).status===200,'Family /family-mcp');
          assert([401,403].includes((await mcp('/my-mcp',fx.j.access_token)).status),'Family must not enter Owner');
          const fcross=await token(family,{grant_type:'refresh_token',refresh_token:fx.j.refresh_token,resource:`${base}/my-mcp`});
          assert(fcross.r.status===400&&fcross.j.error==='invalid_target','Family refresh must not drift to Owner',fcross.j);
          const frf=await token(family,{grant_type:'refresh_token',refresh_token:fx.j.refresh_token,resource:`${base}/family-mcp`});
          assert(frf.r.status===200&&(await mcp('/family-mcp',frf.j.access_token)).status===200,'Family refresh');

          // New/unknown no-PKCE Owner client must not be bootstrapped as confidential.
          const fake=new URL(`${base}/authorize`);
          for(const[k,v]of Object.entries({response_type:'code',client_id:'unknownowner12345',redirect_uri:callback,scope:'offline_access mcp:tools',state:'fake-state',resource:`${base}/my-mcp`}))fake.searchParams.set(k,v);
          assert((await fetch(fake,{redirect:'manual'})).status===400,'unknown no-PKCE Owner must fail closed');

          console.log('OWNER_CONFIDENTIAL_AND_FAMILY_MOM_FULL_MATRIX=PASS');
          NODE

      - name: Complete regression suite and dry-run
        shell: bash
        run: |
          set -euo pipefail
          npm run test:research
          npx wrangler deploy --dry-run
          npx wrangler deploy --dry-run --config wrangler.owner-oauth.jsonc

      - name: Commit tested source and permanent regression only
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/owner-family-oauth-green-matrix.yml .github/workflows/owner-family-oauth-red-matrix.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/v6/owner-oauth.ts tests/owner-oauth-legacy-confidential-compat.test.ts package.json .github/workflows/owner-family-oauth-green-matrix.yml .github/workflows/owner-family-oauth-red-matrix.yml
          git commit -m 'fix: preserve legacy confidential Owner OAuth clients'
          git push origin HEAD:fix/owner-legacy-confidential-family-safe-20260827
