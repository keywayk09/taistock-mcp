name: Crypto Forward Shadow V1.2 Runtime Smoke

on:
  push:
    branches: [research/crypto-mtf-rr-20260830]
    paths:
      - '.github/workflows/crypto-forward-shadow-runtime-smoke-20260831.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREVIEW_BASE: https://9a924d56-tv-crypto-engine.keikei99887.workers.dev
    steps:
      - uses: actions/checkout@v4

      - name: Compare volatile ranking with and without KuCoin funding bulk call
        shell: bash
        run: |
          python - <<'PY'
          # This is a decision test, not a scanner change. It determines whether
          # the extra KuCoin contracts/funding request materially changes ranking.
          import json, os, urllib.request

          base = os.environ['PREVIEW_BASE'].rstrip('/')
          req = urllib.request.Request(
              base + '/research/volatile-funding-sensitivity-smoke',
              headers={'Accept':'application/json','User-Agent':'volatile-funding-sensitivity/1'},
          )
          with urllib.request.urlopen(req, timeout=120) as r:
              p = json.loads(r.read().decode('utf-8'))
              status = r.status

          assert status == 200 and p.get('ok') is True, p
          assert p.get('normal_routes_changed') is False, p
          assert p.get('raw_rows_exposed') is False and p.get('persistence') == 'none', p
          comp = p.get('comparison') or {}
          rule = p.get('decision_rule') or {}

          top30 = (comp.get('top30_overlap') or {}).get('ratio')
          spearman = comp.get('full_rank_spearman')
          median_move = comp.get('median_abs_rank_move')
          use_two = (
              isinstance(top30, (int, float)) and top30 >= rule.get('two_call_preferred_if_top30_overlap_gte', 0.90)
              and isinstance(spearman, (int, float)) and spearman >= rule.get('two_call_preferred_if_spearman_gte', 0.95)
              and isinstance(median_move, (int, float)) and median_move <= rule.get('two_call_preferred_if_median_abs_rank_move_lte', 2)
          )
          decision = 'KEEP_TWO_CALL_GATE_FUNDING_ONLY' if use_two else 'USE_THREE_CALL_KUCOIN_GATE_FUNDING_REFERENCE'

          print('VOLATILE_FUNDING_RANKING_SENSITIVITY')
          print(json.dumps({
              'source_status': p.get('source_status'),
              'matched_rows': p.get('matched_rows'),
              'eligible_rows': p.get('eligible_rows'),
              'kucoin_funding_reporting': p.get('kucoin_funding_reporting'),
              'gate_funding_reporting': p.get('gate_funding_reporting'),
              'comparison': comp,
              'decision_rule': rule,
              'target_comparison': p.get('target_comparison'),
              'decision': decision,
          }, ensure_ascii=False, indent=2))
          PY
