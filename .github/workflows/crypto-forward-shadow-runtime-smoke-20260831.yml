name: Crypto Forward Shadow V1.2 Runtime Smoke

on:
  push:
    branches: [research/crypto-mtf-rr-20260830]
    paths:
      - '.github/workflows/crypto-forward-shadow-runtime-smoke-20260831.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREVIEW_BASE: https://7f6a40e8-tv-crypto-engine.keikei99887.workers.dev
    steps:
      - uses: actions/checkout@v4

      - name: Compare official Bybit mainnet hosts from Cloudflare egress
        shell: bash
        run: |
          python - <<'PY'
          # This test calls only the Shadow diagnostic route. The Worker itself
          # probes Bybit's two official mainnet REST hosts from identical egress.
          import json, os, urllib.error, urllib.request

          base = os.environ['PREVIEW_BASE'].rstrip('/')
          req = urllib.request.Request(
              base + '/research/bybit-host-smoke',
              headers={
                  'Accept': 'application/json',
                  'User-Agent': 'taistock-mcp-bybit-host-smoke/1',
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as r:
                  body = r.read().decode('utf-8')
                  status = r.status
                  ctype = r.headers.get('content-type', '')
          except urllib.error.HTTPError as e:
              body = e.read().decode('utf-8', errors='replace')
              status = e.code
              ctype = e.headers.get('content-type', '')

          assert 'application/json' in ctype.lower(), (status, ctype, body[:300])
          payload = json.loads(body)
          results = payload.get('results') or []
          assert len(results) == 2, payload

          by_host = {x.get('host'): x for x in results}
          primary = by_host.get('https://api.bybit.com') or {}
          alternate = by_host.get('https://api.bytick.com') or {}

          print('BYBIT_OFFICIAL_HOST_SMOKE')
          print(json.dumps({
              'http_status': status,
              'primary': primary,
              'alternate': alternate,
              'recommended_action': (
                  'SUBSTITUTE_API_BYTICK_COM_NO_EXTRA_REQUESTS'
                  if alternate.get('ok') and not primary.get('ok')
                  else 'KEEP_PRIMARY' if primary.get('ok')
                  else 'BOTH_BLOCKED_REDESIGN_SOURCE_PAIR'
              ),
          }, ensure_ascii=False, indent=2))

          # The diagnostic workflow succeeds as long as the Worker returns a
          # controlled JSON result; the printed recommendation drives next step.
          assert status in (200, 502), (status, payload)
          PY
