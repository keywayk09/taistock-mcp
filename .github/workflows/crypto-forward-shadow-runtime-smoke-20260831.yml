name: Crypto Forward Shadow V1.2 Runtime Smoke

on:
  push:
    branches: [research/crypto-mtf-rr-20260830]
    paths:
      - '.github/workflows/crypto-forward-shadow-runtime-smoke-20260831.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREVIEW_BASE: https://a86e021d-tv-crypto-engine.keikei99887.workers.dev
    steps:
      - uses: actions/checkout@v4

      - name: Test KuCoin Classic Futures 5m and 1H Klines from Cloudflare egress
        shell: bash
        run: |
          python - <<'PY'
          # Calls only the Shadow diagnostic route. No scanner source is changed.
          import json, os, urllib.error, urllib.request

          base = os.environ['PREVIEW_BASE'].rstrip('/')
          req = urllib.request.Request(
              base + '/research/kucoin-classic-kline-smoke',
              headers={
                  'Accept': 'application/json',
                  'User-Agent': 'taistock-mcp-kucoin-classic-kline-smoke/1',
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as r:
                  body = r.read().decode('utf-8')
                  status = r.status
                  ctype = r.headers.get('content-type', '')
          except urllib.error.HTTPError as e:
              body = e.read().decode('utf-8', errors='replace')
              status = e.code
              ctype = e.headers.get('content-type', '')

          assert 'application/json' in ctype.lower(), (status, ctype, body[:300])
          p = json.loads(body)
          summary = p.get('capability_summary') or {}
          probes = p.get('probes') or []

          recommendation = (
              'GATE_PLUS_KUCOIN_PRICE_OI_CAPABILITY_COMPLETE'
              if summary.get('gate_plus_kucoin_complete_pair_candidate')
              else 'KUCOIN_CLASSIC_KLINE_FAILED_DO_NOT_SUBSTITUTE'
          )

          print('KUCOIN_CLASSIC_FUTURES_KLINE_SMOKE')
          print(json.dumps({
              'http_status': status,
              'capability_summary': summary,
              'probes': probes,
              'recommendation': recommendation,
          }, ensure_ascii=False, indent=2))

          assert status in (200, 502), (status, p)
          PY
