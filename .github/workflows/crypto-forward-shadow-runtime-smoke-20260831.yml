name: Crypto Forward Shadow V1.2 Runtime Smoke

on:
  push:
    branches: [research/crypto-mtf-rr-20260830]
    paths:
      - '.github/workflows/crypto-forward-shadow-runtime-smoke-20260831.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREVIEW_BASE: https://1bc81234-tv-crypto-engine.keikei99887.workers.dev
    steps:
      - uses: actions/checkout@v4

      - name: Validate KuCoin research-symbol coverage and one-call bulk ticker
        shell: bash
        run: |
          python - <<'PY'
          # Calls only the V1.2.5 Shadow diagnostic endpoint. The endpoint returns
          # aggregate counts plus the ten target mappings, never the raw universe.
          import json, os, urllib.error, urllib.request

          base = os.environ['PREVIEW_BASE'].rstrip('/')
          req = urllib.request.Request(
              base + '/research/kucoin-coverage-smoke',
              headers={
                  'Accept': 'application/json',
                  'User-Agent': 'taistock-mcp-kucoin-coverage-smoke/1',
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as r:
                  body = r.read().decode('utf-8')
                  status = r.status
                  ctype = r.headers.get('content-type', '')
          except urllib.error.HTTPError as e:
              body = e.read().decode('utf-8', errors='replace')
              status = e.code
              ctype = e.headers.get('content-type', '')

          assert 'application/json' in ctype.lower(), (status, ctype, body[:300])
          p = json.loads(body)
          summary = p.get('summary') or {}
          mappings = p.get('mappings') or {}
          source = p.get('source_status') or {}

          assert p.get('raw_full_universe_exposed') is False, p
          assert p.get('persistence') == 'none', p
          assert source.get('contracts', {}).get('ok') is True, source
          assert source.get('bulk_ticker', {}).get('ok') is True, source

          recommendation = 'COVERAGE_COMPLETE_READY_FOR_SHADOW_SUBSTITUTION'
          if summary.get('contract_covered_count') != summary.get('target_count'):
              recommendation = 'PARTIAL_CONTRACT_COVERAGE_REQUIRES_FAIL_CLOSED_MAPPING'
          elif not summary.get('bulk_ticker_viable_for_covered_contracts'):
              recommendation = 'CONTRACTS_COVERED_BUT_BULK_FIELDS_INCOMPLETE'

          print('KUCOIN_TARGET_COVERAGE_AND_BULK_SMOKE')
          print(json.dumps({
              'http_status': status,
              'source_status': source,
              'summary': summary,
              'mappings': mappings,
              'recommendation': recommendation,
          }, ensure_ascii=False, indent=2))

          assert status in (200, 502), (status, p)
          PY
