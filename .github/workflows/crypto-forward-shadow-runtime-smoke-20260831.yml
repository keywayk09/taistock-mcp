name: Crypto Forward Shadow V1.2 Runtime Smoke

on:
  push:
    branches: [research/crypto-mtf-rr-20260830]
    paths:
      - '.github/workflows/crypto-forward-shadow-runtime-smoke-20260831.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIEW_BASE: https://6c60ff2c-tv-crypto-engine.keikei99887.workers.dev
    steps:
      - uses: actions/checkout@v4
      - name: Validate full-universe propagation and shadow invariants
        shell: bash
        run: |
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request

          base = os.environ['PREVIEW_BASE'].rstrip('/')

          def call(path, timeout=150):
              started = time.time()
              req = urllib.request.Request(base + path, headers={
                  'Accept': 'application/json',
                  'User-Agent': 'taistock-mcp-forward-shadow-propagation/1',
              })
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      body = r.read().decode('utf-8')
                      status = r.status
                      ctype = r.headers.get('content-type', '')
              except urllib.error.HTTPError as e:
                  body = e.read().decode('utf-8', errors='replace')
                  status = e.code
                  ctype = e.headers.get('content-type', '')
              elapsed = round((time.time() - started) * 1000)
              assert 'application/json' in ctype.lower(), (path, status, ctype, body[:300])
              return status, json.loads(body), elapsed

          # Self-test proves V1.2 cannot promote or mutate candidate stages.
          status, selftest, self_ms = call('/research/forward-shadow-selftest', 30)
          assert status == 200 and selftest.get('ok') is True, selftest
          assert all((selftest.get('invariants') or {}).values()), selftest

          # Stable candidate scan must carry BOTH full-market and selected-cohort telemetry.
          status, p, scan_ms = call('/market/candidate-scan?per_side=1&light_limit=10')
          assert status in (200, 502), (status, p)
          assert p.get('version') == '1.2.0-shadow', p
          candidates = p.get('candidates')
          assert isinstance(candidates, list), p

          full = p.get('market_participation_shadow') or {}
          assert full.get('mode') == 'forward_shadow_observation_only', full
          assert full.get('universe_scope') == 'full_eligible_stable_quality_light_universe', full
          assert full.get('added_market_requests') == 0, full
          assert full.get('threshold') is None and full.get('decision_effect') == 'none', full
          assert full.get('persistence') == 'none' and full.get('raw_rows_exposed') is False, full
          universe = full.get('universe') or {}
          assert (universe.get('eligible_count') or 0) >= len(candidates), (universe, len(candidates))

          source = p.get('source_status') or {}
          assert source.get('light_market_participation_shadow_available') is True, source

          cohort = p.get('forward_shadow_telemetry') or {}
          scope = cohort.get('scope') or {}
          gate = cohort.get('forward_gate') or {}
          assert scope.get('market_participation_scope') == 'selected_candidate_cohort_not_full_market', scope
          assert scope.get('candidate_count') == len(candidates), (scope, len(candidates))
          assert scope.get('added_market_requests') == 0, scope
          assert gate.get('threshold') is None and gate.get('decision_effect') == 'none', gate
          assert cohort.get('subrequest_budget_passthrough') == p.get('subrequest_budget'), (cohort.get('subrequest_budget_passthrough'), p.get('subrequest_budget'))

          # Per-candidate observation must preserve the already-produced stage/actionability.
          for c in candidates:
              fs = c.get('forward_shadow') or {}
              live_stage = c.get('final_stage') or c.get('diagnostic_stage') or c.get('action_state') or 'unknown'
              assert fs.get('core_stage') == live_stage, (c.get('base'), fs, live_stage)
              assert fs.get('research_actionability') == c.get('research_actionability'), (c.get('base'), fs, c.get('research_actionability'))
              assert fs.get('changes_core_stage') is False, (c.get('base'), fs)
              assert fs.get('can_promote') is False, (c.get('base'), fs)
              assert fs.get('added_market_requests') == 0, (c.get('base'), fs)
              fg = fs.get('forward_gate') or {}
              assert fg.get('state') == 'unscored_collecting' and fg.get('decision') == 'preserve', (c.get('base'), fg)

          # No raw full-universe rows may leak through the aggregate object.
          forbidden = {'rows', 'candles', 'tickers', 'raw', 'raw_rows'}
          assert not (forbidden & set(full.keys())), full.keys()

          report = {
              'preview': base,
              'http_status': status,
              'selftest_latency_ms': self_ms,
              'scan_latency_ms': scan_ms,
              'candidate_count': len(candidates),
              'eligible_universe_count': universe.get('eligible_count'),
              'source_health': full.get('source_health'),
              'turnover_participation': full.get('turnover_participation'),
              'funding_crowding': full.get('funding_crowding'),
              'cross_exchange_direction': full.get('cross_exchange_direction'),
              'bybit_open_interest_observation': full.get('bybit_open_interest_observation'),
              'subrequest_budget': p.get('subrequest_budget'),
              'result': 'PASS_FULL_UNIVERSE_AND_SELECTED_COHORT_PROPAGATION',
          }
          print('FORWARD_SHADOW_V12_PROPAGATION_SMOKE')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
