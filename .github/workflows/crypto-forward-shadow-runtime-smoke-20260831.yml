name: Crypto Forward Shadow V1.2 Runtime Smoke

on:
  push:
    branches: [research/crypto-mtf-rr-20260830]
    paths:
      - '.github/workflows/crypto-forward-shadow-runtime-smoke-20260831.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIEW_BASE: https://b894178a-tv-crypto-engine.keikei99887.workers.dev
    steps:
      - uses: actions/checkout@v4

      - name: Runtime smoke and invariants
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          base = os.environ['PREVIEW_BASE'].rstrip('/')

          def get(path, timeout=120):
              url = base + path
              started = time.time()
              req = urllib.request.Request(url, headers={'Accept': 'application/json', 'User-Agent': 'taistock-mcp-forward-shadow-smoke/1'})
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      body = resp.read().decode('utf-8')
                      status = resp.status
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode('utf-8', errors='replace')
                  status = exc.code
              elapsed_ms = round((time.time() - started) * 1000)
              try:
                  payload = json.loads(body)
              except Exception as exc:
                  raise AssertionError(f'{path}: non-json status={status} error={exc} preview={body[:300]!r}')
              return status, payload, elapsed_ms

          summary = {'preview': base, 'checks': {}}

          status, selftest, latency = get('/research/forward-shadow-selftest', 30)
          assert status == 200, (status, selftest)
          assert selftest.get('ok') is True, selftest
          invariants = selftest.get('invariants') or {}
          required = [
              'input_not_mutated',
              'candidate_count_preserved',
              'core_stage_preserved',
              'research_actionability_preserved',
              'no_promotion_capability',
              'no_stage_change_capability',
              'zero_added_market_requests',
              'no_threshold',
          ]
          assert all(invariants.get(k) is True for k in required), invariants
          summary['checks']['selftest'] = {'ok': True, 'latency_ms': latency, 'invariants': invariants}

          for path in ['/health', '/version']:
              status, payload, latency = get(path, 30)
              assert status == 200, (path, status, payload)
              assert payload.get('version') == '1.2.0-shadow', (path, payload.get('version'))
              policy = payload.get('forward_shadow_policy') or {}
              assert policy.get('mode') == 'forward_shadow_observation_only', policy
              assert policy.get('candidate_promotion') == 'forbidden', policy
              assert policy.get('candidate_stage_changes') is False, policy
              assert policy.get('added_market_requests') == 0, policy
              summary['checks'][path.strip('/')] = {
                  'ok': True,
                  'latency_ms': latency,
                  'version': payload.get('version'),
                  'policy_mode': payload.get('policy_mode'),
              }

          scans = [
              ('stable', '/market/candidate-scan?per_side=1&light_limit=10'),
              ('volatile', '/market/volatile-scan?per_side=1&setup=all'),
          ]
          for label, path in scans:
              status, payload, latency = get(path, 150)
              assert status in (200, 502), (label, status, payload)
              # A 502 can be an upstream market-source degradation; schema invariants must still be inspectable
              # whenever the wrapper returns a candidate payload.
              policy = payload.get('forward_shadow_policy') or {}
              if payload.get('version') == '1.2.0-shadow':
                  assert policy.get('candidate_promotion') == 'forbidden', policy
                  assert policy.get('candidate_stage_changes') is False, policy
                  assert policy.get('added_market_requests') == 0, policy
              candidates = payload.get('candidates')
              if isinstance(candidates, list):
                  telemetry = payload.get('forward_shadow_telemetry') or {}
                  scope = telemetry.get('scope') or {}
                  gate = telemetry.get('forward_gate') or {}
                  assert scope.get('added_market_requests') == 0, telemetry
                  assert scope.get('market_participation_scope') == 'selected_candidate_cohort_not_full_market', scope
                  assert gate.get('threshold') is None, gate
                  assert gate.get('decision_effect') == 'none', gate
                  for c in candidates:
                      fs = c.get('forward_shadow') or {}
                      assert fs.get('can_promote') is False, fs
                      assert fs.get('changes_core_stage') is False, fs
                      assert fs.get('added_market_requests') == 0, fs
                      assert (fs.get('forward_gate') or {}).get('decision') == 'preserve', fs
                  summary['checks'][label] = {
                      'ok': True,
                      'http_status': status,
                      'latency_ms': latency,
                      'candidate_count': len(candidates),
                      'core_stage_counts': telemetry.get('core_stage_counts'),
                      'research_actionability_counts': telemetry.get('research_actionability_counts'),
                      'selected_cohort_24h_participation': telemetry.get('selected_cohort_24h_participation'),
                      'funding_crowding_observation': telemetry.get('funding_crowding_observation'),
                      'higher_tf_cross_exchange_observation': telemetry.get('higher_tf_cross_exchange_observation'),
                      'subrequest_budget_passthrough': telemetry.get('subrequest_budget_passthrough'),
                  }
              else:
                  summary['checks'][label] = {
                      'ok': False,
                      'http_status': status,
                      'latency_ms': latency,
                      'error': payload.get('error'),
                      'note': 'upstream/runtime response had no candidates; no promotion decision inferred',
                  }

          print('FORWARD_SHADOW_RUNTIME_SMOKE_SUMMARY')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
