name: Crypto Forward Shadow V1.2 Runtime Smoke

on:
  push:
    branches: [research/crypto-mtf-rr-20260830]
    paths:
      - '.github/workflows/crypto-forward-shadow-runtime-smoke-20260831.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREVIEW_BASE: https://64941ef1-tv-crypto-engine.keikei99887.workers.dev
    steps:
      - uses: actions/checkout@v4

      - name: Accept KuCoin plus Gate deep replacement before HTF work
        shell: bash
        run: |
          python - <<'PY'
          # Test only the real deep-probe route. This validates the second source
          # replacement in isolation before any 1H/4H/1D code is changed.
          import json, os, time, urllib.error, urllib.request

          base = os.environ['PREVIEW_BASE'].rstrip('/')
          started = time.time()
          req = urllib.request.Request(
              base + '/market/deep-probe?symbols=BTC,ETH',
              headers={
                  'Accept': 'application/json',
                  'User-Agent': 'taistock-mcp-kucoin-gate-deep-acceptance/1',
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=120) as r:
                  body = r.read().decode('utf-8')
                  status = r.status
                  ctype = r.headers.get('content-type', '')
          except urllib.error.HTTPError as e:
              body = e.read().decode('utf-8', errors='replace')
              status = e.code
              ctype = e.headers.get('content-type', '')
          latency_ms = round((time.time() - started) * 1000)

          assert 'application/json' in ctype.lower(), (status, ctype, body[:300])
          p = json.loads(body)
          assert status == 200, (status, p)
          assert p.get('ok') is True, p
          assert p.get('requests_per_symbol') == 4, p
          assert p.get('requested_subrequest_budget') == 8, p
          assert p.get('usable_symbols') == 2, p
          assert p.get('complete_symbols') == 2, p

          results = p.get('results') or []
          assert len(results) == 2, results
          allowed_ids = {
              'kucoin_kline_5m', 'gate_kline_5m',
              'kucoin_oi_5m', 'gate_oi_5m',
          }
          summary = []
          for row in results:
              assert row.get('ok') is True, row
              assert row.get('complete') is True, row
              assert row.get('requests_total') == 4, row
              assert row.get('requests_passed') == 4, row
              ids = {x.get('id') for x in (row.get('request_status') or [])}
              assert ids == allowed_ids, (row.get('base'), ids)
              assert not any('bybit' in str(x).lower() for x in ids), ids
              assert (row.get('kucoin') or {}).get('kline_5m', {}).get('ok') is True, row
              assert (row.get('gate') or {}).get('kline_5m', {}).get('ok') is True, row
              assert (row.get('kucoin') or {}).get('oi_5m', {}).get('ok') is True, row
              assert (row.get('gate') or {}).get('oi_5m', {}).get('ok') is True, row

              alignment = row.get('oi_alignment') or {}
              assert alignment.get('ok') is True, alignment
              sources = alignment.get('sources') or {}
              assert 'kucoin' in sources and 'gate' in sources, sources

              summary.append({
                  'base': row.get('base'),
                  'requests_passed': row.get('requests_passed'),
                  'regime_5m': row.get('regime_5m'),
                  'regime_15m': row.get('regime_15m'),
                  'oi_alignment': alignment,
                  'request_status': row.get('request_status'),
              })

          # Fail if the response still exposes a Bybit deep leg anywhere.
          serialized = json.dumps(p, ensure_ascii=False).lower()
          assert 'bybit_kline_5m' not in serialized, 'legacy Bybit K-line deep request still present'
          assert 'bybit_oi_5m' not in serialized, 'legacy Bybit OI deep request still present'

          print('KUCOIN_GATE_DEEP_REPLACEMENT_ACCEPTANCE')
          print(json.dumps({
              'http_status': status,
              'latency_ms': latency_ms,
              'ok': p.get('ok'),
              'degraded': p.get('degraded'),
              'requested_subrequest_budget': p.get('requested_subrequest_budget'),
              'usable_symbols': p.get('usable_symbols'),
              'complete_symbols': p.get('complete_symbols'),
              'results': summary,
              'result': 'PASS_KUCOIN_GATE_DEEP_4REQ_PAIR',
          }, ensure_ascii=False, indent=2))
          PY
