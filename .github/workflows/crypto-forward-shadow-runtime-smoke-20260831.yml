name: Crypto Forward Shadow V1.2 Runtime Smoke

on:
  push:
    branches: [research/crypto-mtf-rr-20260830]
    paths:
      - '.github/workflows/crypto-forward-shadow-runtime-smoke-20260831.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Isolate V0.9 volatile boundary
        shell: bash
        run: |
          python - <<'PY'
          import json, re, time, urllib.error, urllib.request

          targets = {
              'v0_9': 'https://b0ce769f-tv-crypto-engine.keikei99887.workers.dev',
              'v1_1': 'https://8c6f60c4-tv-crypto-engine.keikei99887.workers.dev',
              'v1_2': 'https://b894178a-tv-crypto-engine.keikei99887.workers.dev',
          }

          def call(base, path):
              started = time.time()
              req = urllib.request.Request(base + path, headers={'Accept':'application/json','User-Agent':'taistock-mcp-volatile-isolate/1'})
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      body = r.read().decode('utf-8', errors='replace'); status = r.status; ctype = r.headers.get('content-type','')
              except urllib.error.HTTPError as e:
                  body = e.read().decode('utf-8', errors='replace'); status = e.code; ctype = e.headers.get('content-type','')
              out = {'http_status': status, 'latency_ms': round((time.time()-started)*1000), 'content_type': ctype}
              try:
                  p = json.loads(body)
                  out.update({'json': True, 'version': p.get('version'), 'stage': p.get('stage'), 'error': p.get('error'), 'candidate_count': len(p.get('candidates')) if isinstance(p.get('candidates'), list) else None})
              except Exception:
                  title = re.search(r'<title>(.*?)</title>', body, re.I|re.S)
                  out.update({'json': False, 'html_title': re.sub(r'\s+',' ',title.group(1)).strip() if title else None})
              return out

          report = {}
          for name, base in targets.items():
              report[name] = {
                  'health': call(base, '/health'),
                  'volatile': call(base, '/market/volatile-scan?per_side=1&setup=all'),
              }
          print('V0_9_VOLATILE_BOUNDARY')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
