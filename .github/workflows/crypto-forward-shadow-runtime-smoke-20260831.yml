name: Crypto Forward Shadow V1.2 Runtime Smoke

on:
  push:
    branches: [research/crypto-mtf-rr-20260830]
    paths:
      - '.github/workflows/crypto-forward-shadow-runtime-smoke-20260831.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIEW_BASE: https://20cf87be-tv-crypto-engine.keikei99887.workers.dev
    steps:
      - uses: actions/checkout@v4
      - name: Verify runtime safety and volatile fail-closed
        shell: bash
        run: |
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request
          base = os.environ['PREVIEW_BASE'].rstrip('/')

          def call(path, timeout=150):
              started = time.time()
              req = urllib.request.Request(base + path, headers={'Accept':'application/json','User-Agent':'taistock-mcp-forward-shadow-verify/1'})
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      body = r.read().decode('utf-8'); status = r.status; ctype = r.headers.get('content-type','')
              except urllib.error.HTTPError as e:
                  body = e.read().decode('utf-8', errors='replace'); status = e.code; ctype = e.headers.get('content-type','')
              elapsed = round((time.time()-started)*1000)
              assert 'application/json' in ctype.lower(), (path, status, ctype, body[:200])
              return status, json.loads(body), elapsed

          report = {'preview': base, 'checks': {}}

          status, p, ms = call('/research/forward-shadow-selftest', 30)
          assert status == 200 and p.get('ok') is True, p
          inv = p.get('invariants') or {}
          assert inv and all(inv.values()), inv
          report['checks']['selftest'] = {'ok': True, 'latency_ms': ms, 'invariants': inv}

          status, p, ms = call('/health', 30)
          assert status == 200 and p.get('version') == '1.2.0-shadow', p
          policy = p.get('forward_shadow_policy') or {}
          assert policy.get('candidate_promotion') == 'forbidden'
          assert policy.get('candidate_stage_changes') is False
          assert policy.get('added_market_requests') == 0
          report['checks']['health'] = {'ok': True, 'latency_ms': ms, 'version': p.get('version')}

          status, p, ms = call('/market/candidate-scan?per_side=1&light_limit=10')
          assert status in (200, 502), (status, p)
          assert p.get('version') == '1.2.0-shadow', p
          if isinstance(p.get('candidates'), list):
              tele = p.get('forward_shadow_telemetry') or {}
              scope = tele.get('scope') or {}; gate = tele.get('forward_gate') or {}
              assert scope.get('added_market_requests') == 0, scope
              assert scope.get('market_participation_scope') == 'selected_candidate_cohort_not_full_market', scope
              assert gate.get('threshold') is None and gate.get('decision_effect') == 'none', gate
              assert all((c.get('forward_shadow') or {}).get('can_promote') is False for c in p['candidates'])
              assert all((c.get('forward_shadow') or {}).get('changes_core_stage') is False for c in p['candidates'])
          report['checks']['stable'] = {'ok': True, 'http_status': status, 'latency_ms': ms, 'candidate_count': len(p.get('candidates')) if isinstance(p.get('candidates'), list) else None, 'error': p.get('error')}

          status, p, ms = call('/market/volatile-scan?per_side=1&setup=all')
          # The upstream may legitimately fail closed with 502 (currently one source returns 403).
          # The regression target is specifically: never turn that controlled JSON 502 into a Worker 500.
          assert status in (200, 502), (status, p)
          assert p.get('version') == '1.2.0-shadow', p
          policy = p.get('forward_shadow_policy') or {}
          assert policy.get('candidate_promotion') == 'forbidden', policy
          assert policy.get('candidate_stage_changes') is False, policy
          assert policy.get('added_market_requests') == 0, policy
          report['checks']['volatile'] = {'ok': True, 'http_status': status, 'latency_ms': ms, 'error': p.get('error'), 'candidate_count': len(p.get('candidates')) if isinstance(p.get('candidates'), list) else None, 'fail_closed_json': True}

          print('FORWARD_SHADOW_V12_POSTFIX_SMOKE')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
