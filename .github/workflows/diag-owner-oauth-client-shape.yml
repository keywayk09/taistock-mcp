name: Diagnose Owner OAuth client shapes

on:
  push:
    branches:
      - diag/owner-oauth-client-shape-20260827
    paths:
      - '.github/workflows/diag-owner-oauth-client-shape.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect sanitized OAuth KV shapes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces"
          curl --fail --silent --show-error --max-time 30 "${endpoint}?per_page=1000" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' > /tmp/oauth-kv-list.json

          kv_id="$(python - <<'PY'
          import json
          from pathlib import Path
          body=json.loads(Path('/tmp/oauth-kv-list.json').read_text())
          rows=body.get('result') or []
          preferred=[x for x in rows if x.get('title')=='taistock-mcp-OAUTH_KV']
          legacy=[x for x in rows if x.get('title')=='OAUTH_KV']
          chosen=preferred[0] if len(preferred)==1 else (legacy[0] if len(legacy)==1 else None)
          if not chosen: raise SystemExit('oauth_kv_not_resolved')
          print(chosen['id'])
          PY
          )"
          export OAUTH_KV_ID="$kv_id"

          curl --fail --silent --show-error --max-time 30 \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${kv_id}/keys?limit=1000" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" > /tmp/all-keys.json

          python - <<'PY'
          import collections, json, os
          from pathlib import Path
          rows=(json.loads(Path('/tmp/all-keys.json').read_text()).get('result') or [])
          counts=collections.Counter()
          for row in rows:
              name=str(row.get('name') or '')
              prefix=name.split(':',1)[0] if ':' in name else name[:40]
              counts[prefix]+=1
          print(f'ALL_KEY_COUNT={len(rows)}')
          for key,count in counts.most_common():
              print(f'KEY_FAMILY {key}={count}')
          PY

          curl --fail --silent --show-error --max-time 30 \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${kv_id}/keys?prefix=client%3A&limit=1000" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" > /tmp/client-keys.json

          python - <<'PY'
          import hashlib, json, os, re, urllib.parse, urllib.request
          from pathlib import Path
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          token=os.environ['CLOUDFLARE_API_TOKEN']
          kv=os.environ['OAUTH_KV_ID']
          rows=(json.loads(Path('/tmp/client-keys.json').read_text()).get('result') or [])
          opaque=re.compile(r'^[A-Za-z0-9._~-]{8,256}$')
          callback=re.compile(r'^/connector/oauth/[A-Za-z0-9_-]{8,256}$')
          legacy='/connector_platform_oauth_redirect'
          public_count=0
          confidential_count=0
          for i,row in enumerate(rows):
              name=str(row.get('name') or '')
              if not name.startswith('client:'): continue
              cid=name[7:]
              digest=hashlib.sha256(cid.encode()).hexdigest()[:10]
              key=urllib.parse.quote(name, safe='')
              url=f'https://api.cloudflare.com/client/v4/accounts/{account}/storage/kv/namespaces/{kv}/values/{key}'
              req=urllib.request.Request(url, headers={'Authorization':f'Bearer {token}'})
              with urllib.request.urlopen(req, timeout=20) as resp:
                  rec=json.loads(resp.read().decode('utf-8'))
              redirects=rec.get('redirectUris') or rec.get('redirect_uris') or []
              auth=rec.get('tokenEndpointAuthMethod') or rec.get('token_endpoint_auth_method')
              if auth=='none': public_count+=1
              if auth in {'client_secret_basic','client_secret_post'}: confidential_count+=1
              for r in redirects:
                  u=urllib.parse.urlsplit(str(r))
                  host=u.hostname or ''
                  path=u.path or ''
                  trusted=host in {'chatgpt.com','chat.openai.com'} and (bool(callback.fullmatch(path)) or path==legacy) and u.scheme=='https' and not u.query and not u.fragment
                  if host in {'chatgpt.com','chat.openai.com'}:
                      print(f'CHATGPT_CLIENT id_hash={digest} opaque_ok={bool(opaque.fullmatch(cid))} redirect_ok={trusted} auth={auth}')
          print(f'CHATGPT_PUBLIC_CLIENTS={public_count}')
          print(f'CHATGPT_CONFIDENTIAL_CLIENTS={confidential_count}')
          PY
