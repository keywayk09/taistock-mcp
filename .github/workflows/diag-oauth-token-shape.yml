name: Diagnose OAuth token record ownership

on:
  push:
    branches:
      - diag/owner-oauth-production-state-20260827

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect token record shape without token values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,urllib.parse,urllib.request
          token=os.environ['CLOUDFLARE_API_TOKEN']; acct=os.environ['CLOUDFLARE_ACCOUNT_ID']
          H={'Authorization':f'Bearer {token}'}
          root=f'https://api.cloudflare.com/client/v4/accounts/{acct}/storage/kv/namespaces'
          def http(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=H),timeout=20) as r:return r.read().decode('utf-8','replace')
          rows=json.loads(http(root+'?per_page=1000')).get('result') or []
          p=[x for x in rows if x.get('title')=='taistock-mcp-OAUTH_KV']; l=[x for x in rows if x.get('title')=='OAUTH_KV']
          chosen=p[0] if len(p)==1 else (l[0] if len(l)==1 else None)
          if not chosen: raise SystemExit('oauth_kv_not_resolved')
          base=root+'/'+chosen['id']
          def keys(prefix):return json.loads(http(base+'/keys?prefix='+urllib.parse.quote(prefix,safe='')+'&limit=1000')).get('result') or []
          def val(k):
              raw=http(base+'/values/'+urllib.parse.quote(k,safe=''))
              try:return json.loads(raw)
              except Exception:return {'_raw_type':'non_json','_raw_len':len(raw)}
          def h(v):return hashlib.sha256(str(v).encode()).hexdigest()[:12] if v else 'none'
          for row in keys('token:'):
              key=row.get('name','')
              t=val(key)
              fields=sorted(t.keys()) if isinstance(t,dict) else []
              safe=[]
              for name in ['userId','grantId','resource','scope','expiresAt','createdAt','type','kind']:
                  if name not in t: continue
                  v=t.get(name)
                  if name in ('grantId',): v='hash:'+h(v)
                  elif name=='scope' and isinstance(v,list): v='|'.join(v)
                  safe.append(f'{name}={v}')
              print('TOKEN_RECORD',f'key_hash={h(key)}',f'fields={"|".join(fields)}',*safe)
          PY
