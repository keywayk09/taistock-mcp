name: Crypto MTF Regime Quality V14

on:
  push:
    branches: [research/crypto-mtf-rr-20260830]
    paths:
      - '.github/workflows/crypto-mtf-regime-quality-v14.yml'
      - 'research/crypto_mtf_regime_quality_v14.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run 60d regime quality holdout
        run: python research/crypto_mtf_regime_quality_v14.py
      - name: Upload regime quality report
        uses: actions/upload-artifact@v4
        with:
          name: crypto-mtf-regime-quality-v14
          path: /tmp/crypto_mtf_regime_quality_v14.json
          retention-days: 3
