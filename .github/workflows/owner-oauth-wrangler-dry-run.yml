name: One-shot Owner OAuth Wrangler dry run

on:
  pull_request:

permissions:
  contents: read

jobs:
  dry-run:
    if: github.head_ref == 'fix/owner-oauth-effective-scope-20260827'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Wrangler deployment graph dry run
        run: npx wrangler deploy --dry-run --outdir /tmp/owner-oauth-dry-run
