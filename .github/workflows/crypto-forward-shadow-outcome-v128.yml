name: Crypto Forward Shadow V1.3.0 Outcome Review

on:
  # Keep push/manual paths for operator diagnostics. The canonical recurring
  # path is the GitHub-native scheduler on the default branch.
  push:
    branches: [research/crypto-mtf-rr-20260830]
    paths:
      - 'research/crypto_forward_shadow_outcome_v128.py'
      - '.github/workflows/crypto-forward-shadow-outcome-v128.yml'
      - 'research/crypto_forward_shadow_outcome_daily_tick.txt'
  workflow_dispatch:
  # Called directly by the native scheduler; no connector write/tick mutation
  # is needed for recurring daily matured-outcome review.
  workflow_call:

permissions:
  contents: read
  actions: read

concurrency:
  group: crypto-forward-shadow-v130-outcome
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OBSERVATION_LOOKBACK_HOURS: '96'
      MIN_AGE_HOURS: '24'
      MAX_AGE_HOURS: '72'
    steps:
      - uses: actions/checkout@v4

      - name: Locate recent aggregate observation artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/crypto-forward-observations
          python - <<'PY' > /tmp/crypto-forward-artifact-ids.txt
          # Transitional review accepts the old V1.2.8 aggregate artifacts for
          # diagnostics and new V1.3.0 artifacts for future promotion evidence.
          # No raw market archive is created.
          import json, os, urllib.request
          from datetime import datetime, timedelta, timezone

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          cutoff = datetime.now(timezone.utc) - timedelta(hours=float(os.environ['OBSERVATION_LOOKBACK_HOURS']))
          prefixes = (
              'crypto-forward-shadow-v128-observation-',
              'crypto-forward-shadow-v130-observation-',
          )
          page = 1
          found = []
          while page <= 8:
              url = f'https://api.github.com/repos/{repo}/actions/artifacts?per_page=100&page={page}'
              req = urllib.request.Request(url, headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'crypto-forward-shadow-v130-outcome',
              })
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = json.load(response)
              rows = body.get('artifacts') or []
              if not rows:
                  break
              stop = False
              for row in rows:
                  created = datetime.fromisoformat(str(row.get('created_at')).replace('Z', '+00:00'))
                  if created < cutoff:
                      stop = True
                      continue
                  if str(row.get('name') or '').startswith(prefixes) and not row.get('expired'):
                      found.append((created, int(row['id'])))
              if stop:
                  break
              page += 1
          for _, artifact_id in sorted(set(found)):
              print(artifact_id)
          PY

          count="$(grep -c . /tmp/crypto-forward-artifact-ids.txt || true)"
          echo "recent observation artifacts: ${count}"
          test "$count" -gt 0

      - name: Download recent aggregate observations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          while read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            zip="/tmp/crypto-forward-${artifact_id}.zip"
            dest="/tmp/crypto-forward-observations/${artifact_id}"
            mkdir -p "$dest"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$zip"
            unzip -q "$zip" -d "$dest"
            rm -f "$zip"
          done < /tmp/crypto-forward-artifact-ids.txt
          find /tmp/crypto-forward-observations -type f -name '*.json' | wc -l

      - name: Evaluate matured forward outcomes
        shell: bash
        run: |
          set -euo pipefail
          python research/crypto_forward_shadow_outcome_v128.py \
            --observation-dir /tmp/crypto-forward-observations \
            --min-age-hours "$MIN_AGE_HOURS" \
            --max-age-hours "$MAX_AGE_HOURS" \
            --out crypto-forward-outcome-v130.json

      - name: Validate outcome schema and no-raw-storage policy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(Path('crypto-forward-outcome-v130.json').read_text(encoding='utf-8'))
          assert p.get('schema_version') == 'crypto-forward-outcome-v1', p
          assert p.get('shadow_version') in {'1.2.8-shadow', '1.3.0-shadow', 'mixed'}, p
          versions = set(p.get('observation_shadow_versions') or [])
          assert versions and versions.issubset({'1.2.8-shadow', '1.3.0-shadow'}), versions
          assert p.get('research_only') is True, p
          assert p.get('production_promotion') is False, p

          storage = p.get('storage_policy') or {}
          assert storage.get('raw_tickers') == 'not_persisted', storage
          assert storage.get('raw_klines') == 'not_persisted', storage
          assert storage.get('raw_oi_series') == 'not_persisted', storage
          assert storage.get('aggregate_outcomes_only') is True, storage
          assert storage.get('permanent_archive') is False, storage

          price = p.get('price_evaluation') or {}
          assert price.get('sources') == ['kucoin_futures_5m', 'mexc_futures_5m'], price
          assert price.get('raw_market_series_persisted') is False, price
          assert price.get('rr_policy_metrics') == 'not_computed_without_frozen_entry_stop_receipt', price

          # Old V1.2.8 records are allowed only as diagnostics. They can never
          # enter promotion statistics after the source-repair boundary.
          for row in p.get('records') or []:
              if row.get('shadow_version') != '1.3.0-shadow':
                  assert row.get('promotion_statistics_eligible') is False, row

          window = p.get('observation_window') or {}
          assert int(window.get('observation_count') or 0) > 0, window
          serialized = json.dumps(p, ensure_ascii=False).lower()
          for forbidden in ['raw_candles', 'raw_ticker_rows', 'api.bybit.com', 'api.bytick.com', 'gate_futures_5m']:
              assert forbidden not in serialized, forbidden

          print('CRYPTO_FORWARD_OUTCOME_SCHEMA_ACCEPTANCE')
          print(json.dumps({
              'observation_versions': sorted(versions),
              'observation_count': window.get('observation_count'),
              'candidate_count': window.get('candidate_count'),
              'summary_rows': len(p.get('summary') or []),
              'promotion_statistics_eligible': sum(1 for row in p.get('records') or [] if row.get('promotion_statistics_eligible')),
              'result': 'PASS_FORWARD_OUTCOME_SCHEMA_V130',
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload aggregate outcome artifact
        uses: actions/upload-artifact@v4
        with:
          name: crypto-forward-shadow-v130-outcome-${{ github.run_id }}
          path: crypto-forward-outcome-v130.json
          retention-days: 30
          if-no-files-found: error
