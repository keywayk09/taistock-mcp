name: Family Plugin MCP DCR OAuth E2E 20260823

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  plugin-dcr-oauth-e2e:
    if: github.head_ref == 'fix/family-plugin-oauth-dcr-recovery-v2-20260823'
    runs-on: ubuntu-latest
    env:
      BASE_URL: http://127.0.0.1:8787
      FAMILY_SECRET: isolated-plugin-test-secret-never-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      - name: Build local Workers config
        shell: bash
        run: |
          set -euo pipefail
          cat > wrangler.family-plugin-oauth-local.jsonc <<'EOF'
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "taistock-mcp-family-plugin-oauth-local",
            "main": "src/index-v6.ts",
            "compatibility_date": "2025-03-10",
            "compatibility_flags": ["nodejs_compat", "global_fetch_strictly_public"],
            "vars": {
              "RESEARCH_MAX_SYMBOLS":"40",
              "RESEARCH_MAX_ONE_MINUTE":"8",
              "GITHUB_DATA_REPO":"keywayk09/tv-papertrader",
              "GITHUB_DATA_BRANCH":"main",
              "FAMILY_OAUTH_LOGIN_SECRET":"isolated-plugin-test-secret-never-production"
            },
            "kv_namespaces": [{"binding":"OAUTH_KV","id":"00000000000000000000000000000000"}],
            "exports": {
              "MyMCP":{"type":"durable-object","storage":"sqlite"},
              "FamilyMCP":{"type":"durable-object","storage":"sqlite"}
            },
            "durable_objects": {
              "bindings":[
                {"class_name":"MyMCP","name":"MCP_OBJECT"},
                {"class_name":"FamilyMCP","name":"FAMILY_MCP_OBJECT"}
              ]
            },
            "observability":{"enabled":false}
          }
          EOF

      - name: Start local Workers runtime
        shell: bash
        run: |
          set -euo pipefail
          nohup npx wrangler dev --local --config wrangler.family-plugin-oauth-local.jsonc --ip 127.0.0.1 --port 8787 --persist-to /tmp/family-plugin-oauth-state > /tmp/wrangler-local.log 2>&1 &
          echo $! > /tmp/wrangler-local.pid
          for i in $(seq 1 60); do
            if curl -fsS --max-time 2 "$BASE_URL/health" >/tmp/local-health.json 2>/dev/null; then
              python - <<'PY'
          import json
          from pathlib import Path
          body=json.loads(Path('/tmp/local-health.json').read_text())
          assert body.get('status') == 'ok', body
          print('LOCAL_WORKER_READY=PASS')
          PY
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wrangler-local.log
          exit 1

      - name: Build Plugin MCP OAuth requests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, os, urllib.parse
          from pathlib import Path
          base=os.environ['BASE_URL']

          def challenge(verifier):
              return base64.urlsafe_b64encode(hashlib.sha256(verifier.encode()).digest()).rstrip(b'=').decode()

          verifier1='mom-plugin-dcr-verifier-' + 'a'*48
          callback1='https://chatgpt.com/connector/oauth/familypluginrecovery20260823'
          params1={
              'response_type':'code',
              'client_id':'41i_gRq63zL6r2tO',
              'redirect_uri':callback1,
              'state':'mom-plugin-dcr-state-20260823',
              'code_challenge':challenge(verifier1),
              'code_challenge_method':'S256',
              'resource':base+'/family-mcp',
          }
          q1=urllib.parse.urlencode(params1)
          Path('/tmp/query1.txt').write_text(q1)
          Path('/tmp/url1.txt').write_text(base+'/authorize?'+q1)
          Path('/tmp/verifier1.txt').write_text(verifier1)
          Path('/tmp/callback1.txt').write_text(callback1)

          verifier2='legacy-plugin-dcr-verifier-' + 'b'*48
          callback2='https://chat.openai.com/connector_platform_oauth_redirect'
          params2={
              'response_type':'code',
              'client_id':'legacyPluginClient20260823',
              'redirect_uri':callback2,
              'scope':'offline_access family:read',
              'state':'legacy-plugin-state-20260823',
              'code_challenge':challenge(verifier2),
              'code_challenge_method':'S256',
              'resource':base+'/family-mcp',
          }
          q2=urllib.parse.urlencode(params2)
          Path('/tmp/query2.txt').write_text(q2)
          Path('/tmp/url2.txt').write_text(base+'/authorize?'+q2)
          Path('/tmp/verifier2.txt').write_text(verifier2)
          Path('/tmp/callback2.txt').write_text(callback2)

          bad=dict(params1)
          bad['client_id']='unsupportedScopeClient20260823'
          bad['scope']='files:write'
          badq=urllib.parse.urlencode(bad)
          Path('/tmp/bad-url.txt').write_text(base+'/authorize?'+badq)
          PY

      - name: Missing DCR client with omitted scope renders Plugin login
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --max-time 20 -sS -D /tmp/get1.headers -o /tmp/get1.html -w '%{http_code}' "$(cat /tmp/url1.txt)")"
          echo "MISSING_DCR_NO_SCOPE_HTTP=${code}"
          test "$code" = '200'
          grep -q '家人連線驗證碼' /tmp/get1.html
          grep -q 'ChatGPT Family Plugin / MCP App' /tmp/get1.html
          ! grep -q 'Invalid client_id' /tmp/get1.html
          echo 'MISSING_DCR_NO_SCOPE_LOGIN=PASS'

      - name: Unsupported scope remains rejected with safe diagnostic
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --max-time 20 -sS -D /tmp/bad.headers -o /tmp/bad.html -w '%{http_code}' "$(cat /tmp/bad-url.txt)")"
          echo "UNSUPPORTED_SCOPE_HTTP=${code}"
          test "$code" = '400'
          grep -q 'FAM-OAUTH-DIAG' /tmp/bad.html
          grep -q 'scope=unsupported' /tmp/bad.html
          ! grep -q '家人連線驗證碼' /tmp/bad.html
          ! grep -q 'unsupportedScopeClient20260823' /tmp/bad.html
          echo 'UNSUPPORTED_SCOPE_FAIL_CLOSED=PASS'

      - name: Wrong Family secret cannot restore missing client
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --max-time 20 -sS -o /tmp/wrong.html -w '%{http_code}' -X POST "$BASE_URL/authorize" \
            -H 'content-type: application/x-www-form-urlencoded' \
            --data-urlencode "oauth_query=$(cat /tmp/query1.txt)" \
            --data-urlencode 'login_secret=definitely-wrong')"
          test "$code" = '200'
          grep -q '驗證碼錯誤' /tmp/wrong.html
          echo 'WRONG_SECRET_REJECTED=PASS'

      - name: Correct Family secret restores missing DCR client
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --max-time 30 -sS -D /tmp/auth1.headers -o /tmp/auth1.body -w '%{http_code}' -X POST "$BASE_URL/authorize" \
            -H 'content-type: application/x-www-form-urlencoded' \
            --data-urlencode "oauth_query=$(cat /tmp/query1.txt)" \
            --data-urlencode "login_secret=$FAMILY_SECRET")"
          echo "RESTORE_DCR_AUTH_HTTP=${code}"
          test "$code" = '302'
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse, parse_qs
          headers=Path('/tmp/auth1.headers').read_text().splitlines()
          loc=next(x.split(':',1)[1].strip() for x in headers if x.lower().startswith('location:'))
          u=urlparse(loc); q=parse_qs(u.query)
          assert u.hostname == 'chatgpt.com', loc
          assert u.path == '/connector/oauth/familypluginrecovery20260823', loc
          code=q.get('code',[''])[0]
          assert code, loc
          assert q.get('state',[''])[0] == 'mom-plugin-dcr-state-20260823', loc
          Path('/tmp/code1.txt').write_text(code)
          print('RESTORED_DCR_AUTH_CODE=PASS')
          PY

      - name: Public PKCE token exchange succeeds after recovery
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --max-time 30 -sS -o /tmp/token1.json -w '%{http_code}' -X POST "$BASE_URL/oauth/token" \
            -H 'content-type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=authorization_code' \
            --data-urlencode 'client_id=41i_gRq63zL6r2tO' \
            --data-urlencode "code=$(cat /tmp/code1.txt)" \
            --data-urlencode "code_verifier=$(cat /tmp/verifier1.txt)" \
            --data-urlencode "redirect_uri=$(cat /tmp/callback1.txt)" \
            --data-urlencode "resource=$BASE_URL/family-mcp")"
          echo "RESTORED_DCR_TOKEN_HTTP=${code}"
          test "$code" = '200'
          python - <<'PY'
          import json
          from pathlib import Path
          body=json.loads(Path('/tmp/token1.json').read_text())
          assert isinstance(body.get('access_token'),str) and body['access_token'], body
          assert body.get('token_type','').lower() == 'bearer', body
          scope=str(body.get('scope') or '')
          assert 'family:read' in scope, body
          assert 'files:write' not in scope, body
          print('RESTORED_DCR_PKCE_TOKEN=PASS')
          PY

      - name: Legacy host plus offline_access remains compatible
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --max-time 20 -sS -o /tmp/get2.html -w '%{http_code}' "$(cat /tmp/url2.txt)")"
          echo "LEGACY_COMPAT_GET_HTTP=${code}"
          test "$code" = '200'
          grep -q 'ChatGPT Family Plugin / MCP App' /tmp/get2.html

          code="$(curl --max-time 30 -sS -D /tmp/auth2.headers -o /tmp/auth2.body -w '%{http_code}' -X POST "$BASE_URL/authorize" \
            -H 'content-type: application/x-www-form-urlencoded' \
            --data-urlencode "oauth_query=$(cat /tmp/query2.txt)" \
            --data-urlencode "login_secret=$FAMILY_SECRET")"
          test "$code" = '302'
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse,parse_qs
          headers=Path('/tmp/auth2.headers').read_text().splitlines()
          loc=next(x.split(':',1)[1].strip() for x in headers if x.lower().startswith('location:'))
          u=urlparse(loc); q=parse_qs(u.query)
          assert u.hostname == 'chat.openai.com', loc
          assert u.path == '/connector_platform_oauth_redirect', loc
          code=q.get('code',[''])[0]
          assert code,loc
          Path('/tmp/code2.txt').write_text(code)
          print('LEGACY_COMPAT_AUTH_CODE=PASS')
          PY

          code="$(curl --max-time 30 -sS -o /tmp/token2.json -w '%{http_code}' -X POST "$BASE_URL/oauth/token" \
            -H 'content-type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=authorization_code' \
            --data-urlencode 'client_id=legacyPluginClient20260823' \
            --data-urlencode "code=$(cat /tmp/code2.txt)" \
            --data-urlencode "code_verifier=$(cat /tmp/verifier2.txt)" \
            --data-urlencode "redirect_uri=$(cat /tmp/callback2.txt)" \
            --data-urlencode "resource=$BASE_URL/family-mcp")"
          echo "LEGACY_COMPAT_TOKEN_HTTP=${code}"
          test "$code" = '200'
          python - <<'PY'
          import json
          from pathlib import Path
          body=json.loads(Path('/tmp/token2.json').read_text())
          scope=str(body.get('scope') or '')
          assert 'family:read' in scope, body
          assert 'offline_access' not in scope, body
          print('LEGACY_COMPAT_TOKEN_READ_ONLY=PASS')
          PY

      - name: Stop local runtime
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/wrangler-local.pid ]; then kill "$(cat /tmp/wrangler-local.pid)" 2>/dev/null || true; fi
          if [ "${{ job.status }}" != 'success' ]; then
            echo '--- wrangler local log ---'
            tail -250 /tmp/wrangler-local.log || true
          fi
