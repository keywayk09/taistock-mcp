name: Full Market Smoke Budget RED

on:
  push:
    branches:
      - fix/production-smoke-budget-20260902
    paths:
      - tests/deploy-cloudflare-full-market-smoke-budget.test.ts
      - .github/workflows/full-market-smoke-budget-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove current smoke budget is unsafe
        run: node --experimental-strip-types tests/deploy-cloudflare-full-market-smoke-budget.test.ts
