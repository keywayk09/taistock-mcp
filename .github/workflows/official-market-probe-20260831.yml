name: Official Market Probe 20260831

on:
  push:
    branches:
      - 'automation-research-relay*'
    paths:
      - 'runtime/official-probe/requests/**.json'

permissions:
  contents: write

concurrency:
  group: official-market-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Probe official TWSE and TPEx endpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, urllib.request

          out = pathlib.Path('runtime/official-probe/results/2026-08-31-3624-v2.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          urls = {
            'twse_openapi': 'https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL',
            'tpex_openapi': 'https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes',
            'twse_stock_day': 'https://www.twse.com.tw/rwd/zh/afterTrading/STOCK_DAY?date=20260831&stockNo=3624&response=json',
            'twse_mi_index': 'https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date=20260831&type=ALLBUT0999&response=json',
            'tpex_historical': 'https://www.tpex.org.tw/web/stock/aftertrading/otc_quotes_no1430/stk_wn1430_result.php?l=zh-tw&d=115%2F08%2F31&se=EW&o=json',
          }
          result = {}
          for name, url in urls.items():
            item = {'url': url}
            try:
              req = urllib.request.Request(url, headers={
                'Accept': 'application/json',
                'Cache-Control': 'no-cache',
                'User-Agent': 'Mozilla/5.0 official-market-probe/1.1',
              })
              with urllib.request.urlopen(req, timeout=30) as r:
                raw = r.read()
                item['http_status'] = r.status
                item['final_url'] = r.geturl()
                item['bytes'] = len(raw)
              body = json.loads(raw.decode('utf-8-sig', errors='strict'))
              item['json_type'] = type(body).__name__
              rows = body if isinstance(body, list) else body.get('data', []) if isinstance(body, dict) else []
              item['row_count'] = len(rows) if isinstance(rows, list) else 0
              if isinstance(rows, list) and rows and isinstance(rows[0], dict):
                item['sample_keys'] = list(rows[0].keys())[:30]
                item['distinct_dates_sample'] = sorted({str(x.get('Date','')).strip() for x in rows[:1000] if isinstance(x, dict) and x.get('Date')})[:10]
                for row in rows:
                  if not isinstance(row, dict):
                    continue
                  code = str(row.get('Code', row.get('SecuritiesCompanyCode', ''))).strip()
                  if code == '3624':
                    item['symbol_3624'] = {k: row.get(k) for k in ['Date','Code','SecuritiesCompanyCode','Name','CompanyName','OpeningPrice','HighestPrice','LowestPrice','ClosingPrice','Open','High','Low','Close','TradingShares'] if k in row}
                    break
              elif isinstance(body, dict):
                item['top_keys'] = list(body.keys())[:30]
                item['stat'] = body.get('stat')
                item['date'] = body.get('date')
                if name == 'twse_stock_day':
                  item['data_first'] = (body.get('data') or [None])[0]
                if name == 'twse_mi_index':
                  tables = body.get('tables') or []
                  item['table_count'] = len(tables)
                  item['tables'] = []
                  for idx, table in enumerate(tables):
                    fields = table.get('fields') or []
                    data = table.get('data') or []
                    t = {'index': idx, 'title': table.get('title'), 'fields': fields[:30], 'row_count': len(data)}
                    if fields and data:
                      for row in data:
                        if isinstance(row, list) and row and any(str(x).strip() == '3624' for x in row[:3]):
                          t['symbol_3624_row'] = row
                          break
                    item['tables'].append(t)
                if name == 'tpex_historical':
                  tables = body.get('tables') or []
                  item['table_count'] = len(tables)
                  if tables:
                    item['fields'] = tables[0].get('fields')
                    for row in tables[0].get('data') or []:
                      if isinstance(row, list) and row and str(row[0]).strip() == '3624':
                        item['symbol_3624_row'] = row
                        break
              item['ok'] = True
            except Exception as e:
              item['ok'] = False
              item['error_type'] = type(e).__name__
              item['error'] = str(e)[:500]
            result[name] = item
          out.write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY
      - name: Commit probe result
        shell: bash
        run: |
          set -euo pipefail
          git add runtime/official-probe/results/2026-08-31-3624-v2.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'diag: write official market probe v2 result'
          git push origin "HEAD:${GITHUB_REF_NAME}"
