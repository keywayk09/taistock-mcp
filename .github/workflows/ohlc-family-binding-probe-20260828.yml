name: OHLC Family Binding Probe 20260828

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ohlc-family-binding-probe-20260828.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler
        run: npm install
      - name: Deploy isolated read-only binding probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ohlc-family-probe
          cat > /tmp/ohlc-family-probe/worker.mjs <<'JS'
          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              if (url.pathname !== '/probe') return new Response('not_found', { status: 404 });
              try {
                // Read-only canonical research call. No write method is exposed by OhlcFamilyReadService.
                const result = await env.OHLC_FAMILY.readOhlc({
                  symbol: '2426',
                  timeframe: '1m',
                  mode: 'research',
                  trade_date: '2026-08-27',
                  decision_time: '10:00',
                  limit: 300,
                });
                // Never expose market bars from this diagnostic worker.
                const proof = {
                  ok: result?.ok === true,
                  data_status: result?.data_status ?? null,
                  mode: result?.mode ?? null,
                  formal_blind_eligible: result?.formal_blind_eligible === true,
                  formal_research_eligible: result?.formal_research_eligible === true,
                  cutoff: result?.cutoff ?? null,
                  verification: result?.verification ?? null,
                  dataset_id: result?.dataset_id ?? null,
                  dataset_version: result?.dataset_version ?? null,
                };
                return Response.json(proof);
              } catch (error) {
                return Response.json({ ok: false, error: String(error?.message || error) }, { status: 502 });
              }
            }
          };
          JS
          cat > /tmp/ohlc-family-probe/wrangler.jsonc <<'JSON'
          {
            "$schema": "./node_modules/wrangler/config-schema.json",
            "name": "ohlc-family-binding-probe-20260828",
            "main": "worker.mjs",
            "compatibility_date": "2026-08-28",
            "workers_dev": true,
            "services": [
              {
                "binding": "OHLC_FAMILY",
                "service": "tv-fugle-1d",
                "entrypoint": "OhlcFamilyReadService"
              }
            ]
          }
          JSON
          cd /tmp/ohlc-family-probe
          "$GITHUB_WORKSPACE/node_modules/.bin/wrangler" deploy --config wrangler.jsonc
      - name: Invoke canonical research proof through binding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request, time
          url='https://ohlc-family-binding-probe-20260828.keikei99887.workers.dev/probe'
          last=None
          for attempt in range(1,6):
              try:
                  req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'ohlc-family-binding-probe/1'})
                  with urllib.request.urlopen(req,timeout=30) as r:
                      raw=r.read().decode('utf-8-sig'); status=r.status
                  body=json.loads(raw)
                  print(json.dumps({'attempt':attempt,'status':status,'body':body},ensure_ascii=False))
                  if status==200:
                      last=body
                      break
              except Exception as e:
                  print(f'attempt={attempt} error={e}')
              time.sleep(2)
          if not isinstance(last,dict): raise RuntimeError('binding_probe_no_response')
          if last.get('ok') is not True: raise RuntimeError('canonical_read_not_ok:'+str(last))
          cutoff=last.get('cutoff') or {}
          verification=last.get('verification') or {}
          if cutoff.get('leakage_validated') is not True: raise RuntimeError('leakage_not_validated')
          prefix=cutoff.get('prefix_completeness')
          prefix_ok = prefix is True or (isinstance(prefix,dict) and prefix.get('complete') is True)
          if not prefix_ok: raise RuntimeError('prefix_not_complete:'+str(prefix))
          if last.get('formal_blind_eligible') is not True: raise RuntimeError('formal_blind_not_eligible:'+str(last))
          if verification.get('accepted_for_research') is not True: raise RuntimeError('official_verification_not_accepted:'+str(verification))
          print('OHLC_FAMILY_BINDING_FORMAL_BLIND_PASS')
          PY
      - name: Delete isolated probe worker
        if: always()
        shell: bash
        run: |
          set +e
          cd /tmp/ohlc-family-probe 2>/dev/null || exit 0
          "$GITHUB_WORKSPACE/node_modules/.bin/wrangler" delete --config wrangler.jsonc --force
