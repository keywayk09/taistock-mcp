name: Recover taistock-mcp Cloudflare deploy

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: taistock-mcp-cloudflare-watchdog
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect stale or failed Production
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          receipt='tmp/deploy-receipts/taistock-mcp-cloudflare.json'
          dispatch=false
          reason='up_to_date'

          if [ ! -f "$receipt" ]; then
            dispatch=true
            reason='missing_receipt'
          else
            readarray -t meta < <(python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          body=json.loads(Path('tmp/deploy-receipts/taistock-mcp-cloudflare.json').read_text())
          sha=str(body.get('source_sha') or '')
          reason=str(body.get('reason') or '')
          recorded=str(body.get('recorded_at') or '')
          age=10**9
          if recorded:
              try:
                  dt=datetime.fromisoformat(recorded.replace('Z','+00:00'))
                  age=max(0,int((datetime.now(timezone.utc)-dt).total_seconds()))
              except Exception:
                  pass
          print(sha)
          print(reason)
          print(age)
          PY
            )
            receipt_sha="${meta[0]:-}"
            receipt_reason="${meta[1]:-}"
            receipt_age="${meta[2]:-999999}"

            if [ -z "$receipt_sha" ] || ! git cat-file -e "${receipt_sha}^{commit}" 2>/dev/null; then
              dispatch=true
              reason='invalid_receipt_sha'
            elif ! git diff --quiet "$receipt_sha" HEAD -- \
              src \
              wrangler.jsonc \
              package.json \
              package-lock.json \
              .github/workflows/deploy-cloudflare-production.yml; then
              dispatch=true
              reason='production_source_stale'
            elif [ "$receipt_reason" != 'DEPLOYED_CRON_AND_FULL_MARKET_SMOKE_VERIFIED' ] \
              && [ "$receipt_reason" != 'DEPLOYED_OAUTH_KV_AND_CRON_VERIFIED' ] \
              && [ "$receipt_age" -ge 900 ]; then
              dispatch=true
              reason='failed_receipt_retry_due'
            fi
          fi

          echo "dispatch=${dispatch}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"
          echo "watchdog decision: dispatch=${dispatch} reason=${reason}"

      - name: Dispatch latest Production workflow
        if: steps.detect.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy-cloudflare-production.yml --ref main
          echo "dispatched Production recovery: ${{ steps.detect.outputs.reason }}"

      - name: Dispatch hourly Crypto Shadow observation
        # This auxiliary bridge is deliberately non-blocking: a Shadow telemetry
        # issue must never change the Production watchdog's success/failure state.
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          workflow='crypto-forward-shadow-observation-v128.yml'

          # Use only bridge/manual workflow_dispatch runs for cadence accounting.
          # Push smokes validate code changes but do not count as hourly evidence.
          payload="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?event=workflow_dispatch&per_page=1" 2>/dev/null || printf '{"workflow_runs":[]}')"
          readarray -t meta < <(PAYLOAD="$payload" python - <<'PY'
          import json, os
          from datetime import datetime, timezone

          body=json.loads(os.environ.get('PAYLOAD') or '{"workflow_runs":[]}')
          runs=body.get('workflow_runs') or []
          if not runs:
              print(0)
              print('none')
              print('none')
              print(10**9)
          else:
              run=runs[0]
              created=str(run.get('created_at') or '')
              age=10**9
              if created:
                  try:
                      dt=datetime.fromisoformat(created.replace('Z','+00:00'))
                      age=max(0,int((datetime.now(timezone.utc)-dt).total_seconds()))
                  except Exception:
                      pass
              print(1)
              print(str(run.get('status') or 'unknown'))
              print(str(run.get('conclusion') or 'none'))
              print(age)
          PY
          )

          count="${meta[0]:-0}"
          status="${meta[1]:-none}"
          conclusion="${meta[2]:-none}"
          age="${meta[3]:-999999999}"
          dispatch=false
          reason='fresh_hourly_observation'

          if [ "$count" = '0' ]; then
            dispatch=true
            reason='bootstrap_no_dispatch_observation'
          elif [ "$status" = 'queued' ] || [ "$status" = 'in_progress' ]; then
            reason='observation_already_running'
          elif [ "$conclusion" = 'success' ] && [ "$age" -ge 3300 ]; then
            dispatch=true
            reason='hourly_observation_due'
          elif [ "$conclusion" != 'success' ] && [ "$age" -ge 600 ]; then
            dispatch=true
            reason='failed_observation_retry_due'
          fi

          echo "crypto shadow bridge: dispatch=${dispatch} reason=${reason} status=${status} conclusion=${conclusion} age_s=${age}"
          if [ "$dispatch" = 'true' ]; then
            gh workflow run "$workflow" --ref main
            echo "dispatched Crypto Forward Shadow V1.2.8 observation"
          fi
