name: Crypto MTF Focused V4

on:
  push:
    branches: [research/crypto-mtf-rr-20260830]
    paths:
      - '.github/workflows/crypto-mtf-focused-v4.yml'
      - 'research/crypto_mtf_focused_v4.py'
      - 'research/crypto_mtf_robustness_v8.py'
      - 'research/gate_history.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run focused MTF execution research
        run: python research/crypto_mtf_focused_v4.py
      - name: Run robustness and cost-stress research
        run: python research/crypto_mtf_robustness_v8.py
      - name: Upload focused report
        uses: actions/upload-artifact@v4
        with:
          name: crypto-mtf-focused-v4
          path: |
            /tmp/crypto_mtf_focused_v4.json
            /tmp/crypto_mtf_robustness_v8.json
          retention-days: 3
