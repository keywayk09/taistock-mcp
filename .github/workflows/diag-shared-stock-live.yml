name: Shared Stock Live Diagnostic

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'wrangler.jsonc'
      - '.github/workflows/diag-shared-stock-live.yml'

permissions:
  contents: read

jobs:
  research-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Research test with failure receipt
        id: research
        shell: bash
        run: |
          set +e
          npm run test:research 2>&1 | tee /tmp/research.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"
      - name: Upload research failure receipt
        if: failure() && steps.research.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: research-error
          path: /tmp/research.log
          if-no-files-found: error
          retention-days: 1
