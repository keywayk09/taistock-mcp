name: P12 Strategy Lab Governance

on:
  pull_request:
    paths:
      - 'src/v6/strategy-lab-governance.ts'
      - 'src/v6/strategy-lab-tools.ts'
      - 'src/v6/diamond-capability-p12.ts'
      - 'src/v6/diamond-capability-tools.ts'
      - 'src/v6/research-tools.ts'
      - 'src/index-v6.ts'
      - 'tests/strategy-lab-governance.test.ts'
      - 'docs/P12-STRATEGY-LAB-GOVERNANCE.md'
      - '.github/workflows/p12-strategy-lab.yml'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'src/v6/strategy-lab-governance.ts'
      - 'src/v6/strategy-lab-tools.ts'
      - 'src/v6/diamond-capability-p12.ts'
      - 'src/v6/diamond-capability-tools.ts'
      - 'src/v6/research-tools.ts'
      - 'src/index-v6.ts'
      - 'tests/strategy-lab-governance.test.ts'
      - 'package.json'

permissions:
  contents: read

jobs:
  verify-p12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run type-check
      - run: npm run test:strategy-lab
      - run: npm run test:research
      - run: npx wrangler deploy --dry-run --outdir dist-p12
