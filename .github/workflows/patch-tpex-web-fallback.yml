name: Patch TPEx official web fallback

on:
  push:
    branches:
      - fix/tpex-official-web-json-fallback
    paths:
      - '.github/workflows/patch-tpex-web-fallback.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tpex-official-web-json-fallback
          fetch-depth: 0
      - name: Wire semantic TPEx payload fallbacks
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('src/v6/market-data-cloudflare-chunked-runner.ts')
          s=p.read_text()
          s=s.replace('import { getTpexJson } from "./tpex-cloudflare-transport";', 'import { getTpexInstitutionalPayload, getTpexJson, getTpexMarginPayload } from "./tpex-cloudflare-transport";')
          s=s.replace('getTpexJson("https://www.tpex.org.tw/openapi/v1/tpex_3insti_daily_trading", "TPEX_3INSTI")', 'getTpexInstitutionalPayload(tradeDate)')
          s=s.replace('getTpexJson("https://www.tpex.org.tw/openapi/v1/tpex_mainboard_margin_balance", "TPEX_MARGIN")', 'getTpexMarginPayload(tradeDate)')
          if 'getTpexInstitutionalPayload(tradeDate)' not in s or 'getTpexMarginPayload(tradeDate)' not in s:
              raise SystemExit('TPEx semantic fallback wiring failed')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/v6/market-data-cloudflare-chunked-runner.ts
          git commit -m 'fix(tpex): use official web JSON fallback for OTC core layers' || exit 0
          git push origin HEAD:fix/tpex-official-web-json-fallback
