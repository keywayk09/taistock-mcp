name: Apply Family Plugin Scope Normalization 20260823

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/family-plugin-scope-normalization-20260823'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply bounded connector scope normalization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('src/v6/family-oauth.ts')
          s = p.read_text()

          old = 'const RECOVERY_COMPAT_SCOPES = new Set([FAMILY_SCOPE, "offline_access"]);'
          new = r'''const OAUTH_SCOPE_TOKEN = /^[\x21\x23-\x5B\x5D-\x7E]{1,128}$/;
          const MAX_RECOVERY_SCOPE_TOKENS = 24;
          const MAX_RECOVERY_SCOPE_LENGTH = 2_048;
          const ACTION_RECOVERY_COMPAT_SCOPES = new Set([FAMILY_SCOPE, "offline_access"]);'''.replace('          ', '')
          if old not in s:
              raise SystemExit('scope_constants_pattern_not_found')
          s = s.replace(old, new, 1)

          anchor = '''function safeAuthDiagnostic(request: Request) {'''
          helper = '''function validConnectorRequestedScopes(rawScope: string, scopes: string[]) {
            // Incoming ChatGPT Plugin/MCP scopes are transport/request metadata,
            // never Family authorization. Keep only a bounded RFC 6749-style
            // syntax check here; recoveredAuthRequest() below normalizes every
            // accepted connector request to the single FAMILY_SCOPE.
            if (rawScope.length > MAX_RECOVERY_SCOPE_LENGTH) return false;
            if (scopes.length > MAX_RECOVERY_SCOPE_TOKENS) return false;
            return scopes.every((scope) => OAUTH_SCOPE_TOKEN.test(scope));
          }

          '''.replace('          ', '') + anchor
          if anchor not in s:
              raise SystemExit('safe_diagnostic_anchor_not_found')
          s = s.replace(anchor, helper, 1)

          old = '''  const scopes = String(url.searchParams.get("scope") || "").split(/\\s+/).filter(Boolean);
            const scopeMode = scopes.length === 0
              ? "none"
              : (scopes.every((scope) => RECOVERY_COMPAT_SCOPES.has(scope)) ? "compatible" : "unsupported");'''.replace('            ', '')
          new = '''  const rawScope = String(url.searchParams.get("scope") || "");
            const scopes = rawScope.split(/\\s+/).filter(Boolean);
            const scopeMode = scopes.length === 0
              ? "none"
              : redirectMode === "connector"
                ? (validConnectorRequestedScopes(rawScope, scopes) ? "normalized" : "malformed")
                : (scopes.every((scope) => ACTION_RECOVERY_COMPAT_SCOPES.has(scope)) ? "compatible" : "unsupported");'''.replace('            ', '')
          if old not in s:
              raise SystemExit('diagnostic_scope_block_not_found')
          s = s.replace(old, new, 1)

          old = '''  // MCP clients are allowed to omit scope when the resource metadata already
            // describes the protected scope. Some OpenAI linking surfaces also include
            // the standard offline_access transport scope for refresh-token continuity.
            // Accept only those compatibility forms; the server still grants only
            // FAMILY_SCOPE below, so this cannot widen Family privileges.
            const scopes = String(url.searchParams.get("scope") || "").split(/\\s+/).filter(Boolean);
            if (scopes.some((scope) => !RECOVERY_COMPAT_SCOPES.has(scope))) return null;'''.replace('            ', '')
          new = '''  const rawScope = String(url.searchParams.get("scope") || "");
            const scopes = rawScope.split(/\\s+/).filter(Boolean);
            if (kind === "connector") {
              // ChatGPT may evolve the OAuth/OIDC scopes it requests. For a trusted
              // ChatGPT connector callback protected by PKCE S256, validate only a
              // bounded OAuth scope-token syntax here. These names are deliberately
              // NOT permissions: recoveredAuthRequest() always replaces them with
              // [FAMILY_SCOPE], and completeAuthorization() filters again.
              if (!validConnectorRequestedScopes(rawScope, scopes)) return null;
            } else if (scopes.some((scope) => !ACTION_RECOVERY_COMPAT_SCOPES.has(scope))) {
              // Custom GPT Action compatibility remains intentionally strict.
              return null;
            }'''.replace('            ', '')
          if old not in s:
              raise SystemExit('recovery_scope_block_not_found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          t = Path('tests/family-oauth-contract.test.ts')
          x = t.read_text()
          old = '''assert.match(oauth, /RECOVERY_COMPAT_SCOPES = new Set\\(\\[FAMILY_SCOPE, "offline_access"\\]\\)/);'''
          new = '''assert.match(oauth, /OAUTH_SCOPE_TOKEN/);
          assert.match(oauth, /MAX_RECOVERY_SCOPE_TOKENS = 24/);
          assert.match(oauth, /MAX_RECOVERY_SCOPE_LENGTH = 2_048/);
          assert.match(oauth, /ACTION_RECOVERY_COMPAT_SCOPES = new Set\\(\\[FAMILY_SCOPE, "offline_access"\\]\\)/);
          assert.match(oauth, /function validConnectorRequestedScopes/);'''.replace('          ', '')
          if old not in x:
              raise SystemExit('test_scope_constant_assertion_not_found')
          x = x.replace(old, new, 1)

          old = '''assert.match(oauth, /scopes\\.some\\(\\(scope\\) => !RECOVERY_COMPAT_SCOPES\\.has\\(scope\\)\\)/);'''
          new = '''assert.match(oauth, /validConnectorRequestedScopes\\(rawScope, scopes\\)/);
          assert.match(oauth, /scopes\\.some\\(\\(scope\\) => !ACTION_RECOVERY_COMPAT_SCOPES\\.has\\(scope\\)\\)/);'''.replace('          ', '')
          if old not in x:
              raise SystemExit('test_scope_gate_assertion_not_found')
          x = x.replace(old, new, 1)

          old = '''// Compatibility must never widen Family permissions: regardless of an omitted
          // scope or offline_access transport scope, reconstructed authorization grants
          // only the single Family read scope.'''
          new = '''// Connector request scopes are compatibility metadata only. Even if ChatGPT
          // asks for OIDC, offline, MCP or other syntactically-valid scopes,
          // reconstructed authorization and issued permissions remain only Family read.'''
          if old not in x:
              raise SystemExit('test_compat_comment_not_found')
          x = x.replace(old, new, 1)
          x = x.replace(
              'assert.doesNotMatch(oauth, /scope: \\[FAMILY_SCOPE, "offline_access"\\]/);',
              'assert.doesNotMatch(oauth, /scope: \\[FAMILY_SCOPE, "offline_access"\\]/);\nassert.match(oauth, /These names are deliberately/);\nassert.match(oauth, /completeAuthorization\\(\\{/);',
              1,
          )
          t.write_text(x)
          PY

          rm .github/workflows/apply-family-scope-normalization-20260823.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/v6/family-oauth.ts tests/family-oauth-contract.test.ts .github/workflows/apply-family-scope-normalization-20260823.yml
          git commit -m 'fix: normalize trusted ChatGPT connector request scopes'
          git push origin HEAD:${{ github.head_ref }}
