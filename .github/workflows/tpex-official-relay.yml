name: TPEx Official Relay Capture

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tpex-official-relay.yml'
      - 'src/v6/tpex-official-relay.ts'
      - 'src/v6/tpex-market-data-backfill.ts'
      - 'src/v6/twse-market-data-capture.ts'
      - 'src/index-v6.ts'
  pull_request:
    branches: [main]
  schedule:
    - cron: '15 10 * * 1-5'
    - cron: '15 12 * * 1-5'

permissions:
  contents: write

concurrency:
  group: tpex-official-relay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture latest official TPEx datasets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt
          import hashlib
          import json
          import pathlib
          import urllib.request

          ENDPOINTS = {
              'institutional': 'https://www.tpex.org.tw/openapi/v1/tpex_3insti_daily_trading',
              'margin': 'https://www.tpex.org.tw/openapi/v1/tpex_mainboard_margin_balance',
          }
          HEADERS = {
              'Accept': 'application/json,text/plain,*/*',
              'Accept-Language': 'zh-TW,zh;q=0.9,en;q=0.8',
              'Referer': 'https://www.tpex.org.tw/',
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140.0.0.0 Safari/537.36',
          }

          def normalize_date(value):
              raw = str(value or '').strip()
              if len(raw) == 7 and raw.isdigit():
                  return f'{int(raw[:3]) + 1911:04d}-{raw[3:5]}-{raw[5:7]}'
              if len(raw) == 8 and raw.isdigit():
                  return f'{raw[:4]}-{raw[4:6]}-{raw[6:8]}'
              if len(raw) == 10 and raw[4] == '-' and raw[7] == '-':
                  return raw
              raise RuntimeError(f'unsupported TPEx Date value: {raw!r}')

          def fetch(name, url):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read()
                  if response.status != 200:
                      raise RuntimeError(f'{name}: HTTP {response.status}')
              body = json.loads(raw.decode('utf-8-sig'))
              if not isinstance(body, list) or not body:
                  raise RuntimeError(f'{name}: expected non-empty JSON list')
              first = body[0]
              if not isinstance(first, dict):
                  raise RuntimeError(f'{name}: first row is not an object')
              trade_date = normalize_date(first.get('Date'))
              for idx in (0, len(body)//2, len(body)-1):
                  row = body[idx]
                  row_date = normalize_date(row.get('Date'))
                  if row_date != trade_date:
                      raise RuntimeError(f'{name}: mixed trade dates {trade_date} vs {row_date}')
              return trade_date, body

          captured = {}
          for name, url in ENDPOINTS.items():
              captured[name] = (*fetch(name, url), url)

          dates = {captured[name][0] for name in captured}
          if len(dates) != 1:
              raise RuntimeError(f'TPEx dataset date mismatch: {sorted(dates)}')
          trade_date = next(iter(dates))
          base = pathlib.Path('data/market-data/tpex-relay') / trade_date
          base.mkdir(parents=True, exist_ok=True)

          manifest = {
              'schema': 'TPEX_OFFICIAL_RELAY_V1',
              'trade_date': trade_date,
              'captured_at_utc': dt.datetime.now(dt.timezone.utc).isoformat().replace('+00:00', 'Z'),
              'source_owner': 'TPEx',
              'transport': 'GitHub Actions official endpoint relay',
              'datasets': {},
          }

          for name, (source_date, body, url) in captured.items():
              payload = json.dumps(body, ensure_ascii=False, separators=(',', ':'), sort_keys=True).encode('utf-8')
              sha = hashlib.sha256(payload).hexdigest()
              path = base / f'{name}.json'
              path.write_bytes(payload + b'\n')
              manifest['datasets'][name] = {
                  'source_date': source_date,
                  'row_count': len(body),
                  'sha256': sha,
                  'endpoint': url,
                  'file': path.name,
              }

          manifest_bytes = json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True).encode('utf-8')
          (base / 'manifest.json').write_bytes(manifest_bytes + b'\n')
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Commit immutable relay snapshot to relay branch
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tpex-official-relay-bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin market-data-relay:refs/remotes/origin/market-data-relay || true
          if git show-ref --verify --quiet refs/remotes/origin/market-data-relay; then
            TMP=$(mktemp -d)
            cp -a data/market-data/tpex-relay "$TMP/"
            git checkout -B market-data-relay refs/remotes/origin/market-data-relay
            mkdir -p data/market-data
            cp -a "$TMP/tpex-relay" data/market-data/
          else
            git checkout -b market-data-relay
          fi
          git add data/market-data/tpex-relay
          if git diff --cached --quiet; then
            echo 'Relay snapshot unchanged; nothing to commit.'
            exit 0
          fi
          DATE=$(find data/market-data/tpex-relay -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | tail -1)
          git commit -m "market-data: capture TPEx official ${DATE}"
          git push origin HEAD:refs/heads/market-data-relay
