name: Research VNext Post-Authority Production Baseline

on:
  push:
    branches:
      - refactor/research-vnext-foundation-20260901
    paths:
      - runtime/research-vnext-post-authority-production-baseline-authorization.json

permissions:
  contents: read

concurrency:
  group: research-vnext-post-authority-production-baseline
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout authorization commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate one-shot authorization
        shell: bash
        run: |
          set -euo pipefail
          auth_path='runtime/research-vnext-post-authority-production-baseline-authorization.json'
          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r "${GITHUB_SHA}")
          if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != "$auth_path" ]; then
            echo 'authorization commit must change exactly the authorization file' >&2
            printf 'changed=%s\n' "${changed[*]:-none}" >&2
            exit 78
          fi
          node - <<'NODE'
          const fs = require('fs');
          const path = 'runtime/research-vnext-post-authority-production-baseline-authorization.json';
          const auth = JSON.parse(fs.readFileSync(path, 'utf8'));
          const expected = '6dc5beb02c168ad6c7c74c314fc9cf704253391a';
          if (auth.schema !== 'RESEARCH_VNEXT_POST_AUTHORITY_BASELINE_AUTH_V1') throw new Error('invalid_schema');
          if (auth.mode !== 'READ_ONLY_PRODUCTION_CONTROL_PLANE_SNAPSHOT') throw new Error('invalid_mode');
          if (auth.source_sha !== expected) throw new Error('invalid_source_sha');
          if (auth.production_deploy_authorized !== false) throw new Error('deploy_must_remain_false');
          if (auth.production_mutation !== 'NONE') throw new Error('mutation_must_remain_none');
          if (!/^vnext-post-authority-baseline-20260902-[a-z0-9-]{8,64}$/.test(String(auth.authorization_nonce || ''))) {
            throw new Error('invalid_nonce');
          }
          console.log('POST_AUTHORITY_BASELINE_AUTHORIZATION=PASS');
          NODE

      - name: Checkout sealed VNext snapshot source
        uses: actions/checkout@v4
        with:
          ref: 6dc5beb02c168ad6c7c74c314fc9cf704253391a
          path: sealed
          persist-credentials: false

      - name: Capture GET-only Production control plane
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEARCH_VNEXT_EXPECTED_SHA: 6dc5beb02c168ad6c7c74c314fc9cf704253391a
        run: |
          set -euo pipefail
          node --experimental-strip-types sealed/scripts/research-vnext-production-control-plane-live-snapshot.mjs \
            > research-vnext-post-authority-production-baseline-receipt.json

      - name: Validate immutable-style receipt
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const p = 'research-vnext-post-authority-production-baseline-receipt.json';
          const r = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (r.schema !== 'RESEARCH_VNEXT_PRODUCTION_CONTROL_PLANE_SNAPSHOT_V1') throw new Error('invalid_receipt_schema');
          if (r.status !== 'READ_ONLY_SNAPSHOT_VALID') throw new Error('invalid_receipt_status');
          if (r.source_sha !== '6dc5beb02c168ad6c7c74c314fc9cf704253391a') throw new Error('invalid_receipt_source');
          if (r.active_version_percentage !== 100) throw new Error('active_version_not_100_percent');
          if (!Array.isArray(r.cron_schedules) || !r.cron_schedules.includes('*/5 * * * *')) throw new Error('cron_mismatch');
          if (r.oauth_kv_id !== '696e3654d2fa4c3bb1a868e5095b5660') throw new Error('oauth_kv_mismatch');
          if (r.read_only_capture !== true) throw new Error('read_only_capture_required');
          if (r.token_leak !== false) throw new Error('token_leak_must_be_false');
          if (r.production_deploy_authorized !== false) throw new Error('deploy_must_remain_false');
          if (r.production_mutation !== 'NONE') throw new Error('mutation_must_remain_none');
          if (r.rollback_target_version_id !== r.active_version_id) throw new Error('rollback_target_must_equal_active_version');
          const expectedExports = ['MyMCP', 'FamilyMCP'];
          if (JSON.stringify(r.protected_exports) !== JSON.stringify(expectedExports)) throw new Error('protected_exports_mismatch');
          console.log('POST_AUTHORITY_BASELINE_RECEIPT=PASS');
          console.log(JSON.stringify({
            status: r.status,
            active_deployment_id: r.active_deployment_id,
            active_version_id: r.active_version_id,
            binding_fingerprint: r.binding_fingerprint,
            cron_schedules: r.cron_schedules,
            oauth_kv_id: r.oauth_kv_id,
            token_leak: r.token_leak,
            production_mutation: r.production_mutation
          }, null, 2));
          NODE

      - name: Upload baseline receipt
        uses: actions/upload-artifact@v4
        with:
          name: research-vnext-post-authority-production-baseline-${{ github.run_id }}
          path: research-vnext-post-authority-production-baseline-receipt.json
          if-no-files-found: error
          retention-days: 30
