name: Diamond Fixed ABI Oracle

on:
  push:
    branches:
      - fix/diamond-public-79-abi-20260902
    paths:
      - '.github/workflows/diamond-fixed-abi-oracle.yml'

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect legacy facade registration syntax
        shell: bash
        run: |
          set -euo pipefail
          echo '=== current add_industry_evidence ==='
          git grep -n -C 8 'add_industry_evidence' origin/main -- src/index.ts src || true
          echo '=== 8/2 introduction add_industry_evidence ==='
          git grep -n -C 8 'add_industry_evidence' c37b780f46b4ee581c8d617cac1b15022b57104e -- src/index.ts src || true
          echo '=== current MCP class/init markers ==='
          git grep -n -E 'export class .*MCP|class .*MCP|async init\(|\.tool\(|registerTool\(' origin/main -- src/index.ts | tail -120 || true
          echo '=== 8/2 MCP class/init markers ==='
          git grep -n -E 'export class .*MCP|class .*MCP|async init\(|\.tool\(|registerTool\(' c37b780f46b4ee581c8d617cac1b15022b57104e -- src/index.ts | tail -120 || true
