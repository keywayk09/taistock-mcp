name: Diamond Fixed ABI Oracle

on:
  push:
    branches:
      - fix/diamond-public-79-abi-20260902
    paths:
      - '.github/workflows/diamond-fixed-abi-oracle.yml'

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate legacy ChatGPT facade generation
        shell: bash
        run: |
          set -euo pipefail
          echo '=== add_industry_evidence history ==='
          git log --all --date=iso --format='%H %ad %s' -S'add_industry_evidence' -- src || true
          echo '=== commits around first Owner OAuth cutover ==='
          git log --all --date=iso --format='%H %ad %s' --before='2026-08-27T23:59:59+08:00' --after='2026-08-20T00:00:00+08:00' -- src/index.ts src/v6/owner-content-handler.ts | head -80
