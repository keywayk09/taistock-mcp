name: Diamond Fixed ABI Oracle

on:
  push:
    branches:
      - fix/diamond-public-79-abi-20260902
    paths:
      - '.github/workflows/diamond-fixed-abi-oracle.yml'

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate exact 79 tool facade generation
        shell: bash
        run: |
          set -euo pipefail
          echo '=== history introducing/removing static 79 count ==='
          git log --all --date=iso --format='%H %ad %s' -S'tools: 79' -- src wrangler.jsonc || true
          echo '=== every historical occurrence of tools: 79 on first-parent main ==='
          while read -r sha; do
            hit="$(git grep -n -E 'tools["'"']?[[:space:]]*:[[:space:]]*79|owner_tools["'"']?[[:space:]]*:[[:space:]]*79' "$sha" -- src 2>/dev/null || true)"
            if [ -n "$hit" ]; then
              echo "MATCH sha=$sha $(git show -s --date=iso --format='%ad %s' "$sha")"
              printf '%s\n' "$hit"
            fi
          done < <(git rev-list --first-parent --reverse --since='2026-08-02T00:00:00+08:00' --until='2026-08-30T23:59:59+08:00' origin/main)
