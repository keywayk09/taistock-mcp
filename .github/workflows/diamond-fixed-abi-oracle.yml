name: Diamond Fixed ABI Oracle

on:
  push:
    branches:
      - fix/diamond-public-79-abi-20260902
    paths:
      - '.github/workflows/diamond-fixed-abi-oracle.yml'

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repair branch with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture exact frozen 79 facade names
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/capture-owner-tool-names-oracle.ts /tmp/capture-owner-tool-names-oracle.ts
          git checkout --detach 9e85592aa8e78a9afbbb246ee1fee2553c2d8187
          cp /tmp/capture-owner-tool-names-oracle.ts scripts/capture-owner-tool-names-oracle.ts
          npm install --ignore-scripts
          TARGET_ENTRY=src/index-v7.ts EXPECTED_COUNT=79 node --experimental-strip-types scripts/capture-owner-tool-names-oracle.ts
