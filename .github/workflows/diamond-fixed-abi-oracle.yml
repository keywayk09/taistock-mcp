name: Diamond Fixed ABI Oracle

on:
  push:
    branches:
      - fix/diamond-public-79-abi-20260902
    paths:
      - '.github/workflows/diamond-fixed-abi-oracle.yml'

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan historical fixed facade candidates
        shell: bash
        run: |
          set -euo pipefail
          echo '=== candidate generations ==='
          while read -r sha; do
            if ! git grep -q 'add_industry_evidence' "$sha" -- src 2>/dev/null; then
              continue
            fi
            count="$(git grep -h -o -E 'registerTool\("[A-Za-z0-9_]+' "$sha" -- src 2>/dev/null \
              | sed 's/.*registerTool("//' | sort -u | wc -l | tr -d ' ')"
            if [ "$count" -ge 65 ] && [ "$count" -le 95 ]; then
              meta="$(git show -s --date=iso --format='%ad %s' "$sha")"
              echo "CANDIDATE sha=$sha literal_tools=$count $meta"
            fi
          done < <(git rev-list --first-parent --reverse --since='2026-08-02T00:00:00+08:00' --until='2026-08-27T23:59:59+08:00' origin/main)
