name: Retired Jin10 Runtime Proof

on:
  push:
    branches:
      - ops/prove-retired-jin10-health-20260829

permissions:
  contents: read

jobs:
  prove-absence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert Fugle retired Jin10 secret is absent at runtime
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const url = 'https://tv-fugle-1d.keikei99887.workers.dev/v4-jin10-retired-secret-proof';
          const response = await fetch(url, { signal: AbortSignal.timeout(20000) });
          if (!response.ok) throw new Error(`tv-fugle-1d: HTTP_${response.status}`);
          const body = await response.json();
          const present = body?.jin10_retired_secret_present;
          if (present !== false) {
            throw new Error(`tv-fugle-1d: runtime absence proof failed; boolean=${String(present)}`);
          }
          console.log('tv-fugle-1d: PASS jin10_retired_secret_present=false');
          console.log('FUGLE_JIN10_RUNTIME_ABSENCE_PROOF_PASS');
          NODE
