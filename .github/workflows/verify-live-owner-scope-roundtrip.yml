name: Verify live Owner scope round-trip

on:
  push:
    branches:
      - fix/owner-oauth-scope-roundtrip-20260827
    paths:
      - '.github/workflows/verify-live-owner-scope-roundtrip.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production Owner scope and resource separation
        shell: bash
        run: |
          set -euo pipefail
          MCP='https://taistock-mcp.keywayk09.workers.dev'
          OWNER='https://taistock-owner-oauth.keywayk09.workers.dev'

          curl -fsS --max-time 20 "$OWNER/.well-known/oauth-authorization-server" > /tmp/owner-as.json
          curl -fsS --max-time 20 "$OWNER/health" > /tmp/owner-health.json
          curl -fsS --max-time 20 "$MCP/.well-known/oauth-protected-resource/my-mcp" > /tmp/owner-prm.json
          curl -fsS --max-time 20 "$MCP/.well-known/oauth-protected-resource/family-mcp" > /tmp/family-prm.json
          root_status="$(curl -sS -o /tmp/root-prm.txt -w '%{http_code}' --max-time 20 "$MCP/.well-known/oauth-protected-resource")"
          challenge_status="$(curl -sS -D /tmp/owner-challenge.headers -o /tmp/owner-challenge.body -w '%{http_code}' --max-time 20 \
            -X POST "$MCP/my-mcp" \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"owner-scope-live-gate","version":"1"}}}')"

          export MCP OWNER ROOT_STATUS="$root_status" CHALLENGE_STATUS="$challenge_status"
          python - <<'PY'
          import json, os
          from pathlib import Path

          mcp=os.environ['MCP']
          owner=os.environ['OWNER']
          meta=json.loads(Path('/tmp/owner-as.json').read_text())
          health=json.loads(Path('/tmp/owner-health.json').read_text())
          owner_prm=json.loads(Path('/tmp/owner-prm.json').read_text())
          family_prm=json.loads(Path('/tmp/family-prm.json').read_text())
          headers=Path('/tmp/owner-challenge.headers').read_text(errors='replace').lower()

          assert meta.get('issuer') == owner, meta
          assert meta.get('authorization_endpoint') == f'{owner}/authorize', meta
          assert meta.get('token_endpoint') == f'{owner}/oauth/token', meta
          assert meta.get('registration_endpoint') == f'{owner}/oauth/register', meta
          scopes=set(meta.get('scopes_supported') or [])
          assert {'owner:full','mcp:tools','offline_access'}.issubset(scopes), scopes
          assert 'family:read' not in scopes, scopes

          assert health.get('ok') is True, health
          assert health.get('role') == 'owner-oauth', health
          assert health.get('mcp_resource') == f'{mcp}/my-mcp', health

          assert owner_prm.get('resource') == f'{mcp}/my-mcp', owner_prm
          assert owner_prm.get('authorization_servers') == [owner], owner_prm
          assert owner_prm.get('scopes_supported') == ['owner:full'], owner_prm

          assert family_prm.get('resource') == f'{mcp}/family-mcp', family_prm
          assert family_prm.get('authorization_servers') == [mcp], family_prm
          assert family_prm.get('scopes_supported') == ['family:read'], family_prm

          assert os.environ['ROOT_STATUS'] == '404', os.environ['ROOT_STATUS']
          assert os.environ['CHALLENGE_STATUS'] in {'401','403'}, os.environ['CHALLENGE_STATUS']
          assert 'www-authenticate:' in headers, headers
          assert 'oauth-protected-resource/my-mcp' in headers, headers

          print('LIVE_OWNER_SCOPE_ROUNDTRIP=PASS')
          print('OWNER_AS_SCOPES='+','.join(sorted(scopes)))
          print('OWNER_PRM_AUTH_SERVER='+owner_prm['authorization_servers'][0])
          print('FAMILY_PRM_AUTH_SERVER='+family_prm['authorization_servers'][0])
          print('OWNER_CHALLENGE_STATUS='+os.environ['CHALLENGE_STATUS'])
          PY
