name: Crypto Forward Shadow V1.2.8 Observation

on:
  # Forward observation uses a deterministic push tick instead of GitHub cron.
  # The hourly tick file is updated by the external scheduler; collector/model
  # code remains frozen on this research branch and Production is untouched.
  push:
    branches: [research/crypto-mtf-rr-20260830]
    paths:
      - 'research/crypto_forward_shadow_observation_v128.py'
      - 'research/crypto_forward_shadow_hourly_tick.txt'
      - '.github/workflows/crypto-forward-shadow-observation-v128.yml'
  # Keep manual replay available for diagnosis without changing the cadence path.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREVIEW_BASE: https://0a7039af-tv-crypto-engine.keikei99887.workers.dev
    steps:
      - uses: actions/checkout@v4

      - name: Collect aggregate-only Forward Shadow snapshot
        shell: bash
        run: |
          # The collector stores no raw ticker/K-line/OI history. The timestamped
          # JSON contains only aggregate market evidence and candidate summaries.
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          out="forward-observation-${stamp}.json"
          python research/crypto_forward_shadow_observation_v128.py \
            --base "$PREVIEW_BASE" \
            --out "$out"
          echo "OBSERVATION_FILE=$out" >> "$GITHUB_ENV"

      - name: Validate observation schema and storage policy
        shell: bash
        run: |
          python - <<'PY'
          # Fail closed if a future collector change starts persisting raw data or
          # drops the Shadow-only production guard.
          import json, os

          path = os.environ['OBSERVATION_FILE']
          with open(path, 'r', encoding='utf-8') as f:
              p = json.load(f)

          assert p.get('schema_version') == 'crypto-forward-observation-v1', p
          shadow = p.get('shadow') or {}
          assert shadow.get('version') == '1.2.8-shadow', shadow
          assert shadow.get('production_promotion') is False, shadow

          storage = p.get('storage_policy') or {}
          assert storage.get('raw_tickers') == 'not_persisted', storage
          assert storage.get('raw_klines') == 'not_persisted', storage
          assert storage.get('raw_oi_series') == 'not_persisted', storage
          assert storage.get('aggregate_snapshot_only') is True, storage

          participation = p.get('market_participation') or {}
          assert participation.get('added_market_requests') == 0, participation
          assert participation.get('decision_effect') == 'none', participation
          assert (participation.get('source_health') or {}).get('required_pair_ok') is True, participation

          stable = p.get('stable_quality') or {}
          volatile = p.get('volatile') or {}
          assert stable.get('http_status') == 200, stable
          assert volatile.get('http_status') == 200, volatile

          # Only aggregate/candidate summaries are allowed. Explicit raw-series
          # field names are prohibited in the serialized observation artifact.
          serialized = json.dumps(p, ensure_ascii=False).lower()
          for forbidden in ['raw_ticker_rows', 'raw_klines', 'raw_candles', 'raw_oi_series', 'api.bybit.com', 'api.bytick.com']:
              if forbidden in ('raw_klines', 'raw_oi_series'):
                  # The storage-policy declarations intentionally contain these
                  # names with the value `not_persisted`; they are safe metadata.
                  continue
              assert forbidden not in serialized, f'forbidden persisted field: {forbidden}'

          print('FORWARD_OBSERVATION_SCHEMA_ACCEPTANCE')
          print(json.dumps({
              'observed_at': p.get('observed_at'),
              'market_universe': (participation.get('universe') or {}).get('eligible_count'),
              'stable_selected': stable.get('selected_count'),
              'stable_preferred': stable.get('research_preferred_count'),
              'volatile_selected': volatile.get('selected_count'),
              'volatile_preferred': volatile.get('research_preferred_count'),
              'result': 'PASS_FORWARD_OBSERVATION_SCHEMA',
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload aggregate observation artifact
        uses: actions/upload-artifact@v4
        with:
          name: crypto-forward-shadow-v128-observation-${{ github.run_id }}
          path: ${{ env.OBSERVATION_FILE }}
          retention-days: 30
          if-no-files-found: error
