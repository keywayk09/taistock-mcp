name: Crypto Forward Shadow V1.3.0 Observation

on:
  # Forward observation uses a deterministic push tick instead of GitHub cron.
  # The hourly tick file is updated by the external scheduler; collector/model
  # code remains frozen on this research branch and Production is untouched.
  push:
    branches: [research/crypto-mtf-rr-20260830]
    paths:
      - 'research/crypto_forward_shadow_observation_v128.py'
      - 'research/crypto_forward_shadow_hourly_tick.txt'
      - '.github/workflows/crypto-forward-shadow-observation-v128.yml'
  # Keep manual replay available for diagnosis without changing the cadence path.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREVIEW_BASE: https://7d75ff6c-tv-crypto-engine.keikei99887.workers.dev
    steps:
      - uses: actions/checkout@v4

      - name: Collect aggregate-only Forward Shadow snapshot
        shell: bash
        run: |
          # The collector stores no raw ticker/K-line/OI history. The timestamped
          # JSON contains only aggregate market evidence and candidate summaries.
          #
          # Retry only explicit transport/rate-limit failures. History coverage,
          # schema, policy and version failures remain immediate fail-closed.
          max_attempts=3
          attempt=1

          while true; do
            stamp="$(date -u +%Y%m%dT%H%M%SZ)"
            out="forward-observation-${stamp}.json"
            log="collector-attempt-${attempt}.log"

            set +e
            python research/crypto_forward_shadow_observation_v128.py \
              --base "$PREVIEW_BASE" \
              --out "$out" 2>&1 | tee "$log"
            code=${PIPESTATUS[0]}
            set -e

            if [ "$code" -eq 0 ]; then
              echo "OBSERVATION_FILE=$out" >> "$GITHUB_ENV"
              echo "COLLECT_ATTEMPTS=$attempt" >> "$GITHUB_ENV"
              break
            fi

            # The V1.3.0 collector classifies source failures. Only rate-limit
            # and transport failures are retryable; history_insufficient and
            # contract/data completeness failures must not create a retry storm.
            if ! grep -Eqi \
              'class=(rate_limited|transport_failure)|non_json_response status=(429|500|502|503|504)|timed out|timeout|URLError|Temporary failure|ConnectionResetError|RemoteDisconnected' \
              "$log"; then
              echo "NON_RETRYABLE_FORWARD_OBSERVATION_FAILURE attempt=$attempt"
              exit "$code"
            fi

            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "TRANSIENT_FORWARD_OBSERVATION_EXHAUSTED attempts=$attempt"
              exit "$code"
            fi

            # Keep bounded backoff; there is no external GitHub-job rerun.
            if [ "$attempt" -eq 1 ]; then
              delay=45
            else
              delay=75
            fi
            echo "TRANSIENT_FORWARD_OBSERVATION_RETRY attempt=$attempt next_delay_seconds=$delay"
            sleep "$delay"
            attempt=$((attempt + 1))
          done

      - name: Validate observation schema and storage policy
        shell: bash
        run: |
          python - <<'PY'
          # Fail closed if a future collector change starts persisting raw data or
          # drops the Shadow-only production/source-repair guards.
          import json, os

          path = os.environ['OBSERVATION_FILE']
          with open(path, 'r', encoding='utf-8') as f:
              p = json.load(f)

          assert p.get('schema_version') == 'crypto-forward-observation-v1', p
          shadow = p.get('shadow') or {}
          assert shadow.get('version') == '1.3.0-shadow', shadow
          assert shadow.get('production_promotion') is False, shadow

          repair = shadow.get('source_reliability_repair') or {}
          assert repair.get('gate_candlestick_in_data_path') is False, repair
          assert repair.get('deep_price_sources') == ['kucoin', 'mexc'], repair
          assert repair.get('deep_oi_sources') == ['kucoin', 'gate'], repair
          assert repair.get('higher_tf_price_sources') == ['kucoin', 'mexc'], repair
          assert repair.get('added_market_requests') == 0, repair
          assert repair.get('production_promotion') is False, repair

          storage = p.get('storage_policy') or {}
          assert storage.get('raw_tickers') == 'not_persisted', storage
          assert storage.get('raw_klines') == 'not_persisted', storage
          assert storage.get('raw_oi_series') == 'not_persisted', storage
          assert storage.get('aggregate_snapshot_only') is True, storage

          participation = p.get('market_participation') or {}
          assert participation.get('added_market_requests') == 0, participation
          assert participation.get('decision_effect') == 'none', participation
          assert (participation.get('source_health') or {}).get('required_pair_ok') is True, participation

          stable = p.get('stable_quality') or {}
          volatile = p.get('volatile') or {}
          assert stable.get('http_status') == 200, stable
          assert volatile.get('http_status') == 200, volatile

          serialized = json.dumps(p, ensure_ascii=False).lower()
          for forbidden in ['raw_ticker_rows', 'raw_candles', 'api.bybit.com', 'api.bytick.com', 'gate_kline_5m', 'gate_1h']:
              assert forbidden not in serialized, f'forbidden persisted/source field: {forbidden}'

          print('FORWARD_OBSERVATION_SCHEMA_ACCEPTANCE')
          print(json.dumps({
              'observed_at': p.get('observed_at'),
              'collect_attempts': int(os.environ.get('COLLECT_ATTEMPTS', '1')),
              'market_universe': (participation.get('universe') or {}).get('eligible_count'),
              'stable_selected': stable.get('selected_count'),
              'stable_preferred': stable.get('research_preferred_count'),
              'volatile_selected': volatile.get('selected_count'),
              'volatile_preferred': volatile.get('research_preferred_count'),
              'result': 'PASS_FORWARD_OBSERVATION_SCHEMA_V130',
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload aggregate observation artifact
        uses: actions/upload-artifact@v4
        with:
          name: crypto-forward-shadow-v130-observation-${{ github.run_id }}
          path: ${{ env.OBSERVATION_FILE }}
          retention-days: 30
          if-no-files-found: error
